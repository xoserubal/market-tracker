  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    .macro-table th[data-tip] { cursor: help; }

    .panel-title { padding: 7px 9px; background: #eef3f8; color: #344054; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .45px; border-bottom: 1px solid #e0e7ef; }

    .rank-row:last-child { border-bottom: none; }

    .flowinout-sub { padding: 4px 9px; font-size: 9px; font-weight: 700; color: #667085; text-transform: uppercase; letter-spacing: .4px; background: #f8f9fb; border-top: 1px solid #edf0f3; border-bottom: 1px solid #edf0f3; }

    /* ── Cross-Module Coherence Matrix (Fase 5a) ───────────────────────────── */
    .xmod-note { font-size: 10px; color: #667085; line-height: 1.5; padding: 6px 2px 10px; }
    table.xmod-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    table.xmod-table th { padding: 5px 8px; background: #354f73; color: white; font-weight: 500; text-align: center; white-space: nowrap; }
    table.xmod-table td { padding: 5px 8px; border-bottom: 1px solid #eee; text-align: center; }
    .xmod-bucket-val { font-family: Consolas, monospace; font-size: 9px; display: block; margin-top: 1px; }
    .xmod-badge { font-weight: 700; border-radius: 3px; padding: 3px 8px; display: inline-block; min-width: 92px; font-size: 10px; }

    /* ── Question Blocks (primary — Relative Flow Lab v2) ─────────────────── */
    .qblock { border: 1px solid #e6e8eb; border-radius: 6px; background: #fbfcfd; margin-bottom: 12px; overflow: hidden; }
    .qblock-head { padding: 8px 12px; background: #eef3f8; border-bottom: 1px solid #e0e7ef; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .qblock-title { font-size: 12px; font-weight: 800; color: #1a3a5c; text-transform: uppercase; letter-spacing: .4px; }
    .qblock-question { font-size: 10.5px; color: #5b6b7f; font-style: italic; }
    .qblock-top { padding: 6px 10px; display: flex; flex-direction: column; gap: 3px; background: white; border-bottom: 1px solid #eef0f3; }
    .qtop-row { display: grid; grid-template-columns: 20px 190px 74px 1fr; gap: 8px; align-items: center; font-size: 10.5px; padding: 3px 2px; border-radius: 3px; }
    .qtop-rank { color: #667085; font-family: Consolas, monospace; }
    .qtop-name { color: #222; font-weight: 600; }
    .qtop-pair { color: #1a6baa; font-family: Consolas, monospace; font-size: 9.5px; font-weight: 400; }
    .qtop-interp { color: #445; font-size: 10px; }
    .qblock-empty { padding: 4px 2px; font-size: 10.5px; color: #aaa; font-style: italic; }
    .interp-cell { text-align: left !important; font-size: 9.5px; color: #445; max-width: 240px; line-height: 1.35; }
    .section-label { font-size: 11px; font-weight: 700; color: #7a8699; text-transform: uppercase; letter-spacing: .6px; margin: 4px 0 6px; }

    /* ── Cluster ────────────────────────────────────────────────────────── */
    .cluster-grid { display: grid; grid-template-columns: repeat(4, minmax(190px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .cluster { border: 1px solid #e6e8eb; border-radius: 6px; background: white; padding: 8px 9px; }
    .cluster-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
    .cluster-name { font-size: 10px; color: #344054; font-weight: 700; letter-spacing: .35px; }
    .cluster-bias { border-radius: 3px; padding: 2px 6px; font-size: 9px; font-weight: 700; white-space: nowrap; }
    .cluster-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 10px; }
    .cluster-stat span { display: block; color: #8a94a6; font-size: 8px; text-transform: uppercase; letter-spacing: .3px; }
    .cluster-stat b { display: block; margin-top: 2px; font-family: Consolas, monospace; color: #1f2933; }

    /* ── Flow table ─────────────────────────────────────────────────────── */
    table.flow-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    table.flow-table thead tr { position: relative; }
    table.flow-table th { padding: 4px 6px; background: #354f73; color: white; font-weight: 500; text-align: center; border-right: 1px solid rgba(255,255,255,0.18); white-space: nowrap; }
    table.flow-table th[data-tip] { cursor: help; }
    table.flow-table th[data-tip]:hover::after { content: attr(data-tip); position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: #1f2933; color: #f0f4f8; font-size: 10px; font-weight: 400; line-height: 1.5; white-space: pre-line; padding: 7px 10px; border-radius: 5px; box-shadow: 0 3px 10px rgba(0,0,0,.35); z-index: 100; min-width: 200px; max-width: 280px; text-align: left; pointer-events: none; }

    .name { text-align: left; font-weight: 600; color: #222; position: relative; }
    .name[data-tip] { cursor: help; }
    .name[data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 4px); top: auto; left: 0; background: #1f2933; color: #f0f4f8; font-size: 10px; font-weight: 400; line-height: 1.5; white-space: pre-line; padding: 7px 10px; border-radius: 5px; box-shadow: 0 3px 10px rgba(0,0,0,.35); z-index: 100; min-width: 180px; max-width: 260px; text-align: left; pointer-events: none; }
    .tickers { color: #1a6baa; font-family: Consolas, monospace; font-size: 10px; white-space: nowrap; }
    .num { font-family: Consolas, monospace; }
    .signal { font-weight: 700; border-radius: 3px; padding: 2px 7px; display: inline-block; min-width: 74px; }
    .spark { width: 104px; height: 28px; display: block; margin: 0 auto; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a6b3c; color: white; padding: 10px 22px; border-radius: 20px; font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.18); z-index: 10; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ── ratio_registry (shared/relative-ratio-registry.js) ────────────────────
// Cada ratio declara su `type` (la pregunta que responde) y su `cluster`
// (agrupación narrativa heredada, usada solo por la Cluster View secundaria).
// Ver shared/relative-ratio-registry.js para la metadata completa.
const RATIO_TYPES = window.RATIO_TYPES;
const REGISTRY_ENTRIES = window.RATIO_REGISTRY.filter(r => r.enabled !== false);

// Adaptador a los campos "legacy" (a/b/name/tip) que usa el resto del render.
function toLegacyRatio(entry) {
  const tip = `${entry.primaryQuestion}\n\n↑ ${entry.positiveMeaning}\n↓ ${entry.negativeMeaning}`;
  return { ...entry, a: entry.pair[0], b: entry.pair[1], name: entry.label, tip };
}

const ALL_RATIO_DEFS = REGISTRY_ENTRIES.map(toLegacyRatio);

const RATIO_TYPE_ORDER = ["risk_appetite", "anticipation", "rotation", "regions", "sector_snapshot"];
const DEFS_BY_TYPE = Object.fromEntries(
  RATIO_TYPE_ORDER.map(t => [t, ALL_RATIO_DEFS.filter(r => r.type === t)])
);

// Cluster View secundaria — mismo agrupamiento narrativo que antes, ahora
// derivado del campo `cluster` del registry (orden = primera aparición).
const CLUSTER_ORDER = [];
ALL_RATIO_DEFS.forEach(r => { if (!CLUSTER_ORDER.includes(r.cluster)) CLUSTER_ORDER.push(r.cluster); });
const RATIO_GROUPS = CLUSTER_ORDER.map(id => ({ id, items: ALL_RATIO_DEFS.filter(r => r.cluster === id) }));

// ── Helpers ───────────────────────────────────────────────────────────────
const toN = v => v != null && Number.isFinite(+v) ? +v : null;
const fmtPct = v => { const n = toN(v); if (n == null) return "-"; return (n >= 0 ? "+" : "") + n.toFixed(1) + "%"; };
const fmtNum = v => { const n = toN(v); if (n == null) return "-"; return n.toFixed(2); };
const ret = (arr, bars) => {
  if (!arr || arr.length <= bars) return null;
  const last = arr[arr.length - 1]?.value, prev = arr[arr.length - 1 - bars]?.value;
  return last && prev ? (last / prev - 1) * 100 : null;
};
const retWindow = (arr, endOffset, bars) => {
  if (!arr || arr.length <= endOffset + bars) return null;
  const end = arr[arr.length - 1 - endOffset]?.value, start = arr[arr.length - 1 - endOffset - bars]?.value;
  return end && start ? (end / start - 1) * 100 : null;
};
const avg = arr => arr.length ? arr.reduce((a,b) => a+b, 0) / arr.length : null;
const sma = (values, len) => values.length >= len ? avg(values.slice(-len)) : null;

function calcRSI(values, period = 14) {
  const v = values.filter(x => x != null);
  if (v.length < period + 1) return null;
  let gain = 0, loss = 0;
  for (let i = 1; i <= period; i++) {
    const d = v[i] - v[i-1];
    if (d > 0) gain += d / period; else loss += -d / period;
  }
  for (let i = period + 1; i < v.length; i++) {
    const d = v[i] - v[i-1];
    gain = (gain * (period-1) + Math.max(d, 0)) / period;
    loss = (loss * (period-1) + Math.max(-d, 0)) / period;
  }
  if (loss === 0) return 100;
  return 100 - 100 / (1 + gain / loss);
}

function alignRatio(aSeries, bSeries) {
  const bMap = Object.fromEntries((bSeries || []).map(p => [p.date, p.close]));
  return (aSeries || [])
    .filter(p => bMap[p.date] != null && p.close != null)
    .map(p => ({ date: p.date, value: p.close / bMap[p.date] }))
    .filter(p => Number.isFinite(p.value));
}

function buildRow(pair, history) {
  const a = history[pair.a]?.series;
  const b = history[pair.b]?.series;
  const ratio = alignRatio(a, b);
  if (ratio.length < 70) return { ...pair, error: true, ratio };

  const values = ratio.map(p => p.value);
  const last = values[values.length - 1];
  const s20 = sma(values, 20);
  const s63 = sma(values, 63);
  const r1w = ret(ratio, 5);
  const r1m = ret(ratio, 21);
  const r3m = ret(ratio, 63);
  const r6m = ret(ratio, 126);
  const flowNow  = retWindow(ratio, 0, 5);
  const flowPrev = retWindow(ratio, 5, 5);
  const flowChange = flowNow != null && flowPrev != null ? flowNow - flowPrev : null;
  const rsi = calcRSI(values);
  const high52 = Math.max(...values.slice(-252));
  const fromHigh = high52 ? (last / high52 - 1) * 100 : null;
  const trend = last > s20 && s20 > s63 ? "Up" : last < s20 && s20 < s63 ? "Down" : "Mixed";
  const trendAdj = trend === "Up" ? 2 : trend === "Down" ? -2 : 0;
  const rsiAdj = rsi > 65 ? 1.5 : rsi > 55 ? 0.8 : rsi < 35 ? -1.5 : rsi < 45 ? -0.8 : 0;
  const flowChangeAdj = flowChange == null ? 0 : Math.max(-3, Math.min(3, flowChange * 0.4));
  const score = Math.round((((r1w ?? 0) * 0.5) + ((r1m ?? 0) * 0.7) + ((r3m ?? 0) * 0.25) + trendAdj + rsiAdj + flowChangeAdj) * 10) / 10;
  return { ...pair, ratio, last, r1w, r1m, r3m, r6m, flowNow, flowPrev, flowChange, rsi, fromHigh, trend, score };
}

function classify(row) {
  if (!row || row.error) return { label: "No data", bg: "#f0f0f0", fg: "#888" };
  if (row.score >= 8)  return { label: "Leader",    bg: "#c8e6c9", fg: "#1b5e20" };
  if (row.score >= 3)  return { label: "Improving",  bg: "#d0e8ff", fg: "#0d2e6e" };
  if (row.score <= -8) return { label: "Laggard",    bg: "#ffcdd2", fg: "#b71c1c" };
  if (row.score <= -3) return { label: "Weakening",  bg: "#fff0cc", fg: "#8a5200" };
  return { label: "Neutral", bg: "#f0f0f0", fg: "#555" };
}

function cellStyle(v) {
  const n = toN(v);
  if (n == null) return { background: "", color: "#aaa" };
  if (n >= 10) return { background: "#0d4e0d", color: "white" };
  if (n >= 5)  return { background: "#1a7a1a", color: "white" };
  if (n >= 2)  return { background: "#a8d8a8", color: "#1a1a1a" };
  if (n <= -10) return { background: "#b01010", color: "white" };
  if (n <= -5)  return { background: "#e03030", color: "white" };
  if (n <= -2)  return { background: "#ffc9c9", color: "#1a1a1a" };
  return { background: "", color: "#555" };
}

function flowChangeLabel(v) {
  const n = toN(v);
  if (n == null) return { label: "-", bg: "", fg: "#aaa" };
  if (n >= 5)  return { label: "Accel+", bg: "#c8e6c9", fg: "#1b5e20" };
  if (n >= 2)  return { label: "Accel",  bg: "#d0e8ff", fg: "#0d2e6e" };
  if (n <= -5) return { label: "Fade-",  bg: "#ffcdd2", fg: "#b71c1c" };
  if (n <= -2) return { label: "Fade",   bg: "#fff0cc", fg: "#8a5200" };
  return { label: "Flat", bg: "#f0f0f0", fg: "#555" };
}

// ── Top 3 Flow In/Out (Fase 4 RFL v2) ───────────────────────────────────────
// Filtro de coherencia interna, mismo criterio que ya usa Early Flow Detector en esta
// página (flowChange + score + trend deben apuntar en la misma dirección) — evita que un
// pico de flowChange de un solo día, sin respaldo del score/tendencia, aparezca como señal
// de entrada/salida. Formulación simétrica acordada con el usuario:
//   Entrantes: flowChange > 0  AND score >= 0  AND trend !== "Down"
//   Salientes: flowChange < 0  AND score <= 0  AND trend !== "Up"
function coherentFlowDirection(row) {
  if (!row || row.error || row.flowChange == null || row.score == null) return null;
  if (row.flowChange > 0 && row.score >= 0 && row.trend !== "Down") return "in";
  if (row.flowChange < 0 && row.score <= 0 && row.trend !== "Up") return "out";
  return null;
}

// ── Coherencia Cross-Módulos (Fase 5a RFL v2) ───────────────────────────────
// Ver wiki/MAPPING_SECTORIAL_CANONICO.md para el mapping sector→fase de Cycle
// Tracker→ticker de Flujos & Rotación→ratio de RFL, firmado antes de este código.
//
// Cada sector cruza 3 lecturas de horizonte distinto:
//   Cycle (3M)   — r3m del mismo ratio *_spy de RFL que usa como proxy el ticker que
//                  cycle.html marca role:"proxy" para esa fase. Aproximación declarada,
//                  NO el score compuesto del cesto completo de esa fase en cycle.html
//                  (evita reimplementar calcPhaseScores + descargar ~90 tickers extra).
//   Flujos (sem) — última entrada de rotation_history[ticker] en state.json (ya
//                  sembrado por rotacion.html), bucketizado por el mismo score 0-10 y
//                  los mismos umbrales VIGILAR=3/ACUMULAR=5 que usa esa página.
//   RFL (5-10d)  — flowChange del mismo ratio *_spy (5D vs 5D previos), el campo de
//                  horizonte más corto que ya calcula esta página.
const SECTOR_MAPPING = [
  { sector: "Transportation",         cyclePhase: "Early Bull",                          flujosTicker: null,  rflRatioId: null },
  { sector: "Technology",             cyclePhase: "Early → Mid Bull",                     flujosTicker: "XLK", rflRatioId: "xlk_spy" },
  { sector: "Capital Goods",          cyclePhase: "Mid → Late Bull",                      flujosTicker: "XLI", rflRatioId: "xli_spy" },
  { sector: "Materials",              cyclePhase: "Late Bull",                            flujosTicker: "XLB", rflRatioId: "xlb_spy" },
  { sector: "Oil & Gas",              cyclePhase: "Late Bull → Top — Oil & Gas",          flujosTicker: "XLE", rflRatioId: "xle_spy" },
  { sector: "Uranium",                cyclePhase: "Late Bull → Top — Uranium",            flujosTicker: null,  rflRatioId: "urnm_urth" },
  { sector: "Coal & Steel Inputs",    cyclePhase: "Late Bull → Top — Coal & Steel Inputs", flujosTicker: null, rflRatioId: null },
  { sector: "Staples",                cyclePhase: "Early Bear",                           flujosTicker: "XLP", rflRatioId: "xlp_spy" },
  { sector: "Healthcare",             cyclePhase: "Early Bear",                           flujosTicker: "XLV", rflRatioId: "xlv_spy" },
  { sector: "Utilities",              cyclePhase: "Late Bear (Approx.)",                  flujosTicker: "XLU", rflRatioId: "xlu_spy" },
  { sector: "Financials & Cyclicals", cyclePhase: "Late Bear",                            flujosTicker: "XLF", rflRatioId: "xlf_spy" },
];

// Umbrales de primera pasada, sin calibrar contra rendimiento — mismo criterio
// observacional que el resto de features nuevas del proyecto.
function bucketFromReturn(v, th) {
  if (v == null) return null;
  if (v >= th) return "BULLISH";
  if (v <= -th) return "BEARISH";
  return "NEUTRAL";
}
function bucketFromFlowChange(v) {
  if (v == null) return null;
  if (v >= 2) return "BULLISH";
  if (v <= -2) return "BEARISH";
  return "NEUTRAL";
}
// Mismos umbrales que rotacion.html: VIGILAR=3, ACUMULAR=5.
function bucketFromRotScore(score) {
  if (score == null) return null;
  if (score >= 5) return "BULLISH";
  if (score < 3) return "BEARISH";
  return "NEUTRAL";
}

// 5 estados acordados con el usuario. Los 3 módulos deben tener lectura para que la
// celda sea CONFIRMACIÓN/DIVERGENCIA/PARCIAL/NEUTRAL — si falta alguno, NO_EVALUABLE
// siempre, nunca se rellena con una lectura inventada.
function computeCoherenceState(cycle, flujos, rfl) {
  if (cycle == null || flujos == null || rfl == null) return "NO_EVALUABLE";
  const vals = [cycle, flujos, rfl];
  const bulls = vals.filter(v => v === "BULLISH").length;
  const bears = vals.filter(v => v === "BEARISH").length;
  const neutrals = vals.filter(v => v === "NEUTRAL").length;
  if (neutrals === 3) return "NEUTRAL";
  if (bulls === 3 || bears === 3) return "CONFIRMACION";
  if (bulls > 0 && bears > 0) return "DIVERGENCIA";
  return "PARCIAL";
}

function coherenceStyle(state) {
  if (state === "CONFIRMACION") return { label: "Confirmación", bg: "#c8e6c9", fg: "#1b5e20" };
  if (state === "DIVERGENCIA")  return { label: "Divergencia",  bg: "#ffcdd2", fg: "#b71c1c" };
  if (state === "PARCIAL")      return { label: "Parcial",      bg: "#d0e8ff", fg: "#0d2e6e" };
  if (state === "NEUTRAL")      return { label: "Neutral",      bg: "#f0f0f0", fg: "#555" };
  return { label: "No evaluable", bg: "#f5f5f5", fg: "#aaa" };
}

function bucketStyle(v) {
  if (v === "BULLISH") return { label: "Bullish", fg: "#1a7a1a" };
  if (v === "BEARISH") return { label: "Bearish", fg: "#b71c1c" };
  if (v === "NEUTRAL") return { label: "Neutral", fg: "#8a94a6" };
  return { label: "—", fg: "#ccc" };
}

function trackUxEvent(kind, name) {

    fetch("/api/ux-instrumentation", {

      body: JSON.stringify({ kind, name }),

function clusterSummary(group) {
  const rows = group.rows.filter(r => !r.error);
  const positives = rows.filter(r => r.score >= 3).length;
  const negatives = rows.filter(r => r.score <= -3).length;
  const active = positives + negatives;
  const avgScore = rows.length ? avg(rows.map(r => r.score)) : null;
  const coherence = active ? Math.round(Math.max(positives, negatives) / active * 100) : 0;
  const bias = positives > negatives ? "Bullish" : negatives > positives ? "Bearish" : active ? "Divergent" : "Quiet";
  const best  = [...rows].sort((a,b) => (b.score ?? -999) - (a.score ?? -999))[0];
  const worst = [...rows].sort((a,b) => (a.score ?? 999)  - (b.score ?? 999))[0];
  return { rows, positives, negatives, active, avgScore, coherence, bias, best, worst };
}

function biasStyle(bias) {
  if (bias === "Bullish")   return { background: "#c8e6c9", color: "#1b5e20" };
  if (bias === "Bearish")   return { background: "#ffcdd2", color: "#b71c1c" };
  if (bias === "Divergent") return { background: "#fff0cc", color: "#8a5200" };
  return { background: "#f0f0f0", color: "#555" };
}

// ── Lectura dinámica sobre relative_flow_history (RFL v2 Optimización — Fase
// posterior a la 1.2/1/2, ver CLAUDE.md) ────────────────────────────────────
// Puerto directo del patrón ya construido en rotacion.html (Flujos & Rotación
// v2 Fase 2: findHistEntryAtOrBefore/computeRotationDynamics) — mismo criterio
// "closest at or before N days ago" sin exigir hueco exacto de 7 días, porque
// esta pestaña tampoco tiene cron propio (recalcula todo en cada carga).
function findHistEntryAtOrBefore(history, daysAgo) {
  if (!history || history.length === 0) return null;
  const target = new Date();
  target.setDate(target.getDate() - daysAgo);
  const targetStr = target.toISOString().slice(0, 10);
  let best = null;
  for (const e of history) {
    if (e.date <= targetStr) best = e;
  }
  return best;
}

// Orden de "calidad" de clasificación, análogo a SIGNAL_RANK en rotacion.html — usado
// solo para decidir UPGRADED/DOWNGRADED, no cambia classify().
const RATIO_SIGNAL_RANK = { "Leader": 5, "Improving": 4, "Neutral": 3, "Weakening": 2, "Laggard": 1, "No data": 0 };

// Δ score 1W + badge de cambio de clasificación + semanas consecutivas en la clasificación
// actual. currentSignal debe ser classify(row).label ya calculado (post score), para que el
// badge compare exactamente lo que el usuario ve.
function computeRelativeFlowDynamics(history, currentScore, currentSignal) {
  if (!history || history.length === 0) return { delta1w: null, arrow: "→", badge: null, weeksInSignal: null };

  const ref = findHistEntryAtOrBefore(history, 7);
  const delta1w = ref && currentScore != null ? +(currentScore - ref.score).toFixed(1) : null;
  const arrow = delta1w == null ? "→" : delta1w >= 2 ? "↗" : delta1w <= -2 ? "↘" : "→";

  let badge = null;
  if (ref && ref.signal !== currentSignal) {
    const curRank = RATIO_SIGNAL_RANK[currentSignal] ?? 0;
    const refRank = RATIO_SIGNAL_RANK[ref.signal] ?? 0;
    if (curRank > refRank) badge = "UPGRADED";
    else if (curRank < refRank) badge = "DOWNGRADED";
  }

  // Racha de la clasificación actual en días naturales, no en nº de snapshots — mismo
  // motivo que en rotacion.html: la página solo graba cuando alguien la abre.
  let streakStart = history[history.length - 1].date;
  for (let i = history.length - 1; i >= 0; i--) {
    if (history[i].signal !== currentSignal) break;
    streakStart = history[i].date;
  }
  const daysInSignal = Math.floor((Date.now() - new Date(streakStart).getTime()) / 86400000);
  const weeksInSignal = Math.max(1, Math.round(daysInSignal / 7));

  return { delta1w, arrow, badge, weeksInSignal };
}

// ── Risk Appetite helpers ─────────────────────────────────────────────────
// Generaliza el antiguo invert:boolean de 4 ratios de Capa 1 a un
// signalDirection explícito por ratio (registry), sobre las 7 entradas de
// risk_appetite. "contextual" (ej. QQQ/RSP) no tiene lectura risk-on/off
// inequívoca — se muestra en la tabla pero no cuenta en el agregado.
function getRiskAppetiteSignal(row, direction) {
  if (!row || row.error || row.r1m == null) return "neutral";
  const up   = row.r1m > 1  && row.trend !== "Down";
  const down = row.r1m < -1 && row.trend !== "Up";
  if (direction === "higher_is_risk_off") return down ? "risk-on" : up ? "risk-off" : "neutral";
  if (direction === "higher_is_risk_on")  return up ? "risk-on" : down ? "risk-off" : "neutral";
  return "neutral"; // contextual — no cuenta en el agregado
}

function riskAppetiteSignalStyle(signal, direction) {
  if (direction === "contextual") return { label: "Contextual", bg: "#eef0f3", fg: "#5b6b7f" };
  if (signal === "risk-on")  return { label: "Risk-On",  bg: "#c8e6c9", fg: "#1b5e20" };
  if (signal === "risk-off") return { label: "Risk-Off", bg: "#ffcdd2", fg: "#b71c1c" };
  return { label: "Neutral", bg: "#f0f0f0", fg: "#555" };
}

// Risk Appetite Monitor — cuenta cuántos ratios direccionales (excluye
// signalDirection:"contextual") muestran signal="risk-off". No confundir con
// el régimen del MacroScore v2 (sistema completamente distinto —
// rotacion.html/backtest). Este bloque nunca debe llamarse "Macro Regime".
function riskAppetiteMonitorState(riskOffCount) {
  if (riskOffCount >= 4) return { label: "Confirmed Defensive Pressure",     color: "#b71c1c", bg: "#ffcdd2" };
  if (riskOffCount >= 3) return { label: "Risk-Off Warning",                color: "#c62828", bg: "#ffdad6" };
  if (riskOffCount >= 2) return { label: "Mixed / Defensive Rotation Warning", color: "#7a5200", bg: "#fff0cc" };
  if (riskOffCount >= 1) return { label: "Mild Defensive Warning",          color: "#8a5200", bg: "#fff7e0" };
  return                       { label: "Risk-On / No Warning",            color: "#1b5e20", bg: "#c8e6c9" };
}

// Texto de interpretación dinámico: score>=0 usa positiveMeaning, si no negativeMeaning.
function interpretationFor(row) {
  if (!row || row.error || row.score == null) return "-";
  return row.score >= 0 ? row.positiveMeaning : row.negativeMeaning;
}

// ── Spark ─────────────────────────────────────────────────────────────────
function Spark({ ratio, strong }) {
  const points = (ratio || []).slice(-90);
  if (points.length < 2) return <span style={{color:"#aaa"}}>-</span>;
  const vals = points.map(p => p.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = max - min || 1;
  const d = vals.map((v, i) => {
    const x = i / (vals.length - 1) * 100;
    const y = 26 - ((v - min) / span * 22 + 2);
    return `${i ? "L" : "M"}${x.toFixed(2)},${y.toFixed(2)}`;
  }).join(" ");
  return (
    <svg className="spark" viewBox="0 0 100 28" preserveAspectRatio="none">
      <path d={d} fill="none" stroke={strong ? "#1a7a1a" : "#3a6ca0"} strokeWidth="2"/>
      <line x1="0" y1="26" x2="100" y2="26" stroke="#e6e8eb" strokeWidth="1"/>
    </svg>
  );
}

// ── Main component ────────────────────────────────────────────────────────
function RelativeFlowLab() {
  const [history, setHistory] = React.useState({});
  const [loading, setLoading] = React.useState(new Set());
  const [toast,   setToast]   = React.useState(null);
  const [appState, setAppState] = React.useState(null);
  const flowHistorySavedRef = React.useRef(false);

  const allTickers = React.useMemo(() =>
    [...new Set(ALL_RATIO_DEFS.flatMap(p => [p.a, p.b]))],
  []);

  // ── Risk Appetite Monitor (bloque por pregunta #1) ──
  const riskAppetiteRows = React.useMemo(() =>
    DEFS_BY_TYPE.risk_appetite.map(pair => {
      const row    = buildRow(pair, history);
      const signal = getRiskAppetiteSignal(row, pair.signalDirection);
      return { ...pair, row, signal };
    }),
  [history]);

  const riskOffCount = React.useMemo(() =>
    riskAppetiteRows.filter(m => m.signal === "risk-off" && m.countedInMonitor !== false).length,
  [riskAppetiteRows]);

  // countedInMonitor:false (ej. TLT/SPY) se muestra en la tabla con lectura direccional
  // real, pero no altera el denominador — mismo criterio que signalDirection:"contextual"
  // (QQQ/RSP), aplicado aquí vía flag explícito porque la lectura de TLT/SPY sí es inequívoca.
  const riskAppetiteCountable = React.useMemo(() =>
    riskAppetiteRows.filter(m => m.signalDirection !== "contextual" && m.countedInMonitor !== false).length,
  [riskAppetiteRows]);

  // ── Bloques por tipo (Anticipation / Rotation / Regions / Sector Snapshot) ──
  // Cada row gana `dyn` (Δ1W, badge, semanas en clasificación) leído de
  // relative_flow_history — mismo patrón que row.dyn en rotacion.html.
  const rowsByType = React.useMemo(() => Object.fromEntries(
    RATIO_TYPE_ORDER.map(t => [t, DEFS_BY_TYPE[t].map(pair => {
      const row = buildRow(pair, history);
      if (row.error) return row;
      const dyn = computeRelativeFlowDynamics(appState?.relative_flow_history?.[row.id], row.score, classify(row).label);
      return { ...row, dyn };
    })])
  ), [history, appState]);

  // Bootstrap de relative_flow_history: fecha del primer snapshot guardado y si ya hay al
  // menos 7 días naturales de histórico. Mismo criterio que rotHistoryBootstrap en
  // rotacion.html — mientras no esté ready, Δ1W/Sem./badge se muestran como "—", nunca un
  // delta inventado.
  const relFlowHistoryBootstrap = React.useMemo(() => {
    const allDates = Object.values(appState?.relative_flow_history || {})
      .flat()
      .map(e => e.date)
      .sort();
    if (allDates.length === 0) return { startDate: null, ready: false };
    const startDate = allDates[0];
    const daysSinceStart = Math.floor((Date.now() - new Date(startDate).getTime()) / 86400000);
    return { startDate, ready: daysSinceStart >= 7 };
  }, [appState]);

  // ── Cluster View (secundaria) ──
  const rowsByGroup = React.useMemo(() =>
    RATIO_GROUPS.map(group => ({
      ...group,
      rows: group.items.map(pair => buildRow(pair, history)),
    })),
  [history]);

  const flatRows = rowsByGroup.flatMap(g => g.rows).filter(r => !r.error);

  // ── Persistencia diaria (Fase 1 de código, wiki/RFL_CLUSTER_REASSIGNMENT_TABLE.md) ──
  // Siembra relative_flow_history en state.json — bloqueante para la Fase 2 (lectura
  // dinámica de deltas, análoga a rotation_history en rotacion.html), no consumida
  // todavía. Mismo patrón dedup-por-día/cap-70 que rotation_history/macro_score_history.
  React.useEffect(() => {
    fetch('/api/state').then(r => r.json()).then(setAppState).catch(() => setAppState({}));
  }, []);

  React.useEffect(() => {
    if (flowHistorySavedRef.current) return;
    if (appState == null) return;
    if (loading.size > 0 || Object.keys(history).length < allTickers.length) return;
    if (flatRows.length === 0) return;
    flowHistorySavedRef.current = true;

    const today = new Date().toISOString().slice(0, 10);
    const newHistory = { ...(appState.relative_flow_history || {}) };
    flatRows.forEach(r => {
      const entry = { date: today, score: r.score, signal: classify(r).label, flowChange: r.flowChange, type: r.type };
      const hist = newHistory[r.id] || [];
      const last = hist[hist.length - 1];
      if (!last || last.date !== today) {
        hist.push(entry);
        if (hist.length > 70) hist.splice(0, hist.length - 70); // ~10 semanas, mismo cap que rotation_history
      } else {
        hist[hist.length - 1] = entry;
      }
      newHistory[r.id] = hist;
    });
    const newState = { ...appState, relative_flow_history: newHistory };
    setAppState(newState);
    fetch('/api/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newState) }).catch(() => {});
  }, [appState, loading, history, allTickers, flatRows]);

  const rankedRows = React.useMemo(() =>
    [...flatRows].sort((a,b) => (b.score ?? -999) - (a.score ?? -999)),
  [flatRows]);

  const accelerationRows = React.useMemo(() =>
    [...flatRows].sort((a,b) => (b.flowChange ?? -999) - (a.flowChange ?? -999)),
  [flatRows]);

  // ── Top 3 Flow In/Out (Fase 4) ── reemplaza "Top 5 Flow Change" como vista primaria;
  // el toggle "sin filtro" (flowFilterOff) mantiene disponible el ranking crudo de siempre.
  const [flowFilterOff, setFlowFilterOff] = React.useState(false);
  const topFlowIn = React.useMemo(() =>
    flatRows.filter(r => coherentFlowDirection(r) === "in")
      .sort((a,b) => (b.flowChange ?? -999) - (a.flowChange ?? -999))
      .slice(0, 3),
  [flatRows]);
  const topFlowOut = React.useMemo(() =>
    flatRows.filter(r => coherentFlowDirection(r) === "out")
      .sort((a,b) => (a.flowChange ?? 999) - (b.flowChange ?? 999))
      .slice(0, 3),
  [flatRows]);

  // ── Coherencia Cross-Módulos (Fase 5a) ──────────────────────────────────
  // rowById: lookup plano por id de ratio, para poder leer xlk_spy/xli_spy/etc. sin
  // depender de en qué type/cluster esté clasificado cada uno.
  const rowById = React.useMemo(() =>
    Object.fromEntries(ALL_RATIO_DEFS.map(p => [p.id, buildRow(p, history)])),
  [history]);

  const crossModuleRows = React.useMemo(() => SECTOR_MAPPING.map(m => {
    const rflRow = m.rflRatioId ? rowById[m.rflRatioId] : null;
    const hasRflData = rflRow && !rflRow.error;
    const cycleRead = hasRflData ? bucketFromReturn(rflRow.r3m, 3) : null;
    const rflRead = hasRflData ? bucketFromFlowChange(rflRow.flowChange) : null;
    const flujosHist = m.flujosTicker ? (appState?.rotation_history?.[m.flujosTicker] || []) : [];
    const flujosLatest = flujosHist.length ? flujosHist[flujosHist.length - 1] : null;
    const flujosRead = flujosLatest ? bucketFromRotScore(flujosLatest.score) : null;
    const coherence = computeCoherenceState(cycleRead, flujosRead, rflRead);
    return { ...m, rflRow, cycleRead, rflRead, flujosLatest, flujosRead, coherence };
  }), [rowById, appState]);

  const weakRows = React.useMemo(() =>
    [...flatRows].sort((a,b) => (a.score ?? 999) - (b.score ?? 999)),
  [flatRows]);

  // ── Early Flow Detector ──
  const earlyFlowRatios = React.useMemo(() =>
    flatRows.filter(r =>
      r.flowChange != null && r.flowChange > 0 &&
      r.rsi != null && r.rsi >= 45 && r.rsi <= 60 &&
      r.r1m != null && r.r1m > 0 &&
      r.trend !== "Down"
    ).sort((a,b) => (b.flowChange ?? 0) - (a.flowChange ?? 0)),
  [flatRows]);

  const summary = React.useMemo(() => {
    const leaders  = flatRows.filter(r => classify(r).label === "Leader").length;
    const improving = flatRows.filter(r => classify(r).label === "Improving").length;
    const laggards  = flatRows.filter(r => classify(r).label === "Laggard").length;
    return { leaders, improving, laggards, best: rankedRows[0], worst: weakRows[0] };
  }, [flatRows, rankedRows, weakRows]);

  const showToast = msg => { setToast(msg); setTimeout(() => setToast(null), 2600); };

  const refresh = React.useCallback(async () => {
    setLoading(new Set(allTickers));
    setHistory({});
    await Promise.allSettled(allTickers.map(async ticker => {
      try {
        const r = await fetch(`/api/history/${encodeURIComponent(ticker)}?range=3y`);
        const d = await r.json();
        if (d.error) throw new Error(d.error);
        setHistory(prev => ({ ...prev, [ticker]: d }));
      } catch(e) {
        setHistory(prev => ({ ...prev, [ticker]: { ticker, error: e.message } }));
      }
      setLoading(prev => { const s = new Set(prev); s.delete(ticker); return s; });
    }));
  }, [allTickers]);

  React.useEffect(() => { refresh(); }, [refresh]);

  // Fase 6: page_load se dispara una sola vez por carga de página.
  const pageLoadTrackedRef = React.useRef(false);
  React.useEffect(() => {
    if (pageLoadTrackedRef.current) return;
    pageLoadTrackedRef.current = true;
    trackUxEvent("page_load");
  }, []);

  // Fase 6: el hover de la matriz cross-módulos se cuenta una sola vez por sesión de
  // página (mide "¿se mira el panel?", no cada micro-movimiento del ratón dentro de él).
  const xmodHoverTrackedRef = React.useRef(false);
  const trackXmodHover = () => {
    if (xmodHoverTrackedRef.current) return;
    xmodHoverTrackedRef.current = true;
    trackUxEvent("widget_interaction", "cross_module_matrix_hover");
  };

  const buildRelativeMarkdown = () => {
    const rs = riskAppetiteMonitorState(riskOffCount);
    const lines = [];
    lines.push("# Relative Flow Lab v2");
    lines.push("");
    lines.push(`## Risk Appetite Monitor — ${riskOffCount}/${riskAppetiteCountable} defensive warnings (${rs.label})`);
    lines.push("Question: Is the market favoring risk-taking or safety?");
    lines.push("| Ratio | Pair | Direction | Signal | 1W | 1M | 3M | RSI | Trend |");
    lines.push("|---|---:|---|---|---:|---:|---:|---:|---|");
    riskAppetiteRows.forEach(m => {
      const r = m.row;
      const st = riskAppetiteSignalStyle(m.signal, m.signalDirection);
      const dir = m.signalDirection + (m.countedInMonitor === false ? " (no cuenta)" : "");
      lines.push(`| ${m.name} | ${m.a}/${m.b} | ${dir} | ${st.label} | ${fmtPct(r.r1w)} | ${fmtPct(r.r1m)} | ${fmtPct(r.r3m)} | ${r.rsi == null ? "-" : r.rsi.toFixed(0)} | ${r.trend ?? "-"} |`);
    });
    if (earlyFlowRatios.length) {
      lines.push("");
      lines.push("## Early Flow (acumulación temprana)");
      earlyFlowRatios.forEach(r => lines.push(`- ${r.name} (${r.a}/${r.b}) — FlowChg: ${fmtPct(r.flowChange)}, RSI: ${r.rsi?.toFixed(0)}, 1M: ${fmtPct(r.r1m)}`));
    }

    RATIO_TYPE_ORDER.filter(t => t !== "risk_appetite").forEach(t => {
      const meta = RATIO_TYPES[t];
      const rows = [...rowsByType[t]].filter(r => !r.error).sort((a,b) => (b.score ?? -999) - (a.score ?? -999));
      lines.push("");
      lines.push(`## ${meta.label}`);
      lines.push(`Question: ${meta.question}`);
      lines.push("");
      lines.push("Top Signals:");
      rows.slice(0, 3).forEach((r, i) => lines.push(`${i+1}. ${r.name} (${r.a}/${r.b}) — ${classify(r).label} — ${interpretationFor(r)}`));
      lines.push("");
      lines.push("| Ratio | Pair | Score | Signal | Δ1W | Sem. | Flow Chg | 1W | 1M | 3M | RSI | Trend | Interpretation |");
      lines.push("|---|---:|---:|---|---:|---:|---:|---:|---:|---:|---:|---|---|");
      rows.forEach(r => {
        const d1 = relFlowHistoryBootstrap.ready && r.dyn?.delta1w != null ? (r.dyn.delta1w>0?"+":"")+r.dyn.delta1w : "—";
        const wk = relFlowHistoryBootstrap.ready && r.dyn?.weeksInSignal != null ? r.dyn.weeksInSignal : "—";
        const badgeStr = relFlowHistoryBootstrap.ready && r.dyn?.badge ? ` [${r.dyn.badge}]` : "";
        lines.push(`| ${r.name} | ${r.a}/${r.b} | ${fmtNum(r.score)} | ${classify(r).label}${badgeStr} | ${d1} | ${wk} | ${fmtPct(r.flowChange)} | ${fmtPct(r.r1w)} | ${fmtPct(r.r1m)} | ${fmtPct(r.r3m)} | ${r.rsi == null ? "-" : r.rsi.toFixed(0)} | ${r.trend ?? "-"} | ${interpretationFor(r)} |`);
      });
    });

    if (!relFlowHistoryBootstrap.ready) {
      lines.push("");
      lines.push(`_Métricas históricas (Δ1W, Semanas en clasificación) disponibles a partir de la segunda semana desde ${relFlowHistoryBootstrap.startDate ?? "—"}._`);
    }

    lines.push("");
    lines.push("## Most Extreme Relative Moves");
    lines.push("| # | Ratio | Pair | Type | Score | Signal | Flow Chg |");
    lines.push("|---:|---|---:|---|---:|---|---:|");
    [...flatRows].sort((a,b) => Math.abs(b.score ?? 0) - Math.abs(a.score ?? 0)).slice(0, 5).forEach((r, i) =>
      lines.push(`| ${i+1} | ${r.name} | ${r.a}/${r.b} | ${r.type} | ${fmtNum(r.score)} | ${classify(r).label} | ${fmtPct(r.flowChange)} |`)
    );
    lines.push("");
    lines.push("## Top 3 Flow In/Out");
    lines.push("Coherencia interna: flowChange, score y trend deben apuntar en la misma dirección (mismo criterio que Early Flow Detector). Entrantes: flowChange>0 AND score>=0 AND trend!=Down. Salientes: flowChange<0 AND score<=0 AND trend!=Up.");
    lines.push("");
    lines.push("### Entrando");
    lines.push("| # | Ratio | Pair | Score | Signal | Flow Chg |");
    lines.push("|---:|---|---:|---:|---|---:|");
    if (topFlowIn.length === 0) lines.push("_Sin candidatos coherentes hoy._");
    topFlowIn.forEach((r, i) =>
      lines.push(`| ${i+1} | ${r.name} | ${r.a}/${r.b} | ${fmtNum(r.score)} | ${classify(r).label} | ${fmtPct(r.flowChange)} |`)
    );
    lines.push("");
    lines.push("### Saliendo");
    lines.push("| # | Ratio | Pair | Score | Signal | Flow Chg |");
    lines.push("|---:|---|---:|---:|---|---:|");
    if (topFlowOut.length === 0) lines.push("_Sin candidatos coherentes hoy._");
    topFlowOut.forEach((r, i) =>
      lines.push(`| ${i+1} | ${r.name} | ${r.a}/${r.b} | ${fmtNum(r.score)} | ${classify(r).label} | ${fmtPct(r.flowChange)} |`)
    );
    lines.push("");
    lines.push("## Top 5 Flow Change (sin filtro)");
    lines.push("| # | Ratio | Pair | Score | Signal | Flow Chg |");
    lines.push("|---:|---|---:|---:|---|---:|");
    accelerationRows.slice(0, 5).forEach((r, i) =>
      lines.push(`| ${i+1} | ${r.name} | ${r.a}/${r.b} | ${fmtNum(r.score)} | ${classify(r).label} | ${fmtPct(r.flowChange)} |`)
    );

    lines.push("");
    lines.push("## Coherencia Cross-Módulos — Cycle Tracker · Flujos & Rotación · RFL");
    lines.push("Coincidencia entre los 3 módulos SUGIERE consenso multi-horizonte (no lo confirma). Divergencia PLANTEA lectura ambigua (no la contradice). Confirmación con horizontes distintos NO garantiza continuación de tendencia. Ver wiki/MAPPING_SECTORIAL_CANONICO.md para el mapping completo.");
    lines.push("");
    lines.push("| Sector | Cycle (3M) | Flujos (semanal) | RFL (5-10d) | Coherencia |");
    lines.push("|---|---|---|---|---|");
    crossModuleRows.forEach(r => {
      const cb = bucketStyle(r.cycleRead), fb = bucketStyle(r.flujosRead), rb = bucketStyle(r.rflRead);
      const cs = coherenceStyle(r.coherence);
      lines.push(`| ${r.sector} | ${cb.label}${r.rflRow && !r.rflRow.error && r.rflRow.r3m != null ? ` (${fmtPct(r.rflRow.r3m)})` : ""} | ${fb.label}${r.flujosLatest ? ` (score ${r.flujosLatest.score}/10)` : ""} | ${rb.label}${r.rflRow && !r.rflRow.error && r.rflRow.flowChange != null ? ` (${fmtPct(r.rflRow.flowChange)})` : ""} | ${cs.label} |`);
    });

    lines.push("");
    lines.push("## Cluster View (secondary)");
    lines.push("| Cluster | Bias | Avg Score | Coherence | Active | Best | Worst |");
    lines.push("|---|---|---:|---:|---:|---|---|");
    rowsByGroup.forEach(group => {
      const c = clusterSummary(group);
      lines.push(`| ${group.id} | ${c.bias} | ${fmtNum(c.avgScore)} | ${c.active ? `${c.coherence}%` : "-"} | ${c.positives}+/${c.negatives}- | ${c.best ? `${c.best.a}/${c.best.b}` : "-"} | ${c.worst ? `${c.worst.a}/${c.worst.b}` : "-"} |`);
    });
    lines.push("");
    lines.push("## Raw Ratio Tables (by cluster)");
    rowsByGroup.forEach(group => {
      lines.push(`### ${group.id}`);
      lines.push("| Ratio | Pair | Score | Signal | Flow Chg | 1W | 1M | 3M | RSI | Trend | From 52W High |");
      lines.push("|---|---:|---:|---|---:|---:|---:|---:|---:|---|---:|");
      group.rows.forEach(r => {
        lines.push(`| ${r.name} | ${r.a}/${r.b} | ${r.error ? "-" : fmtNum(r.score)} | ${classify(r).label} | ${fmtPct(r.flowChange)} | ${fmtPct(r.r1w)} | ${fmtPct(r.r1m)} | ${fmtPct(r.r3m)} | ${r.rsi == null ? "-" : r.rsi.toFixed(0)} | ${r.trend ?? "-"} | ${fmtPct(r.fromHigh)} |`);
      });
      lines.push("");
    });
    return lines.join("\n");

  React.useEffect(() => {
    if (loading.size === 0 && flatRows.length > 0) {
      try { localStorage.setItem('llm_export_relative', buildRelativeMarkdown()); localStorage.setItem('llm_export_relative_ts', Date.now().toString()); } catch {}
    }
  }, [loading.size, flatRows.length]);

  const copyMarkdown = () => {
    trackUxEvent("button_click", "copy_for_llm");
    navigator.clipboard.writeText(buildRelativeMarkdown()).then(() => showToast("Copiado para LLM"));
  };

  const copyAllForLLM = () => {
    trackUxEvent("button_click", "export_all_to_llm");
    const parts = [
      { key: 'llm_export_market',    label: 'Market Tracker' },
      { key: 'llm_export_portfolio', label: 'Portfolio' },
      { key: 'llm_export_cycle',     label: 'Cycle' },
      { key: 'llm_export_relative',  label: 'Relative Flow' },
      { key: 'llm_export_rotacion',  label: 'Flujos & Rotación' },
      { key: 'llm_export_duration',  label: 'Duration' },
      { key: 'llm_export_sentiment', label: 'Sentiment' },
      { key: 'llm_export_positioning', label: 'Positioning' },
    ];
    const now = Date.now();
    const found = [], missing = [], stale = [];
    const sections = parts.map(({ key, label }) => {
      const md = localStorage.getItem(key);
      if (md) {
        found.push(label);
        const ts = parseInt(localStorage.getItem(key + '_ts') || '0');
        const hours = ts ? Math.round((now - ts) / 3600000) : null;
        if (!ts || hours > 23) stale.push(hours != null ? `${label} (${hours}h)` : label);
        return md;
      }
      missing.push(label); return null;
    }).filter(Boolean);
    if (!sections.length) { showToast('⚠️ Abre cada pestaña primero para generar datos'); return; }
    const exportDate = new Date().toLocaleString('es-ES', { dateStyle: 'full', timeStyle: 'short' });
    const header = `**Exportado:** ${exportDate}` +
      (stale.length ? `\n⚠️ **Secciones desactualizadas (>24h):** ${stale.join(', ')} — Abre esas pestañas para refrescar\n` : '\n');
    const combined = header + '\n---\n\n' + sections.join('\n\n---\n\n');
    navigator.clipboard.writeText(combined)
      .then(() => {
        if (stale.length) showToast(`⚠️ ${stale.length} secc. desactualizadas: ${stale.join(', ')}`);
        else if (missing.length) showToast(`✅ ${found.length}/${parts.length} pestañas — Falta: ${missing.join(', ')}`);
        else showToast('✅ Todas las pestañas copiadas (datos frescos)');
      })
      .catch(() => showToast('❌ Error al copiar'));
  };

  const rs = riskAppetiteMonitorState(riskOffCount);

  return (
    <div className="wrap">
      {toast && <div className="toast">{toast}</div>}

      {/* ── Header ── */}
      <div className="topbar">
        <div>
          <div className="title-row">
            <h1>Relative Flow Lab <span style={{fontSize:13,color:'#888',fontWeight:400}}>v2</span></h1>
            <a className="nav-link" href="/index.html" style={{color:'#1a6b3c',borderColor:'#1a6b3c'}}>Market Tracker</a>
            <a className="nav-link" href="/portfolio.html" style={{color:'#3a6ca0',borderColor:'#3a6ca0'}}>Portfolio</a>
            <a className="nav-link" href="/cycle.html" style={{color:'#7f0000',borderColor:'#7f0000'}}>Cycle</a>
            <a className="nav-link" href="/rotacion.html" style={{color:'#e65100',borderColor:'#e65100'}}>Flujos & Rotación</a>
            <a className="nav-link" href="/sentiment.html" style={{color:'#00695c',borderColor:'#00695c'}}>Sentiment</a>
            <a className="nav-link" href="/duration.html" style={{color:'#37474f',borderColor:'#37474f'}}>Duration</a>
            <a className="nav-link" href="/positioning.html" style={{color:'#5d4037',borderColor:'#5d4037'}}>Positioning</a>
          </div>
          <div className="meta">Yahoo Finance historical closes · Relative returns son retornos del ratio, no del activo</div>
        </div>
        <div className="actions">
          <button className="btn-copy" onClick={copyMarkdown} disabled={loading.size > 0 || !flatRows.length}>Copy for LLM</button>
          <button onClick={copyAllForLLM} style={{fontSize:11,border:'none',borderRadius:3,padding:'5px 12px',cursor:'pointer',fontWeight:600,color:'white',background:'#37474f'}}>🗂️ Exportar TODO a LLM</button>
          <button className="btn-refresh" onClick={refresh} disabled={loading.size > 0}>{loading.size ? `${loading.size} pending…` : "Refresh"}</button>
        </div>
      </div>

      {/* ── Bloque #1: Risk Appetite Monitor ── */}
      <div className="macro-panel">
        <div className="macro-header">🔵 Risk Appetite Monitor — Is the market favoring risk-taking or safety?</div>
        <div className="macro-body">
          <div className="macro-table-wrap">
            <table className="macro-table">
              <thead>
                <tr>
                  <th style={{textAlign:"left"}} data-tip="Nombre del ratio. La columna Dirección indica cómo leer la subida del ratio — no todos suben con lectura risk-on.">Ratio</th>
                  <th>Pair</th>
                  <th data-tip={"higher_is_risk_on: sube = risk-on\nhigher_is_risk_off: sube = risk-off (ratio invertido)\ncontextual: sin lectura risk-on/off inequívoca, no cuenta en el agregado\n'no cuenta': lectura inequívoca pero excluida del denominador (ej. TLT/SPY, ver countedInMonitor)"}>Dirección</th>
                  <th data-tip={"Retorno del ratio en los últimos 5 días."}>1W</th>
                  <th data-tip={"Retorno del ratio en los últimos 21 días.\nBase del señal de régimen."}>1M</th>
                  <th data-tip={"Retorno del ratio en los últimos 63 días."}>3M</th>
                  <th data-tip={"RSI(14) del ratio.\nZona 45–60 = momentum moderado."}>RSI</th>
                  <th data-tip={"Tendencia de medias móviles del ratio.\nUp: precio > SMA20 > SMA63\nDown: precio < SMA20 < SMA63"}>Trend</th>
                  <th data-tip={"Señal de régimen para este ratio.\nRisk-On / Risk-Off / Neutral / Contextual (no cuenta en el agregado)."}>Señal</th>
                </tr>
              </thead>
              <tbody>
                {riskAppetiteRows.map(m => {
                  const r   = m.row;
                  const st  = riskAppetiteSignalStyle(m.signal, m.signalDirection);
                  const c1w = cellStyle(r.r1w), c1m = cellStyle(r.r1m), c3m = cellStyle(r.r3m);
                  return (
                    <tr key={m.id}>
                      <td style={{textAlign:"left",fontWeight:600,cursor:"help",position:"relative"}}
                        className="name" data-tip={m.tip}>
                        {m.name}
                      </td>
                      <td style={{fontFamily:"Consolas,monospace",fontSize:10,color:"#1a6baa"}}>{m.a}/{m.b}</td>
                      <td style={{fontSize:9,color:"#8a94a6"}}>
                        {m.signalDirection.replace(/_/g," ")}
                        {m.countedInMonitor === false && <span style={{color:"#b08d3a"}}> · no cuenta</span>}
                      </td>
                      <td style={{fontFamily:"Consolas,monospace",...c1w}}>{r.error ? "-" : fmtPct(r.r1w)}</td>
                      <td style={{fontFamily:"Consolas,monospace",...c1m}}>{r.error ? "-" : fmtPct(r.r1m)}</td>
                      <td style={{fontFamily:"Consolas,monospace",...c3m}}>{r.error ? "-" : fmtPct(r.r3m)}</td>
                      <td style={{fontFamily:"Consolas,monospace",color:r.rsi>60?"#1a7a1a":r.rsi<40?"#b71c1c":"#555"}}>{r.rsi == null ? "-" : r.rsi.toFixed(0)}</td>
                      <td style={{fontWeight:700,color:r.trend==="Up"?"#1a7a1a":r.trend==="Down"?"#b71c1c":"#777"}}>{r.trend ?? "-"}</td>
                      <td>
                        <span style={{background:st.bg,color:st.fg,fontWeight:700,borderRadius:3,padding:"2px 8px",fontSize:10,display:"inline-block",minWidth:68}}>
                          {st.label}
                        </span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div className="regime-box">
            <div className="regime-inner" style={{background: rs.bg}}>
              <div className="regime-label">Risk Appetite Monitor</div>
              <div className="regime-score" style={{color: rs.color}}>{riskOffCount}<span style={{fontSize:18,fontWeight:400}}>/{riskAppetiteCountable} warnings</span></div>
              <div className="regime-state" style={{color: rs.color}}>{rs.label}</div>
            </div>
          </div>
        </div>
      </div>

      {/* ── Early Flow Detector ── */}
      <div className="early-panel">
        <div className="early-header">🔍 Early Flow Detector — ratios en acumulación temprana</div>
        <div className="early-body">
          {earlyFlowRatios.length === 0
            ? <span className="early-empty">{loading.size > 0 ? "Cargando datos…" : "Sin señales de acumulación temprana en este momento"}</span>

                <div className="early-chip" key={`${r.a}-${r.b}`} title={r.tip}>

              ))
          }

      <div className="summary">

        <div className="stat"><div className="label">Improving</div><div className="value">{summary.improving}</div></div>
        <div className="stat"><div className="label">Best</div><div className="value" style={{fontSize:13}}>{summary.best ? `${summary.best.a}/${summary.best.b}` : "-"}</div></div>
        <div className="stat"><div className="label">Worst</div><div className="value" style={{fontSize:13}}>{summary.worst ? `${summary.worst.a}/${summary.worst.b}` : "-"}</div></div>
      </div>

      <div className="section-label">📍 Question-Based Views</div>
      {relFlowHistoryBootstrap.startDate && !relFlowHistoryBootstrap.ready && (
        <div style={{fontSize:10,color:"#8a94a6",fontStyle:"italic",margin:"-4px 0 8px"}}>
          Métricas históricas (Δ1W, semanas en clasificación) disponibles a partir de la segunda semana desde {relFlowHistoryBootstrap.startDate}.
        </div>

      {!relFlowHistoryBootstrap.startDate && (
        <div style={{fontSize:10,color:"#8a94a6",fontStyle:"italic",margin:"-4px 0 8px"}}>

        </div>
      )}
      <QuestionBlock typeKey="anticipation" rows={rowsByType.anticipation} bootstrapReady={relFlowHistoryBootstrap.ready} />
      <QuestionBlock typeKey="rotation" rows={rowsByType.rotation} bootstrapReady={relFlowHistoryBootstrap.ready} />
      <QuestionBlock typeKey="regions" rows={rowsByType.regions} bootstrapReady={relFlowHistoryBootstrap.ready} />
      <QuestionBlock typeKey="sector_snapshot" rows={rowsByType.sector_snapshot} bootstrapReady={relFlowHistoryBootstrap.ready} />

      {/* ── Most Extreme / Flow Change ── */}
      <div className="panel-grid">
        <div className="panel">
          <div className="panel-title">Most Extreme Relative Moves</div>
          {[...flatRows].sort((a,b) => Math.abs(b.score ?? 0) - Math.abs(a.score ?? 0)).slice(0, 5).map((r, i) => (

              title="Coherencia interna: flowChange, score y trend deben apuntar en la misma dirección (mismo criterio que Early Flow Detector)."

                <div className="rank-row" key={`flow-${r.a}-${r.b}`}>
                  <div className="rank-num">#{i+1}</div>
                  <div>{r.name}</div>
                  <div className="rank-pair">{r.a}/{r.b}</div>
                  <div className="rank-score" style={{color:f.fg}}>{fmtPct(r.flowChange)}</div>
                </div>
              );
            })
          ) : (
            <React.Fragment>
              <div className="flowinout-sub">▲ Entrando (Top 3, coherente)</div>
              {topFlowIn.length === 0
                ? <div className="qblock-empty" style={{padding:"5px 9px"}}>Sin candidatos coherentes hoy</div>
                : topFlowIn.map((r, i) => (
                    <div className="rank-row" key={`flowin-${r.a}-${r.b}`}>
                      <div className="rank-num">#{i+1}</div>
                      <div>{r.name}</div>
                      <div className="rank-pair">{r.a}/{r.b}</div>
                      <div className="rank-score" style={{color:"#1a7a1a"}}>{fmtPct(r.flowChange)}</div>
                    </div>
                  ))
              }
              <div className="flowinout-sub">▼ Saliendo (Top 3, coherente)</div>
              {topFlowOut.length === 0
                ? <div className="qblock-empty" style={{padding:"5px 9px"}}>Sin candidatos coherentes hoy</div>
                : topFlowOut.map((r, i) => (
                    <div className="rank-row" key={`flowout-${r.a}-${r.b}`}>
                      <div className="rank-num">#{i+1}</div>
                      <div>{r.name}</div>
                      <div className="rank-pair">{r.a}/{r.b}</div>
                      <div className="rank-score" style={{color:"#b71c1c"}}>{fmtPct(r.flowChange)}</div>
                    </div>
                  ))
              }
            </React.Fragment>
          )}
        </div>
      </div>

      {/* ── Coherencia Cross-Módulos (Fase 5a) ── */}
      <div className="section-label">🧭 Coherencia Cross-Módulos — Cycle Tracker · Flujos & Rotación · RFL</div>
      <div className="panel" style={{marginBottom:4}}>
        <div className="panel-title">Cycle (3M) · Flujos (semanal) · RFL (5-10d)</div>
        <div style={{overflowX:"auto"}} onMouseEnter={trackXmodHover}>
          <table className="xmod-table">
            <thead>
              <tr>
                <th style={{textAlign:"left"}}>Sector</th>
                <th data-tip={"Retorno a 3 meses del ratio *_spy de RFL para el ticker que Cycle Tracker usa como proxy de esa fase.\nAproximación — no es el score compuesto del cesto completo de la fase en cycle.html."}>Cycle (3M)</th>
                <th data-tip={"Última entrada de rotation_history en state.json (sembrado por rotacion.html).\nBullish si RotScore≥5 (ACUMULAR) · Bearish si <3 · Neutral 3-4 (VIGILAR)."}>Flujos (semanal)</th>
                <th data-tip={"Flow Change (5D vs 5D previos) del mismo ratio *_spy de RFL — el horizonte más corto de esta página."}>RFL (5-10d)</th>
                <th data-tip={"CONFIRMACIÓN: los 3 coinciden · DIVERGENCIA: hay signos opuestos\nPARCIAL: 2 coinciden, resto neutral · NEUTRAL: los 3 neutrales\nNO EVALUABLE: falta lectura en algún módulo — nunca se inventa un dato."}>Coherencia</th>
              </tr>
            </thead>
            <tbody>
              {crossModuleRows.map((r, idx) => {
                const cb = bucketStyle(r.cycleRead), fb = bucketStyle(r.flujosRead), rb = bucketStyle(r.rflRead);
                const cs = coherenceStyle(r.coherence);
                return (
                  <tr key={r.sector} style={{background: idx % 2 ? "#f8f9fb" : "white"}}
                    onClick={() => trackUxEvent("widget_interaction", "cross_module_matrix_click")}>
                    <td className="name" data-tip={r.cyclePhase}>{r.sector}</td>
                    <td>
                      <span style={{color:cb.fg,fontWeight:700}}>{cb.label}</span>
                      {r.rflRow && !r.rflRow.error && r.rflRow.r3m != null && <span className="xmod-bucket-val" style={{color:"#999"}}>{fmtPct(r.rflRow.r3m)}</span>}
                    </td>
                    <td>
                      <span style={{color:fb.fg,fontWeight:700}}>{fb.label}</span>
                      {r.flujosLatest && <span className="xmod-bucket-val" style={{color:"#999"}}>score {r.flujosLatest.score}/10</span>}
                    </td>
                    <td>
                      <span style={{color:rb.fg,fontWeight:700}}>{rb.label}</span>
                      {r.rflRow && !r.rflRow.error && r.rflRow.flowChange != null && <span className="xmod-bucket-val" style={{color:"#999"}}>{fmtPct(r.rflRow.flowChange)}</span>}
                    </td>
                    <td><span className="xmod-badge" style={{background:cs.bg,color:cs.fg}}>{cs.label}</span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div className="xmod-note">
          Coincidencia entre los 3 módulos <b>sugiere</b> consenso multi-horizonte — no lo confirma.
          Divergencia entre los módulos <b>plantea</b> lectura ambigua, no la contradice.
          Una confirmación con horizontes distintos <b>no garantiza</b> continuación de tendencia.
          Ver <code>wiki/MAPPING_SECTORIAL_CANONICO.md</code> para el mapping sector→ticker completo
          y las 3 filas marcadas "No evaluable" a propósito (Transportation, Uranium, Coal &amp; Steel
          Inputs) por no compartir el mismo ticker en los tres módulos.
        </div>
      </div>

      {/* ── Cluster View (secundaria) ── */}
      <div className="section-label">🟡 Cluster Coherence View (secondary)</div>
      <div className="panel" style={{marginBottom:12}}>
        <div className="panel-title">Cluster View</div>
        <div className="cluster-grid" style={{padding:8,marginBottom:0}}>
          {rowsByGroup.map(group => {
            const c  = clusterSummary(group);
            const bs = biasStyle(c.bias);
            return (
              <div className="cluster" key={`cluster-${group.id}`}>
                <div className="cluster-head">
                  <div className="cluster-name">{group.id}</div>
                  <div className="cluster-bias" style={bs}>{c.bias}</div>
                </div>
                <div className="cluster-stats">
                  <div className="cluster-stat"><span>Avg score</span><b>{fmtNum(c.avgScore)}</b></div>
                  <div className="cluster-stat"><span>Coherence</span><b>{c.active ? `${c.coherence}%` : "-"}</b></div>
                  <div className="cluster-stat"><span>Active</span><b>{c.positives}+ / {c.negatives}-</b></div>
                </div>
                <div className="cluster-note">
                  Best: {c.best ? `${c.best.a}/${c.best.b} ${fmtNum(c.best.score)}` : "-"} | Worst: {c.worst ? `${c.worst.a}/${c.worst.b} ${fmtNum(c.worst.score)}` : "-"}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* ── Raw Ratio Tables (tertiary, grouped by cluster) ── */}
      <div className="section-label">🔽 Raw Ratio Tables — by cluster (detailed)</div>
      <table className="flow-table">
        <thead>
          <tr>
            <th style={{textAlign:"left"}}>Ratio</th>
            <th>Pair</th>
            <th data-tip={"Posición global ordenada por Score.\nTop 5 se resaltan en verde."}>Rank</th>
            <th data-tip={"Puntuación compuesta de momentum relativo.\nFórmula: (1W×0.5) + (1M×0.7) + (3M×0.25)\n+ ajuste Trend (±2) + ajuste RSI (±0.8–1.5)\n+ ajuste Flow Change (clippeado ±3)."}>Score</th>
            <th data-tip={"Clasificación cualitativa basada en Score:\nLeader ≥ 8 · Improving ≥ 3\nWeakening ≤ -3 · Laggard ≤ -8\nNeutral: entre -3 y +3"}>Signal</th>
            <th data-tip={"Aceleración del flujo relativo.\nDiferencia entre retorno relativo últimos 5D vs 5D previos.\nPositivo = momentum acelerando."}>Flow Chg</th>
            <th data-tip={"Retorno del ratio en los últimos 5 días."}>1W Rel</th>
            <th data-tip={"Retorno del ratio en los últimos 21 días.\nFactor de mayor peso en el Score (×0.7)."}>1M Rel</th>
            <th data-tip={"Retorno del ratio en los últimos 63 días."}>3M Rel</th>
            <th data-tip={"Retorno del ratio en los últimos 126 días.\nReferencia de contexto, no entra en el Score."}>6M Rel</th>
            <th data-tip={"RSI(14) del ratio.\n>65: sobrecomprado (+1.5 al Score)\n>55: fuerte (+0.8)\n<45: débil (-0.8)\n<35: sobrevendido (-1.5)"}>RSI</th>
            <th data-tip={"Tendencia de medias móviles del ratio.\nUp: precio > SMA20 > SMA63 (+2 al Score)\nDown: precio < SMA20 < SMA63 (-2)\nMixed: sin alineación clara (0)"}>Trend</th>
            <th data-tip={"Distancia desde el máximo del ratio en los últimos 252 días.\nCercano a 0% = ratio en máximos relativos."}>From 52W High</th>
            <th data-tip={"Gráfico de los últimos 90 días del ratio A/B.\nVerde = señal Leader o Improving.\nAzul = resto."}>90D Ratio</th>
          </tr>
        </thead>
        <tbody>
          {rowsByGroup.map(group => (
            <React.Fragment key={group.id}>
              <tr className="group-row"><td colSpan="14">{group.id}</td></tr>
              {group.rows.map((r, idx) => {
                const sig      = classify(r);
                const flowSig  = flowChangeLabel(r.flowChange);
                const rank     = rankedRows.findIndex(x => x.a === r.a && x.b === r.b) + 1;
                const c1w = cellStyle(r.r1w), c1m = cellStyle(r.r1m);
                const c3m = cellStyle(r.r3m), c6m = cellStyle(r.r6m);
                return (
                  <tr key={`${r.a}-${r.b}`} style={{background: idx % 2 ? "#f8f9fb" : "white"}}>
                    <td className="name" data-tip={r.tip}>{r.name}</td>
                    <td className="tickers">{r.a} / {r.b}</td>
                    <td className="num" style={{color:rank && rank<=5?"#1a7a1a":"#888",fontWeight:rank&&rank<=5?700:400}}>{rank||"-"}</td>
                    <td className="num" style={{fontWeight:700,color:r.score>0?"#1a7a1a":r.score<0?"#b71c1c":"#666"}}>{r.error?"-":fmtNum(r.score)}</td>
                    <td><span className="signal" style={{background:sig.bg,color:sig.fg}}>{sig.label}</span></td>
                    <td className="num" title={`Current 5D: ${fmtPct(r.flowNow)} | Prior 5D: ${fmtPct(r.flowPrev)}`}>
                      <span className="signal" style={{background:flowSig.bg,color:flowSig.fg,minWidth:86}}>{fmtPct(r.flowChange)}</span>
                    </td>
                    <td className="num" style={c1w}>{fmtPct(r.r1w)}</td>
                    <td className="num" style={c1m}>{fmtPct(r.r1m)}</td>
                    <td className="num" style={c3m}>{fmtPct(r.r3m)}</td>
                    <td className="num" style={c6m}>{fmtPct(r.r6m)}</td>
                    <td className="num" style={{color:r.rsi>60?"#1a7a1a":r.rsi<40?"#b71c1c":"#555"}}>{r.rsi==null?"-":r.rsi.toFixed(0)}</td>
                    <td style={{fontWeight:700,color:r.trend==="Up"?"#1a7a1a":r.trend==="Down"?"#b71c1c":"#777"}}>{r.trend??"-"}</td>
                    <td className="num" style={{color:r.fromHigh>-5?"#1a7a1a":r.fromHigh<-20?"#b71c1c":"#555"}}>{fmtPct(r.fromHigh)}</td>
                    <td><Spark ratio={r.ratio} strong={sig.label==="Leader"||sig.label==="Improving"}/></td>
                  </tr>
                );
              })}
            </React.Fragment>
          ))}
        </tbody>
      </table>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(RelativeFlowLab));
</script>
</body>
</html>
