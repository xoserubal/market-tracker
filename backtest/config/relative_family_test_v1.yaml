# ── Relative Flow Family Falsification Test v1 — universo congelado ──────────
# Ver wiki/PREREGISTRO_RELATIVE_FLOW_FAMILY_TEST_V1.md para el preregistro
# completo. CONGELADO 2026-08-10 — no añadir ni quitar activos tras ejecutar
# el test, salvo ticker roto documentado explícitamente aquí mismo.
#
# ratio_denominator: todos los ratios son symbol/SPY salvo que se indique otro.
# tradable_type: ETF | ETN | future_proxy | crypto | index_proxy
# liquidity_bucket: high | medium | low (asignación cualitativa por AUM/volumen
#   conocido en el momento de congelar, no recalculado dinámicamente).
# known_duplicate_of: id de otro activo si es un proxy casi idéntico (verificado
#   por correlación de retornos >0.995) — excluido del análisis principal.
# seen_in_exploration: true si el activo ya apareció en la exploración ad-hoc
#   previa (wiki/ASESOR_EXTERNO_RELATIVE_FLOW_REFUGIO_VS_INDUSTRIAL.md).
# seen_direction_biased: true si se añadió específicamente porque el usuario
#   predijo su resultado antes de verlo (PPLT, PALL, DBB).

version: 1
frozen_date: "2026-08-10"
ratio_denominator_default: SPY

families:
  A:
    name: "Monetary / Store-of-value"
    subfamilies:
      A1_precious_metals: "Metales preciosos refugio"
      A2_crypto_speculative: "Cripto especulativo (reportado separado)"
      A3_gold_equity_beta: "Beta de mineras de oro (reportado separado)"
  B:
    name: "Industrial / Cyclical Commodities"
    subfamilies:
      B1_physical_commodities: "Materias primas físicas via ETF/ETN"
      B2_cyclical_mining_equities: "Equities cíclicas mineras"
      B3_materials_sector: "Sector materiales amplio"
      B4_futures_proxy: "Futuros continuos (referencia, fuera del análisis principal)"
  C:
    name: "Rates / FX / Duration"
    note: "Reportada aparte — no entra en el test A vs B de H1."
  D:
    name: "Equity / Sector Controls"
    subfamilies:
      D1_broad_index: "Indice amplio — funciona en cualquier equity o solo subconjuntos"
      D2_sector: "Sectorial — funciona indistinto por sector"

