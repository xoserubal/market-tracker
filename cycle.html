// ── LLM Markdown export ───────────────────────────────────────────────────
const buildCycleMarkdown = (rows, phases) => {
  const date = new Date().toLocaleString('es-ES', { dateStyle: 'full', timeStyle: 'short' });
  const spy = rows['SPY'];
  let md = `# Cycle Tracker — Snapshot\n**Fecha:** ${date}\n_Sector rotation · Dow Theory cycle framework · α = relative outperformance vs SPY_\n\n`;

  // SPY context
  if (spy) {
    md += `## REFERENCIA SPY\n`;
    md += `| 1M | 3M | YTD | 1Y |\n|---:|---:|----:|---:|\n`;
    const f = v => v == null || isNaN(v) ? '—' : v < 0 ? `(${Math.abs(Math.round(v))}%)` : `+${Math.round(v)}%`;
    md += `| ${f(spy.m1)} | ${f(spy.m3)} | ${f(spy.ytd)} | ${f(spy.y1)} |\n\n`;
  }

  // Phase ranking
  md += `## PHASE RANKING (score = avg relativo vs SPY · 70%×3M + 30%×1M)\n`;
  md += `| # | Fase | Score | Aceleración | Cargados |\n`;
  md += `|--:|------|------:|:-----------:|---------:|\n`;
  const sorted = [...phases].filter(p => p.score != null).sort((a, b) => b.score - a.score);
  sorted.forEach((ph, i) => {
    const acc = ph.accelerating == null ? '—' : ph.accelerating ? '▲ accel.' : '▽ decel.';
    md += `| ${i + 1} | **${ph.phase}** | ${ph.score > 0 ? '+' : ''}${ph.score.toFixed(1)} | ${acc} | ${ph.loaded}/${ph.total} |\n`;
  });
  md += '\n';

  // Detail by phase
  md += `## DETALLE POR FASE\n`;
  const fmtR = v => v == null || isNaN(v) ? '—' : v < 0 ? `(${Math.abs(Math.round(v))}%)` : `+${Math.round(v)}%`;
  phases.forEach(ph => {
    md += `### ${ph.phase} — ${ph.category} (score: ${ph.score != null ? (ph.score > 0 ? '+' : '') + ph.score.toFixed(1) : '—'})\n`;
    md += `| Rol | Ticker | Nombre | 1M | 3M | α vs SPY |\n`;
    md += `|:---:|:------:|--------|---:|---:|---------:|\n`;
    ph.sectors.forEach(sec => {
      md += `| — | — | **${sec.name.toUpperCase()}** | — | — | — |\n`;
      sec.tickers.forEach(t => {
        const d = rows[t.ticker];
        const spyM3 = spy?.m3 ?? null;
        const relM3 = d?.m3 != null && spyM3 != null ? d.m3 - spyM3 : null;
        md += `| ${t.role} | ${t.ticker} | ${t.name} | ${fmtR(d?.m1)} | ${fmtR(d?.m3)} | ${relM3 != null ? (relM3 > 0 ? '+' : '') + relM3.toFixed(0) + 'pp' : '—'} |\n`;
      });
    });
    md += '\n';
  });

  md += `_Yahoo Finance (delayed ~15 min) · Not financial advice_\n`;
  return md;
};

// ── Helpers ───────────────────────────────────────────────────────────────
const fmtRet = v => {
  if (v == null || isNaN(v)) return '—';
  return v < 0 ? `(${Math.abs(Math.round(v))}%)` : `+${Math.round(v)}%`;
};

const retColor = v => {
  if (v == null) return '#aaa';
  if (v >= 15) return '#1b5e20'; if (v >= 7) return '#2e7d32';
  if (v >= 3)  return '#388e3c'; if (v > 0)  return '#43a047';
  if (v === 0) return '#666';
  if (v > -3)  return '#c62828'; if (v > -7) return '#c62828';
  return '#b71c1c';
};

// ── Sparkline — 5 anchor points from return data ──────────────────────────
// Time-accurate x-positioning: 1Y(0%) → 3M(75%) → 1M(91.7%) → 1W(98.1%) → now(100%)
// Line color reflects 3M absolute return.
function Sparkline({ d, width = 62, height = 20 }) {
  if (!d || d.price == null) return <span style={{ color: '#ddd', fontSize: 8 }}>—</span>;
  const p = d.price;
  const pts = [
    { t: 0.000, v: d.y1 != null ? p / (1 + d.y1 / 100) : null },
    { t: 0.750, v: d.m3 != null ? p / (1 + d.m3 / 100) : null },
    { t: 0.917, v: d.m1 != null ? p / (1 + d.m1 / 100) : null },
    { t: 0.981, v: d.w1 != null ? p / (1 + d.w1 / 100) : null },
    { t: 1.000, v: p },
  ];
  const vals = pts.map(pt => pt.v).filter(v => v != null);
  if (vals.length < 2) return <span style={{ color: '#ddd', fontSize: 8 }}>—</span>;

  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const pad = 2, iw = width - 2 * pad, ih = height - 2 * pad;

  const pathParts = [];
  let started = false;
  pts.forEach(pt => {
    if (pt.v == null) { started = false; return; }
    const x = (pad + pt.t * iw).toFixed(1);
    const y = (pad + ih - ((pt.v - min) / range) * ih).toFixed(1);
    pathParts.push(started ? `L${x} ${y}` : `M${x} ${y}`);
    started = true;
  });

  const lastPt = [...pts].reverse().find(pt => pt.v != null);
  const dotX = lastPt ? pad + lastPt.t * iw : null;
  const dotY = lastPt ? pad + ih - ((lastPt.v - min) / range) * ih : null;

  const m3 = d.m3;
  const lineColor = m3 == null ? '#bbb'
    : m3 > 10 ? '#1b5e20' : m3 > 3 ? '#43a047'
    : m3 > -3 ? '#f9a825' : m3 > -10 ? '#e53935' : '#b71c1c';

  return (
    <svg width={width} height={height} style={{ display: 'block', verticalAlign: 'middle' }}>
      <path d={pathParts.join(' ')} fill="none" stroke={lineColor} strokeWidth="1.5"
        strokeLinejoin="round" strokeLinecap="round" />
      {dotX != null && <circle cx={dotX.toFixed(1)} cy={dotY.toFixed(1)} r="2" fill={lineColor} />}
    </svg>
  );
}

// ── Phase score calculation ───────────────────────────────────────────────
// Score = 0.7 × avg(relM3) + 0.3 × avg(relM1) — relative to SPY.
// Falls back to absolute returns when SPY not yet loaded.
function calcPhaseScores(rows) {
  const spy = rows['SPY'];
  return CYCLE_MAP.map(phase => {
    const allT = phase.sectors.flatMap(s => s.tickers);
    const data = allT.map(t => rows[t.ticker]).filter(Boolean);
    if (!data.length) return { ...phase, score: null, relM3: null, relM1: null, loaded: 0, total: allT.length };

    const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
    const spyM3 = spy?.m3 ?? null, spyM1 = spy?.m1 ?? null;

    const relM3v = data.map(d => d.m3 != null && spyM3 != null ? d.m3 - spyM3 : null).filter(v => v != null);
    const relM1v = data.map(d => d.m1 != null && spyM1 != null ? d.m1 - spyM1 : null).filter(v => v != null);
    const absM3v = data.map(d => d.m3).filter(v => v != null);
    const absM1v = data.map(d => d.m1).filter(v => v != null);

    const relM3 = avg(relM3v) ?? avg(absM3v);
    const relM1 = avg(relM1v) ?? avg(absM1v);
    const score = relM3 != null ? relM3 * 0.7 + (relM1 ?? relM3) * 0.3 : null;
    const accelerating = relM1 != null && relM3 != null ? relM1 > relM3 : null;

    return { ...phase, score, relM3, relM1, accelerating, loaded: data.length, total: allT.length };
  });
}

// ── PhaseTimeline ─────────────────────────────────────────────────────────
function PhaseTimeline({ phases }) {
  const scored = phases.filter(p => p.score != null);
  const topPhase = scored.length ? [...scored].sort((a, b) => b.score - a.score)[0] : null;
  const maxAbs = scored.length ? Math.max(...scored.map(p => Math.abs(p.score)), 0.1) : 1;

  return (
    <div style={{ marginBottom: 12, background: '#1a2535', borderRadius: 6, padding: '12px 16px' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 10 }}>
        <span style={{ color: 'white', fontSize: 12, fontWeight: 600, letterSpacing: '0.5px' }}>
          MARKET CYCLE PHASE ESTIMATOR
        </span>
        {topPhase && (
          <span style={{ background: topPhase.color, color: 'white', padding: '2px 12px', borderRadius: 12, fontSize: 11, fontWeight: 700 }}>
            Estimated: {topPhase.phase}
            {topPhase.accelerating != null && (
              <span style={{ marginLeft: 6, opacity: 0.8, fontSize: 10 }}>
                {topPhase.accelerating ? '▲ accel.' : '▽ decel.'}
              </span>
            )}
          </span>
        )}
        <span style={{ marginLeft: 'auto', fontSize: 9, color: '#6b7a8d', fontStyle: 'italic' }}>
          Score = avg. relative return vs SPY · 70% × 3M + 30% × 1M · lagging indicator
        </span>
      </div>
      <div style={{ display: 'flex', gap: 4, alignItems: 'flex-end', height: 56 }}>
        {phases.map(ph => {
          const isTop = topPhase?.phase === ph.phase;
          const hasScore = ph.score != null;
          const barH = hasScore ? Math.max(4, Math.abs(ph.score) / maxAbs * 40) : 4;
          const barColor = !hasScore ? '#334' : ph.score >= 0 ? ph.borderColor : '#4a3040';
          return (
            <div key={ph.phase} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 }}>
              <div style={{ fontSize: 8, fontFamily: 'monospace', height: 11, lineHeight: '11px', color: !hasScore ? '#444' : ph.score >= 0 ? '#7ecf7e' : '#ff7070' }}>
                {hasScore ? (ph.score > 0 ? '+' : '') + ph.score.toFixed(1) : '—'}
              </div>
              <div style={{ width: '100%', height: barH, minHeight: 4, background: barColor, borderRadius: 2, border: isTop ? '2px solid white' : '1px solid transparent', opacity: hasScore ? 1 : 0.25 }} />
              <div style={{ fontSize: 8, color: isTop ? 'white' : '#7a8a9a', textAlign: 'center', lineHeight: 1.2, fontWeight: isTop ? 700 : 400 }}>
                {ph.short}
              </div>
              {isTop && <div style={{ fontSize: 8, color: '#ffd700', fontWeight: 700 }}>▲</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

          <button onClick={fetchAll} disabled={isLoading} style={{ padding: '4px 12px', fontSize: 11, border: 'none', borderRadius: 3, cursor: isLoading ? 'default' : 'pointer', background: isLoading ? '#aaa' : '#3a6ca0', color: 'white' }}>
            {isLoading ? `⏳ ${loading.size} pending…` : '↻ Refresh'}
          </button>
          <span style={{ fontSize: 13, fontWeight: 'bold', color: '#333' }}>{dateStr}</span>
        </div>
      </div>

      <PhaseTimeline phases={phases} />
      <PhaseRankings phases={phases} />
      <RoleLegend />

      {/* Phase Cards Grid */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8 }}>
        {phases.map((ph, i) => (
          <PhaseCard key={ph.phase} phase={ph} rows={rows} spy={spy} colIndex={i % 4} />
        ))}
      </div>

      <div style={{ marginTop: 10, fontSize: 9, color: '#bbb', textAlign: 'right' }}>
        Yahoo Finance (delayed ~15 min) · Score = avg. relative return vs SPY across all phase instruments · Not financial advice
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(CycleTracker));
</script>
</body>
</html>
