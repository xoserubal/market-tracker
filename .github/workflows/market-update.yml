name: Market Data Update

on:
  schedule:
    - cron: '0 8,20 * * *'   # 08:00 y 20:00 UTC (cada 12h)
  workflow_dispatch:           # permite lanzar manualmente desde GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backtest/requirements.txt

      - name: Install dependencies
        run: pip install -r backtest/requirements.txt

      - name: Run pipeline - Step 1 fetch data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python backtest/src/main.py
        working-directory: ${{ github.workspace }}

      - name: Run pipeline - Step 2 macro score
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python backtest/src/main_macro.py
        working-directory: ${{ github.workspace }}

      - name: Run pipeline - Step 3 rotation
        run: python backtest/src/main_rotation.py
        working-directory: ${{ github.workspace }}

      - name: Run pipeline - Step 4 backtest
        run: python backtest/src/main_backtest.py
        working-directory: ${{ github.workspace }}

      - name: Run pipeline - Step 5 confluence
        run: python backtest/src/main_confluence.py
        working-directory: ${{ github.workspace }}

      - name: Run pipeline - Step 6 portfolio
        run: python backtest/src/main_portfolio.py
        working-directory: ${{ github.workspace }}

      - name: Export data to JSON for dashboard
        run: python scripts/export_to_json.py
        working-directory: ${{ github.workspace }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest/data/processed/ backtest/data/manifest.json backtest/reports/ docs/data/
          git diff --staged --quiet || git commit -m "chore: auto-update market data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
