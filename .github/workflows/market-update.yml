name: Market Data Update

on:
  schedule:
    - cron: '0 8,20 * * *'   # 08:00 y 20:00 UTC (cada 12h)
  workflow_dispatch:           # permite lanzar manualmente desde GitHub

permissions:
  contents: write
  actions: read   # solo lectura, para que el step de notificación de fallo pueda consultar qué step falló

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backtest/requirements.txt

      - name: Install dependencies
        run: pip install -r backtest/requirements.txt

      # Solo para scripts/portfolio_daily_snapshot.js (Step 9g) — reutiliza
      # shared/quote-lib.js y shared/flow-score.js, las mismas fórmulas que
      # server.js/portfolio.html, en vez de reimplementarlas en Python (ver
      # CLAUDE.md, "Captura diaria completa de Portfolio Tracker").
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install --omit=dev

      # Motor de decisión de Cava AI, fijado a un tag concreto y NUNCA a main:
      # si el agente cambiara a mitad de un periodo de medición sin que lo
      # sepamos, los datos de rendimiento de ese periodo dejarían de significar
      # nada. La versión se sube de forma deliberada (ver CLAUDE.md).
      - name: Install Cava decision engine (v1.1.0)
        env:
          CAVA_TOKEN: ${{ secrets.CAVA_ENGINE_TOKEN }}
        run: |
          pip install "git+https://x-access-token:${CAVA_TOKEN}@github.com/xoserubal/cava-decision-engine.git@v1.1.0"
        continue-on-error: true

      - name: Run pipeline - Step 1 fetch data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        # main.py ya tolera fallos de descarga de tickers/series individuales
        # (los deja como NaN y sigue) y lo señaliza con exit code 2 — "aviso",
        # no "fatal" (ver main.py: "exit code 2: completado con fallos
        # parciales"). Sin esto, un solo ticker caído de Yahoo/FRED bloqueaba
        # TODO el resto del pipeline (Steps 2-12), porque Actions trata
        # cualquier exit code != 0 como fallo del step. exit 1 (sanity checks
        # fallidos, excepción sin capturar) sigue siendo fatal — no se toca.
        #
        # `set +e` / `set -e` alrededor de la llamada es imprescindible: los
        # steps `run:` de Actions usan `bash -eo pipefail` por defecto, así
        # que sin desactivar errexit aquí, bash aborta el script en cuanto
        # main.py devuelve 2 — antes de llegar a leer `$?` — y el step muere
        # igual que sin este arreglo. Confirmado en producción (run 238,
        # 2026-08-25): exit code 2 real por ^VIX9D/^VIX3M caídos en Yahoo,
        # pero el primer intento de este fix nunca llegó a evaluarse.
        run: |
          set +e
          python backtest/src/main.py
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::Step 1 completó con fallos parciales de descarga (exit 2) — el pipeline continúa con NaN en los tickers/series afectados. Revisar el log de este step para ver cuáles."
            exit 0
          fi
          exit $code
        working-directory: ${{ github.workspace }}

      - name: Run pipeline - Step 2 macro score
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python backtest/src/main_macro.py
        working-directory: ${{ github.workspace }}

      - name: Run pipeline - Step 3 rotation
        run: python backtest/src/main_rotation.py
        working-directory: ${{ github.workspace }}

      - name: Run pipeline - Step 4 backtest
        run: python backtest/src/main_backtest.py
        working-directory: ${{ github.workspace }}

      - name: Run pipeline - Step 5 confluence
        run: python backtest/src/main_confluence.py
        working-directory: ${{ github.workspace }}

      - name: Run pipeline - Step 6 portfolio
        run: python backtest/src/main_portfolio.py
        working-directory: ${{ github.workspace }}

      - name: Run pipeline - Step 7 stock scanner
        run: python backtest/src/main_stocks.py
        working-directory: ${{ github.workspace }}

      - name: Export data to JSON for dashboard
        run: python scripts/export_to_json.py
        working-directory: ${{ github.workspace }}

      - name: Run pipeline - Step 8 PCS calculator
        run: python scripts/pcs_calculator.py
        working-directory: ${{ github.workspace }}

      - name: Run pipeline - Step 9 event detection
        run: python scripts/event_detector.py
        working-directory: ${{ github.workspace }}

      - name: Run pipeline - Step 9b Koncorde Plus (3 timeframes)
        run: python scripts/koncorde_calculator.py
        working-directory: ${{ github.workspace }}

      - name: Run pipeline - Step 9c Koncorde shadow exits
        run: python scripts/koncorde_shadow_exits.py
        working-directory: ${{ github.workspace }}

      - name: Run pipeline - Step 9c2 Koncorde custom alerts (user-defined, via /kalert)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check_koncorde_alerts.py
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      # Cartera 100% mecánica, sin IA (entrada Y salida) — a diferencia de
      # Mirror Espejo (que sí llama a Grok) y Cava (que sí usa PCS). Corre en
      # ambos pases del día, no solo por la mañana — coste mínimo (sin llamada
      # a ningún modelo, solo lectura de koncorde_data.json + un fetch de
      # precio pequeño para altas/bajas del día). Ver scripts/cruce_rojo_d_portfolio.py.
      - name: Run pipeline - Step 9c3 Cruce Rojo D portfolio (mechanical, no AI)
        run: python scripts/cruce_rojo_d_portfolio.py --apply
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Run pipeline - Step 9e Duration Stress Monitor (BOJ/Treasury thesis)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/duration_monitor.py
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Check if this is the morning run
        id: time_check
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -lt 14 ]; then
            echo "is_morning=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_morning=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline - Step 9d Mirror Espejo portfolio (Grok) — solo por la mañana
        if: steps.time_check.outputs.is_morning == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/mirror_portfolio.py --apply
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      # Piloto — Portfolio Tracker únicamente, no toca AI Picks Lab. Solo por
      # la mañana a propósito (decisión del usuario 2026-08-16): la actividad
      # insider (SEC Form 4) no cambia varias veces al día, así que una
      # consulta diaria basta y evita duplicar cuota del plan gratuito de
      # Form4API entre los dos runs del pipeline. Ver scripts/update_insider_activity.py
      # para el resto de decisiones de alcance (universo, prioridades, caché).
      - name: Run pipeline - Step 9f Insider Activity (Form4API) — solo por la mañana
        if: steps.time_check.outputs.is_morning == 'true'
        env:
          FORM4API_KEY: ${{ secrets.FORM4API_KEY }}
        run: python scripts/update_insider_activity.py
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      # Captura diaria completa de todo lo que muestra portfolio.html
      # (precio, RSI, MACD, ATLAS Mini, ATR%, CMF, Koncorde D/3D/W, insider,
      # SMAs, OBV, Flow Score, Early Flow Score) para los ~111 tickers de
      # portfolio.json, corra o no el dashboard ese día — antes esto solo se
      # guardaba (parcialmente) si alguien abría portfolio.html en el
      # navegador. Ambos runs del día (no solo el matutino): esto es una
      # captura de mercado, no una consulta de cuota limitada como Insider
      # Activity. Ver CLAUDE.md.
      - name: Run pipeline - Step 9g Portfolio daily snapshot (full raw capture)
        run: node scripts/portfolio_daily_snapshot.js
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Run pipeline - Step 10 paper trading (AI picks)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL_TEST_MODE: ${{ vars.AI_MODEL_TEST_MODE || 'true' }}
          AI_MODELS_TO_TEST: ${{ vars.AI_MODELS_TO_TEST || '["x-ai/grok-4.3","xiaomi/mimo-v2.5-pro"]' }}
          ACTIVE_MODEL: ${{ vars.ACTIVE_MODEL || 'x-ai/grok-4.3' }}
          FALLBACK_MODEL: ${{ vars.FALLBACK_MODEL || 'xiaomi/mimo-v2.5-pro' }}
          ENABLE_SHADOW_MODELS: ${{ vars.ENABLE_SHADOW_MODELS || 'true' }}
          MAX_CANDIDATES_PER_CALL: ${{ vars.MAX_CANDIDATES_PER_CALL || '25' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/paper_trading.py
        working-directory: ${{ github.workspace }}

      # Va ANTES del 10b a propósito: así los picks nuevos de hoy entran en el
      # mismo pase de update_performance y se les rellena el entry_price sin
      # esperar doce horas.
      - name: Run pipeline - Step 10d Cava macro portfolio
        run: python scripts/cava_portfolio.py --apply
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Run pipeline - Step 10b update performance tracking
        run: python scripts/update_performance.py
        working-directory: ${{ github.workspace }}

      - name: Run pipeline - Step 10c update Koncorde research-log returns
        run: python scripts/update_koncorde_performance.py
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Run pipeline - Step 10e backfill extension_risk (historical, no look-ahead)
        run: python scripts/reconstruct_extension_risk_historical.py
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Run pipeline - Step 10f CFL 1-week follow-through (shadow only)
        run: python scripts/cfl_followthrough_shadow.py
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Run pipeline - Step 10g CFL re-entry cooldown (shadow only)
        run: python scripts/cfl_reentry_cooldown_shadow.py
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Run pipeline - Step 10h PCS-floor whipsaw monitor (shadow only)
        run: python scripts/pcs_floor_whipsaw_shadow.py
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      # P0 de la Hoja de ruta consolidada — Auditoría de carteras IA (firmada
      # 2026-08-30, wiki/). Fundación de la que dependen P1A/P1B/P1C/P2/P3.
      # Corre al final a propósito: después de todos los pasos que mutan
      # ai_picks.json (Step 10 paper_trading, Step 10d Cava; Mirror y Cruce
      # Rojo D ya corrieron antes, en 9d/9c3) — así el SELECT de hoy queda
      # capturado en su propia fila de entrada, sin hook aparte por cartera.
      - name: Run pipeline - Step 10i AI Picks decision state (P0, daily capture)
        run: python scripts/ai_picks_decision_state.py
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      # Avisa por Telegram, una sola vez cada uno, cuando P2/P1A+P1C/P1B
      # cumplan el umbral de la hoja de ruta consolidada (o si a los 90 días
      # P1A/P1C todavía no lo ha alcanzado) — para no tener que comprobarlo a
      # mano. No decide ni ejecuta nada, solo cuenta y avisa.
      - name: Run pipeline - Step 10j P1 readiness monitor (Telegram alert)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/p1_readiness_monitor.py
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Run pipeline - Step 11 Telegram notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Run pipeline - Step 12 Telegram portfolio commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/telegram_portfolio_bot.py --once
        working-directory: ${{ github.workspace }}

      - name: Update bot docs in CLAUDE.md
        run: python scripts/telegram_portfolio_bot.py --docs
        working-directory: ${{ github.workspace }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest/data/processed/ backtest/data/manifest.json backtest/reports/ docs/data/ portfolio.json
          git diff --staged --quiet || git commit -m "chore: auto-update market data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      # Último step, a propósito — if: failure() solo se activa cuando un
      # step SIN continue-on-error ha fallado de verdad y ha bloqueado el
      # resto del pipeline (ver incidente 2026-08-24/25: Step 1 falló 3 runs
      # seguidos en silencio hasta que alguien miró la pestaña Actions a
      # mano). Los steps que ya tienen continue-on-error:true (Cava, Koncorde
      # alerts, Duration Monitor, Mirror Espejo, Insider Activity, Portfolio
      # snapshot, Steps 11/12 Telegram) NO disparan esto — se degradan en
      # silencio a propósito, avisar de cada uno sería ruido, no señal.
      - name: Notify Telegram on pipeline failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_workflow_failure.py
        working-directory: ${{ github.workspace }}
        continue-on-error: true
