name: GEX ZeroGEX Fase 1 Collector

# Piloto temporal — ver wiki/PREREGISTRO_GEX_ZEROGEX_V1.md. Recogía un snapshot
# de SPX + QQQ cada ~20 min durante RTH (script se auto-limita a 09:30-16:00 ET,
# el cron solo necesitaba cubrir esa ventana con margen).
#
# CRON DESACTIVADO 2026-08-26: Fase 1 concluyó — veredicto limpio para ambos
# símbolos (0% datos obsoletos, p90 spot_diff_bps muy por debajo del umbral de
# fallo en 98 snapshots/5 sesiones, ver fase1_informe.md). Decidido con el
# usuario seguir a Fase 2 (gex-zerogex-fase2.yml, cadencia 1x/día EOD en vez de
# cada 20 min) — mantener este cron activo solo gastaría cuota de la API ya de
# pago sin aportar nada nuevo a la decisión. workflow_dispatch se deja por si
# hiciera falta relanzar Fase 1 a mano más adelante. Borrar este workflow (y el
# secret ZEROGEX_API_KEY, junto con el de fase2) al concluir el piloto entero.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gex-zerogex-fase1
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backtest/requirements.txt

      - name: Install dependencies
        run: pip install -r backtest/requirements.txt

      - name: Run ZeroGEX Fase 1 collector
        env:
          ZEROGEX_API_KEY: ${{ secrets.ZEROGEX_API_KEY }}
        run: python research/gex_zerogex_pilot_v1/fetch_zerogex_snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/gex_zerogex_pilot_v1/outputs/fase1_snapshots.jsonl
          git diff --staged --quiet || git commit -m "bot: zerogex fase1 snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
