name: GEX ZeroGEX Fase 1 Collector

# Piloto temporal — ver wiki/PREREGISTRO_GEX_ZEROGEX_V1.md. Recoge un snapshot
# de SPX + QQQ cada ~20 min durante RTH (script se auto-limita a 09:30-16:00 ET,
# el cron solo necesita cubrir esa ventana con margen). Borrar este workflow
# (y el secret ZEROGEX_API_KEY) cuando termine el piloto de Fase 1/2.

on:
  schedule:
    - cron: '*/20 13-20 * * 1-5'   # 13:00-20:40 UTC, L-V (cubre RTH 13:30-20:00 UTC con margen)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gex-zerogex-fase1
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backtest/requirements.txt

      - name: Install dependencies
        run: pip install -r backtest/requirements.txt

      - name: Run ZeroGEX Fase 1 collector
        env:
          ZEROGEX_API_KEY: ${{ secrets.ZEROGEX_API_KEY }}
        run: python research/gex_zerogex_pilot_v1/fetch_zerogex_snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/gex_zerogex_pilot_v1/outputs/fase1_snapshots.jsonl
          git diff --staged --quiet || git commit -m "bot: zerogex fase1 snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
