name: Portfolio Tags — aislamiento e invariancia

# Garantiza que las etiquetas (capa de taxonomía) nunca influyen en los motores de inversión.
# No toca ni sustituye a market-update.yml; no usa secretos; no hace llamadas de red a proveedores.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tags:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backtest/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dependencias
        run: |
          pip install -r backtest/requirements.txt
          pip install requests python-dotenv openai
          npm install --omit=dev
      - name: Batería de Portfolio Tags
        env:
          PY: python
        run: bash scripts/run_tags_tests.sh
