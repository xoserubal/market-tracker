name: Koncorde Retry (2h after main run)

# Retries Koncorde tickers that failed to download in the main pipeline run
# (scripts/koncorde_calculator.py --retry-failed). Runs as a separate
# workflow, 2h after each main run (08:00/20:00 UTC), because yfinance batch
# downloads occasionally drop a handful of tickers non-deterministically —
# a same-run retry wouldn't help, and a genuine 2h delay can't be done
# inside a single CI job without idling and burning minutes for nothing.
# See CLAUDE.md "Reintento de tickers fallidos en Koncorde".

on:
  schedule:
    - cron: '0 10,22 * * *'   # 10:00 y 22:00 UTC — 2h después de market-update.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backtest/requirements.txt

      - name: Install dependencies
        run: pip install -r backtest/requirements.txt

      - name: Retry failed Koncorde tickers
        run: python scripts/koncorde_calculator.py --retry-failed
        working-directory: ${{ github.workspace }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/koncorde_data.json docs/data/koncorde_failed_state.json
          git diff --staged --quiet || git commit -m "chore: retry failed Koncorde tickers $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
