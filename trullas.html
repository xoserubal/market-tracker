<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trullás — Market Tracker</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#0b3d63"/>
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32"/>
  <link rel="icon" href="/icons/favicon-16.png" sizes="16x16"/>
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});}</script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>
  <script src="/shared/flow-score.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; color: #1f2933; }
    .wrap { background: white; min-width: 960px; min-height: 100vh; padding: 16px 20px; overflow-x: auto; }
    .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
    .title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 20px; color: #111; line-height: 1; }
    .nav-link { font-size: 11px; text-decoration: none; padding: 2px 10px; border: 1px solid; border-radius: 12px; line-height: 20px; }
    .meta { font-size: 9px; color: #999; margin-top: 4px; font-style: italic; }
    .actions { display: flex; align-items: center; gap: 8px; }
    button { border: none; border-radius: 3px; padding: 5px 12px; cursor: pointer; font-size: 11px; font-weight: 600; color: white; }
    button:disabled { cursor: default; opacity: 0.65; }
    .btn-copy { background: #1a6b3c; }
    .btn-export { background: #37474f; }
    .btn-refresh { background: #3a6ca0; }
    .btn-toggle { background: #6d4c00; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a6b3c; color: white; padding: 10px 22px; border-radius: 20px; font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.18); z-index: 10; }

    .section-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: #344054;
      margin: 18px 0 4px; padding-bottom: 4px; border-bottom: 2px solid #e6e8eb; }
    .section-sub { font-size: 10px; color: #98a2b3; margin-bottom: 10px; font-style: italic; }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .stat-card { border: 1px solid #e6e8eb; border-radius: 6px; background: #fbfcfd; padding: 10px 12px; }
    .stat-card .n { font-size: 20px; font-weight: 700; font-family: Consolas, monospace; }
    .stat-card .lbl { font-size: 10px; color: #667085; margin-top: 2px; }

    table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 10px; }
    th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #eef0f2; white-space: nowrap; }
    th { font-size: 9px; text-transform: uppercase; color: #98a2b3; letter-spacing: .3px; background: #354f73; color: #fff; position: sticky; top: 0; }
    tbody tr:hover { background: #fafbfc; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; }
    .tier-badge { display: inline-block; padding: 1px 6px; border-radius: 8px; font-size: 9.5px; font-weight: 800; }

    .gap-note { border: 1px solid #ffe0b2; background: #fff8ef; color: #8a5200; border-radius: 6px; padding: 8px 12px; font-size: 10px; margin-bottom: 10px; }
    .footer-note { font-size: 9px; color: #98a2b3; margin-top: 14px; font-style: italic; }
    .loading { font-size: 11px; color: #98a2b3; padding: 20px 0; text-align: center; }
    .num { font-family: Consolas, monospace; }
    .tk-link { font-weight: 700; color: #1a6baa; cursor: pointer; background: none; border: none; padding: 0; font-size: 11px; text-decoration: underline dotted; }
    .tk-link:hover { color: #0d4a7a; text-decoration: underline; }
    .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
    .modal { background: white; border-radius: 10px; padding: 18px 22px; width: 100%; max-width: 860px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const C = {
  green:  { bg: '#c8e6c9', fg: '#1b5e20' },
  yellow: { bg: '#fff9c4', fg: '#e65100' },
  orange: { bg: '#ffe0b2', fg: '#bf360c' },
  red:    { bg: '#ffcdd2', fg: '#b71c1c' },
  neutral:{ bg: '#f0f0f0', fg: '#555' },
  blue:   { bg: '#e3f2fd', fg: '#1565c0' },
};

const TIER_STYLE = {
  3: { bg: '#1b5e20', fg: '#fff', label: 'T3 · MACD+RSI+Vol' },
  2: { bg: '#e65100', fg: '#fff', label: 'T2 · MACD+RSI' },
  1: { bg: '#90a4ae', fg: '#fff', label: 'T1 · solo MACD' },
};

// Estados del calculador (scripts/trullas_signal_calculator.py) agrupados
// por prioridad de lectura — lo más accionable primero. El orden aquí es
// también el orden de visualización por defecto de la tabla.
// `tooltip`: explicación exacta de la condición que dispara cada estado,
// tomada literalmente de scripts/trullas_lib.py (evaluate_pivot_pair() /
// find_entry_executable()) -- no una paráfrasis aproximada. Se muestra en
// el glosario desplegable de abajo (no en hover -- esta página ahora
// también se usa desde el móvil vía la PWA, donde hover no existe).
const STATE_META = {
  entry_today:               { rank: 0, label: 'Entrada hoy',            ...C.green,
    tooltip: 'La APERTURA de hoy cae dentro de la zona de entrada (23-25% de retroceso Fibonacci desde el pivote 2). Accionable hoy mismo — el único estado que TRULLAS_SHADOW convierte en posición real.',
    group: 'Accionable' },
  waiting_in_zone:           { rank: 0.5, label: 'En zona · orden activa',  ...C.green,
    tooltip: 'Divergencia confirmada hoy y la apertura de hoy ya está dentro de la zona de entrada. Como el pivote solo se confirma con el cierre de hoy, la primera apertura operable es la de mañana: la orden queda armada desde la próxima sesión (si abre dentro de la zona, entra).',
    group: 'Divergencia activa' },
  waiting_pullback_ran_ahead: { rank: 1, label: 'Esperando retroceso',   ...C.yellow,
    tooltip: 'Divergencia MACD confirmada, pero la apertura de HOY está por ENCIMA del techo de la zona (25%): el precio se alejó sin retroceder. La orden límite sigue activa (dentro de las 15 sesiones); necesita que el precio vuelva a bajar hasta la zona, y cada sesión sin hacerlo lo hace menos probable.',
    group: 'Divergencia activa' },
  waiting_pullback_below_zone:{ rank: 2, label: 'Bajo la zona (espera rebote)', ...C.blue,
    tooltip: 'Divergencia MACD confirmada, pero la apertura de HOY está por DEBAJO del suelo de la zona (el precio ya retrocedió más de lo previsto) y todavía por encima del stop. No espera un retroceso sino un rebote: solo entra si una apertura vuelve a caer dentro de la zona; si cae hasta el stop (el propio pivote2) la señal se invalida.',
    group: 'Divergencia activa' },
  entry_in_past:             { rank: 3, label: 'Señal reciente (pasada)',...C.orange,
    tooltip: 'Hubo un fill (apertura dentro de 23-25%) en una sesión ANTERIOR a hoy, dentro de la ventana de 15 desde el pivote2 — la señal "Entrada hoy" ya ocurrió en el pasado. Se muestra solo como contexto histórico, no es accionable ahora.',
    group: 'Divergencia activa' },
  expired_no_pullback:       { rank: 4, label: 'Expirada',               ...C.neutral,
    tooltip: 'Pasaron las 15 sesiones desde el pivote2 sin que ninguna apertura llegara a la zona 23-25% ni rompiera el stop — la señal caduca sin haberse podido ejecutar.',
    group: 'Cerrada' },
  invalidated:               { rank: 5, label: 'Invalidada',             ...C.red,
    tooltip: 'Alguna apertura, dentro de la ventana de 15 sesiones, cayó por debajo del stop (el propio pivote2) antes de llegar a la zona de entrada — el patrón queda invalidado sin llegar a operar.',
    group: 'Cerrada' },
  no_macd_divergence:        { rank: 6, label: 'Sin divergencia MACD',   ...C.neutral,
    tooltip: 'El precio hace un mínimo más bajo (pivote2 < pivote1) pero el MACD en pivote2 NO es mayor que en pivote1. MACD es un filtro obligatorio: si falla, ni RSI ni Volumen llegan a consultarse — no hay señal aunque esos dos sí confirmasen.',
    group: 'Sin setup' },
  no_lower_low:              { rank: 7, label: 'Sin mínimo más bajo',    ...C.neutral,
    tooltip: 'El pivote más reciente (2) no es más bajo en precio que el anterior (1) — condición previa a cualquier chequeo de divergencia; sin esto ni se evalúa MACD.',
    group: 'Sin setup' },
  swing_too_small:           { rank: 8, label: 'Swing < 3%',             ...C.neutral,
    tooltip: 'La caída entre pivote1 y pivote2 es menor al 3% — se descarta como ruido antes de evaluar MACD/RSI/Volumen.',
    group: 'Sin setup' },
  no_pivots_yet:             { rank: 9, label: 'Sin pivotes',            ...C.neutral,
    tooltip: 'Todavía no hay 2 mínimos confirmados como pivote en el histórico descargado. Un mínimo necesita 5 sesiones posteriores sin otro más bajo para confirmarse como pivote (fractal de 5 barras) — es normal en tickers con poco historial o en medio de una tendencia sin mínimos claros.',
    group: 'Sin setup' },
  insufficient_history:      { rank: 10,label: 'Histórico insuficiente', ...C.neutral,
    tooltip: 'Hay 2 pivotes, pero el MACD todavía no tiene valor válido en uno de ellos (el indicador tarda ~35 barras en calcularse por primera vez) — no se puede evaluar la divergencia todavía en ese punto de la serie.',
    group: 'Sin setup' },
};
const ACTIVE_STATES = new Set(['entry_today', 'waiting_in_zone', 'waiting_pullback_below_zone', 'waiting_pullback_ran_ahead', 'entry_in_past']);

function bestRank(r) { return Math.min(stateMeta(r.signal_state).rank, r.flex_signal_state ? stateMeta(r.flex_signal_state).rank : 99); }
function isActiveRow(r) { return ACTIVE_STATES.has(r.signal_state) || ACTIVE_STATES.has(r.flex_signal_state); }
function stateMeta(s) { return STATE_META[s] || { rank: 99, label: s || '—', ...C.neutral, group: 'Sin setup' }; }
function fmtPrice(v) { return v == null ? '—' : v.toFixed(v < 10 ? 4 : 2); }
function fmtPct(v) { return v == null ? '—' : v.toFixed(1) + '%'; }

// ── Resumen de ticker (modal), COPIA de screeners.html (que a su vez copia la capa visual de
// portfolio.html). Se carga bajo demanda al pulsar un ticker, no para los 130 a la vez. ──
const FLOW_HISTORY_FIELDS = ['date', 'flowScore', 'rsi', 'konc_alignment', 'macdHist', 'macdHistDelta1', 'atrPct', 'price', 'm1',
  'konc_d_state', 'konc_3d_state', 'konc_w_state']; // los 3 últimos: solo para el resumen de ticker (Early Flow vs sesión anterior)

async function fetchFlowHistory() {
  const text = await fetch('/docs/data/portfolio_daily_snapshot.jsonl?t=' + Date.now()).then(r => r.text()).catch(() => '');
  const byTicker = {};
  text.trim().split('\n').forEach(line => {
    if (!line) return;
    let r;
    try { r = JSON.parse(line); } catch (e) { return; }
    if (!r.ticker || !r.date) return;
    if (!byTicker[r.ticker]) byTicker[r.ticker] = {};
    const row = {};
    FLOW_HISTORY_FIELDS.forEach(k => { row[k] = r[k] !== undefined ? r[k] : null; });
    byTicker[r.ticker][r.date] = row;
  });
  const out = {};
  Object.entries(byTicker).forEach(([tk, byDate]) => {
    out[tk] = Object.keys(byDate).sort().map(d => byDate[d]);
  });
  return out;
}


// ── Resumen de ticker (modal) — mismo dato y mismo formato que la fila del
// ticker en portfolio.html (retornos, volumen, RSI, Koncorde D/3D/W con
// mini-gráfico, MACD, ATLAS, ATR%, Flow, Early Flow, insider, notas). Los
// helpers de presentación de abajo son COPIA de portfolio.html (cada página
// del proyecto mantiene su propia copia de la capa visual, sin módulo
// compartido) — si se cambia el criterio de color/formato allí, mantener
// sincronizado aquí. La matemática (computeFlowScore, etc.) sí es compartida:
// viene de /shared/flow-score.js, la misma fuente que usa Portfolio Tracker.
const toN = v => (v != null && !isNaN(v)) ? +v : null;
const fmtRet = v => { const n=toN(v); if(n==null) return '—'; return n<0?`(${Math.abs(Math.round(n))}%)`:`${Math.round(n)}%`; };
const retBg   = v => { const n=toN(v); if(n==null) return ''; if(n>=20) return '#0d4e0d'; if(n>=10) return '#1a7a1a'; if(n>=3) return '#5ec45e'; if(n>0) return '#a8d8a8'; if(n===0) return ''; if(n>-3) return '#ffc9c9'; if(n>-10) return '#f48080'; return '#e03030'; };
const retFg   = v => { const n=toN(v); return n==null?'#555':Math.abs(n)>=10?'white':'#1a1a1a'; };
const volBg   = v => { const n=toN(v); if(n==null) return ''; if(n>=200) return '#0d2e6e'; if(n>=150) return '#1a5ca0'; if(n>=120) return '#6ab0e0'; if(n<=50) return '#a0a0a0'; if(n<=80) return '#d0d0d0'; return ''; };
const volFg   = v => { const n=toN(v); if(n==null) return '#aaa'; if(n>=150) return 'white'; if(n<=80) return '#555'; return '#333'; };
const rsiBg = v => { const n=toN(v); if(n==null) return ''; if(n>=80) return '#6b0000'; if(n>=70) return '#c0392b'; if(n>=60) return '#e8a87c'; if(n<=20) return '#0d4e0d'; if(n<=30) return '#1a7a1a'; if(n<=40) return '#a8d8a8'; return ''; };
const rsiFg = v => { const n=toN(v); if(n==null) return '#aaa'; if(n>=70||n<=30) return 'white'; if(n>=60||n<=40) return '#222'; return '#444'; };
const koncStateStyle = s => ({'accumulation':{bg:'#dbeafe',fg:'#1e40af'},'up':{bg:'#dcfce7',fg:'#15803d'},'distribution':{bg:'#fef3c7',fg:'#b45309'},'down':{bg:'#fee2e2',fg:'#b91c1c'}})[s] ?? {bg:'#f3f4f6',fg:'#6b7280'};
const blueFg   = v => { const n=toN(v); return n==null?'#aaa':n>0?'#1a5cb0':n<0?'#7b8ea0':'#888'; };
const greenFg  = v => { const n=toN(v); return n==null?'#aaa':n>0?'#1a7a1a':n<0?'#c0392b':'#888'; };
const trendFg  = v => { const n=toN(v); return n==null?'#aaa':n>0?'#555577':n<0?'#774455':'#888'; };
const fmtKonc  = (v,d) => { if(v==null) return '—'; const s=v>=0?'+':''; const a=d==null?'':d>0.1?'↑':d<-0.1?'↓':''; return s+v.toFixed(1)+a; };
const koncPrevTitle = (label, v, d) => {
  if (v == null) return null;
  if (d == null) return `${label}: ${v.toFixed(1)} (sin dato de sesión anterior)`;
  const ds = d >= 0 ? '+' : '';
  return `${label}: ${v.toFixed(1)} · sesión anterior: ${(v - d).toFixed(1)} (${ds}${d.toFixed(1)})`;
};
const macdTriangle = p => {
  if (p?.macdBull == null) return null;
  const color = p.macdBull ? '#1a7a1a' : '#c0392b';
  const up = p.macdHistDelta1 == null ? p.macdBull : p.macdHistDelta1 >= 0;
  return { glyph: up ? '▲' : '▼', color, weakening: p.macdHistDelta1 != null && up !== p.macdBull };
};
const FLOW_STYLE = {
  'Lider':      { bg:'#1a7a1a', fg:'white' },
  'Transicion': { bg:'#b8860b', fg:'white' },
  'Debil':      { bg:'#c0392b', fg:'white' },
};
const EARLY_STYLE = {
  'Fuerte':      { bg:'#1a5ca0', fg:'white' },
  'Interesante': { bg:'#5b3fa0', fg:'white' },
  'Sin setup':   { bg:'',       fg:'#aaa'   },
};
const INSIDER_SCORE_STYLE = {0:{bg:'#f3f4f6',fg:'#9ca3af'},1:{bg:'#fee2e2',fg:'#b91c1c'},2:{bg:'#f3f4f6',fg:'#6b7280'},3:{bg:'#dcfce7',fg:'#15803d'},4:{bg:'#86efac',fg:'#14532d'},5:{bg:'#22c55e',fg:'#052e16'}};
const INSIDER_CONTEXT_LBL = {strong_confirmation:'Confirmación fuerte',moderate_confirmation:'Confirmación moderada',neutral:'Neutral',warning:'⚠ Warning',ignored_selling:'Venta 10b5-1 (ignorada)',not_evaluable:'No evaluable'};
const fmtMoney = v => { const n=toN(v); if(n==null) return '—'; const a=Math.abs(n), s=n<0?'-':''; if(a>=1e6) return `${s}$${(a/1e6).toFixed(1)}M`; if(a>=1e3) return `${s}$${(a/1e3).toFixed(0)}k`; return `${s}$${Math.round(a)}`; };

const TREND_ARROWS = { mildUp:'↑', strongUp:'↑↑', extremeUp:'↑↑↑', mildDown:'↓', strongDown:'↓↓', extremeDown:'↓↓↓' };
const trendBucket = (delta, mildTh, strongTh, extremeTh) => {
  const a = Math.abs(delta);
  if (a < mildTh) return 'flat';
  const dir = delta > 0 ? 'Up' : 'Down';
  if (a >= extremeTh) return 'extreme' + dir;
  if (a >= strongTh)  return 'strong'  + dir;
  return 'mild' + dir;
};
const trendColor = b => ({
  mildUp:'#4a9e5c', strongUp:'#0d7a2e', extremeUp:'#063d17',
  mildDown:'#c77c1f', strongDown:'#c0392b', extremeDown:'#7a1810',
})[b] ?? 'inherit';
function TrendArrow({ delta, mildTh, strongTh, extremeTh, color }) {
  if (delta == null || isNaN(delta)) return null;
  const b = trendBucket(delta, mildTh, strongTh, extremeTh);
  if (b === 'flat') return null;
  return (
    <span title={`${delta>=0?'+':''}${delta.toFixed(2)} vs sesión anterior`}
      style={{marginLeft:3, fontWeight:700, fontSize:11, color: color ?? trendColor(b)}}>
      {TREND_ARROWS[b]}
    </span>
  );
}

// Mini-gráfico Koncorde (últimas 5 sesiones) — copia de portfolio.html, algo
// más grande para el modal. Ver el comentario largo de allí sobre el orden
// de capas (verde → ocre/trend → azul, roja suelta encima).
function KoncMiniChart({ blue, green, trend, trendMa }) {
  const areaSeries = [
    { arr: green, line: '#1a7a1a', fill: '#a8d5a2' },
    { arr: trend, line: null,      fill: '#e0c184' },
    { arr: blue,  line: '#1a5cb0', fill: '#8fb8e6' },
  ];
  const allArrs = [...areaSeries.map(s => s.arr), trendMa];
  const n = Math.max(0, ...allArrs.map(a => Array.isArray(a) ? a.length : 0));
  if (n < 2) return <span style={{color:'#ddd',fontSize:9}}>—</span>;
  const W = 96, H = 34, PAD = 2;
  const vals = allArrs.flatMap(a => (a||[]).filter(v => v != null));
  vals.push(0);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const x = i => PAD + (i / Math.max(n-1,1)) * (W - PAD*2);
  const y = v => H - PAD - ((v - min) / range) * (H - PAD*2);
  const baseline = y(0);
  const pointsFor = arr => (arr||[]).map((v,i) => v==null ? null : [x(i), y(v)]).filter(Boolean);
  const lineFor = pts => pts.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const areas = areaSeries.map(s => {
    const pts = pointsFor(s.arr);
    if (pts.length < 2) return null;
    const line = lineFor(pts);
    const area = `${line} L${pts[pts.length-1][0].toFixed(1)},${baseline.toFixed(1)} L${pts[0][0].toFixed(1)},${baseline.toFixed(1)} Z`;
    return { ...s, line, area };
  }).filter(Boolean);
  const redPts = pointsFor(trendMa);
  const redLine = redPts.length >= 2 ? lineFor(redPts) : null;
  return (
    <svg width={W} height={H} style={{display:'block',margin:'0 auto'}}>
      <line x1={PAD} y1={baseline} x2={W-PAD} y2={baseline} stroke="#ccc" strokeWidth={0.5} />
      {areas.map((p,i) => <path key={'a'+i} d={p.area} fill={p.fill} fillOpacity={1} stroke="none" />)}
      {areas.map((p,i) => p.line && <path key={'l'+i} d={p.line} fill="none" stroke={p.line} strokeWidth={1} />)}
      {redLine && <path d={redLine} fill="none" stroke="#c0392b" strokeWidth={1} />}
    </svg>
  );
}

function SumCard({ label, tip, children }) {
  return (
    <div title={tip} style={{border:'1px solid #e6e8eb',borderRadius:6,background:'#fbfcfd',padding:'8px 12px',minWidth:96,textAlign:'center'}}>
      <div style={{fontSize:9,color:'#98a2b3',textTransform:'uppercase',letterSpacing:.3,marginBottom:3}}>{label}</div>
      <div style={{fontSize:14,fontWeight:700,fontFamily:'Consolas, monospace'}}>{children}</div>
    </div>
  );
}

function TickerSummaryModal({ ticker, q, item, section, prevRow, onClose }) {
  React.useEffect(() => {
    const h = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onClose]);

  const p = q;
  const flow  = p ? computeFlowScore(p) : null;
  const flowCls = flow != null ? classifyFlow(flow) : null;
  const flowSt = flowCls ? FLOW_STYLE[flowCls] : null;
  const prevFlow = prevRow?.flowScore;
  const flowDelta = (flow != null && prevFlow != null) ? flow - prevFlow : null;
  const early = p ? computeEarlyFlowScore(p, prevRow) : null;
  const earlyCls = early != null ? classifyEarlyFlow(early) : null;
  const earlySt = earlyCls ? EARLY_STYLE[earlyCls] : null;
  const reading = (early != null && flow != null) ? matrixReading(early, flow) : null;
  const prevAtr = prevRow?.atrPct;
  const atrDelta = (p?.atrPct != null && prevAtr != null) ? p.atrPct - prevAtr : null;
  const tri = p ? macdTriangle(p) : null;
  const ins = p?.insider;
  const w3 = ins?.windows?.['0_3m'] ?? {};
  const insScoreSt = INSIDER_SCORE_STYLE[ins?.insider_activity_score ?? 0];

  const th = { fontSize: 9, textTransform: 'uppercase', color: '#98a2b3', fontWeight: 600, padding: '3px 8px', textAlign: 'center', borderBottom: '1px solid #eef0f2', background: 'transparent', position: 'static' };
  const td = { textAlign: 'center', padding: '4px 8px', fontFamily: 'Consolas, monospace', fontWeight: 600 };
  const secTitle = { fontSize: 10, fontWeight: 800, textTransform: 'uppercase', letterSpacing: .5, color: '#344054', margin: '14px 0 6px' };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12}}>
          <div>
            <span style={{fontSize:20,fontWeight:800,color:'#1a6baa'}}>{ticker}</span>
            {p?.konc_mirror_signal === 'mirror_reversal_confirmed' &&
              <span title="Espejo CONFIRMADO: giro azul negativo→positivo (verde sigue negativo) en D y 3D, semanal aún negativo."
                style={{marginLeft:8,fontSize:11,background:'#f3e5f5',color:'#7b1fa2',borderRadius:8,padding:'1px 7px',fontWeight:700}}>🪞 Espejo</span>}
            {p?.konc_mirror_signal === 'mirror_reversal_daily_only' &&
              <span title="Espejo (solo D)."
                style={{marginLeft:8,fontSize:11,background:'#f5f5f5',color:'#9e9e9e',borderRadius:8,padding:'1px 7px',fontWeight:700}}>🪞 D</span>}
            <div style={{fontSize:11,color:'#667085',marginTop:2}}>
              {section || '—'}{item?.addedAt ? ` · añadido ${item.addedAt}` : ''}
              {p?.price != null && <> · <b style={{fontFamily:'Consolas, monospace',color:'#1f2933'}}>{fmtPrice(p.price)}</b></>}
            </div>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <a href="/portfolio.html" target="_blank" style={{fontSize:10,color:'#1a6baa'}}>Abrir Portfolio ↗</a>
            <button onClick={onClose} style={{background:'#98a2b3'}}>✕</button>
          </div>
        </div>

        {!p && <div className="gap-note" style={{marginTop:12}}>Sin datos de mercado para este ticker (la consulta a /api/quote falló o aún no ha cargado).</div>}

        {p && (<>
          <div style={secTitle}>Retornos y volumen</div>
          <table style={{width:'auto',margin:0}}>
            <thead><tr>
              {['1D','2D','3D','1W','1M','3M','YTD','1Y'].map(h => <th key={h} style={th}>{h}</th>)}
              <th style={th}>Vol 1D</th><th style={th}>Vol 2D</th><th style={th}>Vol 3D</th><th style={th}>RSI</th>
            </tr></thead>
            <tbody><tr>
              {['d1','d2','d3','w1','m1','m3','ytd','y1'].map(k => (
                <td key={k} style={{...td, background: p[k]!=null?retBg(p[k]):'', color: p[k]!=null?retFg(p[k]):'#aaa'}}>{p[k]!=null ? fmtRet(p[k]) : '—'}</td>
              ))}
              {['vol1d','vol2d','vol3d'].map(k => (
                <td key={k} style={{...td, background: volBg(p[k]), color: volFg(p[k])}} title="Volumen vs media 3M">{p[k]!=null ? p[k]+'%' : '—'}</td>
              ))}
              <td style={{...td, background: rsiBg(p.rsi), color: rsiFg(p.rsi)}}>{p.rsi != null ? p.rsi : '—'}</td>
            </tr></tbody>
          </table>

          <div style={secTitle}>Koncorde Plus</div>
          <table style={{width:'auto',margin:0}}>
            <thead><tr>
              <th style={th}>TF</th><th style={th}>Blue</th><th style={th}>Green</th><th style={th}>Trend</th><th style={th}>Estado</th><th style={th}>Últ. 5 sesiones</th>
            </tr></thead>
            <tbody>
              {[['D','d'],['3D','3d'],['W','w']].map(([lbl, k]) => {
                const st = koncStateStyle(p[`konc_${k}_state`]);
                return (
                  <tr key={k}>
                    <td style={{...td, color:'#888'}}>{lbl}</td>
                    <td style={{...td, color: blueFg(p[`konc_${k}_blue`])}} title={koncPrevTitle('Blue', p[`konc_${k}_blue`], p[`konc_${k}_blue_delta1`])}>{fmtKonc(p[`konc_${k}_blue`], p[`konc_${k}_blue_delta1`])}</td>
                    <td style={{...td, color: greenFg(p[`konc_${k}_green`])}} title={koncPrevTitle('Green', p[`konc_${k}_green`], p[`konc_${k}_green_delta1`])}>{fmtKonc(p[`konc_${k}_green`], p[`konc_${k}_green_delta1`])}</td>
                    <td style={{...td, color: trendFg(p[`konc_${k}_trend`])}} title={koncPrevTitle('Trend', p[`konc_${k}_trend`], p[`konc_${k}_trend_delta1`])}>{fmtKonc(p[`konc_${k}_trend`], p[`konc_${k}_trend_delta1`])}</td>
                    <td style={{...td, fontSize:10, background: p[`konc_${k}_state`]?st.bg:'', color: p[`konc_${k}_state`]?st.fg:'#aaa', whiteSpace:'nowrap'}}>{koncStateLbl(p[`konc_${k}_state`])}</td>
                    <td style={{...td}}><KoncMiniChart blue={p[`konc_${k}_blue_last5`]} green={p[`konc_${k}_green_last5`]} trend={p[`konc_${k}_trend_last5`]} trendMa={p[`konc_${k}_trend_ma_last5`]} /></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          {p.konc_alignment && <div style={{fontSize:10,color:'#667085',marginTop:4}}>Alineación D/3D/W: <b>{p.konc_alignment}</b></div>}

          <div style={secTitle}>Indicadores y scores</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <SumCard label="MACD hist." tip={p.macdHist!=null ? `Histograma MACD = ${p.macdHist}${p.macdHistDelta1!=null ? ` (Δ1d ${p.macdHistDelta1>=0?'+':''}${p.macdHistDelta1})` : ''}. Color = estado (línea vs señal); flecha = tendencia del histograma vs ayer.` : undefined}>
              {tri ? <span style={{color:tri.color}}>{tri.glyph}</span> : <span style={{color:'#aaa'}}>—</span>}
            </SumCard>
            <SumCard label="MACD línea" tip={p.macdLine!=null ? `Línea MACD (EMA12−EMA26) = ${p.macdLine}` : undefined}>
              {p.macdLineBull==null ? <span style={{color:'#aaa'}}>—</span>
                : <span style={{color: p.macdLineBull ? '#1a7a1a' : '#c0392b', fontSize:12}}>
                    {p.macdLineBull ? '+' : ''}{p.macdLine}
                    {p.macdLineDelta5 != null && p.macdLineDelta5 !== 0 && <span title={`Tendencia 5 sesiones: ${p.macdLineDelta5>=0?'+':''}${p.macdLineDelta5}`} style={{marginLeft:3,color: p.macdLineDelta5>0?'#0d7a2e':'#c0392b'}}>{p.macdLineDelta5>0?'↑':'↓'}</span>}
                  </span>}
            </SumCard>
            <SumCard label="ATLAS" tip={p.atlasDbb!=null ? `dbb=${p.atlasDbb} · umbral=${p.atlasFactor} · atl=${p.atlasAtl}. ● = estrechamiento de Bollinger (no da dirección).` : undefined}>
              {p.atlasSignal==null ? <span style={{color:'#aaa'}}>—</span> : p.atlasSignal ? <span style={{color:'#a9720f'}}>●</span> : <span style={{color:'#ddd'}}>·</span>}
            </SumCard>
            <SumCard label="ATR%" tip="ATR(14) normalizado por precio.">
              {p.atrPct != null ? <>{p.atrPct}%<TrendArrow delta={atrDelta} mildTh={0.25} strongTh={0.8} extremeTh={1.5} /></> : '—'}
            </SumCard>
            <SumCard label="Flow Score" tip="Momentum + RSI/MACD + ATR + Koncorde + tendencia 52W. Líder ≥ 8 · Transición ≥ 4 · Débil < 4.">
              {flow != null ? (
                <span style={{background:flowSt?.bg,color:flowSt?.fg,padding:'1px 8px',borderRadius:4}}>
                  {flow.toFixed(1)}<TrendArrow delta={flowDelta} mildTh={0.6} strongTh={5} extremeTh={10} color={flowSt?.fg} />
                </span>) : '—'}
            </SumCard>
            <SumCard label="Early Flow" tip={reading ?? 'Detecta setups antes de que el momentum sea evidente. Fuerte ≥ 7 · Interesante ≥ 4.'}>
              {early != null ? (
                <span style={{background:earlySt?.bg,color:earlySt?.fg,padding:'1px 8px',borderRadius:4}}>{early.toFixed(1)}</span>) : '—'}
            </SumCard>
          </div>
          {reading && <div style={{fontSize:11,color:'#475467',marginTop:6}}>Lectura combinada: <b>{reading}</b></div>}

          {ins && ins.coverage_status === 'covered' && (<>
            <div style={secTitle}>Insider activity (Form4API)</div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',fontSize:11}}>
              <span style={{fontWeight:700,fontFamily:'Consolas, monospace',padding:'2px 8px',borderRadius:4,background:insScoreSt.bg,color:insScoreSt.fg}}>Score {ins.insider_activity_score ?? '—'}</span>
              <span>{INSIDER_CONTEXT_LBL[ins.koncorde_insider_context] ?? '—'}</span>
              <span style={{fontFamily:'Consolas, monospace'}}>0-3M: {fmtMoney(w3.open_market_buy_value)} / {fmtMoney(w3.open_market_sell_value)} / <b>{fmtMoney(w3.net_open_market_value)}</b></span>
              <span style={{color:'#667085'}}>compradores: {w3.unique_buyers ?? 0}</span>
              {(ins.flags||[]).length > 0 && <span style={{color:'#667085'}}>{ins.flags.join(', ')}</span>}
            </div>
          </>)}

          {item?.notes && (<>
            <div style={secTitle}>Notas (Portfolio Tracker)</div>
            <div style={{fontSize:11,color:'#475467',whiteSpace:'pre-wrap',background:'#fbfcfd',border:'1px solid #e6e8eb',borderRadius:6,padding:'8px 10px'}}>{item.notes}</div>
          </>)}
        </>)}
      </div>
    </div>
  );
}

function useToast() {
  const [toast, setToast] = React.useState(null);
  const show = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); };
  return [toast, show];
}

function TrullasPage() {
  const [signals, setSignals] = React.useState({});
  const [shadowPositions, setShadowPositions] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [updated, setUpdated] = React.useState(null);
  const [showAll, setShowAll] = React.useState(false);
  const [toast, showToast] = useToast();
  // Resumen de ticker: se pide la cotización completa solo del ticker pulsado; Portfolio
  // (secciones/notas) y el histórico de Flow se cargan una vez, la primera vez que se abre.
  const [summaryTicker, setSummaryTicker] = React.useState(null);
  const [summaryQuote, setSummaryQuote] = React.useState(null);
  const [portInfo, setPortInfo] = React.useState(null);   // { sec: {ticker: sección}, items: {ticker: item} }
  const [flowHistory, setFlowHistory] = React.useState(null);
  const closeSummary = React.useCallback(() => setSummaryTicker(null), []);
  React.useEffect(() => {
    if (!summaryTicker) return;
    let alive = true;
    setSummaryQuote(null);
    fetch(`/api/quote/${encodeURIComponent(summaryTicker)}`).then(r => r.json()).then(d => { if (alive) setSummaryQuote(d.error ? null : d); }).catch(() => {});
    if (!portInfo) {
      fetch('/api/portfolio?t=' + Date.now()).then(r => r.json()).then(port => {
        const sec = {}, items = {};
        (port.sections || []).forEach(s => (s.items || []).forEach(i => { if (i.ticker && !(i.ticker in sec)) { sec[i.ticker] = s.name; items[i.ticker] = i; } }));
        if (alive) setPortInfo({ sec, items });
      }).catch(() => { if (alive) setPortInfo({ sec: {}, items: {} }); });
    }
    if (!flowHistory) fetchFlowHistory().then(h => { if (alive) setFlowHistory(h); }).catch(() => { if (alive) setFlowHistory({}); });
    return () => { alive = false; };
  }, [summaryTicker]);

  const load = React.useCallback(() => {
    setLoading(true);
    Promise.all([
      fetch('/api/trullas-signals?t=' + Date.now()).then(r => r.json()).catch(() => ({ date: null, tickers: {} })),
      fetch('/docs/data/ai_picks.json?t=' + Date.now()).then(r => r.json()).catch(() => ({ portfolios: {} })),
    ]).then(([sig, picks]) => {
      setSignals(sig.tickers || {});
      setShadowPositions((picks.portfolios || {}).TRULLAS_SHADOW?.positions || []);
      setLoading(false);
      setUpdated(sig.date || null);
    });
  }, []);

  React.useEffect(() => { load(); }, [load]);

  const rows = React.useMemo(() => {
    const list = Object.values(signals);
    list.sort((a, b) => {
      const ra = bestRank(a), rb = bestRank(b);
      if (ra !== rb) return ra - rb;
      const ta = a.tier || 0, tb = b.tier || 0;
      if (ta !== tb) return tb - ta;
      const sa = a.swing_pct || 0, sb = b.swing_pct || 0;
      return sb - sa;
    });
    return list;
  }, [signals]);

  const visibleRows = showAll ? rows : rows.filter(isActiveRow);

  const counts = React.useMemo(() => {
    const c = {};
    rows.forEach(r => { c[r.signal_state] = (c[r.signal_state] || 0) + 1; });
    return c;
  }, [rows]);

  const buildTrullasMarkdown = () => {
    const lines = [];
    lines.push('# Trullás — Divergencias MACD/Volumen/RSI + Fibonacci');
    lines.push(`Actualizado: ${updated || '—'}`);
    lines.push('');
    lines.push('Regla validada en research/trullas_divergence_backtest_v1/: entrada solo en ' +
      'divergencias alcistas en mínimos, MACD obligatorio + RSI/Volumen confirman (T1/T2/T3), ' +
      'fill a cierre en zona 23-25% de Fibonacci, TP 38.2%, stop en ruptura del pivote de origen, ' +
      'time-stop 20 sesiones. Cartera TRULLAS_SHADOW la opera en modo shadow (sin capital real).');
    lines.push('');
    lines.push(`## Posiciones abiertas en TRULLAS_SHADOW (${shadowPositions.length})`);
    if (shadowPositions.length) {
      lines.push('| Ticker | Entrada | Precio entrada | TP | Stop | Tier |');
      lines.push('|---|---|---:|---:|---:|---|');
      shadowPositions.forEach(p => {
        lines.push(`| ${p.ticker} | ${p.entry_date} | ${fmtPrice(p.entry_price)} | ${fmtPrice(p.tp_at_entry)} | ${fmtPrice(p.stop_at_entry)} | T${p.tier_at_entry} |`);
      });
    } else {
      lines.push('Sin posiciones abiertas.');
    }
    lines.push('');
    lines.push('## Señales activas (accionables o en curso)');
    lines.push('| Ticker | Estado | Estado FLEX (zona desde 20%) | Tier | Precio | Zona entrada | TP | Stop | Swing% | Pivote1 | Pivote2 |');
    lines.push('|---|---|---|---|---:|---|---:|---:|---:|---|---|');
    rows.filter(isActiveRow).forEach(r => {
      const m = stateMeta(r.signal_state);
      lines.push(`| ${r.ticker} | ${m.label} | ${r.flex_signal_state ? stateMeta(r.flex_signal_state).label : '—'} | ${r.tier ? 'T' + r.tier : '—'} | ${fmtPrice(r.price)} | ` +
        `${r.entry_low != null ? fmtPrice(r.entry_low) + '-' + fmtPrice(r.entry_high) : '—'} | ${fmtPrice(r.tp)} | ` +
        `${fmtPrice(r.stop)} | ${fmtPct(r.swing_pct)} | ${r.pivot1_date || '—'} @ ${fmtPrice(r.pivot1_close)} | ` +
        `${r.pivot2_date || '—'} @ ${fmtPrice(r.pivot2_close)} |`);
    });
    return lines.join('\n');
  };

  React.useEffect(() => {
    if (!updated) return;
    localStorage.setItem('llm_export_trullas', buildTrullasMarkdown());
    localStorage.setItem('llm_export_trullas_ts', Date.now().toString());
  }, [updated, signals, shadowPositions]);

  const copyMarkdown = () => {
    navigator.clipboard.writeText(buildTrullasMarkdown()).then(() => showToast('Copiado para LLM'));
  };

  const copyAllForLLM = () => {
    const parts = [
      { key: 'llm_export_market',      label: 'Market Tracker' },
      { key: 'llm_export_portfolio',   label: 'Portfolio' },
      { key: 'llm_export_cycle',       label: 'Cycle' },
      { key: 'llm_export_relative',    label: 'Relative Flow' },
      { key: 'llm_export_rotacion',    label: 'Flujos & Rotación' },
      { key: 'llm_export_duration',    label: 'Duration' },
      { key: 'llm_export_sentiment',   label: 'Sentiment' },
      { key: 'llm_export_positioning', label: 'Positioning' },
      { key: 'llm_export_trullas',     label: 'Trullás' },
      { key: 'llm_export_screeners',   label: 'Screener' },
    ];
    const now = Date.now();
    const found = [], missing = [], stale = [];
    const sections = parts.map(({ key, label }) => {
      const md = localStorage.getItem(key);
      if (md) {
        found.push(label);
        const ts = parseInt(localStorage.getItem(key + '_ts') || '0');
        const hours = ts ? Math.round((now - ts) / 3600000) : null;
        if (!ts || hours > 23) stale.push(hours != null ? `${label} (${hours}h)` : label);
        return md;
      }
      missing.push(label); return null;
    }).filter(Boolean);
    if (!sections.length) { showToast('⚠️ Abre cada pestaña primero para generar datos'); return; }
    const exportDate = new Date().toLocaleString('es-ES', { dateStyle: 'full', timeStyle: 'short' });
    const header = `**Exportado:** ${exportDate}` +
      (stale.length ? `\n⚠️ **Secciones desactualizadas (>24h):** ${stale.join(', ')} — Abre esas pestañas para refrescar\n` : '\n');
    const combined = header + '\n---\n\n' + sections.join('\n\n---\n\n');
    navigator.clipboard.writeText(combined)
      .then(() => {
        if (stale.length) showToast(`⚠️ ${stale.length} secc. desactualizadas: ${stale.join(', ')}`);
        else if (missing.length) showToast(`✅ ${found.length}/${parts.length} pestañas — Falta: ${missing.join(', ')}`);
        else showToast('✅ Todas las pestañas copiadas (datos frescos)');
      })
      .catch(() => showToast('❌ Error al copiar'));
  };

  return (
    <div className="wrap">
      {toast && <div className="toast">{toast}</div>}
      <div className="topbar">
        <div>
          <div className="title-row">
            <h1>Trullás</h1>
            <a href="/index.html" className="nav-link" style={{ color: '#1a6b3c', borderColor: '#1a6b3c' }}>Market Tracker</a>
            <a href="/portfolio.html" className="nav-link" style={{ color: '#3a6ca0', borderColor: '#3a6ca0' }}>Portfolio</a>
            <a href="/relative.html" className="nav-link" style={{ color: '#7b1fa2', borderColor: '#7b1fa2' }}>Relative Flow</a>
            <a href="/cycle.html" className="nav-link" style={{ color: '#7f0000', borderColor: '#7f0000' }}>Cycle</a>
            <a href="/rotacion.html" className="nav-link" style={{ color: '#e65100', borderColor: '#e65100' }}>Flujos & Rotación</a>
            <a href="/duration.html" className="nav-link" style={{ color: '#37474f', borderColor: '#37474f' }}>Duration</a>
            <a href="/sentiment.html" className="nav-link" style={{ color: '#00695c', borderColor: '#00695c' }}>Sentiment</a>
            <a href="/positioning.html" className="nav-link" style={{ color: '#5d4037', borderColor: '#5d4037' }}>Positioning</a>
            <a href="/screeners.html" className="nav-link" style={{ color: '#00838f', borderColor: '#00838f' }}>Screener</a>
          </div>
          <div className="meta">Divergencias MACD/Volumen/RSI + ejecución Fibonacci (sistema Trullás) — decisión discrecional; TRULLAS_SHADOW la opera en paralelo sin capital real</div>
        </div>
        <div className="actions">
          <button className="btn-toggle" onClick={() => setShowAll(s => !s)}>{showAll ? 'Solo activas' : `Ver todos (${rows.length})`}</button>
          <button className="btn-refresh" onClick={load} disabled={loading}>{loading ? 'Cargando…' : 'Refrescar'}</button>
          <button className="btn-copy" onClick={copyMarkdown}>Copy for LLM</button>
          <button className="btn-export" onClick={copyAllForLLM}>🗂️ Exportar TODO a LLM</button>
        </div>
      </div>

      <div className="gap-note">
        Validado en <code>research/trullas_divergence_backtest_v1/</code> (118 tickers, 2019→hoy) antes de construir
        esta pestaña — TP fijo al 38.2% de Fibonacci fue el mejor punto de todo lo probado (bate a dejar correr la
        tendencia hasta cruce MACD, y a cualquier otro nivel de la escalera Fibonacci). Con n=82 señales en 6.5 años,
        <b> esto es información para decisión discrecional, no una recomendación con edge confirmado</b> — la cartera
        TRULLAS_SHADOW opera la misma regla en paralelo sin capital real mientras se acumula más muestra.
      </div>

      <div className="section-title">Resumen</div>
      <div className="card-grid">
        {Object.keys(STATE_META).map(s => (
          counts[s] ? (
            <div className="stat-card" key={s}>
              <div className="n" style={{ color: stateMeta(s).fg }}>{counts[s]}</div>
              <div className="lbl">{stateMeta(s).label}</div>
            </div>
          ) : null
        ))}
      </div>

      {shadowPositions.length > 0 && (
        <React.Fragment>
          <div className="section-title">TRULLAS_SHADOW — posiciones abiertas ({shadowPositions.length})</div>
          <table>
            <thead><tr>
              <th title="Símbolo del valor.">Ticker</th><th title="Fecha de entrada de la posición.">Entrada</th><th title="Precio de entrada congelado al abrir la posición.">Precio entrada</th><th title="Objetivo de beneficio congelado en la entrada (Fibonacci 38,2%).">TP</th><th title="Stop: ruptura del mínimo del pivote que originó la divergencia.">Stop</th><th title="Calidad de la señal: T1 solo MACD; T2 MACD + RSI; T3 MACD + RSI + Volumen (el Volumen solo cuenta si RSI también confirma). R✓/✗ V✓/✗ indica qué confirmó.">Tier</th>
            </tr></thead>
            <tbody>
              {shadowPositions.map(p => (
                <tr key={p.ticker}>
                  <td><button className="tk-link" title="Abrir resumen del ticker" onClick={() => setSummaryTicker(p.ticker)}>{p.ticker}</button></td>
                  <td>{p.entry_date}</td>
                  <td className="num">{fmtPrice(p.entry_price)}</td>
                  <td className="num">{fmtPrice(p.tp_at_entry)}</td>
                  <td className="num">{fmtPrice(p.stop_at_entry)}</td>
                  <td><span className="tier-badge" style={{ background: TIER_STYLE[p.tier_at_entry]?.bg, color: '#fff' }}>T{p.tier_at_entry}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </React.Fragment>
      )}

      <div className="section-title">{showAll ? `Universo completo (${visibleRows.length})` : `Señales activas (${visibleRows.length})`}</div>
      <div className="section-sub">
        Zona de entrada = 23-25% de retroceso Fibonacci desde el segundo pivote (mínimo más reciente) sobre el swing
        pivote1→pivote2. TP = 38.2%. Stop = ruptura del pivote de origen (precio vuelve a caer por debajo del segundo mínimo).
        Universo recalculado ENTERO desde cero en cada run del pipeline (2×/día) — no hay estado incremental.
      </div>
      <details style={{ marginBottom: 12, fontSize: 10.5, color: '#475467', border: '1px solid #e6e8eb', borderRadius: 6, padding: '6px 10px', background: '#fbfcfd' }}>
        <summary style={{ cursor: 'pointer', fontWeight: 700, color: '#344054', fontSize: 11 }}>
          ℹ️ Qué significa cada estado y cómo se calcula el Tier (T1/T2/T3)
        </summary>
        <div style={{ marginTop: 8, lineHeight: 1.6 }}>
          <b>Estados</b> (de más a menos accionable):
          <ul style={{ margin: '4px 0 10px 18px' }}>
            {Object.entries(STATE_META).map(([k, m]) => (
              <li key={k} style={{ marginBottom: 4 }}>
                <span className="badge" style={{ background: m.bg, color: m.fg, marginRight: 4 }}>{m.label}</span>
                {m.tooltip}
              </li>
            ))}
          </ul>
          <b>Tier</b>: MACD es un filtro obligatorio — si no hay divergencia MACD, no hay señal y RSI/Volumen ni se
          consultan. Con MACD ya confirmado: <b>T1</b> = solo MACD. <b>T2</b> = MACD + RSI (RSI en pivote2 &gt; pivote1).
          <b> T3</b> = MACD + RSI + Volumen (volumen en pivote2 &gt; pivote1) — <u>Volumen solo cuenta si RSI también
          confirma</u>; una señal con Volumen a favor pero RSI en contra se queda en T1, no sube a T2. En la tabla,
          bajo cada badge de Tier se muestra el desglose real de esa fila (R✓/✗ = RSI confirmó o no, V✓/✗ = Volumen).
        </div>
      </details>
      {loading ? <div className="loading">Cargando…</div> : (
        <table>
          <thead>
            <tr>
              <th title="Símbolo del valor.">Ticker</th><th title="Sección de Portfolio Tracker a la que pertenece el ticker.">Sección</th><th title="Estado de la señal Trullás: divergencia MACD, espera de retroceso, entrada hoy, expirada, invalidada… (ver glosario).">Estado</th><th title="Misma señal con la zona de entrada ampliada: retroceso desde el 20% (en vez del 23%) hasta el 25%. Lo opera la cartera shadow TRULLAS_FLEX.">Estado FLEX</th><th title="Calidad de la señal: T1 solo MACD; T2 MACD + RSI; T3 MACD + RSI + Volumen (el Volumen solo cuenta si RSI también confirma). R✓/✗ V✓/✗ indica qué confirmó.">Tier</th><th title="Último cierre del ticker.">Precio</th><th title="RSI de Wilder a 14 sesiones.">RSI14</th>
              <th title="Histograma MACD (12,26,9): línea MACD menos su señal.">MACD hist</th><th title="Caída porcentual entre el máximo previo y el mínimo del segundo pivote. Mínimo 3% para considerarse.">Swing%</th><th title="Primer mínimo fractal (5 sesiones) de la divergencia alcista.">Pivote1</th><th title="Segundo mínimo, más bajo en precio pero con MACD más alto (divergencia).">Pivote2</th>
              <th title="Zona de retroceso del 23-25% del swing donde se coloca la orden límite de compra.">Zona entrada</th><th title="Objetivo de beneficio: retroceso Fibonacci del 38,2% del swing.">TP 38.2%</th><th title="Stop: ruptura del mínimo del pivote que originó la divergencia.">Stop</th><th title="Información adicional de la señal.">Detalle</th>
            </tr>
          </thead>
          <tbody>
            {visibleRows.map(r => {
              const m = stateMeta(r.signal_state);
              const tier = TIER_STYLE[r.tier];
              const detail = r.signal_state === 'entry_today' ? '¡Fill hoy!'
                : r.bars_remaining_in_window != null ? `${r.bars_remaining_in_window} sesiones restantes`
                : r.entry_signal_date ? `señal: ${r.entry_signal_date}`
                : '—';
              return (
                <tr key={r.ticker}>
                  <td><button className="tk-link" title="Abrir resumen del ticker" onClick={() => setSummaryTicker(r.ticker)}>{r.ticker}</button></td>
                  <td style={{ color: '#98a2b3', fontSize: 10 }}>{r.section || '—'}</td>
                  <td><span className="badge" style={{ background: m.bg, color: m.fg }}>{m.label}</span></td>
                  <td>{r.flex_signal_state ? (() => { const fm = stateMeta(r.flex_signal_state); return <span className="badge" style={{ background: fm.bg, color: fm.fg }}>{fm.label}</span>; })() : '—'}</td>
                  <td>
                    {tier ? (
                      <div>
                        <span className="tier-badge" style={{ background: tier.bg, color: '#fff' }}>T{r.tier}</span>
                        <div style={{ fontSize: 9, color: '#98a2b3', marginTop: 2 }}>
                          R{r.rsi_div ? '✓' : '✗'} V{r.vol_div ? '✓' : '✗'}
                        </div>
                      </div>
                    ) : '—'}
                  </td>
                  <td className="num">{fmtPrice(r.price)}</td>
                  <td className="num">{r.rsi14 ?? '—'}</td>
                  <td className="num">{r.macd_hist ?? '—'}</td>
                  <td className="num">{fmtPct(r.swing_pct)}</td>
                  <td style={{ fontSize: 10 }}>{r.pivot1_date ? `${r.pivot1_date} @ ${fmtPrice(r.pivot1_close)}` : '—'}</td>
                  <td style={{ fontSize: 10 }}>{r.pivot2_date ? `${r.pivot2_date} @ ${fmtPrice(r.pivot2_close)}` : '—'}</td>
                  <td className="num">{r.entry_low != null ? `${fmtPrice(r.entry_low)}-${fmtPrice(r.entry_high)}` : '—'}{r.flex_entry_low != null && <div style={{ fontSize: 9, color: '#98a2b3' }}>flex ≥ {fmtPrice(r.flex_entry_low)}</div>}</td>
                  <td className="num">{fmtPrice(r.tp)}</td>
                  <td className="num">{fmtPrice(r.stop)}</td>
                  <td style={{ fontSize: 10, color: '#667085' }}>{detail}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      )}

      {summaryTicker && (() => {
        const today = new Date().toISOString().slice(0, 10);
        const rows = (flowHistory || {})[summaryTicker] || [];
        let prevRow = null;
        for (let i = rows.length - 1; i >= 0; i--) { if (rows[i].date < today) { prevRow = rows[i]; break; } }
        return <TickerSummaryModal ticker={summaryTicker} q={summaryQuote} item={portInfo?.items?.[summaryTicker]}
                 section={portInfo?.sec?.[summaryTicker]} prevRow={prevRow} onClose={closeSummary} />;
      })()}

      <div className="footer-note">
        Datos: scripts/trullas_signal_calculator.py (Step 9c4 del pipeline, 2×/día) sobre el universo de
        Portfolio Tracker (portfolio.json). Cartera TRULLAS_SHADOW (Step 9c5) es 100% mecánica, sin IA en
        ningún punto, en modo shadow. TRULLAS_SHADOW usa la zona pura (retroceso 23-25%); TRULLAS_FLEX la misma señal con la zona
        ampliada (20-25%), creada tras el caso HFG.DE. Ver CLAUDE.md.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<TrullasPage />);
</script>
</body>
</html>
