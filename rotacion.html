// ── Clusters categoriales (para Rotación Temprana) ───────────────────────
const CLUSTERS = {
  Growth:        ['XLK','XLC','XLY','QQQ','BTC-USD'],
  ValueCyclical: ['XLF','XLI','XLB','XLE'],
  Defensive:     ['XLP','XLU','XLV','XLRE'],
  Duration:      ['TLT'],          // un solo miembro → nunca dispara (intencional)
  Commodities:   ['GC=F','SI=F','BZ=F','HG=F'],
  SmallEM:       ['IWM','EEM','EFA','FEZ'],
};

function getTickerCluster(ticker) {
  return Object.entries(CLUSTERS).find(([,m]) => m.includes(ticker))?.[0] ?? null;
}

// ROT. CONFIRMADA (antes llamada "ROT. TEMPRANA") — persistencia, no es realmente temprana:
// Condición 1: streak ≥3 | Condición 2: ≥2 del mismo clúster | Condición 3: benchmark
function isConfirmedRotation(ticker, candidates, spyAboveSma200, netLiqDeltaB) {
  const entry = candidates?.[ticker];
  if (!entry || entry.streak < 3) return false;
  if (spyAboveSma200 !== true && netLiqDeltaB <= 300) return false;
  const cluster = getTickerCluster(ticker);
  if (!cluster) return false;
  const qualifying = CLUSTERS[cluster].filter(t => {
    const e = candidates[t]; return e && e.streak >= 3;
  });
  return qualifying.length >= 2;
}

function getConfirmedRotMeta(ticker, candidates, spyAboveSma200, netLiqDeltaB) {
  const cluster = getTickerCluster(ticker);
  const qualifying = cluster
    ? CLUSTERS[cluster].filter(t => { const e = candidates[t]; return e && e.streak >= 3; })
    : [];
  return {
    streak:        candidates?.[ticker]?.streak ?? 0,
    cluster,
    clusterPeers:  qualifying.filter(t => t !== ticker),
    benchmarkSPY:  spyAboveSma200 === true,
    benchmarkNetLiq: netLiqDeltaB > 300,
    netLiqDeltaB,
  };
}

// ROT. TEMPRANA (nueva, basada en inflexión — hoja sección 9.2) — a diferencia de
// ROT. CONFIRMADA, no exige persistencia de varias semanas sino una mejora reciente
// de score confirmada por RS4w positivo y Koncorde 3D no en distribución. En este
// universo de ETFs solo se agrupa por macro_cluster; el equivalente para acciones
// individuales por subtheme_cluster vive en backtest/src/rotation/stock_scanner.py.
function qualifiesForNewEarlyRotation(currentScore, prevScore, rs4wVsSpy, konc3dState) {
  if (currentScore == null || currentScore < 6) return false;
  if (prevScore == null || (currentScore - prevScore) < 2) return false;
  if (!(rs4wVsSpy > 0)) return false;
  if (konc3dState === 'distribution') return false;
  return true;
}

function isNewEarlyRotation(ticker, qualifyMap, spyAboveSma200, netLiqDeltaB) {
  if (!qualifyMap[ticker]) return false;
  if (spyAboveSma200 !== true && netLiqDeltaB <= 300) return false;
  const cluster = getTickerCluster(ticker);
  if (!cluster) return false;
  const peers = CLUSTERS[cluster].filter(t => t !== ticker && qualifyMap[t]);
  return peers.length >= 1;
}

function getNewEarlyRotMeta(ticker, qualifyMap, spyAboveSma200, netLiqDeltaB) {
  const cluster = getTickerCluster(ticker);
  const peers = cluster ? CLUSTERS[cluster].filter(t => t !== ticker && qualifyMap[t]) : [];
  return {
    cluster_type: 'macro_cluster',
    cluster_name: cluster,
    clusterPeers: peers,
    benchmarkSPY:  spyAboveSma200 === true,
    benchmarkNetLiq: netLiqDeltaB > 300,
    netLiqDeltaB,
  };
}

// ── Helpers ───────────────────────────────────────────────────────────────
function getRegime(score) {
  return REGIMES.find(r => score >= r.min) || REGIMES[REGIMES.length-1];
}

// Nombres de régimen menos agresivos para mostrar al usuario (hoja sección 5).
// Solo capa de display: el valor canónico (label en REGIMES/current_regime/
// pending_regime) NO cambia — sigue siendo 'Bull Pleno'/'Bull Maduro'/etc. en
// todos los sitios donde se compara o persiste. Usar esta función únicamente
// al renderizar texto para el usuario, nunca en comparaciones de lógica.
function displayRegimeName(regime) {
  const map = {
    'Bull Pleno':   'Risk-On Fuerte',
    'Bull Maduro':  'Risk-On Maduro',
    'Transición':   'Transición',
    'Risk-OFF':     'Risk-Off',
    'Capitulación': 'Estrés / Capitulación',
  };
  return map[regime] ?? regime;
}

function calcMacroScore(macroData) {
  let absolute = 0, maxPossible = 0;
  for (const it of MACRO_ITEMS) {
    const entry = macroData[it.id];
    if (!entry || entry.value == null) continue;
    maxPossible += it.weight;
    absolute += it.needsDelta
      ? it.score(entry.value, entry.delta13w ?? null)
      : it.score(entry.value);
  }
  const scaled = maxPossible > 0 ? Math.round(absolute * 100 / maxPossible) : 0;
  return { scaled, absolute: Math.round(absolute * 10) / 10, maxPossible };
}

// Returns { total, blockA, blockB, blockC, breakdown, w1Rel, m1Rel, m3Rel }
function calcRotScore(data, spyData) {
  if (!data || !spyData) return { total:0, blockA:0, blockB:0, blockC:0, w1Rel:null, m1Rel:null, m3Rel:null, bd:{} };
  const rs4w  = (data.m1 ?? 0) - (spyData.m1 ?? 0);
  const rs13w = (data.m3 ?? 0) - (spyData.m3 ?? 0);
  const rs1w  = (data.w1 ?? 0) - (spyData.w1 ?? 0);

  const bd = {
    rs13w: rs13w > 2.0,
    rs4w:  rs4w  > 1.0,
    sma200: data.closeAboveSma200 === true,
    cmf:   data.cmf20 != null && data.cmf20 > 0.05,
    obv:   data.obvAboveSma50 === true,
    vol:   data.volRatio != null && data.volRatio > 1.10,
    macd:  data.macdBull === true,
    rsi:   data.rsi != null && data.rsi >= 40 && data.rsi <= 70,
    antiExt: data.antiExt === true,
  };

  const blockA = (bd.rs13w ? 2 : 0) + (bd.rs4w ? 1 : 0) + (bd.sma200 ? 1 : 0);
  const blockB = (bd.cmf   ? 1 : 0) + (bd.obv   ? 1 : 0) + (bd.vol    ? 1 : 0);
  const blockC = (bd.macd  ? 1 : 0) + (bd.rsi   ? 1 : 0) + (bd.antiExt? 1 : 0);
  return { total:blockA+blockB+blockC, blockA, blockB, blockC, bd, w1Rel:rs1w, m1Rel:rs4w, m3Rel:rs13w };
}

function toStars(score) {
  if (score >= 9) return 5;
  if (score >= 7) return 4;
  if (score >= 5) return 3;
  if (score >= 3) return 2;
  return 1;
}

function getSignal(rotTotal, fit, flags, spyAboveSma200, isConfirmedRot = false, isNewEarlyRot = false) {
  const creditFlag = flags?.CREDIT_COMPLACENCY?.active;
  const emergency  = flags?.EMERGENCY_MODE?.active;
  const buyThreshold = creditFlag ? 8 : 7;

  if (emergency) {
    if (fit && rotTotal >= 6) return { label:'ACUMULAR*',   color:'#33691e', bg:'#f1f8e9', note:'emergencia' };
    return { label:'—', color:'#ccc', bg:'transparent' };
  }

  let level;
  if      (fit && rotTotal >= buyThreshold) level = 'COMPRA';
  else if (fit && rotTotal >= 5)            level = 'ACUMULAR';
  else if (isConfirmedRot)                  level = 'ROT. CONFIRMADA';
  else if (isNewEarlyRot)                   level = 'ROT. TEMPRANA';
  else if (rotTotal >= 3)                   level = 'VIGILAR';
  else                                      level = null;

  // Master Filter: SPY < SMA200 → degrade 1 nivel
  // Ambas señales de rotación quedan excluidas: cada una lleva su propio filtro de
  // benchmark (SPY>SMA200 OR NetLiq>300B)
  if (spyAboveSma200 === false && level && level !== 'ROT. CONFIRMADA' && level !== 'ROT. TEMPRANA') {
    const downgrade = { 'COMPRA':'ACUMULAR', 'ACUMULAR':'VIGILAR', 'VIGILAR':null };
    level = downgrade[level] ?? null;
  }

  const colors = {
    'COMPRA':          { color:'#1b5e20', bg:'#e8f5e9' },
    'ACUMULAR':        { color:'#33691e', bg:'#f1f8e9' },
    'ROT. CONFIRMADA': { color:'#e65100', bg:'#fff3e0' },
    'ROT. TEMPRANA':   { color:'#7b1fa2', bg:'#f3e5f5' },
    'VIGILAR':         { color:'#888',    bg:'#f5f5f5' },
  };
  return level ? { label:level, ...colors[level] } : { label:'—', color:'#ccc', bg:'transparent' };
}

// Applies inflation overlay and conditionals to leader list
function getEffectiveLeaders(regime, macroData, flags, quotes) {
  let leaders = [...regime.defaultLeaders];
  const hyBps       = (macroData.hy?.value ?? 999)*100;
  const t10y3m      = macroData.curve?.value ?? 0;
  const curveDelta  = macroData.curve?.delta13w ?? 0;
  const dfii10      = macroData.dfii10?.value ?? 99;
  const dxyM3       = quotes['DX-Y.NYB']?.m3 ?? 0;
  const netLiqDelta = macroData.netliq?.value ?? 0;

  // IWM conditional
  const iwmOk = hyBps < 375 && (t10y3m > 0 || curveDelta > 0);
  if (!iwmOk) leaders = leaders.filter(t => t !== 'IWM');

  // Gold conditional
  const goldOk = dfii10 < 1.0 || dxyM3 < 0;
  if (!goldOk) leaders = leaders.filter(t => t !== 'GC=F');

  // Inflation overlay
  if (flags?.INFLATION_OVERLAY?.active) {
    const durationBlock = netLiqDelta > 300 ? false : true;
    if (durationBlock) leaders = leaders.filter(t => !['TLT','QQQ','XLK'].includes(t));
    if (!['XLE','XLB','GC=F','SI=F'].every(t => leaders.includes(t))) {
      ['XLE','XLB','GC=F','SI=F'].forEach(t => { if (!leaders.includes(t)) leaders.push(t); });
    }
  }

  return leaders;
}

// Régimen efectivo: histéresis (current_regime persistido) + degradación por TERM_PREMIUM_EXTREME.
// Extraído para poder calcular el snapshot histórico en load() con el mismo resultado que
// verá el usuario en pantalla (que usa esta misma fórmula vía useMemo sobre appState).
function computeEffectiveRegime(appState, rawRegime) {
  const label = appState.current_regime || rawRegime.label;
  let r = REGIMES.find(x => x.label === label) || rawRegime;
  if (appState.flags?.TERM_PREMIUM_EXTREME?.active) {
    const idx = REGIMES.indexOf(r);
    r = REGIMES[Math.min(idx+1, REGIMES.length-1)];
  }
  return r;
}

// Elegibilidad para ROT. TEMPRANA (inflexión) de todo el universo — extraído del cuerpo
// del useMemo `rows` para poder reutilizarlo también al construir el snapshot en load().
function buildEarlyRotQualifyMap(quotes, spy, candidates) {
  const qualifyMap = {};
  UNIVERSE.forEach(a => {
    if (a.ticker === 'SPY') { qualifyMap[a.ticker] = false; return; }
    const d2 = quotes[a.ticker];
    if (!d2) { qualifyMap[a.ticker] = false; return; }
    const r2 = calcRotScore(d2, spy);
    const prevScore = candidates?.[a.ticker]?.prev_score;
    qualifyMap[a.ticker] = qualifiesForNewEarlyRotation(r2.total, prevScore, r2.m1Rel, d2.konc_3d_state);
  });
  return qualifyMap;
}

// Fila completa por ticker (score, fit, señal, meta de rotación). Extraído del useMemo
// `rows` para reutilizarlo tal cual al construir el snapshot histórico en load() — evita
// que el cálculo que se persiste diverja del que se renderiza (mismo criterio que motivó
// centralizar HARD_RULES/compact_candidate en ai_shared.py en el pipeline Python).
function computeTickerRow(a, quotes, spy, effectiveLeaders, flags, candidates, qualifyMap, spyAboveSma200, netLiqDeltaB) {
  const d   = quotes[a.ticker];
  const rot = a.ticker === 'SPY' ? { total:0, blockA:0, blockB:0, blockC:0, w1Rel:null, m1Rel:null, m3Rel:null, bd:{} } : calcRotScore(d, spy);
  const fit = effectiveLeaders.includes(a.ticker);
  const confirmedRot = a.ticker !== 'SPY' && !fit
    ? isConfirmedRotation(a.ticker, candidates, spyAboveSma200, netLiqDeltaB)
    : false;
  const confirmedRotMeta = confirmedRot
    ? getConfirmedRotMeta(a.ticker, candidates, spyAboveSma200, netLiqDeltaB)
    : null;
  const newEarlyRot = a.ticker !== 'SPY' && !fit && !confirmedRot
    ? isNewEarlyRotation(a.ticker, qualifyMap, spyAboveSma200, netLiqDeltaB)
    : false;
  const newEarlyRotMeta = newEarlyRot
    ? getNewEarlyRotMeta(a.ticker, qualifyMap, spyAboveSma200, netLiqDeltaB)
    : null;
  const sig = a.ticker === 'SPY'
    ? { label:'ref', color:'#aaa', bg:'transparent' }
    : getSignal(rot.total, fit, flags, spyAboveSma200, confirmedRot, newEarlyRot);
  return { ...a, d, rot, fit, sig, confirmedRot, confirmedRotMeta, newEarlyRot, newEarlyRotMeta };
}

function updateStateFromData(prev, macroScore, macroData, rawRegime, vixVal, rotScores) {
  const s = JSON.parse(JSON.stringify(prev || DEFAULT_STATE));
  const now = new Date().toISOString().slice(0,10);

  // Emergency Mode: VIX ≥ 35
  if (vixVal >= 35) {
    if (!s.flags.EMERGENCY_MODE.active) {
      const exp = new Date(); exp.setDate(exp.getDate()+14);
      s.flags.EMERGENCY_MODE = { active:true, activated_at:now, expires_date:exp.toISOString().slice(0,10) };
    }
  }
  if (s.flags.EMERGENCY_MODE.active && s.flags.EMERGENCY_MODE.expires_date) {
    if (new Date(s.flags.EMERGENCY_MODE.expires_date) <= new Date()) {
      s.flags.EMERGENCY_MODE.active = false;
    }
  }

  // Histéresis: régimen solo cambia cuando cruza >5 pts Y persiste ≥2 lecturas
  if (!s.current_regime) {
    s.current_regime = rawRegime.label;
    s.regime_entered_date = now;
    s.pending_regime = null;
    s.pending_since_count = 0;
  } else {
    const cur = REGIMES.find(r => r.label === s.current_regime);
    const curIdx = cur ? REGIMES.indexOf(cur) : -1;
    const upperBound = curIdx > 0 ? REGIMES[curIdx - 1].min : 101;
    const inRange = cur && macroScore >= cur.min && macroScore < upperBound;
    if (!inRange) {
      // Medir cruce contra el borde correcto:
      // ascendente (score >= upperBound) → distancia al borde superior
      // descendente (score < cur.min)    → distancia al borde inferior
      let diff = 0;
      if (cur) {
        diff = macroScore >= upperBound
          ? macroScore - upperBound
          : cur.min - macroScore;
      } else {
        diff = 999;
      }
      if (rawRegime.label !== s.pending_regime) {
        s.pending_regime = rawRegime.label;
        s.pending_since_count = 1;
      } else {
        s.pending_since_count = (s.pending_since_count||0)+1;
      }
      if (diff >= 5 && s.pending_since_count >= 2) {
        // Fase 5.3: guarda el régimen saliente antes de sobrescribirlo, para poder
        // mostrar "Régimen anterior: X (durante N semanas)" en la UI.
        s.previous_regime = { label: s.current_regime, entered_date: s.regime_entered_date, exited_date: now };
        s.current_regime = rawRegime.label;
        s.regime_entered_date = now;
        s.pending_regime = null;
        s.pending_since_count = 0;
      }
    } else {
      s.pending_regime = null;
      s.pending_since_count = 0;
    }
  }

  // CREDIT_COMPLACENCY: HY < 275 bps ≥ 8 semanas
  const hyBps = (macroData.hy?.value ?? 999)*100;
  if (hyBps < 275) {
    s.flags.CREDIT_COMPLACENCY.streak_weeks = (s.flags.CREDIT_COMPLACENCY.streak_weeks||0)+1;
    s.flags.CREDIT_COMPLACENCY.active = s.flags.CREDIT_COMPLACENCY.streak_weeks >= 8;
  } else {
    s.flags.CREDIT_COMPLACENCY.streak_weeks = 0;
    s.flags.CREDIT_COMPLACENCY.active = false;
  }

  // INFLATION_OVERLAY: T5YIE ≥ 2.8% ≥ 4 semanas
  const t5yie = macroData.t5yie?.value ?? 0;
  if (t5yie >= 2.8) {
    s.flags.INFLATION_OVERLAY.streak_weeks = (s.flags.INFLATION_OVERLAY.streak_weeks||0)+1;
    s.flags.INFLATION_OVERLAY.active = s.flags.INFLATION_OVERLAY.streak_weeks >= 4;
  } else {
    s.flags.INFLATION_OVERLAY.streak_weeks = 0;
    s.flags.INFLATION_OVERLAY.active = false;
  }

  // TERM_PREMIUM_EXTREME: THREEFYTP10 < -0.75 ≥ 13 semanas
  const tp10 = macroData.termPremium?.value ?? 99;
  if (tp10 < -0.75) {
    s.flags.TERM_PREMIUM_EXTREME.streak_weeks = (s.flags.TERM_PREMIUM_EXTREME.streak_weeks||0)+1;
    s.flags.TERM_PREMIUM_EXTREME.active = s.flags.TERM_PREMIUM_EXTREME.streak_weeks >= 13;
  } else {
    s.flags.TERM_PREMIUM_EXTREME.streak_weeks = 0;
    s.flags.TERM_PREMIUM_EXTREME.active = false;
  }

  // Early rotation streaks: incrementar solo una vez por día (protección multi-refresh)
  // Cada entry guarda last_updated_date; si ya se actualizó hoy, se omite el incremento.
  if (rotScores) {
    for (const [ticker, score] of Object.entries(rotScores)) {
      const entry = s.early_rotation_candidates[ticker] || { streak: 0, last_score: null, prev_score: null, last_updated_date: null };
      if (entry.last_updated_date !== now) {
        // Primera actualización del día: snapshot de prev_score (última lectura del día anterior),
        // usado por isNewEarlyRotation para detectar inflexión (score actual - prev_score >= 2).
        entry.prev_score = entry.last_score;
        // Primera actualización del día: incrementar o resetear streak
        entry.streak = score >= 8 ? (entry.streak || 0) + 1 : 0;
        entry.last_updated_date = now;
      }
      // Si ya se actualizó hoy, solo refrescar last_score (sin tocar streak ni prev_score)
      entry.last_score = score;
      s.early_rotation_candidates[ticker] = entry;
    }
  }

  // Fase 5.3 — self-heal para state.json previos a este campo (mismo patrón que
  // macro_score_history abajo).
  if (s.previous_regime === undefined) s.previous_regime = null;

  // Historial de MacroScore (Fase 7 — macro_delta_1w/4w + macro_trend). Una entrada
  // por día, mismo patrón de protección multi-refresh que los streaks de arriba.
  if (!s.macro_score_history) s.macro_score_history = [];
  const lastHistEntry = s.macro_score_history[s.macro_score_history.length - 1];
  if (!lastHistEntry || lastHistEntry.date !== now) {
    s.macro_score_history.push({ date: now, score: macroScore });
    if (s.macro_score_history.length > 70) {          // ~10 semanas, margen sobre delta_4w
      s.macro_score_history = s.macro_score_history.slice(-70);
    }
  }

  return s;
}

// Δ1w / Δ4w del MacroScore + tendencia (improving/stable/deteriorating), hoja sección 5.
function computeMacroTrend(history, currentScore) {
  if (!history || history.length === 0 || currentScore == null) {
    return { delta1w: null, delta4w: null, trend: 'stable' };
  }
  const findClosestAtOrBefore = (daysAgo) => {
    const target = new Date();
    target.setDate(target.getDate() - daysAgo);
    const targetStr = target.toISOString().slice(0, 10);
    let best = null;
    for (const e of history) {
      if (e.date <= targetStr) best = e;
    }
    return best;
  };
  const e1w = findClosestAtOrBefore(7);
  const e4w = findClosestAtOrBefore(28);
  const delta1w = e1w ? +(currentScore - e1w.score).toFixed(1) : null;
  const delta4w = e4w ? +(currentScore - e4w.score).toFixed(1) : null;
  let trend = 'stable';
  if (delta1w != null && delta4w != null) {
    if (delta1w > 0 && delta4w > 0) trend = 'improving';
    else if (delta1w < 0 && delta4w < 0) trend = 'deteriorating';
  }
  return { delta1w, delta4w, trend };
}

function trendLabel(trend) {
  return { improving: 'Improving', stable: 'Stable', deteriorating: 'Deteriorating' }[trend] ?? '';
}

// ── Flujos & Rotación v2 — Fase 2 (dinámica sobre rotation_history) ────────
// Busca la entrada más reciente con date <= (hoy − daysAgo). Generaliza el helper que ya
// usa computeMacroTrend para macro_score_history — mismo criterio "closest at or before",
// no exige que exista una entrada exactamente hace N días (esta pestaña no tiene cron
// propio, ver nota en Fase 1 sobre rotation_history).
function findHistEntryAtOrBefore(history, daysAgo) {
  if (!history || history.length === 0) return null;
  const target = new Date();
  target.setDate(target.getDate() - daysAgo);
  const targetStr = target.toISOString().slice(0, 10);
  let best = null;
  for (const e of history) {
    if (e.date <= targetStr) best = e;
  }
  return best;
}

// Orden implícito de calidad de señal, igual al cascade if/elif de getSignal (COMPRA se
// comprueba primero como "mejor", ACUMULAR después, etc.) — usado solo para decidir
// UPGRADED/DOWNGRADED, no cambia getSignal.
const SIGNAL_RANK = { 'COMPRA':5, 'ACUMULAR':4, 'ACUMULAR*':4, 'ROT. CONFIRMADA':3, 'ROT. TEMPRANA':2, 'VIGILAR':1, '—':0 };

// "Confirma" en todo Fase 3/4: señal actual con rank >= ACUMULAR. Extraído a función para
// no repetir la expresión `(SIGNAL_RANK[x]??0)>=SIGNAL_RANK['ACUMULAR']` en cada sitio.
function confirmsSignal(label) {
  return (SIGNAL_RANK[label] ?? 0) >= SIGNAL_RANK['ACUMULAR'];
}

// Δ score 1W + badge de cambio de señal + semanas consecutivas en la señal actual.
// currentSignal debe ser el label YA renderizado (row.sig.label, post Master Filter) para
// que el badge compare exactamente lo que el usuario ve, no el score crudo.
function computeRotationDynamics(history, currentScore, currentSignal) {
  if (!history || history.length === 0) return { delta1w:null, arrow:'→', badge:null, weeksInSignal:null };

  const ref = findHistEntryAtOrBefore(history, 7);
  const delta1w = ref ? +(currentScore - ref.score).toFixed(1) : null;
  const arrow = delta1w == null ? '→' : delta1w >= 2 ? '↗' : delta1w <= -2 ? '↘' : '→';

  let badge = null;
  if (ref && ref.signal !== currentSignal) {
    const curRank = SIGNAL_RANK[currentSignal] ?? 0;
    const refRank = SIGNAL_RANK[ref.signal] ?? 0;
    if (curRank > refRank) badge = 'UPGRADED';
    else if (curRank < refRank) badge = 'DOWNGRADED';
  }

  // Racha de la señal actual: recorre el histórico hacia atrás mientras la señal
  // coincide, mide días naturales desde el inicio de la racha y los pasa a semanas. Se
  // basa en tiempo transcurrido, no en nº de snapshots guardados — como esta pestaña solo
  // graba cuando alguien abre la página (sin cron propio, ver Fase 1), un hueco de varios
  // días sin abrir no rompe la racha si la señal es la misma antes y después del hueco.
  let streakStart = history[history.length - 1].date;
  for (let i = history.length - 1; i >= 0; i--) {
    if (history[i].signal !== currentSignal) break;
    streakStart = history[i].date;
  }
  const daysInSignal = Math.floor((Date.now() - new Date(streakStart).getTime()) / 86400000);
  const weeksInSignal = Math.max(1, Math.round(daysInSignal / 7));

  return { delta1w, arrow, badge, weeksInSignal };
}

// Distancia al siguiente umbral de señal — solo definida para tickers "fit" (líderes
// efectivos del régimen actual): es el único tramo con un umbral de score limpio y
// objetivo (VIGILAR/ACUMULAR/COMPRA). ROT.CONFIRMADA/ROT.TEMPRANA dependen de
// streak+clúster, no de un único umbral de score — quedan fuera (null), no se inventa un
// pseudo-umbral para ellos. Si el Master Filter está degradando señales (SPY<SMA200), la
// distancia sobre el score crudo dejaría de coincidir con lo que se ve en pantalla, así
// que se marca masterFilterBlocking en vez de devolver un número engañoso.
function computeThresholdDistance(row, flags, spyAboveSma200) {
  if (row.ticker === 'SPY' || !row.fit) return null;
  if (spyAboveSma200 === false) return { masterFilterBlocking:true, pointsUp:null, nextLabel:null, bufferDown:null };

  const score = row.rot.total;
  if (flags?.EMERGENCY_MODE?.active) {
    const min = 6; // único tramo bajo emergencia: fit && total>=6 → ACUMULAR*
    return score >= min
      ? { masterFilterBlocking:false, pointsUp:null, nextLabel:null, bufferDown: score - min }
      : { masterFilterBlocking:false, pointsUp: min - score, nextLabel:'ACUMULAR*', bufferDown:null };
  }

  const buyThreshold = flags?.CREDIT_COMPLACENCY?.active ? 8 : 7;
  const tiers = [ { label:'VIGILAR', min:3 }, { label:'ACUMULAR', min:5 }, { label:'COMPRA', min:buyThreshold } ];
  let idx = -1;
  tiers.forEach((t,i) => { if (score >= t.min) idx = i; });
  const next = tiers[idx+1] || null;
  return {
    masterFilterBlocking:false,
    pointsUp: next ? +(next.min - score).toFixed(1) : null,
    nextLabel: next?.label ?? null,
    bufferDown: idx >= 0 ? +(score - tiers[idx].min).toFixed(1) : null,
  };
}

// ── Flujos & Rotación v2 — Fase 3 (coherencia régimen vs rotación) ─────────
// % de líderes teóricos del régimen actual (effectiveLeaders, ya con los condicionales de
// getEffectiveLeaders aplicados — no la lista estática REGIMES[].defaultLeaders) cuya
// señal confirma el régimen (COMPRA/ACUMULAR, rank>=ACUMULAR en SIGNAL_RANK). Recibe un
// mapa ticker->signal ya resuelto (post Master Filter) en vez de recalcular getSignal,
// mismo criterio que Fase 2. "Confirma régimen" = señal ≥ ACUMULAR, tal como pide el plan
// — ROT.CONFIRMADA/ROT.TEMPRANA (rank 3/2) NO cuentan como confirmación aunque sean
// señales válidas, porque no implican que el ticker sea uno de los líderes reconocidos.
function computeRegimeCoherence(signalByTicker, leaders) {
  if (!leaders || leaders.length === 0) return null;
  let confirm = 0, total = 0;
  leaders.forEach(t => {
    const sig = signalByTicker[t];
    if (sig == null) return;
    total++;
    if (confirmsSignal(sig)) confirm++;
  });
  if (total === 0) return null;
  return { confirm, total, pct: Math.round(100 * confirm / total) };
}

function coherenceLevel(pct) {
  if (pct == null) return { label:'—', color:'#aaa', bg:'#f5f5f5' };
  if (pct > 70) return { label:'régimen confirmado', color:'#1b5e20', bg:'#e8f5e9' };
  if (pct >= 40) return { label:'régimen mixto / transición', color:'#e65100', bg:'#fff3e0' };
  return { label:'régimen no confirmado por rotación — posible cambio en curso', color:'#b71c1c', bg:'#ffebee' };
}

// ── Flujos & Rotación v2 — Fase 4 (registry de divergencias) ───────────────
// 8 relaciones definidas por adelantado (plan sección 4.2) — nunca se genera una
// divergencia "al vuelo" fuera de este array. Las 8 relaciones del plan NO son todas
// comparaciones simples de 2 tickers (Financials vs Bonds es una relación inversa;
// Cyclicals vs Copper y Defensives vs Risk-on Leaders comparan un grupo; Healthcare vs
// régimen compara un ticker contra el estado del régimen, no contra otro ticker) — se
// tipificaron en 5 "type" reutilizables en vez de escribir 8 evaluadores sueltos:
// pair_same_direction / pair_inverse_risk / group_vs_ticker / group_vs_regime_leaders /
// ticker_vs_regime. `theme` es el texto fijo que se inserta en la plantilla de
// interpretación (interpretationFor) — la plantilla en sí está pre-escrita y es la misma
// para todas las relaciones del mismo type, `theme` solo la particulariza.
const DIVERGENCE_REGISTRY = [
  { id:'copper_silver_reflation',  label:'Copper vs Silver — reflation check',
    type:'pair_same_direction', a:'HG=F', b:'SI=F',
    theme:'reflation confirmada por metales industriales y monetarios' },
  { id:'crude_vs_energy_equities', label:'Crude vs Energy Equities',
    type:'pair_same_direction', a:'BZ=F', b:'XLE',
    theme:'que la renta variable energética acompañe el movimiento del crudo' },
  { id:'integrated_vs_ep',         label:'Integrated Energy vs E&P',
    type:'pair_same_direction', a:'XLE', b:'XOP',
    theme:'qué extremo de la cadena de valor energética lidera' },
  { id:'financials_vs_bonds',      label:'Financials vs Bonds — risk expectation check',
    type:'pair_inverse_risk', a:'XLF', b:'TLT',
    theme:'expectativas de tipos coherentes con el apetito de riesgo' },
  { id:'tech_sector_vs_index',     label:'Tech Sector vs Tech-heavy Index',
    type:'pair_same_direction', a:'XLK', b:'QQQ',
    theme:'liderazgo de todo el sector tecnológico, no solo mega-caps' },
  { id:'cyclicals_vs_copper',      label:'Cyclicals vs Copper',
    type:'group_vs_ticker', group:['XLI','XLB'], ticker:'HG=F',
    theme:'fuerza cíclica confirmada por materias primas industriales' },
  { id:'defensives_vs_risk_on',    label:'Defensives vs Risk-on Leaders',
    type:'group_vs_regime_leaders', group:['XLU','XLP'],
    theme:'rotación hacia o desde el riesgo' },
  { id:'healthcare_vs_regime',     label:'Healthcare vs régimen',
    type:'ticker_vs_regime', ticker:'XLV', expectedRegime:'Transición',
    theme:'fuerza en Salud como señal idiosincrática frente a señal de régimen' },
];

function groupConfirmCount(group, rowByTicker) {
  let n = 0, total = 0;
  group.forEach(t => { const r = rowByTicker[t]; if (!r) return; total++; if (confirmsSignal(r.sig.label)) n++; });
  return { n, total };
}

// Orden de evaluación = prioridad, igual criterio que la cascada de _konc_alignment
// (koncorde_calculator.py): warning primero (el estado más alarmante nunca debe quedar
// enmascarado por una confirmación parcial), luego strong > partial > divergence > neutral.
// 'neutral' es una 5ª categoría añadida aquí y no en la hoja original — la hoja solo define
// 4 estados pero sus propias condiciones de ejemplo (4.1) no son exhaustivas: si ninguno de
// los dos lados confirma, ninguna de las 4 aplica. Se documenta en vez de forzar un estado
// que no encaja (ver CLAUDE.md).
function evalPairSameDirection(entry, rowByTicker) {
  const A = rowByTicker[entry.a], B = rowByTicker[entry.b];
  if (!A || !B) return { state:'neutral', A, B };
  const confA = confirmsSignal(A.sig.label), confB = confirmsSignal(B.sig.label);
  const gap = Math.abs(A.rot.total - B.rot.total);
  if (gap > 4 && A.sig.label !== B.sig.label) return { state:'warning', A, B, gap };
  if (confA && confB && (A.dyn?.delta1w ?? 0) > 0 && (B.dyn?.delta1w ?? 0) > 0) return { state:'strong_confirmation', A, B };
  if (confA && confB) return { state:'partial_confirmation', A, B };
  if (confA !== confB) return { state:'divergence', A, B };
  return { state:'neutral', A, B };
}

// a = activo de riesgo (ej. XLF), b = refugio (ej. TLT). Risk-on coherente = a confirma y
// b no; ambos confirmando a la vez es la lectura ambigua (acciones y bonos largos
// rallying juntos no es el combo "normal" de ningún régimen); b confirmando solo sin que
// a lo haga es la advertencia más fuerte (refugio atrayendo flujo mientras el activo de
// riesgo no responde — contradice un régimen risk-on).
function evalPairInverseRisk(entry, rowByTicker) {
  const A = rowByTicker[entry.a], B = rowByTicker[entry.b];
  if (!A || !B) return { state:'neutral', A, B };
  const confA = confirmsSignal(A.sig.label), confB = confirmsSignal(B.sig.label);
  if (confB && !confA) return { state:'warning', A, B };
  if (confA && confB) return { state:'divergence', A, B };
  if (confA && (A.dyn?.delta1w ?? 0) > 0) return { state:'strong_confirmation', A, B };
  if (confA) return { state:'partial_confirmation', A, B };
  return { state:'neutral', A, B };
}

function evalGroupVsTicker(entry, rowByTicker) {
  const g = groupConfirmCount(entry.group, rowByTicker);
  const T = rowByTicker[entry.ticker];
  if (g.total === 0 || !T) return { state:'neutral', g, T };
  const groupConfirms = g.n >= Math.ceil(g.total / 2);
  const tickerConfirms = confirmsSignal(T.sig.label);
  if (groupConfirms && g.n === g.total && !tickerConfirms) return { state:'warning', g, T };
  if (groupConfirms && tickerConfirms && (T.dyn?.delta1w ?? 0) > 0) return { state:'strong_confirmation', g, T };
  if (groupConfirms && tickerConfirms) return { state:'partial_confirmation', g, T };
  if (groupConfirms !== tickerConfirms) return { state:'divergence', g, T };
  return { state:'neutral', g, T };
}

// Reutiliza regimeCoherence (Fase 3) como proxy de "líderes risk-on" en vez de recorrer
// effectiveLeaders otra vez — misma cifra que ya se muestra en el banner de coherencia.
function evalGroupVsRegimeLeaders(entry, rowByTicker, regimeCoherence) {
  const g = groupConfirmCount(entry.group, rowByTicker);
  if (g.total === 0 || regimeCoherence == null) return { state:'neutral', g, regimeCoherence };
  const defensivesConfirm = g.n >= Math.ceil(g.total / 2);
  const leadersStrong = regimeCoherence.pct > 70;
  const leadersWeak = regimeCoherence.pct < 40;
  if (defensivesConfirm && leadersWeak) return { state:'warning', g, regimeCoherence };
  if (!defensivesConfirm && leadersStrong) return { state:'strong_confirmation', g, regimeCoherence };
  if (!defensivesConfirm && !leadersWeak) return { state:'partial_confirmation', g, regimeCoherence };
  if (defensivesConfirm && !leadersWeak) return { state:'divergence', g, regimeCoherence };
  return { state:'neutral', g, regimeCoherence };
}

// XLV es líder teórico SOLO en Transición (ver REGIMES[].defaultLeaders) — fuerza en XLV
// fuera de ese régimen es idiosincrática (noticias del sector, no lectura macro).
function evalTickerVsRegime(entry, rowByTicker, effectiveRegimeLabel) {
  const T = rowByTicker[entry.ticker];
  if (!T) return { state:'neutral', T };
  const tickerConfirms = confirmsSignal(T.sig.label);
  const inExpectedRegime = effectiveRegimeLabel === entry.expectedRegime;
  if (inExpectedRegime && !tickerConfirms) return { state:'warning', T };
  if (inExpectedRegime && tickerConfirms && (T.dyn?.delta1w ?? 0) > 0) return { state:'strong_confirmation', T };
  if (inExpectedRegime && tickerConfirms) return { state:'partial_confirmation', T };
  if (!inExpectedRegime && tickerConfirms) return { state:'divergence', T };
  return { state:'neutral', T };
}

function evaluateDivergence(entry, rowByTicker, effectiveRegimeLabel, regimeCoherence) {
  switch (entry.type) {
    case 'pair_same_direction':     return evalPairSameDirection(entry, rowByTicker);
    case 'pair_inverse_risk':       return evalPairInverseRisk(entry, rowByTicker);
    case 'group_vs_ticker':         return evalGroupVsTicker(entry, rowByTicker);
    case 'group_vs_regime_leaders': return evalGroupVsRegimeLeaders(entry, rowByTicker, regimeCoherence);
    case 'ticker_vs_regime':        return evalTickerVsRegime(entry, rowByTicker, effectiveRegimeLabel);
    default:                        return { state:'neutral' };
  }
}

const DIVERGENCE_STATE_META = {
  strong_confirmation: { icon:'✓', color:'#1b5e20', bg:'#e8f5e9' },
  partial_confirmation:{ icon:'~', color:'#1565c0', bg:'#e3f2fd' },
  divergence:           { icon:'⚠', color:'#e65100', bg:'#fff3e0' },
  warning:              { icon:'⚡', color:'#b71c1c', bg:'#ffebee' },
  neutral:              { icon:'·', color:'#999',    bg:'#f5f5f5' },
};

// Lenguaje obligatorio (plan sección 4.4): solo "suggests / partial confirmation / not
// confirmed by / warning: ambiguous" — nunca "confirms" sin matiz, "contradicts", "means"
// ni afirmaciones conclusivas. La plantilla es fija por estado; entry.theme la
// particulariza sin introducir vocabulario nuevo. Nota: el ejemplo de la hoja original en
// 4.1 ("Reflation broadly confirmed by...") no sigue su propia regla de 4.4 — aquí se
// siguió la regla explícita, no el ejemplo (mismo criterio que la corrección de Fase 2 al
// ejemplo aritmético de distancia a umbral).
function interpretationFor(entry, result) {
  switch (result.state) {
    case 'strong_confirmation':
      return `Ambos lados confirman con momentum semanal positivo — sugiere confirmación fuerte de: ${entry.theme}.`;
    case 'partial_confirmation':
      return `Ambos lados confirman, el momentum aún no está alineado en los dos — sugiere confirmación parcial de: ${entry.theme}.`;
    case 'divergence':
      return `Un lado muestra señal fuerte y el otro no — no confirmado por la relación completa, respecto a: ${entry.theme}.`;
    case 'warning':
      return `warning: ambiguous — señales muy divergentes en esta relación (${entry.theme}).`;
    default:
      return `Ninguno de los dos lados sugiere fuerza suficiente — sin lectura de rotación para: ${entry.theme}.`;
  }
}

// ── Flujos & Rotación v2 — Fase 5 (refinamientos) ───────────────────────────
// 5.1 Fit gradual — deriva 4 niveles de datos que ya existen (REGIMES[].defaultLeaders,
// effectiveLeaders), sin inventar una tabla de asociación nueva:
//   core:      ticker está en effectiveLeaders (líder activo ahora mismo, post-filtros)
//   secondary: ticker está en la lista estática defaultLeaders del régimen actual, pero
//              un condicional (goldOk/iwmOk/Inflation Overlay) lo excluyó de effectiveLeaders
//   contrary:  ticker es líder estático de OTRO régimen (no del actual) — "activo típico
//              de otro régimen", tal como pide el plan
//   neutral:   no aparece en la lista de líderes de ningún régimen
// No sustituye al booleano `fit` (core === fit === true) — sigue siendo la base de
// Oportunidades/watchlist/Fase 3-4. fitLevel es puramente de display, calculado aparte en
// el useMemo de rows, no en computeTickerRow (que también corre en el snapshot de Fase 1
// y no necesita persistir esto).
function computeFitLevel(ticker, regime, effectiveLeaders) {
  if (effectiveLeaders.includes(ticker)) return 'core';
  if (regime.defaultLeaders.includes(ticker)) return 'secondary';
  const inOtherRegime = REGIMES.some(r => r.label !== regime.label && r.defaultLeaders.includes(ticker));
  if (inOtherRegime) return 'contrary';
  return 'neutral';
}

  secondary: { icon:'◐', color:'#1565c0' },

// 5.2 Balance de subscores — evaluado en el orden literal del plan, primera coincidencia
// gana. 'undetermined' es un fallback no pedido por el plan (mismo criterio que 'neutral'
// en Fase 4): las 7 reglas no son exhaustivas — se documenta en vez de forzar un perfil
// que no encaja.
function computeSubscoreProfile(rot) {
  const A = rot.blockA, B = rot.blockB, C = rot.blockC, score = rot.total;
  if (A >= 2 && B >= 2 && C >= 2) return 'balanced';
  if (A >= 3 && B <= 1 && C <= 1) return 'momentum_only';
  if (A >= 2 && B >= 2 && C < 2)  return 'flow_supported';
  if (C >= 3 && A <= 1 && B <= 1) return 'technical_only';
  if (score >= 6 && B === 0)      return 'fragile_no_flow';
  if (score >= 6 && C === 0)      return 'fragile_no_technical';
  if (C >= 3 && A <= 1)           return 'fragile_pure_technical';
  return 'undetermined';
}

// ── FRED cache + fail log ─────────────────────────────────────────────────
const _CACHE_PFX = 'rotacion_v1_';
const _FAIL_KEY  = 'rotacion_fred_fails';

function _readCache(key) {
  try {
    const raw = localStorage.getItem(_CACHE_PFX + key);
    if (!raw) return null;
    const { d, ts } = JSON.parse(raw);
    return { d, ts, age_h: (Date.now() - ts) / 3600000 };
  } catch { return null; }
}

function _writeCache(key, data) {
  try { localStorage.setItem(_CACHE_PFX + key, JSON.stringify({ d: data, ts: Date.now() })); }
  catch {}
}

function _logFail(key) {
  try {
    const raw = localStorage.getItem(_FAIL_KEY);
    const log = raw ? JSON.parse(raw) : {};
    const e = log[key] ?? { count: 0 };
    log[key] = { count: e.count + 1, last: new Date().toISOString() };
    localStorage.setItem(_FAIL_KEY, JSON.stringify(log));
  } catch {}
}

function printFredFailLog() {
  try {
    const raw = localStorage.getItem(_FAIL_KEY);
    if (!raw) return;
    const log = JSON.parse(raw);
    const rows = Object.entries(log)
      .sort((a, b) => b[1].count - a[1].count)
      .map(([k, v]) => ({ llamada: k, fallos: v.count, ultimo: v.last }));
    if (rows.length) {
      console.group('[rotacion] FRED fail log (acumulado)');
      console.table(rows);
      console.groupEnd();
    }
  } catch {}
}

async function _fetchWithCache(url, cacheKey) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    _writeCache(cacheKey, data);
    return { data, stale: false, age_h: 0 };
  } catch {
    _logFail(cacheKey);
    const c = _readCache(cacheKey);
    return c ? { data: c.d, stale: true, age_h: c.age_h }
             : { data: null, stale: false, age_h: 0 };
  }
}

async function fetchMacro() {
  const out = {};

  // Fetch in parallel with per-call caching
  const [hy, netliq, t10y3m, cfnai, vix, vix9d, vix3m, t5yie, dfii10, termPremium] = await Promise.all([
    _fetchWithCache('/api/fred/BAMLH0A0HYM2',               'hy'),
    _fetchWithCache('/api/fred3?s=WALCL,RRPONTSYD,WTREGEN', 'netliq'),
    _fetchWithCache('/api/fred/T10Y3M',                      'curve'),
    _fetchWithCache('/api/fred/CFNAI?monthly=1',             'cfnai'),
    _fetchWithCache('/api/quote/%5EVIX',                     'vix'),
    _fetchWithCache('/api/quote/%5EVIX9D',                   'vix9d'),
    _fetchWithCache('/api/quote/%5EVIX3M',                   'vix3m'),
    _fetchWithCache('/api/fred/T5YIE',                       't5yie'),
    _fetchWithCache('/api/fred/DFII10',                      'dfii10'),
    _fetchWithCache('/api/fred/THREEFYTP10?monthly=1',       'termPremium'),
  ]);

  // Attaches _stale/_age_h when the value came from localStorage cache
  const withStale = (entry, wr) =>
    wr.stale ? { ...entry, _stale: true, _age_h: wr.age_h } : entry;

  // HY Spread
  const hyD = hy.data;
  out.hy = withStale(hyD?.current != null ? { value: hyD.current } : { value: null }, hy);

  // NetLiq Δ13w (USD billions = divide by 1000 since FRED is in millions)
  const nlD = netliq.data;
  if (nlD?.current != null) {
    const delta13w = nlD.v3m != null
      ? (nlD.current - nlD.v3m) / 1000
      : null;
    out.netliq = withStale({ value: delta13w, raw: nlD.current }, netliq);
  } else {
    out.netliq = withStale({ value: null }, netliq);
  }

  // VolScore = min(vixScore, termScore)
  const vixVal  = vix.data?.price  ?? null;
  const vix9dVal = vix9d.data?.price ?? null;
  const vix3mVal = vix3m.data?.price ?? null;
  let volScore = null;
  if (vixVal != null) {
    const vixScore = vixVal<14?20:vixVal<18?15:vixVal<23?10:vixVal<30?5:0;
    if (vix9dVal != null && vix3mVal != null && vix3mVal > 0) {
      const ratio = vix9dVal / vix3mVal;
      const termScore = ratio<0.85?20:ratio<0.95?15:ratio<1.05?10:ratio<1.15?5:0;
      volScore = Math.min(vixScore, termScore);
    } else {
      volScore = vixScore;
    }
  }
  const volStale = vix.stale || vix9d.stale || vix3m.stale;
  const volAge   = Math.max(vix.age_h, vix9d.age_h, vix3m.age_h);
  out.vol = { value: volScore, vixVal, vix9d: vix9dVal, vix3m: vix3mVal,
    ...(volStale ? { _stale: true, _age_h: volAge } : {}) };

  // Curva 10Y-3M + Δ13w (steepening penalty)
  const t10D = t10y3m.data;
  if (t10D?.current != null) {
    const delta13w = t10D.v3m != null ? t10D.current - t10D.v3m : null;
    out.curve = withStale({ value: t10D.current, delta13w }, t10y3m);
  } else {
    out.curve = withStale({ value: null }, t10y3m);
  }

  // CFNAI
  const cfD = cfnai.data;
  out.cfnai = withStale(cfD?.current != null ? { value: cfD.current } : { value: null }, cfnai);

  // Flag data
  const t5D = t5yie.data;
  const dfD = dfii10.data;
  const tpD = termPremium.data;
  out.t5yie       = withStale(t5D?.current != null ? { value: t5D.current       } : { value: null }, t5yie);
  out.dfii10      = withStale(dfD?.current != null ? { value: dfD.current       } : { value: null }, dfii10);
  out.termPremium = withStale(tpD?.current != null ? { value: tpD.current       } : { value: null }, termPremium);

  return out;
}

// ── Spark — sparkline SVG minimalista (Fase 5.3, mismo patrón que
// sentiment.html/relative.html/duration.html — cada página tiene su propia copia) ──
function Spark({ points, color = '#3a6ca0', height = 34 }) {
  if (!points || points.length < 2) return <span style={{ color:'#aaa', fontSize:10 }}>sin datos</span>;
  const vals = points.filter(v => v != null && Number.isFinite(v));
  if (vals.length < 2) return <span style={{ color:'#aaa', fontSize:10 }}>sin datos</span>;
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  const d = vals.map((v, i) => {
    const x = i / (vals.length - 1) * 100;
    const y = (height - 4) - ((v - min) / span * (height - 8) + 2);
    return `${i ? 'L' : 'M'}${x.toFixed(2)},${y.toFixed(2)}`;
  }).join(' ');
  const areaD = `${d} L100,${height} L0,${height} Z`;
  return (
    <svg viewBox={`0 0 100 ${height}`} preserveAspectRatio="none" style={{ width:'100%', height, display:'block' }}>
      <path d={areaD} fill={color} opacity="0.12" stroke="none" />
      <path d={d} fill="none" stroke={color} strokeWidth="1.6" />
    </svg>
  );
}

    { h:'Score',      key:'rot_score',       tip: "RotationScore 0–10 — mismo cálculo que la tabla ETF principal.\n\nUmbral relajado: ≥ 6 (vs ≥ 8 en el sistema ETF).\n\nScore ≥ 8 → zona óptima\nScore 6–7 → elegible para señal" },
