const CLUSTERS = {
  Growth:        ['XLK','XLC','XLY','QQQ','BTC-USD'],
  ValueCyclical: ['XLF','XLI','XLB','XLE'],
  Defensive:     ['XLP','XLU','XLV','XLRE'],

  SmallEM:       ['IWM','EEM'],
};

function getTickerCluster(ticker) {
  return Object.entries(CLUSTERS).find(([,m]) => m.includes(ticker))?.[0] ?? null;
}

// Condición 1: streak ≥3 | Condición 2: ≥2 del mismo clúster | Condición 3: benchmark
function isEarlyRotation(ticker, candidates, spyAboveSma200, netLiqDeltaB) {
  const entry = candidates?.[ticker];
  if (!entry || entry.streak < 3) return false;
  if (spyAboveSma200 !== true && netLiqDeltaB <= 300) return false;
  const cluster = getTickerCluster(ticker);
  if (!cluster) return false;
  const qualifying = CLUSTERS[cluster].filter(t => {
    const e = candidates[t]; return e && e.streak >= 3;
  });
  return qualifying.length >= 2;
}

function getEarlyRotMeta(ticker, candidates, spyAboveSma200, netLiqDeltaB) {
  const cluster = getTickerCluster(ticker);
  const qualifying = cluster
    ? CLUSTERS[cluster].filter(t => { const e = candidates[t]; return e && e.streak >= 3; })
    : [];
  return {
    streak:        candidates?.[ticker]?.streak ?? 0,
    cluster,
    clusterPeers:  qualifying.filter(t => t !== ticker),
    benchmarkSPY:  spyAboveSma200 === true,
    benchmarkNetLiq: netLiqDeltaB > 300,
    netLiqDeltaB,
  };
}

// ── Helpers ───────────────────────────────────────────────────────────────
function getRegime(score) {
  return REGIMES.find(r => score >= r.min) || REGIMES[REGIMES.length-1];
}

function calcMacroScore(macroData) {
  let absolute = 0, maxPossible = 0;
  for (const it of MACRO_ITEMS) {
    const entry = macroData[it.id];
    if (!entry || entry.value == null) continue;
    maxPossible += it.weight;
    absolute += it.needsDelta
      ? it.score(entry.value, entry.delta13w ?? null)
      : it.score(entry.value);
  }
  const scaled = maxPossible > 0 ? Math.round(absolute * 100 / maxPossible) : 0;
  return { scaled, absolute: Math.round(absolute * 10) / 10, maxPossible };
}

// Returns { total, blockA, blockB, blockC, breakdown, w1Rel, m1Rel, m3Rel }
function calcRotScore(data, spyData) {
  if (!data || !spyData) return { total:0, blockA:0, blockB:0, blockC:0, w1Rel:null, m1Rel:null, m3Rel:null, bd:{} };
  const rs4w  = (data.m1 ?? 0) - (spyData.m1 ?? 0);
  const rs13w = (data.m3 ?? 0) - (spyData.m3 ?? 0);
  const rs1w  = (data.w1 ?? 0) - (spyData.w1 ?? 0);

  const bd = {
    rs13w: rs13w > 2.0,
    rs4w:  rs4w  > 1.0,
    sma200: data.closeAboveSma200 === true,
    cmf:   data.konAzul != null && data.konAzul > 0,
    obv:   data.obvAboveSma50 === true,
    vol:   data.volRatio != null && data.volRatio > 1.10,
    macd:  data.macdBull === true,
    rsi:   data.rsi != null && data.rsi >= 40 && data.rsi <= 70,
    antiExt: data.antiExt === true,
  };

  const blockA = (bd.rs13w ? 2 : 0) + (bd.rs4w ? 1 : 0) + (bd.sma200 ? 1 : 0);
  const blockB = (bd.cmf   ? 1 : 0) + (bd.obv   ? 1 : 0) + (bd.vol    ? 1 : 0);
  const blockC = (bd.macd  ? 1 : 0) + (bd.rsi   ? 1 : 0) + (bd.antiExt? 1 : 0);
  return { total:blockA+blockB+blockC, blockA, blockB, blockC, bd, w1Rel:rs1w, m1Rel:rs4w, m3Rel:rs13w };
}

function toStars(score) {
  if (score >= 9) return 5;
  if (score >= 7) return 4;
  if (score >= 5) return 3;
  if (score >= 3) return 2;
  return 1;
}

function getSignal(rotTotal, fit, flags, spyAboveSma200, isEarlyRot = false) {
  const creditFlag = flags?.CREDIT_COMPLACENCY?.active;
  const emergency  = flags?.EMERGENCY_MODE?.active;
  const buyThreshold = creditFlag ? 8 : 7;

  if (emergency) {
    if (fit && rotTotal >= 6) return { label:'ACUMULAR*',   color:'#33691e', bg:'#f1f8e9', note:'emergencia' };
    return { label:'—', color:'#ccc', bg:'transparent' };
  }

  let level;
  if      (fit && rotTotal >= buyThreshold) level = 'COMPRA';
  else if (fit && rotTotal >= 5)            level = 'ACUMULAR';
  else if (isEarlyRot)                      level = 'ROT. TEMPRANA';
  else if (rotTotal >= 3)                   level = 'VIGILAR';
  else                                      level = null;

  // Master Filter: SPY < SMA200 → degrade 1 nivel
  // ROT. TEMPRANA queda excluida: ya lleva su propio filtro de benchmark (SPY>SMA200 OR NetLiq>300B)
  if (spyAboveSma200 === false && level && level !== 'ROT. TEMPRANA') {
    const downgrade = { 'COMPRA':'ACUMULAR', 'ACUMULAR':'VIGILAR', 'VIGILAR':null };
    level = downgrade[level] ?? null;
  }

  const colors = {
    'COMPRA':         { color:'#1b5e20', bg:'#e8f5e9' },
    'ACUMULAR':       { color:'#33691e', bg:'#f1f8e9' },
    'ROT. TEMPRANA':  { color:'#e65100', bg:'#fff3e0' },
    'VIGILAR':        { color:'#888',    bg:'#f5f5f5' },
  };
  return level ? { label:level, ...colors[level] } : { label:'—', color:'#ccc', bg:'transparent' };
}

// Applies inflation overlay and conditionals to leader list
function getEffectiveLeaders(regime, macroData, flags, quotes) {
  let leaders = [...regime.defaultLeaders];
  const hyBps       = (macroData.hy?.value ?? 999)*100;
  const t10y3m      = macroData.curve?.value ?? 0;
  const curveDelta  = macroData.curve?.delta13w ?? 0;
  const dfii10      = macroData.dfii10?.value ?? 99;
  const dxyM3       = quotes['DX-Y.NYB']?.m3 ?? 0;
  const netLiqDelta = macroData.netliq?.value ?? 0;

  // IWM conditional
  const iwmOk = hyBps < 375 && (t10y3m > 0 || curveDelta > 0);
  if (!iwmOk) leaders = leaders.filter(t => t !== 'IWM');

  // Gold conditional
  const goldOk = dfii10 < 1.0 || dxyM3 < 0;
  if (!goldOk) leaders = leaders.filter(t => t !== 'GC=F');

  // Inflation overlay
  if (flags?.INFLATION_OVERLAY?.active) {
    const durationBlock = netLiqDelta > 300 ? false : true;
    if (durationBlock) leaders = leaders.filter(t => !['TLT','QQQ','XLK'].includes(t));
    if (!['XLE','XLB','GC=F','SI=F'].every(t => leaders.includes(t))) {
      ['XLE','XLB','GC=F','SI=F'].forEach(t => { if (!leaders.includes(t)) leaders.push(t); });
    }
  }

  return leaders;
}

function updateStateFromData(prev, macroScore, macroData, rawRegime, vixVal, rotScores) {
  const s = JSON.parse(JSON.stringify(prev || DEFAULT_STATE));
  const now = new Date().toISOString().slice(0,10);

  // Emergency Mode: VIX ≥ 35
  if (vixVal >= 35) {
    if (!s.flags.EMERGENCY_MODE.active) {
      const exp = new Date(); exp.setDate(exp.getDate()+14);
      s.flags.EMERGENCY_MODE = { active:true, activated_at:now, expires_date:exp.toISOString().slice(0,10) };
    }
  }
  if (s.flags.EMERGENCY_MODE.active && s.flags.EMERGENCY_MODE.expires_date) {
    if (new Date(s.flags.EMERGENCY_MODE.expires_date) <= new Date()) {
      s.flags.EMERGENCY_MODE.active = false;
    }
  }

  // Histéresis: régimen solo cambia cuando cruza >5 pts Y persiste ≥2 lecturas
  if (!s.current_regime) {
    s.current_regime = rawRegime.label;
    s.regime_entered_date = now;
    s.pending_regime = null;
    s.pending_since_count = 0;
  } else {
    const cur = REGIMES.find(r => r.label === s.current_regime);
    const curIdx = cur ? REGIMES.indexOf(cur) : -1;
    const upperBound = curIdx > 0 ? REGIMES[curIdx - 1].min : 101;
    const inRange = cur && macroScore >= cur.min && macroScore < upperBound;
    if (!inRange) {
      // Medir cruce contra el borde correcto:
      // ascendente (score >= upperBound) → distancia al borde superior
      // descendente (score < cur.min)    → distancia al borde inferior
      let diff = 0;
      if (cur) {
        diff = macroScore >= upperBound
          ? macroScore - upperBound
          : cur.min - macroScore;
      } else {
        diff = 999;
      }
      if (rawRegime.label !== s.pending_regime) {
        s.pending_regime = rawRegime.label;
        s.pending_since_count = 1;
      } else {
        s.pending_since_count = (s.pending_since_count||0)+1;
      }
      if (diff >= 5 && s.pending_since_count >= 2) {
        s.current_regime = rawRegime.label;
        s.regime_entered_date = now;
        s.pending_regime = null;
        s.pending_since_count = 0;
      }
    } else {
      s.pending_regime = null;
      s.pending_since_count = 0;
    }
  }

  // CREDIT_COMPLACENCY: HY < 275 bps ≥ 8 semanas
  const hyBps = (macroData.hy?.value ?? 999)*100;
  if (hyBps < 275) {
    s.flags.CREDIT_COMPLACENCY.streak_weeks = (s.flags.CREDIT_COMPLACENCY.streak_weeks||0)+1;
    s.flags.CREDIT_COMPLACENCY.active = s.flags.CREDIT_COMPLACENCY.streak_weeks >= 8;
  } else {
    s.flags.CREDIT_COMPLACENCY.streak_weeks = 0;
    s.flags.CREDIT_COMPLACENCY.active = false;
  }

  // INFLATION_OVERLAY: T5YIE ≥ 2.8% ≥ 4 semanas
  const t5yie = macroData.t5yie?.value ?? 0;
  if (t5yie >= 2.8) {
    s.flags.INFLATION_OVERLAY.streak_weeks = (s.flags.INFLATION_OVERLAY.streak_weeks||0)+1;
    s.flags.INFLATION_OVERLAY.active = s.flags.INFLATION_OVERLAY.streak_weeks >= 4;
  } else {
    s.flags.INFLATION_OVERLAY.streak_weeks = 0;
    s.flags.INFLATION_OVERLAY.active = false;
  }

  // TERM_PREMIUM_EXTREME: THREEFYTP10 < -0.75 ≥ 13 semanas
  const tp10 = macroData.termPremium?.value ?? 99;
  if (tp10 < -0.75) {
    s.flags.TERM_PREMIUM_EXTREME.streak_weeks = (s.flags.TERM_PREMIUM_EXTREME.streak_weeks||0)+1;
    s.flags.TERM_PREMIUM_EXTREME.active = s.flags.TERM_PREMIUM_EXTREME.streak_weeks >= 13;
  } else {
    s.flags.TERM_PREMIUM_EXTREME.streak_weeks = 0;
    s.flags.TERM_PREMIUM_EXTREME.active = false;
  }

  // Early rotation streaks: incrementar solo una vez por día (protección multi-refresh)
  // Cada entry guarda last_updated_date; si ya se actualizó hoy, se omite el incremento.
  if (rotScores) {
    for (const [ticker, score] of Object.entries(rotScores)) {
      const entry = s.early_rotation_candidates[ticker] || { streak: 0, last_score: null, last_updated_date: null };
      if (entry.last_updated_date !== now) {
        // Primera actualización del día: incrementar o resetear streak
        entry.streak = score >= 8 ? (entry.streak || 0) + 1 : 0;
        entry.last_updated_date = now;
      }
      // Si ya se actualizó hoy, solo refrescar last_score (sin tocar streak)
      entry.last_score = score;
      s.early_rotation_candidates[ticker] = entry;
    }
  }

  return s;
}

// ── FRED cache + fail log ─────────────────────────────────────────────────
const _CACHE_PFX = 'rotacion_v1_';
const _FAIL_KEY  = 'rotacion_fred_fails';

function _readCache(key) {
  try {
    const raw = localStorage.getItem(_CACHE_PFX + key);
    if (!raw) return null;
    const { d, ts } = JSON.parse(raw);
    return { d, ts, age_h: (Date.now() - ts) / 3600000 };
  } catch { return null; }
}

function _writeCache(key, data) {
  try { localStorage.setItem(_CACHE_PFX + key, JSON.stringify({ d: data, ts: Date.now() })); }
  catch {}
}

function _logFail(key) {
  try {
    const raw = localStorage.getItem(_FAIL_KEY);
    const log = raw ? JSON.parse(raw) : {};
    const e = log[key] ?? { count: 0 };
    log[key] = { count: e.count + 1, last: new Date().toISOString() };
    localStorage.setItem(_FAIL_KEY, JSON.stringify(log));
  } catch {}
}

function printFredFailLog() {
  try {
    const raw = localStorage.getItem(_FAIL_KEY);
    if (!raw) return;
    const log = JSON.parse(raw);
    const rows = Object.entries(log)
      .sort((a, b) => b[1].count - a[1].count)
      .map(([k, v]) => ({ llamada: k, fallos: v.count, ultimo: v.last }));
    if (rows.length) {
      console.group('[rotacion] FRED fail log (acumulado)');
      console.table(rows);
      console.groupEnd();
    }
  } catch {}
}

async function _fetchWithCache(url, cacheKey) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    _writeCache(cacheKey, data);
    return { data, stale: false, age_h: 0 };
  } catch {
    _logFail(cacheKey);
    const c = _readCache(cacheKey);
    return c ? { data: c.d, stale: true, age_h: c.age_h }
             : { data: null, stale: false, age_h: 0 };
  }
}

async function fetchMacro() {
  const out = {};

  // Fetch in parallel with per-call caching
  const [hy, netliq, t10y3m, cfnai, vix, vix9d, vix3m, t5yie, dfii10, termPremium] = await Promise.all([
    _fetchWithCache('/api/fred/BAMLH0A0HYM2',               'hy'),
    _fetchWithCache('/api/fred3?s=WALCL,RRPONTSYD,WTREGEN', 'netliq'),
    _fetchWithCache('/api/fred/T10Y3M',                      'curve'),
    _fetchWithCache('/api/fred/CFNAI?monthly=1',             'cfnai'),
    _fetchWithCache('/api/quote/%5EVIX',                     'vix'),
    _fetchWithCache('/api/quote/%5EVIX9D',                   'vix9d'),
    _fetchWithCache('/api/quote/%5EVIX3M',                   'vix3m'),
    _fetchWithCache('/api/fred/T5YIE',                       't5yie'),
    _fetchWithCache('/api/fred/DFII10',                      'dfii10'),
    _fetchWithCache('/api/fred/THREEFYTP10?monthly=1',       'termPremium'),
  ]);

  // Attaches _stale/_age_h when the value came from localStorage cache
  const withStale = (entry, wr) =>
    wr.stale ? { ...entry, _stale: true, _age_h: wr.age_h } : entry;

  // HY Spread
  const hyD = hy.data;
  out.hy = withStale(hyD?.current != null ? { value: hyD.current } : { value: null }, hy);

  // NetLiq Δ13w (USD billions = divide by 1000 since FRED is in millions)
  const nlD = netliq.data;
  if (nlD?.current != null) {
    const delta13w = nlD.v13w != null
      ? (nlD.current - nlD.v13w) / 1000
      : null;
    out.netliq = withStale({ value: delta13w, raw: nlD.current }, netliq);
  } else {
    out.netliq = withStale({ value: null }, netliq);
  }

  // VolScore = min(vixScore, termScore)
  const vixVal  = vix.data?.price  ?? null;
  const vix9dVal = vix9d.data?.price ?? null;
  const vix3mVal = vix3m.data?.price ?? null;
  let volScore = null;
  if (vixVal != null) {
    const vixScore = vixVal<14?20:vixVal<18?15:vixVal<23?10:vixVal<30?5:0;
    if (vix9dVal != null && vix3mVal != null && vix3mVal > 0) {
      const ratio = vix9dVal / vix3mVal;
      const termScore = ratio<0.85?20:ratio<0.95?15:ratio<1.05?10:ratio<1.15?5:0;
      volScore = Math.min(vixScore, termScore);
    } else {
      volScore = vixScore;
    }
  }
  const volStale = vix.stale || vix9d.stale || vix3m.stale;
  const volAge   = Math.max(vix.age_h, vix9d.age_h, vix3m.age_h);
  out.vol = { value: volScore, vixVal, vix9d: vix9dVal, vix3m: vix3mVal,
    ...(volStale ? { _stale: true, _age_h: volAge } : {}) };

  // Curva 10Y-3M + Δ13w (steepening penalty)
  const t10D = t10y3m.data;
  if (t10D?.current != null) {
    const delta13w = t10D.v3m != null ? t10D.current - t10D.v3m : null;
    out.curve = withStale({ value: t10D.current, delta13w }, t10y3m);
  } else {
    out.curve = withStale({ value: null }, t10y3m);
  }

  // CFNAI
  const cfD = cfnai.data;
  out.cfnai = withStale(cfD?.current != null ? { value: cfD.current } : { value: null }, cfnai);

  // Flag data
  const t5D = t5yie.data;
  const dfD = dfii10.data;
  const tpD = termPremium.data;
  out.t5yie       = withStale(t5D?.current != null ? { value: t5D.current       } : { value: null }, t5yie);
  out.dfii10      = withStale(dfD?.current != null ? { value: dfD.current       } : { value: null }, dfii10);
  out.termPremium = withStale(tpD?.current != null ? { value: tpD.current       } : { value: null }, termPremium);

  return out;
}

}

// ── App ───────────────────────────────────────────────────────────────────
function App() {
  const [macro,    setMacro]    = useState({});
  const [quotes,   setQuotes]   = useState({});
  const [appState, setAppState] = useState(DEFAULT_STATE);
  const [loading,  setLoading]  = useState(true);
  const [done,     setDone]     = useState(0);
  const [updated,  setUpdated]  = useState(null);
  const [sortCol,        setSortCol]        = useState('rot');
  const [sortDir,        setSortDir]        = useState(-1);
  const [toast,          setToast]          = useState(null);
  const [stockCandidates,setStockCandidates]= useState(null);

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(null), 3000); };

  const load = useCallback(async () => {
    setLoading(true); setDone(0);

    const [stateData, macroData, spyData, dxyData, stockData] = await Promise.all([
      fetch('/api/state').then(r=>r.json()).catch(()=>DEFAULT_STATE),
      fetchMacro(),
      fetchQ('SPY'),
      fetchQ('DX-Y.NYB'),
      fetch('/api/stock-candidates').then(r=>r.json()).catch(()=>null),
    ]);
    setStockCandidates(stockData);

    setMacro(macroData);
    const q = { SPY: spyData, 'DX-Y.NYB': dxyData };
    setDone(2);

    const rest = UNIVERSE.filter(a => a.ticker !== 'SPY');
    for (let i = 0; i < rest.length; i += 5) {
      const batch   = rest.slice(i, i+5);
      const results = await Promise.all(batch.map(a => fetchQ(a.ticker)));
      batch.forEach((a,j) => { q[a.ticker] = results[j]; });
      setDone(prev => prev + batch.length);
    }

    setQuotes({...q});

    // Compute score + update state
    const { scaled: rawScore } = calcMacroScore(macroData);
    const rawRegime = getRegime(rawScore);
    const vixVal = macroData.vol?.vixVal ?? 0;

    // Calcular RotScores de todos los activos para actualizar streaks de rotación
    const spyForRot = q['SPY'];
    const rotScores = {};
    UNIVERSE.forEach(a => {
      if (a.ticker !== 'SPY') {
        rotScores[a.ticker] = q[a.ticker] && spyForRot
          ? calcRotScore(q[a.ticker], spyForRot).total
          : 0;
      }
    });

    const newState = updateStateFromData(stateData, rawScore, macroData, rawRegime, vixVal, rotScores);
    setAppState(newState);
    fetch('/api/state', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(newState) }).catch(()=>{});

    setUpdated(new Date());
    setLoading(false);
    printFredFailLog();
  }, []);

  useEffect(() => { load(); }, [load]);

  const macroScoreResult = useMemo(() => calcMacroScore(macro), [macro]);
  const { scaled: macroScore, maxPossible: macroMaxPossible } = macroScoreResult;
  const staleSources = useMemo(
    () => MACRO_ITEMS.filter(it => macro[it.id]?._stale).map(it => it.label),
    [macro]
  );
  const rawRegime        = useMemo(() => getRegime(macroScore), [macroScore]);

  // Effective regime: histéresis + term premium degradation
  const effectiveRegime = useMemo(() => {
    const label = appState.current_regime || rawRegime.label;
    let r = REGIMES.find(x => x.label === label) || rawRegime;
    if (appState.flags?.TERM_PREMIUM_EXTREME?.active) {
      const idx = REGIMES.indexOf(r);
      r = REGIMES[Math.min(idx+1, REGIMES.length-1)];
    }
    return r;
  }, [appState, rawRegime]);

  const effectiveLeaders = useMemo(() =>
    getEffectiveLeaders(effectiveRegime, macro, appState.flags, quotes),
    [effectiveRegime, macro, appState.flags, quotes]);

  const spyAboveSma200 = useMemo(() => quotes['SPY']?.closeAboveSma200 ?? null, [quotes]);

  const rows = useMemo(() => {
    const spy = quotes['SPY'];
    const netLiqDeltaB = macro.netliq?.value ?? 0;
    const candidates   = appState.early_rotation_candidates;
    return UNIVERSE.map(a => {
      const d   = quotes[a.ticker];
      const rot = a.ticker === 'SPY' ? { total:0, blockA:0, blockB:0, blockC:0, w1Rel:null, m1Rel:null, m3Rel:null, bd:{} } : calcRotScore(d, spy);
      const fit = effectiveLeaders.includes(a.ticker);
      const earlyRot = a.ticker !== 'SPY' && !fit
        ? isEarlyRotation(a.ticker, candidates, spyAboveSma200, netLiqDeltaB)
        : false;
      const earlyRotMeta = earlyRot
        ? getEarlyRotMeta(a.ticker, candidates, spyAboveSma200, netLiqDeltaB)
        : null;
      const sig = a.ticker === 'SPY' ? { label:'ref', color:'#aaa', bg:'transparent' } : getSignal(rot.total, fit, appState.flags, spyAboveSma200, earlyRot);
      return { ...a, d, rot, fit, sig, earlyRot, earlyRotMeta };  // sin `extended`: eliminado (pendiente Fase 4)
    });
  }, [quotes, effectiveLeaders, appState.flags, appState.early_rotation_candidates, spyAboveSma200, macro]);

  const sorted = useMemo(() => [...rows].sort((a,b) => {
    let va=0, vb=0;
    if (sortCol==='rot')  { va=a.rot.total;       vb=b.rot.total; }
    if (sortCol==='w1')   { va=a.rot.w1Rel??-99;  vb=b.rot.w1Rel??-99; }
    if (sortCol==='m1')   { va=a.rot.m1Rel??-99;  vb=b.rot.m1Rel??-99; }
    if (sortCol==='rsi')  { va=a.d?.rsi??-1;      vb=b.d?.rsi??-1; }
    return sortDir*(vb-va);
  }), [rows, sortCol, sortDir]);

  const opps = useMemo(() =>
    rows.filter(r => r.fit && r.rot.total >= 5 && r.ticker !== 'SPY' && !['—'].includes(r.sig.label))
        .sort((a,b) => b.rot.total - a.rot.total).slice(0,6),
    [rows]);

  const early = useMemo(() =>
    rows.filter(r => r.sig.label === 'ROT. TEMPRANA' && r.ticker !== 'SPY')
        .sort((a,b) => b.rot.total - a.rot.total).slice(0,4),
    [rows]);

  const activeFlags = useMemo(() =>
    Object.entries(appState.flags||{}).filter(([,v]) => v.active),
    [appState.flags]);

  function Th({ col, label, tip }) {
    return (
      <th onClick={() => sortCol===col ? setSortDir(d=>-d) : (setSortCol(col),setSortDir(-1))}
          title={tip}
          style={{ ...TH_S, cursor:'pointer', background:sortCol===col?'#e8f0fe':'#f8f9fa' }}>
        {label} {sortCol===col?(sortDir<0?'▼':'▲'):''}
      </th>
    );
  }

  const loadPct = Math.round((done / (UNIVERSE.length+1)) * 100);

  // Checks panel
  const checks = [
    { label:'Score ≥ 60',        ok: macroScore >= 60,                                     val:`${macroScore}/100` },
    { label:'VIX < 23',          ok: (macro.vol?.vixVal??99) < 23,                         val: macro.vol?.vixVal?.toFixed(1)??'—' },
    { label:'HY < 475 bps',      ok: macro.hy?.value!=null && macro.hy.value*100 < 475,    val: macro.hy?.value ? Math.round(macro.hy.value*100)+' bps' : '—' },
    { label:'Curva > –25 bps',   ok: macro.curve?.value!=null && macro.curve.value > -0.25,val: macro.curve?.value!=null ? Math.round(macro.curve.value*100)+' bps' : '—' },
    { label:'CFNAI > –0.35',     ok: (macro.cfnai?.value??-99) > -0.35,                    val: macro.cfnai?.value?.toFixed(2)??'—' },
    { label:'SPY > SMA200',      ok: spyAboveSma200 === true,                              val: spyAboveSma200===true?'✓':spyAboveSma200===false?'✗':'—' },
  ];

  // ── Markdown builders ──────────────────────────────────────────────────
  const buildMD = useCallback(() => {
    const date = new Date().toLocaleString('es-ES',{dateStyle:'full',timeStyle:'short'});
    let md = `# Flujos & Rotación v2 — Snapshot\n**Fecha:** ${date}\n\n`;

    md += `## RÉGIMEN\n**MacroScore:** ${macroScore}/100${macroMaxPossible < 100 ? ` ⚠ (reescalado, ${macroMaxPossible}/100 disponible)` : ''} — **${effectiveRegime.label}**\n`;
    if (appState.pending_regime) md += `_Transición pendiente → ${appState.pending_regime} (${appState.pending_since_count}/2 lecturas)_\n`;
    md += `_${effectiveRegime.desc}_\n`;
    md += `Líderes efectivos: ${effectiveLeaders.join(', ')}\n\n`;

    if (activeFlags.length) {
      md += `## FLAGS ACTIVOS\n`;
      activeFlags.forEach(([id,v]) => { md += `- **${id}** (${v.streak_weeks||0}w)\n`; });
      md += '\n';
    }

    md += `## INDICADORES MACRO\n| Indicador | Valor | Status | Score |\n|-----------|-------|--------|-------|\n`;
    MACRO_ITEMS.forEach(it => {
      const v = macro[it.id]?.value;
      const pts = v!=null?(it.needsDelta?it.score(v,macro[it.id]?.delta13w):it.score(v)):null;
      md += `| ${it.label} (/${it.weight}) | ${v!=null?it.fmt(v):'—'} | ${v!=null?it.status(v):'—'} | ${pts==null?'—':pts%1===0?pts:pts.toFixed(1)} |\n`;
    });
    md += `\n_DFII10: ${macro.dfii10?.value?.toFixed(2)??'—'}% · T5YIE: ${macro.t5yie?.value?.toFixed(2)??'—'}% · Term Premium: ${macro.termPremium?.value?.toFixed(3)??'—'}_\n\n`;

    md += `## CONDICIONES PROTOCOLO\n`;
    checks.forEach(c => { md += `- ${c.ok?'✅':'❌'} ${c.label}: ${c.val}\n`; });
    md += '\n';

    if (opps.length) {
      md += `## OPORTUNIDADES\n| Ticker | Score | A/B/C | 1W vs SPY | RSI | MACD | OBV | Señal |\n|--------|------:|-------|----------:|----:|:----:|:---:|-------|\n`;
      opps.forEach(r => {
        const d=r.d, rot=r.rot;
        md += `| ${r.ticker} | ${rot.total}/10 | ${rot.blockA}/${rot.blockB}/${rot.blockC} | ${relFmt(rot.w1Rel)} | ${d?.rsi??'—'} | ${d?.macdBull!=null?(d.macdBull?'▲':'▼'):'—'} | ${d?.obvAboveSma50!=null?(d.obvAboveSma50?'↑':'↓'):'—'} | ${r.sig.label} |\n`;
      });
      md += '\n';
    }

    md += `## ROTACIÓN COMPLETA\n| Ticker | Cat. | 1W vs SPY | RS13w | Score | A/B/C | Fit | Señal |\n|--------|------|----------:|------:|------:|-------|:---:|-------|\n`;
    sorted.forEach(r => {
      if (r.ticker==='SPY') return;
      md += `| ${r.ticker} | ${r.cat} | ${relFmt(r.rot.w1Rel)} | ${relFmt(r.rot.m3Rel)} | ${r.rot.total}/10 | ${r.rot.blockA}/${r.rot.blockB}/${r.rot.blockC} | ${r.fit?'✓':'○'} | ${r.sig.label} |\n`;
    });

6 pts ✓, confirma tras 2 semanas.\n\n**Modificador Term Premium:** si THREEFYTP10 < −0.75 durante ≥13 semanas → degradar régimen 1 nivel.\n\n---\n\n## 3. ROTATION SCORE (0–10)\n\n### Bloque A — Momentum/RS (4 pts)\n- RS 13w vs SPY > +2.0% → 2 pts\n- RS 4w vs SPY > +1.0% → 1 pt\n- Close > SMA200 → 1 pt\n\n### Bloque B — Flujo/Volumen (3 pts)\n- CMF(20) > 0 (Koncorde Azul) → 1 pt\n- OBV > SMA50(OBV) → 1 pt\n- Vol20d / Vol60d > 1.10 → 1 pt\n\n### Bloque C — Momentum técnico (3 pts)\n- MACD histograma > 0 → 1 pt\n- RSI(14) entre 40 y 70 → 1 pt\n- Anti-extensión: Close > SMA20 AND (Close−SMA20)/ATR(14) < 1.5 → 1 pt\n\n---\n\n## 4. SEÑALES\n\n| Señal | Condición |\n|-------|----------|\n| COMPRA | Fit régimen + Score ≥ 7 (≥8 si CREDIT_COMPLACENCY activo) |\n| ACUMULAR | Fit régimen + Score 5–6 |\n| ACUMULAR* | EMERGENCY_MODE activo + Fit Risk-OFF + Score ≥ 6 (acumular defensivos en caída) |\n| ROT. TEMPRANA | Ver §4.1 — tres condiciones obligatorias |\n| VIGILAR | Score 3–4 |\n\n**Master Filter:** si SPY < SMA200 → degradar COMPRA/ACUMULAR/VIGILAR un nivel. ROT. TEMPRANA NO se degrada (tiene su propio filtro de benchmark).\n\n**EMERGENCY_MODE:** si VIX ≥ 35 → todas las señales suprimidas excepto ACUMULAR* para defensivos de Risk-OFF. Duración mínima 14 días.\n\n### §4.1 ROT. TEMPRANA — tres condiciones obligatorias\nSe emite solo si se cumplen las tres a la vez:\n1. **Persistencia individual:** RotScore ≥ 8/10 durante ≥3 lecturas semanales consecutivas\n2. **Clúster categorial:** ≥2 activos del mismo clúster con streak ≥3 simultáneamente\n3. **Filtro benchmark:** SPY > SMA200 OR Δ13w NetLiq > +300B\n\nClústeres definidos:\n| Clúster | Activos |\n|---------|----------|\n| Growth | XLK, XLC, XLY, QQQ, BTC-USD |\n| ValueCyclical | XLF, XLI, XLB, XLE |\n| Defensive | XLP, XLU, XLV, XLRE |\n| Duration | TLT (un solo miembro → nunca dispara, intencional) |\n| Commodities | GC=F, SI=F, BZ=F |\n| SmallEM | IWM, EEM |\n\nNota: si fit con régimen actual, la señal estándar (COMPRA/ACUMULAR) tiene prioridad sobre ROT. TEMPRANA.\n\n---\n\n## 5. LÍDERES CONDICIONALES\n- **IWM** solo si HY Spread < 375 bps AND (Curva > 0 OR Δ13w Curva > 0)\n- **GC=F (Oro)** solo si DFII10 < 1.0% OR DXY en tendencia bajista 3M\n- **INFLATION_OVERLAY** (T5YIE ≥ 2.8% × 4 semanas): TLT/QQQ/XLK pierden fit (salvo Net Liq Δ13w > 300B); XLE/XLB/GC=F/SI=F se promueven como líderes\n\n---\n\n## 6. FLAGS GLOBALES\n| Flag | Activación | Desactivación | Efecto |\n|------|-----------|---------------|--------|\n| CREDIT_COMPLACENCY | HY < 275 bps × 8 semanas | Un periodo HY ≥ 275 → reset streak | Elevar umbral COMPRA a ≥8/10 |\n| INFLATION_OVERLAY | T5YIE ≥ 2.8% × 4 semanas | Un periodo T5YIE < 2.8% → reset streak | Ajustar líderes (ver §5) |\n| TERM_PREMIUM_EXTREME | THREEFYTP10 < −0.75 × 13 semanas | Un periodo ≥ −0.75 → reset streak | Degradar régimen 1 nivel |\n| EMERGENCY_MODE | VIX ≥ 35 (inmediato) | Expiración 14 días desde activación | Suprimir señales; solo ACUMULAR* defensivos |\n`;

                    <span style={{ background:r.sig.bg, color:r.sig.color, borderRadius:4, padding:'2px 6px', fontSize:10, fontWeight:700, whiteSpace:'nowrap' }}>
                      {r.sig.label}
                    </span>:<span style={{ color:'#ddd' }}>—</span>}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>

      <StockCandidates data={stockCandidates} />

      {/* Footer */}
      <div style={{ marginTop:16, background:'#f8f9fa', border:'1px solid #e0e0e0', borderRadius:8, padding:'10px 14px' }}>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:10, fontSize:11 }}>
          <div>
            <b style={{ color:'#333' }}>MacroScore /100</b><br/>
            <span style={{ color:'#666', lineHeight:1.8 }}>HY/25 · Net Liq Δ13w/25 · VolScore/20 · Curva/15 · CFNAI/15</span>
          </div>
          <div>
            <b style={{ color:'#333' }}>Rotation Score /10</b><br/>
            <span style={{ color:'#666', lineHeight:1.8 }}>A(4): RS13w+RS4w+SMA200 · B(3): CMF+OBV+Vol · C(3): MACD+RSI+AntiExt</span>
          </div>
          <div>
            <b style={{ color:'#333' }}>Señales</b><br/>
            <span style={{ color:'#666', lineHeight:1.8 }}>COMPRA: Fit+≥7 · ACUMULAR: Fit+5-6 · ROT.TEMP: streak≥3+clúster+benchmark · Master Filter: SPY{'<'}SMA200→-1 nivel (no degrada ROT.TEMP)</span>
          </div>
        </div>
      </div>

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
