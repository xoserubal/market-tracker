    { h:'Beta 52w',   key:'beta_52w',        tip: "Beta calculada sobre retornos semanales — últimas 52 semanas vs SPY.\n\nBeta = Cov(ticker, SPY) / Var(SPY)\n\n> 1.8 = muy alta (rojo)\n> 1.3 = alta (naranja)\n\nActúa como multiplicador del movimiento del sector ETF." },
    { h:'Amplifier',  key:'amplifier_score', tip: "Amplifier = Beta 52w × RotationScore\n\nEstima el potencial de amplificación relativo al cluster ETF. Una acción con Beta 2.0 y Score 8 tiene Amplifier 16.\n\n> 12 = muy alto (rojo)\n8–12 = alto (naranja)\n\nMayor Amplifier → mayor potencial de retorno y mayor riesgo." },
    { h:'4w vs SPY',  key:'ret_4w_vs_spy',   tip: "Retorno 4 semanas de la acción menos retorno 4w de SPY.\n\nPositivo = outperformance reciente." },
    { h:'13w vs SPY', key:'ret_13w_vs_spy',  tip: "Retorno 13 semanas de la acción menos retorno 13w de SPY.\n\nHorizonte trimestral: evalúa si la tendencia relativa es sostenida." },
    { h:'RS Mom',     key:'rs_momentum',     tip: "Mejora del diferencial RS vs SPY en las últimas 4 semanas.\n\nRS Mom = (ret_4w_vs_spy hoy) − (ret_4w_vs_spy hace 4w)\n\nPositivo → RS construyendo aunque el precio esté lateral = acumulación en relativo.\nNegativo → RS deteriorándose." },
    { h:'ATR%',       key:'atr_pct_rank',    tip: "Percentil del ATR% (ATR14/precio×100) actual respecto a los últimos 252 días.\n\n< 25 = volatilidad muy contraída (squeeze) → posible pre-breakout\n25–50 = rango normal-bajo\n> 50 = volatilidad expansiva\n\nBuscar valor bajo combinado con precio cerca del máximo 52w." },
    { h:'Dist 52h',   key:'dist_52w_high',   tip: "Distancia del precio actual al máximo de las últimas 52 semanas (%).\n\nCerca de 0% = precio rozando máximos anuales → zona de breakout potencial\n< −5% = bastante cerca\n< −15% = aún lejos" },
    { h:'Nota',       key:'note',            tip: "Comentario libre del YAML (motivo de inclusión del ticker en la lista)." },
  ];
  // Ranking local de Señal para esta tabla — vocabulario propio (CANDIDATO/
  // EN_RADAR/VIGILAR/IGNORAR), distinto del SIGNAL_RANK de la tabla ETF
  // principal (COMPRA/ACUMULAR/...), no reutilizable entre ambos.
  const SC_SIGNAL_RANK = { CANDIDATO:3, EN_RADAR:2, VIGILAR:1, IGNORAR:0 };
  const scSortValue = (c, key) => key === 'signal' ? (SC_SIGNAL_RANK[c.signal] ?? -1) : c[key];
  const scCompare = (a, b, key, dir) => {
    const va = scSortValue(a, key), vb = scSortValue(b, key);
    const aEmpty = va == null || va === '';
    const bEmpty = vb == null || vb === '';
    if (aEmpty && bEmpty) return 0;
    if (aEmpty) return 1;   // sin dato siempre al final, en cualquier dirección
    if (bEmpty) return -1;
    if (typeof va === 'string') return dir === -1 ? va.localeCompare(vb) : vb.localeCompare(va);
    return dir * (vb - va); // mismo convenio numérico que Th() en la tabla "Mapa de Rotación"
  };
  const sortCandidates = list => scSortCol ? [...list].sort((a,b) => scCompare(a, b, scSortCol, scSortDir)) : list;
  const handleScSort = key => scSortCol === key ? setScSortDir(d => -d) : (setScSortCol(key), setScSortDir(-1));
  const THead = () => (
    <thead>
      <tr style={{ background:'#f8f9fa' }}>
        {SC_COLS.map(({ h, tip, key }) =>
          <ThTip key={h} tip={tip}
            style={{ ...SC_TH, cursor:'pointer', background: scSortCol===key ? '#e8f0fe' : SC_TH.background }}
            onClick={() => handleScSort(key)}>
            {h} {scSortCol===key ? (scSortDir<0?'▼':'▲') : ''}
          </ThTip>
        )}
      </tr>
    </thead>
  );

  const TRow = ({ c }) => {
    const st  = sigStyle[c.signal] || sigStyle.VIGILAR;
    const amp = c.amplifier_score;
    return (
      <tr style={{ borderBottom:'1px solid #f0f0f0' }}>
        <td style={{ padding:'5px 10px', fontWeight:700, color:'#222' }}>{c.ticker}</td>
        <td style={{ padding:'5px 10px', color:'#666', fontSize:11 }}>
          {c.cluster}
          {c.rotation_cluster_type === 'subtheme_cluster' && (
            <span title={`ROT.TEMPRANA por inflexión — subtheme_cluster: ${c.rotation_cluster_name}`}
              style={{ marginLeft:5, fontSize:9, background:'#f3e5f5', color:'#7b1fa2', borderRadius:8, padding:'1px 6px', fontWeight:700 }}>
              ⚡ {c.rotation_cluster_name}
            </span>
          )}
        </td>
        <td style={{ padding:'5px 10px' }}>
          <span style={{ background:st.bg, color:st.color, borderRadius:4, padding:'2px 7px', fontWeight:700, fontSize:11, whiteSpace:'nowrap' }}>
            {c.cluster_has_confirmed_rotation ? '⚡ ' : ''}{c.signal}
          </span>
        </td>
        <td style={{ padding:'5px 10px', textAlign:'center', fontWeight:700,
          color: c.rot_score >= 8 ? '#1b5e20' : c.rot_score >= 6 ? '#e65100' : '#aaa' }}>{c.rot_score}</td>
        <td style={{ padding:'5px 10px', textAlign:'center', color:'#555' }}>{c.streak_weeks}w</td>
        <td style={{ padding:'5px 10px', textAlign:'center', fontWeight:(c.beta_52w??0)>=1.5?700:400,
          color:(c.beta_52w??0)>=1.8?'#c62828':(c.beta_52w??0)>=1.3?'#e65100':'#333' }}>{c.beta_52w??'—'}</td>
        <td style={{ padding:'5px 10px', textAlign:'center', fontWeight:600,
          color:(amp??0)>=12?'#c62828':(amp??0)>=8?'#e65100':'#555' }}>{amp!=null?amp.toFixed(1):'—'}</td>
        <td style={{ padding:'5px 10px', textAlign:'center', color:relColor(c.ret_4w_vs_spy)  }}>{fmtRel(c.ret_4w_vs_spy)}</td>
        <td style={{ padding:'5px 10px', textAlign:'center', color:relColor(c.ret_13w_vs_spy) }}>{fmtRel(c.ret_13w_vs_spy)}</td>
        <td style={{ padding:'5px 10px', textAlign:'center',
          color: c.rs_momentum == null ? '#aaa' : c.rs_momentum > 0 ? '#1b5e20' : '#c62828' }}>
          {c.rs_momentum == null ? '—' : (c.rs_momentum > 0 ? '+' : '') + c.rs_momentum.toFixed(1)}
        </td>
        <td style={{ padding:'5px 10px', textAlign:'center',
          color: c.atr_pct_rank == null ? '#aaa' : c.atr_pct_rank < 25 ? '#1b5e20' : c.atr_pct_rank < 50 ? '#e65100' : '#888' }}>
          {c.atr_pct_rank == null ? '—' : c.atr_pct_rank.toFixed(0) + '%'}
        </td>
        <td style={{ padding:'5px 10px', textAlign:'center',
          color: c.dist_52w_high == null ? '#aaa' : c.dist_52w_high > -5 ? '#1b5e20' : c.dist_52w_high > -15 ? '#e65100' : '#888' }}>
          {c.dist_52w_high == null ? '—' : c.dist_52w_high.toFixed(1) + '%'}
        </td>
        <td style={{ padding:'5px 10px', color:'#999', fontSize:11, maxWidth:200 }}>{c.note||'—'}</td>
      </tr>
    );
  };

  return (
    <div style={{ marginTop:24, background:'#fff', border:'1px solid #e0e0e0', borderRadius:10, padding:'16px 20px' }}>

      {/* ── Header ── */}
      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:12, flexWrap:'wrap' }}>
        <span style={{ fontSize:14, fontWeight:700, color:'#333' }}>⚡ Acciones individuales — candidatos por cluster</span>
        {activeCluster.length > 0 &&
          <span style={{ fontSize:11, background:'#fff3e0', color:'#e65100', borderRadius:4, padding:'2px 8px', fontWeight:700 }}>
            ROT.CONFIRMADA activa en: {activeCluster.join(', ')}
          </span>}
        <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:6, flexWrap:'wrap' }}>
          {/* Sync status */}
          {syncStatus?.lastCommit &&
            <span style={{ fontSize:10, color:'#bbb' }}>GitHub: {syncStatus.lastCommit}</span>}
          <button onClick={doSync} disabled={syncing}
            style={{ fontSize:11, background: syncing?'#f5f5f5':'#e8f5e9', color: syncing?'#aaa':'#2e7d32', border:'1px solid #c8e6c9', borderRadius:5, padding:'4px 10px', cursor:syncing?'default':'pointer', fontWeight:600 }}>
            {syncing ? '⟳ Sincronizando...' : '⟳ Sync GitHub'}
          </button>
          {syncMsg &&
            <span style={{ fontSize:11, color: syncMsg.ok?'#2e7d32':'#c62828', maxWidth:200, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}
              title={syncMsg.message}>
              {syncMsg.ok ? '✓' : '✗'} {syncMsg.message}
            </span>}
          <button onClick={openModal}
            style={{ fontSize:11, background:'#f0f4ff', color:'#3949ab', border:'1px solid #c5cae9', borderRadius:5, padding:'4px 12px', cursor:'pointer', fontWeight:600 }}>
            ⚙ Editar lista
          </button>
        </div>
      </div>
      <div style={{ fontSize:10, color:'#bbb', marginBottom:8 }}>
        {data.updated ? `Datos procesados: ${data.updated}` : 'Sin datos — ejecuta main_stocks.py o haz Sync GitHub'}
        {syncStatus?.lastPull && <span style={{ marginLeft:12 }}>Último pull: {new Date(syncStatus.lastPull).toLocaleTimeString()}</span>}
      </div>

      {/* ── Tabla principal (no IGNORAR) ── */}
      {active.length === 0
        ? <div style={{ fontSize:12, color:'#aaa', padding:'6px 0' }}>Sin señales activas — todos los candidatos con score {'<'} 6.</div>
        : <div style={{ overflowX:'auto' }}>
            <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
              <THead /><tbody>{sortCandidates(active).map(c => <TRow key={c.ticker} c={c} />)}</tbody>
            </table>
          </div>
      }

      {/* ── Toggle IGNORAR ── */}
      {ignorados.length > 0 && (
        <div style={{ marginTop:10 }}>
          <button onClick={() => setShowIgnorados(s => !s)}
            style={{ fontSize:11, background:'none', border:'none', color:'#aaa', cursor:'pointer', padding:'3px 0', display:'flex', alignItems:'center', gap:4 }}>
            {showIgnorados ? '▾ Ocultar' : '▸ Ver'} ignorados ({ignorados.length} con score {'<'} 6)
          </button>
          {showIgnorados &&
            <div style={{ overflowX:'auto', marginTop:6, opacity:0.5 }}>
              <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
                <THead /><tbody>{sortCandidates(ignorados).map(c => <TRow key={c.ticker} c={c} />)}</tbody>
              </table>
            </div>}
        </div>
      )}

      {/* ── Leyenda ── */}
      <div style={{ marginTop:12, fontSize:10, color:'#bbb', display:'flex', gap:20, flexWrap:'wrap' }}>
        <span><b style={{ color:'#e65100' }}>⚡ CANDIDATO</b>: cluster ETF con ROT.CONFIRMADA + score≥6 durante 2w</span>
        <span><b style={{ color:'#1565c0' }}>EN_RADAR</b>: score≥6 durante 2w, cluster ETF sin señal todavía</span>
        <span>Stop: −10% · Horizonte: 8–13 sem · Amplifier = beta × score</span>
      </div>

      {/* ── Modal edición config ── */}
      {showModal && (
        <div onClick={e => e.target===e.currentTarget && setShowModal(false)}
          style={{ position:'fixed', top:0, left:0, right:0, bottom:0, background:'rgba(0,0,0,0.45)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center' }}>
          <div style={{ background:'#fff', borderRadius:12, padding:24, width:660, maxWidth:'95vw', maxHeight:'88vh', overflow:'auto', boxShadow:'0 8px 40px rgba(0,0,0,0.2)' }}>

            <div style={{ display:'flex', alignItems:'center', marginBottom:16 }}>
              <span style={{ fontSize:15, fontWeight:700, color:'#333' }}>⚙ Editar lista de acciones</span>
              <button onClick={() => setShowModal(false)}
                style={{ marginLeft:'auto', fontSize:20, background:'none', border:'none', cursor:'pointer', color:'#aaa', lineHeight:1 }}>✕</button>
            </div>

            {loadingCfg ? <div style={{ color:'#aaa', fontSize:13 }}>Cargando...</div> : !config
              ? <div style={{ color:'#c62828', fontSize:13 }}>Error al cargar el config.</div>
              : <>
                  {/* Stocks por cluster */}
                  {CLUSTER_OPTIONS.map(cluster => {
                    const stocks = config[cluster] || [];
                    return (
                      <div key={cluster} style={{ marginBottom:14 }}>
                        <div style={{ fontSize:12, fontWeight:700, color:'#555', borderBottom:'1px solid #eee', paddingBottom:4, marginBottom:6 }}>
                          {cluster} <span style={{ fontWeight:400, color:'#aaa' }}>({stocks.length})</span>
                        </div>
                        {stocks.length === 0
                          ? <div style={{ fontSize:11, color:'#ddd' }}>— vacío</div>
                          : stocks.map(s => (
                            <div key={s.ticker} style={{ display:'flex', alignItems:'center', gap:8, padding:'3px 0', fontSize:12 }}>
                              <span style={{ fontWeight:700, minWidth:65, color:'#222' }}>{s.ticker}</span>
                              <span style={{ color:'#aaa', flex:1, fontSize:11 }}>{s.note || '—'}</span>
                              <button onClick={() => deleteStock(cluster, s.ticker)}
                                style={{ fontSize:12, color:'#e53935', background:'none', border:'none', cursor:'pointer', padding:'0 4px', lineHeight:1 }}>✕</button>
                            </div>
                          ))
                        }
                      </div>
                    );
                  })}

                  {/* Form añadir */}
                  <div style={{ borderTop:'2px solid #eee', paddingTop:14, marginTop:6 }}>
                    <div style={{ fontSize:12, fontWeight:700, color:'#555', marginBottom:8 }}>Añadir acción</div>
                    <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'flex-end' }}>
                      <div>
                        <div style={{ fontSize:10, color:'#888', marginBottom:3 }}>Ticker *</div>
                        <input value={newTicker} onChange={e => setNewTicker(e.target.value.toUpperCase())}
                          onKeyDown={e => e.key==='Enter' && addStock()}
                          placeholder="NVDA"
                          style={{ width:85, padding:'5px 8px', border:'1px solid #ddd', borderRadius:5, fontSize:12 }} />
                      </div>
                      <div>
                        <div style={{ fontSize:10, color:'#888', marginBottom:3 }}>Cluster</div>
                        <select value={newCluster} onChange={e => setNewCluster(e.target.value)}
                          style={{ padding:'5px 8px', border:'1px solid #ddd', borderRadius:5, fontSize:12 }}>
                          {CLUSTER_OPTIONS.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                      </div>
                      <div style={{ flex:1, minWidth:150 }}>
                        <div style={{ fontSize:10, color:'#888', marginBottom:3 }}>Nota (opcional)</div>
                        <input value={newNote} onChange={e => setNewNote(e.target.value)}
                          onKeyDown={e => e.key==='Enter' && addStock()}
                          placeholder="alta beta, cíclico..."
                          style={{ width:'100%', padding:'5px 8px', border:'1px solid #ddd', borderRadius:5, fontSize:12 }} />
                      </div>
                      <button onClick={addStock}
                        style={{ padding:'5px 16px', background:'#3949ab', color:'#fff', border:'none', borderRadius:5, fontSize:12, cursor:'pointer', fontWeight:700 }}>
                        + Añadir
                      </button>
                    </div>
                  </div>

                  {/* Guardar */}
                  <div style={{ display:'flex', alignItems:'center', gap:12, marginTop:18 }}>
                    <button onClick={saveConfig} disabled={savingCfg}
                      style={{ padding:'7px 22px', background:savingCfg?'#ccc':'#1b5e20', color:'#fff', border:'none', borderRadius:6, fontSize:13, cursor:savingCfg?'default':'pointer', fontWeight:700 }}>
                      {savingCfg ? 'Guardando...' : '💾 Guardar'}
                    </button>
                    {saveMsg && <span style={{ fontSize:12, color:saveMsg.startsWith('✓')?'#1b5e20':'#c62828' }}>{saveMsg}</span>}
                  </div>
                  {saveMsg && saveMsg.startsWith('✓') && (
                    <div style={{ marginTop:8, fontSize:11, color:'#aaa', lineHeight:1.6 }}>
                      El YAML se ha subido a GitHub automáticamente.<br/>
                      La próxima ejecución de Actions (08:00 / 20:00 UTC) procesará los nuevos tickers.<br/>
                      Para actualizar ahora: <code style={{ background:'#f5f5f5', padding:'1px 6px', borderRadius:3, fontFamily:'monospace' }}>py backtest/src/main_stocks.py</code> + botón <b>⟳ Sync GitHub</b>.
                    </div>
                  )}
                </>
            }
          </div>
        </div>
      )}
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────
function App() {
  const [macro,    setMacro]    = useState({});
  const [quotes,   setQuotes]   = useState({});
  const [appState, setAppState] = useState(DEFAULT_STATE);
  const [loading,  setLoading]  = useState(true);
  const [done,     setDone]     = useState(0);
  const [updated,  setUpdated]  = useState(null);
  const [sortCol,        setSortCol]        = useState('rot');
  const [sortDir,        setSortDir]        = useState(-1);
  const [toast,          setToast]          = useState(null);
  const [stockCandidates,setStockCandidates]= useState(null);

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(null), 3000); };

  const load = useCallback(async () => {
    setLoading(true); setDone(0);

    const [stateData, macroData, spyData, dxyData, stockData] = await Promise.all([
      fetch('/api/state').then(r=>r.json()).catch(()=>DEFAULT_STATE),
      fetchMacro(),
      fetchQ('SPY'),
      fetchQ('DX-Y.NYB'),
      fetch('/api/stock-candidates').then(r=>r.json()).catch(()=>null),
    ]);
    setStockCandidates(stockData);

    setMacro(macroData);
    const q = { SPY: spyData, 'DX-Y.NYB': dxyData };
    setDone(2);

    const rest = UNIVERSE.filter(a => a.ticker !== 'SPY');
    for (let i = 0; i < rest.length; i += 5) {
      const batch   = rest.slice(i, i+5);
      const results = await Promise.all(batch.map(a => fetchQ(a.ticker)));
      batch.forEach((a,j) => { q[a.ticker] = results[j]; });
      setDone(prev => prev + batch.length);
    }

    setQuotes({...q});

    // Compute score + update state
    const { scaled: rawScore } = calcMacroScore(macroData);
    const rawRegime = getRegime(rawScore);
    const vixVal = macroData.vol?.vixVal ?? 0;

    // Calcular RotScores de todos los activos para actualizar streaks de rotación
    const spyForRot = q['SPY'];
    const rotScores = {};
    UNIVERSE.forEach(a => {
      if (a.ticker !== 'SPY') {
        rotScores[a.ticker] = q[a.ticker] && spyForRot
          ? calcRotScore(q[a.ticker], spyForRot).total
          : 0;
      }
    });

    const newState = updateStateFromData(stateData, rawScore, macroData, rawRegime, vixVal, rotScores);

    // Snapshot histórico por ticker (Fase 1 — Flujos & Rotación v2 optimización, 2026-07-29).
    // Se calcula con newState (régimen ya resuelto por histéresis, streaks del día ya
    // aplicados) para que lo persistido coincida con lo que la UI va a renderizar en este
    // mismo ciclo — no con el régimen/streaks de la carga anterior. Un registro por ticker
    // por día natural (dedup por fecha, mismo patrón que macro_score_history/
    // early_rotation_candidates): si la pestaña se recarga varias veces el mismo día, la
    // fila de hoy se sobrescribe en vez de duplicarse, así el histórico no se infla con
    // ruido intradiario. No hay "cierre de viernes" explícito — a diferencia de un pipeline
    // 2x/día, esta pestaña no tiene backend Python que corra sola: solo se computa cuando
    // alguien abre la página en su máquina, así que el dedup diario ya es la unidad natural
    // de "un run" aquí (las Δ semanales de Fase 2 se calculan buscando la entrada más
    // cercana a N días atrás sobre estos días naturales, igual que ya hace
    // computeMacroTrend con macro_score_history — no requiere que existan huecos exactos
    // de 7 días).
    {
      const effRegimeForSnapshot = computeEffectiveRegime(newState, rawRegime);
      const effLeadersForSnapshot = getEffectiveLeaders(effRegimeForSnapshot, macroData, newState.flags, q);
      const spyAbove200ForSnapshot = q['SPY']?.closeAboveSma200 ?? null;
      const netLiqBForSnapshot = macroData.netliq?.value ?? 0;
      const qualifyMapForSnapshot = buildEarlyRotQualifyMap(q, q['SPY'], newState.early_rotation_candidates);
      const today = new Date().toISOString().slice(0,10);
      if (!newState.rotation_history) newState.rotation_history = {};
      const signalByTickerForSnapshot = {}; // ticker -> sig.label, alimenta la coherencia (Fase 3) sin recalcular getSignal
      UNIVERSE.forEach(a => {
        if (a.ticker === 'SPY') return; // SPY es benchmark, no candidato de rotación
        const row = computeTickerRow(
          a, q, q['SPY'], effLeadersForSnapshot, newState.flags, newState.early_rotation_candidates,
          qualifyMapForSnapshot, spyAbove200ForSnapshot, netLiqBForSnapshot
        );
        signalByTickerForSnapshot[a.ticker] = row.sig.label;
        const entry = {
          date: today,
          score: row.rot.total,
          signal: row.sig.label,
          blockA: row.rot.blockA,
          blockB: row.rot.blockB,
          blockC: row.rot.blockC,
          fit: row.fit,
          macro_regime: effRegimeForSnapshot.label,
          macro_score: rawScore,
          rs_1w: row.rot.w1Rel,
          rs_4w: row.rot.m1Rel,
          rs_13w: row.rot.m3Rel,
        };
        const hist = newState.rotation_history[a.ticker] || [];
        const last = hist[hist.length - 1];
        if (!last || last.date !== today) {
          hist.push(entry);
          if (hist.length > 70) hist.splice(0, hist.length - 70); // ~10 semanas, mismo cap que macro_score_history
        } else {
          hist[hist.length - 1] = entry;
        }
        newState.rotation_history[a.ticker] = hist;
      });

      // Coherencia régimen-rotación (Fase 3.3/3.4) — mismo día natural / dedup / cap que
      // rotation_history y macro_score_history.
      const coherence = computeRegimeCoherence(signalByTickerForSnapshot, effLeadersForSnapshot);
      if (coherence) {
        if (!newState.regime_coherence_history) newState.regime_coherence_history = [];
        const coh = newState.regime_coherence_history;
        const cohEntry = { date: today, pct: coherence.pct, confirm: coherence.confirm, total: coherence.total, macro_regime: effRegimeForSnapshot.label };
        const lastCoh = coh[coh.length - 1];
        if (!lastCoh || lastCoh.date !== today) {
          coh.push(cohEntry);
          if (coh.length > 70) coh.splice(0, coh.length - 70);
        } else {
          coh[coh.length - 1] = cohEntry;
        }
      }
    }

    setAppState(newState);
    fetch('/api/state', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(newState) }).catch(()=>{});

    setUpdated(new Date());
    setLoading(false);
    printFredFailLog();
  }, []);

  useEffect(() => { load(); }, [load]);

  const macroScoreResult = useMemo(() => calcMacroScore(macro), [macro]);
  const { scaled: macroScore, maxPossible: macroMaxPossible } = macroScoreResult;
  const staleSources = useMemo(
    () => MACRO_ITEMS.filter(it => macro[it.id]?._stale).map(it => it.label),
    [macro]
  );
  const rawRegime        = useMemo(() => getRegime(macroScore), [macroScore]);

  const macroTrend = useMemo(
    () => computeMacroTrend(appState.macro_score_history, macroScore),
    [appState.macro_score_history, macroScore]
  );

  // Fase 5.3 — semanas en el régimen actual + contexto del régimen anterior.
  const regimeContext = useMemo(() => {
    const weeksSince = (dateStr) => dateStr == null ? null :
      Math.max(1, Math.round((Date.now() - new Date(dateStr).getTime()) / 604800000));
    const currentWeeks = weeksSince(appState.regime_entered_date);
    const prev = appState.previous_regime;
    const prevWeeks = prev ? Math.max(1, Math.round(
      (new Date(prev.exited_date).getTime() - new Date(prev.entered_date).getTime()) / 604800000)) : null;
    return { currentWeeks, prevLabel: prev?.label ?? null, prevWeeks };
  }, [appState.regime_entered_date, appState.previous_regime]);

  // Effective regime: histéresis + term premium degradation
  const effectiveRegime = useMemo(
    () => computeEffectiveRegime(appState, rawRegime),
    [appState, rawRegime]
  );

  const effectiveLeaders = useMemo(() =>
    getEffectiveLeaders(effectiveRegime, macro, appState.flags, quotes),
    [effectiveRegime, macro, appState.flags, quotes]);

  const spyAboveSma200 = useMemo(() => quotes['SPY']?.closeAboveSma200 ?? null, [quotes]);

  const rows = useMemo(() => {
    const spy = quotes['SPY'];
    const candidates = appState.early_rotation_candidates;

    // Elegibilidad individual para la nueva ROT. TEMPRANA (inflexión), calculada para
    // todo el universo antes de evaluar peers de clúster (hoja 9.2: "ambos" activos
    // deben cumplir inflexión + RS4w + Koncorde, no solo el que se está evaluando).
    const qualifyMap = buildEarlyRotQualifyMap(quotes, spy, candidates);
    const netLiqDeltaB = macro.netliq?.value ?? 0;

    return UNIVERSE.map(a => {
      const row = computeTickerRow(a, quotes, spy, effectiveLeaders, appState.flags, candidates, qualifyMap, spyAboveSma200, netLiqDeltaB);
      const dyn = a.ticker === 'SPY' ? null : computeRotationDynamics(appState.rotation_history?.[a.ticker], row.rot.total, row.sig.label);
      const thresholdDist = computeThresholdDistance(row, appState.flags, spyAboveSma200);
      const fitLevel = a.ticker === 'SPY' ? null : computeFitLevel(a.ticker, effectiveRegime, effectiveLeaders);
      const subscoreProfile = a.ticker === 'SPY' ? null : computeSubscoreProfile(row.rot);
      return { ...row, dyn, thresholdDist, fitLevel, subscoreProfile };
    });
  }, [quotes, effectiveLeaders, effectiveRegime, appState.flags, appState.early_rotation_candidates, appState.rotation_history, spyAboveSma200, macro]);

  // Bootstrap de rotation_history (Fase 1): fecha del primer snapshot guardado y si ya
  // hay al menos 7 días naturales de histórico. Las métricas de Fase 2 (Δ 1W, watchlist
  // de promoción/degradación, etc.) dependerán de esto para mostrar "—" en vez de un
  // delta falso durante la primera semana.
  const rotHistoryBootstrap = useMemo(() => {
    const allDates = Object.values(appState.rotation_history || {})
      .flat()
      .map(e => e.date)
      .sort();
    if (allDates.length === 0) return { startDate: null, ready: false };
    const startDate = allDates[0];
    const daysSinceStart = Math.floor((Date.now() - new Date(startDate).getTime()) / 86400000);
    return { startDate, ready: daysSinceStart >= 7 };
  }, [appState.rotation_history]);

  // Coherencia régimen-rotación (Fase 3.3): % de effectiveLeaders con señal >= ACUMULAR,
  // calculado en vivo con los mismos rows que se renderizan (no releído del snapshot, que
  // puede ser de una carga anterior el mismo día).
  const regimeCoherence = useMemo(() => {
    const signalByTicker = {};
    rows.forEach(r => { signalByTicker[r.ticker] = r.sig.label; });
    return computeRegimeCoherence(signalByTicker, effectiveLeaders);
  }, [rows, effectiveLeaders]);

  // Δ coherencia 1W (Fase 3.4) — mismo helper "closest at or before" que Δ Score 1W.
  const coherenceTrend = useMemo(() => {
    const ref = findHistEntryAtOrBefore(appState.regime_coherence_history, 7);
    if (!ref || regimeCoherence == null) return { delta1w: null, refPct: null };
    return { delta1w: regimeCoherence.pct - ref.pct, refPct: ref.pct };
  }, [appState.regime_coherence_history, regimeCoherence]);

  // Líderes efectivos del régimen actual con sus datos completos (Fase 3.2), en el mismo
  // orden que effectiveLeaders.
  const leaderRows = useMemo(() =>
    effectiveLeaders.map(t => rows.find(r => r.ticker === t)).filter(Boolean),
    [effectiveLeaders, rows]);

  // Registry de divergencias (Fase 4) — evaluado sobre los mismos rows que se renderizan.
  const rowByTicker = useMemo(() => {
    const m = {};
    rows.forEach(r => { m[r.ticker] = r; });
    return m;
  }, [rows]);

  const divergenceResults = useMemo(() =>
    DIVERGENCE_REGISTRY.map(entry => ({
      entry,
      result: evaluateDivergence(entry, rowByTicker, effectiveRegime.label, regimeCoherence),
    })),
    [rowByTicker, effectiveRegime, regimeCoherence]);

  const sorted = useMemo(() => [...rows].sort((a,b) => {
    let va=0, vb=0;
    if (sortCol==='rot')  { va=a.rot.total;       vb=b.rot.total; }
    if (sortCol==='w1')   { va=a.rot.w1Rel??-99;  vb=b.rot.w1Rel??-99; }
    if (sortCol==='m1')   { va=a.rot.m1Rel??-99;  vb=b.rot.m1Rel??-99; }
    if (sortCol==='rsi')  { va=a.d?.rsi??-1;      vb=b.d?.rsi??-1; }
    return sortDir*(vb-va);
  }), [rows, sortCol, sortDir]);

  const opps = useMemo(() =>
    rows.filter(r => r.fit && r.rot.total >= 5 && r.ticker !== 'SPY' && !['—'].includes(r.sig.label))
        .sort((a,b) => b.rot.total - a.rot.total).slice(0,6),
    [rows]);

  const confirmed = useMemo(() =>
    rows.filter(r => r.sig.label === 'ROT. CONFIRMADA' && r.ticker !== 'SPY')
        .sort((a,b) => b.rot.total - a.rot.total).slice(0,4),
    [rows]);

  const newEarly = useMemo(() =>
    rows.filter(r => r.sig.label === 'ROT. TEMPRANA' && r.ticker !== 'SPY')
        .sort((a,b) => b.rot.total - a.rot.total).slice(0,4),
    [rows]);

  // Watchlist de promoción/degradación (Fase 2.5). Solo sobre tickers "fit" (único tramo
  // con umbral de score limpio, ver computeThresholdDistance) y solo cuando el Master
  // Filter no está degradando señales globalmente (si SPY<SMA200 el umbral de referencia
  // no coincide con lo que se ve en pantalla). Gateado por rotHistoryBootstrap.ready —
  // antes de la segunda semana de histórico no hay Δ1W fiable para ordenar.
  const promotionWatch = useMemo(() => {
    if (!rotHistoryBootstrap.ready || spyAboveSma200 === false) return [];
    return rows
      .filter(r => r.thresholdDist && r.thresholdDist.pointsUp === 1)
      .sort((a,b) => (b.dyn?.delta1w ?? -99) - (a.dyn?.delta1w ?? -99));
  }, [rows, rotHistoryBootstrap.ready, spyAboveSma200]);

  const demotionWatch = useMemo(() => {
    if (!rotHistoryBootstrap.ready || spyAboveSma200 === false) return [];
    return rows
      .filter(r => r.thresholdDist && r.thresholdDist.bufferDown === 0)
      .sort((a,b) => (a.dyn?.delta1w ?? 99) - (b.dyn?.delta1w ?? 99));
  }, [rows, rotHistoryBootstrap.ready, spyAboveSma200]);

  const activeFlags = useMemo(() =>
    Object.entries(appState.flags||{}).filter(([,v]) => v.active),
    [appState.flags]);

  function Th({ col, label, tip }) {
    const handleClick = () => sortCol===col ? setSortDir(d=>-d) : (setSortCol(col), setSortDir(-1));
    return (
      <ThTip tip={tip} style={{ ...TH_S, cursor:'pointer', background:sortCol===col?'#e8f0fe':'#f8f9fa' }} onClick={handleClick}>
        {label} {sortCol===col?(sortDir<0?'▼':'▲'):''}
      </ThTip>
    );
  }

  const loadPct = Math.round((done / (UNIVERSE.length+1)) * 100);

  // Checks panel
  const checks = [
    { label:'Score ≥ 60',        ok: macroScore >= 60,                                     val:`${macroScore}/100` },
    { label:'VIX < 23',          ok: (macro.vol?.vixVal??99) < 23,                         val: macro.vol?.vixVal?.toFixed(1)??'—' },
    { label:'HY < 475 bps',      ok: macro.hy?.value!=null && macro.hy.value*100 < 475,    val: macro.hy?.value ? Math.round(macro.hy.value*100)+' bps' : '—' },
    { label:'Curva > –25 bps',   ok: macro.curve?.value!=null && macro.curve.value > -0.25,val: macro.curve?.value!=null ? Math.round(macro.curve.value*100)+' bps' : '—' },
    { label:'CFNAI > –0.35',     ok: (macro.cfnai?.value??-99) > -0.35,                    val: macro.cfnai?.value?.toFixed(2)??'—' },
    { label:'SPY > SMA200',      ok: spyAboveSma200 === true,                              val: spyAboveSma200===true?'✓':spyAboveSma200===false?'✗':'—' },
  ];

  // ── Markdown builders ──────────────────────────────────────────────────
  const buildMD = useCallback(() => {
    const date = new Date().toLocaleString('es-ES',{dateStyle:'full',timeStyle:'short'});
    let md = `# Flujos & Rotación v2 — Snapshot\n**Fecha:** ${date}\n\n`;

    md += `## RÉGIMEN\n**MacroScore:** ${macroScore}/100${macroMaxPossible < 100 ? ` ⚠ (reescalado, ${macroMaxPossible}/100 disponible)` : ''} — **${displayRegimeName(effectiveRegime.label)} ${trendLabel(macroTrend.trend)}** (Δ1w ${macroTrend.delta1w ?? '—'} · Δ4w ${macroTrend.delta4w ?? '—'})\n`;
    if (appState.pending_regime) md += `_Transición pendiente → ${displayRegimeName(appState.pending_regime)} (${appState.pending_since_count}/2 lecturas)_\n`;
    md += `_${effectiveRegime.desc}_\n`;
    md += `Líderes efectivos: ${effectiveLeaders.join(', ')}\n`;
    md += `Régimen actual: ${displayRegimeName(effectiveRegime.label)}${regimeContext.currentWeeks!=null?` (desde hace ${regimeContext.currentWeeks} sem.)`:''}`;
    if (regimeContext.prevLabel) md += ` · Régimen anterior: ${displayRegimeName(regimeContext.prevLabel)}${regimeContext.prevWeeks!=null?` (durante ${regimeContext.prevWeeks} sem.)`:''}`;
    md += '\n\n';

    if (activeFlags.length) {
      md += `## FLAGS ACTIVOS\n`;
      activeFlags.forEach(([id,v]) => { md += `- **${id}** (${v.streak_weeks||0}w)\n`; });
      md += '\n';
    }

    md += `## INDICADORES MACRO\n| Indicador | Valor | Status | Score |\n|-----------|-------|--------|-------|\n`;
    MACRO_ITEMS.forEach(it => {
      const v = macro[it.id]?.value;
      const pts = v!=null?(it.needsDelta?it.score(v,macro[it.id]?.delta13w):it.score(v)):null;
      md += `| ${it.label} (/${it.weight}) | ${v!=null?it.fmt(v):'—'} | ${v!=null?it.status(v):'—'} | ${pts==null?'—':pts%1===0?pts:pts.toFixed(1)} |\n`;
    });
    md += `\n_DFII10: ${macro.dfii10?.value?.toFixed(2)??'—'}% · T5YIE: ${macro.t5yie?.value?.toFixed(2)??'—'}% · Term Premium: ${macro.termPremium?.value?.toFixed(3)??'—'}_\n\n`;

    md += `## CONDICIONES PROTOCOLO\n`;
    checks.forEach(c => { md += `- ${c.ok?'✅':'❌'} ${c.label}: ${c.val}\n`; });
    md += '\n';

    if (regimeCoherence) {
      const lvl = coherenceLevel(regimeCoherence.pct);
      md += `## COHERENCIA RÉGIMEN vs ROTACIÓN\n${regimeCoherence.confirm}/${regimeCoherence.total} (${regimeCoherence.pct}%) — ${lvl.label}`;
      if (rotHistoryBootstrap.ready && coherenceTrend.delta1w != null) {
        md += ` (era ${coherenceTrend.refPct}% hace 1 semana, ${coherenceTrend.delta1w>0?'+':''}${coherenceTrend.delta1w}pp)`;
      }
      md += `\n\n**Líderes efectivos:**\n| Ticker | Score | Señal | Δ1W | Sem. | Confirma |\n|--------|------:|-------|----:|-----:|:--------:|\n`;
      leaderRows.forEach(r => {
        const d1 = rotHistoryBootstrap.ready && r.dyn?.delta1w!=null ? (r.dyn.delta1w>0?'+':'')+r.dyn.delta1w : '—';
        const wk = rotHistoryBootstrap.ready && r.dyn?.weeksInSignal!=null ? r.dyn.weeksInSignal : '—';
        const ok = confirmsSignal(r.sig.label);
        md += `| ${r.ticker} | ${r.rot.total}/10 | ${r.sig.label} | ${d1} | ${wk} | ${ok?'✓':'✗'} |\n`;
      });
      md += '\n';
    }

    md += `## DIVERGENCIAS Y CONFIRMACIONES (${DIVERGENCE_REGISTRY.length} relaciones monitorizadas)\n`;
    divergenceResults.forEach(({ entry, result }) => {
      const meta = DIVERGENCE_STATE_META[result.state];
      md += `${meta.icon} **${entry.label}** — ${result.state.replace(/_/g,' ')}\n${interpretationFor(entry, result)}\n\n`;
    });

    if (opps.length) {
      md += `## OPORTUNIDADES\n| Ticker | Score | A/B/C | 1W vs SPY | RSI | MACD | OBV | Señal |\n|--------|------:|-------|----------:|----:|:----:|:---:|-------|\n`;
      opps.forEach(r => {
        const d=r.d, rot=r.rot;
        md += `| ${r.ticker} | ${rot.total}/10 | ${rot.blockA}/${rot.blockB}/${rot.blockC} | ${relFmt(rot.w1Rel)} | ${d?.rsi??'—'} | ${d?.macdBull!=null?(d.macdBull?'▲':'▼'):'—'} | ${d?.obvAboveSma50!=null?(d.obvAboveSma50?'↑':'↓'):'—'} | ${r.sig.label} |\n`;
      });
      md += '\n';
    }

    if (rotHistoryBootstrap.ready && (promotionWatch.length || demotionWatch.length)) {
      md += `## WATCHLIST PROMOCIÓN/DEGRADACIÓN\n`;
      if (promotionWatch.length) {
        md += `**Próximos a subir:**\n`;
        promotionWatch.forEach(r => { md += `- ${r.ticker} (${r.sig.label}): score ${r.rot.total}/10, falta +${r.thresholdDist.pointsUp} pt para ${r.thresholdDist.nextLabel} · Δ1W ${r.dyn?.delta1w ?? '—'}\n`; });
      }
      if (demotionWatch.length) {
        md += `**Próximos a caer:**\n`;
        demotionWatch.forEach(r => { md += `- ${r.ticker} (${r.sig.label}): score ${r.rot.total}/10, sin colchón sobre el umbral · Δ1W ${r.dyn?.delta1w ?? '—'}\n`; });
      }
      md += '\n';
    } else if (spyAboveSma200 === false) {
      md += `## WATCHLIST PROMOCIÓN/DEGRADACIÓN\n_No disponible — Master Filter activo (SPY<SMA200), señales degradadas._\n\n`;
    }

    md += `## ROTACIÓN COMPLETA\n| Ticker | Cat. | 1W vs SPY | RS13w | Score | Δ1W | Sem. | A/B/C | Fit | Perfil | Señal |\n|--------|------|----------:|------:|------:|----:|-----:|-------|:---:|--------|-------|\n`;
    sorted.forEach(r => {
      if (r.ticker==='SPY') return;
      const delta1wStr = rotHistoryBootstrap.ready && r.dyn?.delta1w!=null ? (r.dyn.delta1w>0?'+':'')+r.dyn.delta1w : '—';
      const weeksStr = rotHistoryBootstrap.ready && r.dyn?.weeksInSignal!=null ? r.dyn.weeksInSignal : '—';
      const badgeStr = rotHistoryBootstrap.ready && r.dyn?.badge ? ` [${r.dyn.badge}]` : '';
      const fitStr = FIT_LEVEL_META[r.fitLevel]?.icon ?? '○';
      const anomalyStr = (r.fitLevel==='contrary' && r.rot.total>=6) ? ' ⚠ANOMALÍA' : '';
      const perfilStr = SUBSCORE_PROFILE_META[r.subscoreProfile]?.label ?? '—';
      md += `| ${r.ticker}${badgeStr} | ${r.cat} | ${relFmt(r.rot.w1Rel)} | ${relFmt(r.rot.m3Rel)} | ${r.rot.total}/10 | ${delta1wStr} | ${weeksStr} | ${r.rot.blockA}/${r.rot.blockB}/${r.rot.blockC} | ${fitStr}${anomalyStr} | ${perfilStr} | ${r.sig.label} |\n`;
    });
    if (!rotHistoryBootstrap.ready) {
      md += `\n_Métricas históricas (Δ1W, Semanas, watchlist) disponibles a partir de la segunda semana desde ${rotHistoryBootstrap.startDate ?? '—'}._\n`;
    }
    return md;
  }, [macro, macroScore, macroMaxPossible, effectiveRegime, effectiveLeaders, activeFlags, appState, opps, sorted, checks, promotionWatch, demotionWatch, rotHistoryBootstrap, spyAboveSma200, regimeCoherence, coherenceTrend, leaderRows, divergenceResults, regimeContext]);

  useEffect(() => {
    if (!loading) {
      try { localStorage.setItem('llm_export_rotacion', buildMD()); localStorage.setItem('llm_export_rotacion_ts', Date.now().toString()); } catch {}
    }
  }, [loading, buildMD]);

  const copyLLM = useCallback(() => {
    navigator.clipboard.writeText(buildMD())
      .then(() => showToast('✅ Snapshot copiado'))
      .catch(() => showToast('❌ Error'));
  }, [buildMD]);

  const copyAllForLLM = () => {
    const parts = [
      { key: 'llm_export_market',    label: 'Market Tracker' },
      { key: 'llm_export_portfolio', label: 'Portfolio' },
      { key: 'llm_export_cycle',     label: 'Cycle' },
      { key: 'llm_export_relative',  label: 'Relative Flow' },
      { key: 'llm_export_rotacion',  label: 'Flujos & Rotación' },
      { key: 'llm_export_duration',  label: 'Duration' },
      { key: 'llm_export_sentiment', label: 'Sentiment' },
      { key: 'llm_export_positioning', label: 'Positioning' },
    ];
    const now = Date.now();
    const found = [], missing = [], stale = [];
    const sections = parts.map(({ key, label }) => {
      const md = localStorage.getItem(key);
      if (md) {
        found.push(label);
        const ts = parseInt(localStorage.getItem(key + '_ts') || '0');
        const hours = ts ? Math.round((now - ts) / 3600000) : null;
        if (!ts || hours > 23) stale.push(hours != null ? `${label} (${hours}h)` : label);
        return md;
      }
      missing.push(label); return null;
    }).filter(Boolean);
    if (!sections.length) { showToast('⚠️ Abre cada pestaña primero para generar datos'); return; }
    const exportDate = new Date().toLocaleString('es-ES', { dateStyle: 'full', timeStyle: 'short' });
    const header = `**Exportado:** ${exportDate}` +
      (stale.length ? `\n⚠️ **Secciones desactualizadas (>24h):** ${stale.join(', ')} — Abre esas pestañas para refrescar\n` : '\n');
    const combined = header + '\n---\n\n' + sections.join('\n\n---\n\n');
    navigator.clipboard.writeText(combined)
      .then(() => {
        if (stale.length) showToast(`⚠️ ${stale.length} secc. desactualizadas: ${stale.join(', ')}`);
        else if (missing.length) showToast(`✅ ${found.length}/${parts.length} pestañas — Falta: ${missing.join(', ')}`);
        else showToast('✅ Todas las pestañas copiadas (datos frescos)');
      })
      .catch(() => showToast('❌ Error al copiar'));
  };

  const copyProtocol = () => {
    const md = `# Protocolo Flujos & Rotación v2 — Metodología\n\n## 1. MACROSCORE (0–100)\n\nCinco indicadores con pesos no uniformes:\n\n| # | Indicador | Fuente | Peso |\n|---|-----------|--------|------|\n| 1 | HY Credit Spread (BAMLH0A0HYM2) | FRED | 25 |\n| 2 | Net Liquidity Δ13 semanas (WALCL−RRPONTSYD−WTREGEN) | FRED | 25 |\n| 3 | VolScore = min(VIX nivel, VIX term structure ^VIX9D/^VIX3M) | Yahoo | 20 |\n| 4 | Curva 10Y–3M con penalización steepening (T10Y3M) | FRED | 15 |\n| 5 | CFNAI — Chicago Fed National Activity Index | FRED | 15 |\n\n### Umbrales HY Spread (/25)\n<300 bps→25 · 300–374→18.75 · 375–474→12.5 · 475–599→6.25 · ≥600→0\n\n### Umbrales Net Liq Δ13w en USD Billions (/25)\n>+500B→25 · +100–500→18.75 · −100–+100→12.5 · −500–−100→6.25 · <−500→0\n\n### VolScore (/20) — mínimo conservador\nVIX: <14→20 · 14–17.9→15 · 18–22.9→10 · 23–29.9→5 · ≥30→0\nTerm (^VIX9D/^VIX3M): <0.85→20 · 0.85–0.95→15 · 0.95–1.05→10 · 1.05–1.15→5 · >1.15→0\nVolScore = min(VIX_score, Term_score)\n\n### Umbrales Curva 10Y–3M (/15)\nBase: >75bps→20 · 25–75→15 · −25–25→10 · −75–−25→5 · <−75→0\nPenalización: si curva<0 Y Δ13w>+50bps → restar 5 (steepening desde inversión = señal recesión temprana)\nFinal = max(0, base−pen) × 0.75\n\n### Umbrales CFNAI (/15)\n>+0.20→15 · 0–0.20→11.25 · −0.35–0→7.5 · −0.70–−0.35→3.75 · <−0.70→0\n\n---\n\n## 2. REGÍMENES (con histéresis simétrica)\n\n| Score | Régimen |\n|-------|---------|\n| 80–100 | Bull Pleno (mostrado: Risk-On Fuerte) |\n| 60–79 | Bull Maduro (mostrado: Risk-On Maduro) |\n| 40–59 | Transición |\n| 20–39 | Risk-OFF (mostrado: Risk-Off) |\n| 0–19 | Capitulación (mostrado: Estrés / Capitulación) |\n\n**Histéresis (simétrica para subidas y bajadas):** el régimen solo cambia cuando:\n1. El score cruza la frontera en ≥5 puntos (medido contra el borde que se cruza, no el borde inferior siempre)\n2. Ese cruce persiste durante ≥2 lecturas consecutivas\n\nEjemplo ascendente: en Transición (40–59), score sube a 65 → cruce = 65−60 = 5 pts ✓, confirma tras 2 semanas.\nEjemplo descendente: en Bull Maduro (60–79), score baja a 54 → cruce = 60−54 = 6 pts ✓, confirma tras 2 semanas.\n\n**Modificador Term Premium:** si THREEFYTP10 < −0.75 durante ≥13 semanas → degradar régimen 1 nivel.\n\n---\n\n## 3. ROTATION SCORE (0–10)\n\n### Bloque A — Momentum/RS (4 pts)\n- RS 13w vs SPY > +2.0% → 2 pts\n- RS 4w vs SPY > +1.0% → 1 pt\n- Close > SMA200 → 1 pt\n\n### Bloque B — Flujo/Volumen (3 pts)\n- CMF(20) > 0.05 → 1 pt\n- OBV > SMA50(OBV) → 1 pt\n- Vol20d / Vol60d > 1.10 → 1 pt\n\n### Bloque C — Momentum técnico (3 pts)\n- MACD histograma > 0 → 1 pt\n- RSI(14) entre 40 y 70 → 1 pt\n- Anti-extensión: Close > SMA20 AND (Close−SMA20)/ATR(14) < 1.5 → 1 pt\n\n---\n\n## 4. SEÑALES\n\n| Señal | Condición |\n|-------|----------|\n| COMPRA | Fit régimen + Score ≥ 7 (≥8 si CREDIT_COMPLACENCY activo) |\n| ACUMULAR | Fit régimen + Score 5–6 |\n| ACUMULAR* | EMERGENCY_MODE activo + Fit Risk-OFF + Score ≥ 6 (acumular defensivos en caída) |\n| ROT. CONFIRMADA | Ver §4.1 — persistencia, tres condiciones obligatorias |\n| ROT. TEMPRANA | Ver §4.2 — inflexión, cinco condiciones obligatorias |\n| VIGILAR | Score 3–4 |\n\n**Master Filter:** si SPY < SMA200 → degradar COMPRA/ACUMULAR/VIGILAR un nivel. Ninguna señal ROT.* se degrada (cada una lleva su propio filtro de benchmark).\n\n**EMERGENCY_MODE:** si VIX ≥ 35 → todas las señales suprimidas excepto ACUMULAR* para defensivos de Risk-OFF. Duración mínima 14 días.\n\n### §4.1 ROT. CONFIRMADA — persistencia, tres condiciones obligatorias\n(Antes llamada \"ROT. TEMPRANA\" — renombrada porque exige persistencia de 3 semanas y no es realmente temprana.)\nSe emite solo si se cumplen las tres a la vez:\n1. **Persistencia individual:** RotScore ≥ 8/10 durante ≥3 lecturas semanales consecutivas\n2. **Clúster categorial:** ≥2 activos del mismo clúster con streak ≥3 simultáneamente\n3. **Filtro benchmark:** SPY > SMA200 OR Δ13w NetLiq > +300B\n\n### §4.2 ROT. TEMPRANA — inflexión, cinco condiciones obligatorias\nSeñal nueva basada en inflexión, no en persistencia. Se emite solo si se cumplen las cinco a la vez, y solo si ROT. CONFIRMADA no aplica ya (tiene prioridad):\n1. **Score actual:** RotScore ≥ 6/10\n2. **Inflexión:** RotScore mejora ≥2 puntos vs la lectura semanal anterior\n3. **RS4w:** RS 4 semanas vs SPY > 0\n4. **Koncorde 3D:** konc_3d_state ≠ distribution\n5. **Clúster + benchmark:** ≥2 activos del mismo clúster cumplen 1-4 simultáneamente, Y (SPY > SMA200 OR Δ13w NetLiq > +300B)\n\nClústeres definidos (macro_cluster, compartido por ambas señales ROT.*):\n| Clúster | Activos |\n|---------|----------|\n| Growth | XLK, XLC, XLY, QQQ, BTC-USD |\n| ValueCyclical | XLF, XLI, XLB, XLE |\n| Defensive | XLP, XLU, XLV, XLRE |\n| Duration | TLT (un solo miembro → nunca dispara, intencional) |\n| Commodities | GC=F, SI=F, BZ=F, HG=F |\n| SmallEM | IWM, EEM, EFA, FEZ |\n\nNota: si fit con régimen actual, la señal estándar (COMPRA/ACUMULAR) tiene prioridad sobre ambas ROT.*.\n\n---\n\n## 5. LÍDERES CONDICIONALES\n- **IWM** solo si HY Spread < 375 bps AND (Curva > 0 OR Δ13w Curva > 0)\n- **GC=F (Oro)** solo si DFII10 < 1.0% OR DXY en tendencia bajista 3M\n- **INFLATION_OVERLAY** (T5YIE ≥ 2.8% × 4 semanas): TLT/QQQ/XLK pierden fit (salvo Net Liq Δ13w > 300B); XLE/XLB/GC=F/SI=F se promueven como líderes\n\n---\n\n## 6. FLAGS GLOBALES\n| Flag | Activación | Desactivación | Efecto |\n|------|-----------|---------------|--------|\n| CREDIT_COMPLACENCY | HY < 275 bps × 8 semanas | Un periodo HY ≥ 275 → reset streak | Elevar umbral COMPRA a ≥8/10 |\n| INFLATION_OVERLAY | T5YIE ≥ 2.8% × 4 semanas | Un periodo T5YIE < 2.8% → reset streak | Ajustar líderes (ver §5) |\n| TERM_PREMIUM_EXTREME | THREEFYTP10 < −0.75 × 13 semanas | Un periodo ≥ −0.75 → reset streak | Degradar régimen 1 nivel |\n| EMERGENCY_MODE | VIX ≥ 35 (inmediato) | Expiración 14 días desde activación | Suprimir señales; solo ACUMULAR* defensivos |\n`;

                  return (
                    <div key={r.ticker} style={{ display:'flex', flexDirection:'column', gap:3,
                      background:'#fff3e0', border:'1px solid #ffcc80', borderRadius:8, padding:'7px 11px' }}>
                      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                        <div style={{ minWidth:70 }}>
                          <div style={{ fontSize:12, fontWeight:700 }}>{r.ticker}</div>
                          <div style={{ fontSize:9, color:'#888' }}>{r.name}</div>
                        </div>
                        <Stars score={r.rot.total} />
                        <span style={{ fontSize:10, fontWeight:700, color:'#e65100', marginLeft:4 }}>{r.rot.total}/10</span>
                        {m && <span style={{ fontSize:9, background:'#e65100', color:'white', borderRadius:10, padding:'1px 7px', marginLeft:'auto' }}>
                          {m.streak}w streak
                        </span>}
                      </div>
                      {m && (
                        <div style={{ fontSize:9, color:'#888', display:'flex', gap:10, flexWrap:'wrap' }}>
                          <span>Clúster: <b style={{ color:'#555' }}>{m.cluster}</b></span>
                          {m.clusterPeers.length > 0 && <span>Peers: <b style={{ color:'#555' }}>{m.clusterPeers.join(', ')}</b></span>}
                          <span style={{ marginLeft:'auto', color: m.benchmarkSPY ? '#1b5e20' : '#e65100' }}>
                            {m.benchmarkSPY ? '✓ SPY>SMA200' : `✓ NetLiq +${Math.round(m.netLiqDeltaB)}B`}
                          </span>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {newEarly.length > 0 && (
            <div>
              <div style={{ fontSize:11, fontWeight:700, color:'#7b1fa2', marginBottom:6, textTransform:'uppercase', letterSpacing:1 }}>
                ⚡ Rotación Temprana ({newEarly.length})
              </div>
              <div style={{ display:'flex', flexDirection:'column', gap:5 }}>
                {newEarly.map(r => {
                  const m = r.newEarlyRotMeta;
                  return (
                    <div key={r.ticker} style={{ display:'flex', flexDirection:'column', gap:3,
                      background:'#f3e5f5', border:'1px solid #ce93d8', borderRadius:8, padding:'7px 11px' }}>
                      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                        <div style={{ minWidth:70 }}>
                          <div style={{ fontSize:12, fontWeight:700 }}>{r.ticker}</div>
                          <div style={{ fontSize:9, color:'#888' }}>{r.name}</div>
                        </div>
                        <Stars score={r.rot.total} />
                        <span style={{ fontSize:10, fontWeight:700, color:'#7b1fa2', marginLeft:4 }}>{r.rot.total}/10</span>
                      </div>
                      {m && (
                        <div style={{ fontSize:9, color:'#888', display:'flex', gap:10, flexWrap:'wrap' }}>
                          <span>Clúster: <b style={{ color:'#555' }}>{m.cluster_name}</b></span>
                          {m.clusterPeers.length > 0 && <span>Peers: <b style={{ color:'#555' }}>{m.clusterPeers.join(', ')}</b></span>}
                          <span style={{ marginLeft:'auto', color: m.benchmarkSPY ? '#1b5e20' : '#7b1fa2' }}>
                            {m.benchmarkSPY ? '✓ SPY>SMA200' : `✓ NetLiq +${Math.round(m.netLiqDeltaB)}B`}
                          </span>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      )}

      {/* Watchlist de promoción/degradación (Fase 2.5) */}
      {rotHistoryBootstrap.ready && spyAboveSma200 !== false && (promotionWatch.length > 0 || demotionWatch.length > 0) && (
        <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:14, marginBottom:14 }}>
          {promotionWatch.length > 0 && (
            <div>
              <div style={{ fontSize:11, fontWeight:700, color:'#1b5e20', marginBottom:6, textTransform:'uppercase', letterSpacing:1 }}>
                ↗ Próximos a subir ({promotionWatch.length})
              </div>
              <div style={{ display:'flex', flexDirection:'column', gap:5 }}>
                {promotionWatch.map(r => (
                  <div key={r.ticker} style={{ display:'flex', alignItems:'center', gap:8,
                    background:'#f1f8e9', border:'1px solid #c8e6c9', borderRadius:8, padding:'6px 11px' }}>
                    <div style={{ minWidth:70 }}>
                      <div style={{ fontSize:12, fontWeight:700 }}>{r.ticker}</div>
                      <div style={{ fontSize:9, color:'#888' }}>{r.sig.label}</div>
                    </div>
                    <span style={{ fontSize:11 }}>Score <b>{r.rot.total}</b>/10 — falta <b style={{ color:'#1b5e20' }}>+{r.thresholdDist.pointsUp}</b> pt para <b>{r.thresholdDist.nextLabel}</b></span>
                    <span style={{ marginLeft:'auto', fontSize:11, fontWeight:700, color:rc(r.dyn?.delta1w) }}>
                      Δ1W {r.dyn?.delta1w != null ? (r.dyn.delta1w>0?'+':'')+r.dyn.delta1w : '—'} {r.dyn?.arrow}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}
          {demotionWatch.length > 0 && (
            <div>
              <div style={{ fontSize:11, fontWeight:700, color:'#b71c1c', marginBottom:6, textTransform:'uppercase', letterSpacing:1 }}>
                ↘ Próximos a caer ({demotionWatch.length})
              </div>
              <div style={{ display:'flex', flexDirection:'column', gap:5 }}>
                {demotionWatch.map(r => (
                  <div key={r.ticker} style={{ display:'flex', alignItems:'center', gap:8,
                    background:'#fbe9e7', border:'1px solid #ffab91', borderRadius:8, padding:'6px 11px' }}>
                    <div style={{ minWidth:70 }}>
                      <div style={{ fontSize:12, fontWeight:700 }}>{r.ticker}</div>
                      <div style={{ fontSize:9, color:'#888' }}>{r.sig.label}</div>
                    </div>
                    <span style={{ fontSize:11 }}>Score <b>{r.rot.total}</b>/10 — al borde del umbral (sin colchón)</span>
                    <span style={{ marginLeft:'auto', fontSize:11, fontWeight:700, color:rc(r.dyn?.delta1w) }}>
                      Δ1W {r.dyn?.delta1w != null ? (r.dyn.delta1w>0?'+':'')+r.dyn.delta1w : '—'} {r.dyn?.arrow}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}
      {rotHistoryBootstrap.ready && spyAboveSma200 === false && (
        <div style={{ fontSize:10, color:'#888', marginBottom:10 }}>
          Watchlist de promoción/degradación no disponible mientras el Master Filter está activo (SPY&lt;SMA200) — las señales están degradadas y el umbral de referencia no sería fiable.
        </div>
      )}

      {/* Rotation Heatmap */}
      <div style={{ fontSize:11, fontWeight:700, color:'#333', marginBottom:6, textTransform:'uppercase', letterSpacing:1 }}>
        Mapa de Rotación — {UNIVERSE.length} activos
        {spyAboveSma200===false && <span style={{ marginLeft:10, fontSize:10, color:'#b71c1c', fontWeight:400 }}>⚠ Master Filter activo — SPY bajo SMA200 (señales degradadas)</span>}
      </div>
      {rotHistoryBootstrap.startDate && !rotHistoryBootstrap.ready && (
        <div style={{ fontSize:10, color:'#888', fontWeight:400, marginBottom:8, marginTop:-4 }}>
          Métricas históricas (Δ semanal, semanas en señal, watchlist) disponibles a partir de la segunda semana desde {rotHistoryBootstrap.startDate}.
        </div>
      )}
      <table style={{ width:'100%', borderCollapse:'collapse', fontSize:11 }}>
        <thead>
          <tr>
            <th style={{ ...TH_S, textAlign:'left', padding:'7px 9px' }}>Activo</th>
            <th style={{ ...TH_S, textAlign:'left' }}>Cat.</th>
            <Th col="w1"  label="1W vs SPY" tip={"Retorno semanal relativo a SPY\n\n(Precio_hoy / Precio_5d) − (SPY_hoy / SPY_5d)\n\nPositivo = outperformance esta semana.\nNo puntúa directamente en el Score."} />
            <Th col="m1"  label="RS 4w"     tip={"Relative Strength 4 semanas vs SPY\n\n(Retorno 4w del activo) − (Retorno 4w SPY)\n\nPositivo → outperformance último mes.\nContribuye 1 pt al Bloque A."} />
            <Th col="rsi" label="RS 13w"    tip={"Relative Strength 13 semanas vs SPY\n\n(Retorno 13w del activo) − (Retorno 13w SPY)\n\nPositivo → outperformance trimestral.\nContribuye 2 pts al Bloque A (peso doble)."} />
            <ThTip style={TH_S} tip={"RSI 14 períodos\n\nMide fuerza del momentum en escala 0–100.\n• >70 = sobrecompra → −1 pt (Bloque C)\n• <30 = sobreventa → +1 pt (Bloque C)\n• 30–70 = neutro\n\nActúa como filtro anti-extremal para evitar entrar en picos de euforia."}>RSI</ThTip>
            <ThTip style={TH_S} tip={"SMA 200 días\n\nPrecio vs media móvil de 200 días.\n• Precio > SMA200 → +1 pt (Bloque A)\n• Precio < SMA200 → 0 pt\n\nFiltro de tendencia primaria. También condiciona el Master Filter global: si SPY < SMA200, todas las señales se degradan 1 nivel."}>SMA200</ThTip>
            <ThTip style={TH_S} tip={"OBV — On-Balance Volume\n\nAcumula el volumen del día según dirección del precio (suma si sube, resta si baja). Confirma si el dinero acompaña al precio.\n\nCriterio: OBV > SMA(OBV, 10) → +1 pt\nDivergencia OBV/precio = señal de debilidad.\n\nBloque B · Componente 'Flujo'"}>OBV</ThTip>
            <ThTip style={TH_S} tip={"Ratio Volumen 20d / 60d\n\nCompara el volumen reciente con su media trimestral.\n• >1.1 = volumen acelerado → +1 pt\n• <1.0 = volumen desacelerado → 0 pt\n\nDetecta acumulación institucional temprana antes de que el precio arranque.\n\nBloque B · Componente 'Volumen'"}>Vol20/60</ThTip>
            <ThTip style={TH_S} tip={"Puntuación por bloque del RotationScore\n\nA (4 pts) — Momentum relativo:\n  RS4w (1pt) + RS13w (2pt) + SMA200 (1pt)\n\nB (3 pts) — Flujo / Volumen:\n  CMF (1pt) + OBV (1pt) + Vol20/60 (1pt)\n\nC (3 pts) — Técnico:\n  MACD (1pt) + RSI anti-ext (1pt) + anti-extremal (1pt)\n\nTotal = A + B + C = Score /10"}>A·B·C</ThTip>
            <Th col="rot" label="Score /10" tip={"RotationScore v2 — 10 puntos, 3 bloques\n\nA (4 pts): RS4w + RS13w(×2) + SMA200\nB (3 pts): CMF + OBV + Vol20/60\nC (3 pts): MACD + RSI + AntiExtremal\n\n≥8 durante 3 semanas → zona ROT.CONFIRMADA\n≥6 con inflexión (+2 vs semana anterior) → posible ROT.TEMPRANA\n≥7 → COMPRA (con Fit)\n5–6 → ACUMULAR (con Fit)\n<5 → sin señal"} />
            <ThTip style={TH_S} tip={"Fit — nivel de encaje con el régimen actual (Fase 5.1)\n\n✓ core: líder activo del régimen ahora mismo (effectiveLeaders) — único nivel que habilita COMPRA/ACUMULAR\n◐ secondary: está en la lista del régimen, pero un condicional lo filtró ahora mismo (ej. Gold/IWM)\n○ neutral: no es líder de ningún régimen\n⚠ contrary: líder típico de OTRO régimen — combinado con score alto, anomalía a revisar (fila resaltada)"}>Fit</ThTip>
            <ThTip style={TH_S} tip={"Señal de entrada\n\n▲ COMPRA: Fit ✓ + Score ≥ 7\n◉ ACUMULAR: Fit ✓ + Score 5–6\n◑ ROT.CONFIRMADA: score≥8 durante 3w + ≥2 ETFs en cluster + SPY>SMA200 o NetLiq>300B\n⚡ ROT.TEMPRANA: inflexión (+2 vs semana anterior) + score≥6 + RS4w>0 + Konc 3D≠distribution + ≥2 ETFs en cluster con la misma inflexión + SPY>SMA200 o NetLiq>300B\n\n⚠ Master Filter: SPY < SMA200 degrada 1 nivel (ninguna de las dos señales de rotación se degrada, cada una lleva su propio filtro de benchmark)."}>Señal</ThTip>
            <ThTip style={TH_S} tip={"Δ Score 1W (Fase 2)\n\nDiferencia de score vs la lectura más cercana a hace 7 días en rotation_history.\n≥+2 → ↗ verde · entre −1 y +1 → → gris · ≤−2 → ↘ rojo\n\n'—' si aún no hay 2 semanas de histórico (empezó el " + (rotHistoryBootstrap.startDate||'—') + ")."}>Δ 1W</ThTip>
            <ThTip style={TH_S} tip={"Semanas en la señal actual (Fase 2)\n\nDías naturales desde que la señal actual empezó, convertidos a semanas. Se basa en tiempo transcurrido, no en nº de veces que se abrió la pestaña.\n\n'—' si aún no hay 2 semanas de histórico."}>Sem.</ThTip>
            <ThTip style={TH_S} tip={"Perfil de balance de subscores (Fase 5.2)\n\nEquilibrado: A≥2, B≥2, C≥2\nSolo momentum: A≥3, B≤1, C≤1\nCon flujo: A≥2, B≥2, C<2\nSolo técnico: C≥3, A≤1, B≤1\nFrágil: score≥6 con un bloque en 0, o técnico puro (C≥3, A≤1)\n\nBalanced/flow_supported son más fiables. Los perfiles 'frágil' son señal de riesgo elevado aunque el score sea alto."}>Perfil</ThTip>
          </tr>
        </thead>
        <tbody>
          {sorted.map((r,i) => {
            const d=r.d, rot=r.rot, isSpy=r.ticker==='SPY';
            // Fase 5.1 — anomalía: score alto (≥6) en un ticker "contrary" (líder típico de
            // OTRO régimen, no del actual). Umbral 6 elegido por ser el punto medio entre
            // el suelo de ACUMULAR (5) y COMPRA (7) — "alto" en el sentido de "ya sería
            // señal si tuviera fit", no un umbral nuevo inventado aparte de los ya usados.
            const isAnomaly = !isSpy && r.fitLevel === 'contrary' && rot.total >= 6;
            return (
              <tr key={r.ticker} style={{
                background: isAnomaly ? '#fff3e0' : (isSpy?'#f8f9fa':i%2===0?'#fff':'#fafafa'),
                ...(isAnomaly ? { boxShadow:'inset 3px 0 0 #e65100' } : {}) }}>
                <td style={{ padding:'5px 9px', borderBottom:'1px solid #eee' }}>
                  <span style={{ fontSize:12, fontWeight:700 }}>{r.ticker}</span>
                  <span style={{ fontSize:9, color:'#bbb', marginLeft:5 }}>{r.name}</span>
                  {rotHistoryBootstrap.ready && r.dyn?.badge && (
                    <span style={{ fontSize:8, fontWeight:700, marginLeft:5, borderRadius:3, padding:'1px 5px',
                      background:r.dyn.badge==='UPGRADED'?'#e8f5e9':'#ffebee',
                      color:r.dyn.badge==='UPGRADED'?'#1b5e20':'#b71c1c' }}>
                      {r.dyn.badge}
                    </span>
                  )}
                </td>
                <td style={{ padding:'5px 9px', borderBottom:'1px solid #eee', color:'#999', fontSize:9 }}>{r.cat}</td>
                <td style={{ padding:'5px 9px', borderBottom:'1px solid #eee', textAlign:'center', fontWeight:700, fontSize:11, color:rc(rot.w1Rel) }}>
                  {relFmt(rot.w1Rel)}
                </td>
                <td style={{ padding:'5px 9px', borderBottom:'1px solid #eee', textAlign:'center', fontWeight:700, fontSize:11, color:rc(rot.m1Rel) }}>
                  {relFmt(rot.m1Rel)}
                </td>
                <td style={{ padding:'5px 9px', borderBottom:'1px solid #eee', textAlign:'center', fontWeight:700, fontSize:11, color:rc(rot.m3Rel) }}>
                  {relFmt(rot.m3Rel)}
                </td>
                <td style={{ padding:'5px 9px', borderBottom:'1px solid #eee', textAlign:'center' }}>
                  {d?.rsi!=null?<span style={{ fontWeight:700, color:d.rsi>70?'#b71c1c':d.rsi<35?'#e65100':'#1b5e20' }}>{d.rsi}</span>:'—'}
                </td>
                <td style={{ padding:'5px 9px', borderBottom:'1px solid #eee', textAlign:'center', fontSize:11 }}>
                  {d?.closeAboveSma200!=null?<span style={{ color:d.closeAboveSma200?'#1b5e20':'#b71c1c' }}>{d.closeAboveSma200?'▲':'▽'}</span>:'—'}
                </td>
                <td style={{ padding:'5px 9px', borderBottom:'1px solid #eee', textAlign:'center', fontSize:11 }}>
                  {d?.obvAboveSma50!=null?<span style={{ color:d.obvAboveSma50?'#1b5e20':'#b71c1c' }}>{d.obvAboveSma50?'↑':'↓'}</span>:'—'}
                </td>
                <td style={{ padding:'5px 9px', borderBottom:'1px solid #eee', textAlign:'center', fontSize:10,
                  color:d?.volRatio!=null?(d.volRatio>1.1?'#1b5e20':d.volRatio>0.9?'#555':'#b71c1c'):'#aaa' }}>
                  {d?.volRatio!=null?d.volRatio.toFixed(2):'—'}
                </td>
                <td style={{ padding:'5px 9px', borderBottom:'1px solid #eee', textAlign:'center' }}>
                  {!isSpy?<span style={{ fontSize:10, color:'#555' }}>{rot.blockA}·{rot.blockB}·{rot.blockC}</span>:'—'}
                </td>
                <td style={{ padding:'5px 9px', borderBottom:'1px solid #eee', textAlign:'center' }}>
                  {isSpy?<span style={{ fontSize:9, color:'#aaa' }}>ref</span>:
                    <span style={{ fontWeight:700, fontSize:12 }}>
                      {rot.total}
                      {rotHistoryBootstrap.ready && r.dyn && (
                        <span style={{ fontSize:10, marginLeft:3, color:r.dyn.arrow==='↗'?'#1b5e20':r.dyn.arrow==='↘'?'#b71c1c':'#aaa' }}>{r.dyn.arrow}</span>
                      )}
                    </span>}
                </td>
                <td style={{ padding:'5px 9px', borderBottom:'1px solid #eee', textAlign:'center', fontSize:10 }}>
                  {!isSpy
                    ? <span title={isAnomaly?'⚠ Anomalía: score alto pero líder típico de otro régimen':r.fitLevel}
                        style={{ fontWeight:700, color:FIT_LEVEL_META[r.fitLevel]?.color??'#ccc' }}>
                        {FIT_LEVEL_META[r.fitLevel]?.icon ?? '○'}
                      </span>
                    : '—'}
                </td>
                <td style={{ padding:'5px 9px', borderBottom:'1px solid #eee', textAlign:'center' }}>
                  {r.sig.label!=='—'&&r.sig.label!=='ref'?
                    <span style={{ background:r.sig.bg, color:r.sig.color, borderRadius:4, padding:'2px 6px', fontSize:10, fontWeight:700, whiteSpace:'nowrap' }}>
                      {r.sig.label}
                    </span>:<span style={{ color:'#ddd' }}>—</span>}
                </td>
                <td style={{ padding:'5px 9px', borderBottom:'1px solid #eee', textAlign:'center', fontSize:11, fontWeight:700,
                  color: !rotHistoryBootstrap.ready || isSpy || r.dyn?.delta1w==null ? '#ccc' : rc(r.dyn.delta1w) }}>
                  {!rotHistoryBootstrap.ready || isSpy || r.dyn?.delta1w==null ? '—' : (r.dyn.delta1w>0?'+':'')+r.dyn.delta1w}
                </td>
                <td style={{ padding:'5px 9px', borderBottom:'1px solid #eee', textAlign:'center', fontSize:10, color:'#888' }}>
                  {!rotHistoryBootstrap.ready || isSpy || r.dyn?.weeksInSignal==null ? '—' : r.dyn.weeksInSignal}
                </td>
                <td style={{ padding:'5px 9px', borderBottom:'1px solid #eee', textAlign:'center', fontSize:9, fontWeight:700 }}>
                  {!isSpy && r.subscoreProfile
                    ? <span style={{ color:SUBSCORE_PROFILE_META[r.subscoreProfile]?.color }}>{SUBSCORE_PROFILE_META[r.subscoreProfile]?.label}</span>
                    : '—'}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>

      <StockCandidates data={stockCandidates} />

      {/* Footer */}
      <div style={{ marginTop:16, background:'#f8f9fa', border:'1px solid #e0e0e0', borderRadius:8, padding:'10px 14px' }}>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:10, fontSize:11 }}>
          <div>
            <b style={{ color:'#333' }}>MacroScore /100</b><br/>
            <span style={{ color:'#666', lineHeight:1.8 }}>HY/25 · Net Liq Δ13w/25 · VolScore/20 · Curva/15 · CFNAI/15</span>
          </div>
          <div>
            <b style={{ color:'#333' }}>Rotation Score /10</b><br/>
            <span style={{ color:'#666', lineHeight:1.8 }}>A(4): RS13w+RS4w+SMA200 · B(3): CMF+OBV+Vol · C(3): MACD+RSI+AntiExt</span>
          </div>
          <div>
            <b style={{ color:'#333' }}>Señales</b><br/>
            <span style={{ color:'#666', lineHeight:1.8 }}>COMPRA: Fit+≥7 · ACUMULAR: Fit+5-6 · ROT.CONFIRMADA: streak≥3+clúster+benchmark · ROT.TEMPRANA: inflexión+RS4w+Konc3D+clúster+benchmark · Master Filter: SPY{'<'}SMA200→-1 nivel (no degrada ninguna ROT.*)</span>
          </div>
        </div>
      </div>

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
