<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ETFs Inversos — Market Tracker</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#0b3d63"/>
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32"/>
  <link rel="icon" href="/icons/favicon-16.png" sizes="16x16"/>
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});}</script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>
  <script src="/shared/inverse-etf-lib.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; color: #1f2933; }
    .wrap { background: white; min-width: 960px; min-height: 100vh; padding: 16px 20px; overflow-x: auto; }
    .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    .title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 20px; color: #111; line-height: 1; }
    .nav-link { font-size: 11px; text-decoration: none; padding: 2px 10px; border: 1px solid; border-radius: 12px; line-height: 20px; }
    .meta { font-size: 9px; color: #999; margin-top: 4px; font-style: italic; }
    .actions { display: flex; align-items: center; gap: 8px; }
    button { border: none; border-radius: 3px; padding: 5px 12px; cursor: pointer; font-size: 11px; font-weight: 600; color: white; }
    button:disabled { cursor: default; opacity: 0.65; }
    .btn-copy { background: #1a6b3c; } .btn-export { background: #37474f; } .btn-refresh { background: #3a6ca0; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a6b3c; color: white; padding: 10px 22px; border-radius: 20px; font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.18); z-index: 10; }
    .section-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: #344054; margin: 18px 0 4px; padding-bottom: 4px; border-bottom: 2px solid #e6e8eb; }
    .section-sub { font-size: 10px; color: #98a2b3; margin-bottom: 10px; font-style: italic; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .card { border: 1px solid #e6e8eb; border-radius: 6px; background: #fbfcfd; padding: 12px 14px; border-left-width: 5px; }
    .card h2 { font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card .sub { font-size: 10.5px; color: #667085; margin-top: 3px; }
    .kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 12px; margin: 10px 0; }
    .kv .k { font-size: 9px; text-transform: uppercase; letter-spacing: .3px; color: #98a2b3; }
    .kv .v { font-size: 13px; font-weight: 700; font-family: Consolas, monospace; }
    .checks { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
    .chk { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 700; }
    .chk.ok { background: #c8e6c9; color: #1b5e20; } .chk.no { background: #f0f0f0; color: #667085; } .chk.na { background: #fff9c4; color: #e65100; }
    .opt { border-top: 1px dashed #d0d5dd; margin-top: 8px; padding-top: 8px; font-size: 11px; }
    .opt .warn { color: #b71c1c; font-weight: 700; }
    details { margin-top: 8px; font-size: 10.5px; color: #475467; }
    details summary { cursor: pointer; font-weight: 700; color: #344054; }
    details ul { margin: 4px 0 0 18px; }
    .pos { color: #1b5e20; } .neg { color: #b71c1c; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 10px; }
    th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #eef0f2; white-space: nowrap; }
    th { font-size: 9px; text-transform: uppercase; color: #98a2b3; letter-spacing: .3px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; }
    .gap-note { border: 1px solid #ffe0b2; background: #fff8ef; color: #8a5200; border-radius: 6px; padding: 8px 12px; font-size: 10px; margin-bottom: 10px; }
    .footer-note { font-size: 9px; color: #98a2b3; margin-top: 14px; font-style: italic; }
    .loading { font-size: 11px; color: #98a2b3; padding: 20px 0; text-align: center; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const BADGE = {
  green:   { bg: '#c8e6c9', fg: '#1b5e20' },
  orange:  { bg: '#ffe0b2', fg: '#bf360c' },
  neutral: { bg: '#f0f0f0', fg: '#555' },
};
const STATE_BORDER = { fading: '#2e7d32', spike: '#ef6c00', calm: '#cfd4da', no_data: '#cfd4da' };

const fmtPct = v => v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
const fmtN = (v, d = 2) => v == null ? '—' : v.toFixed(d);
const signCls = v => v == null ? '' : v > 0 ? 'pos' : v < 0 ? 'neg' : '';

function useToast() {
  const [toast, setToast] = React.useState(null);
  const show = React.useCallback(msg => { setToast(msg); setTimeout(() => setToast(null), 3000); }, []);
  return [toast, show];
}

async function fetchQuote(sym) {
  try { const d = await fetch(`/api/quote/${encodeURIComponent(sym)}`).then(r => r.json()); return d.error ? null : d; }
  catch (e) { return null; }
}

// Última fila de opciones por ticker (el fichero puede no existir todavía).
async function fetchOptionsLatest() {
  try {
    const r = await fetch('/docs/data/inverse_etf_options_summary.jsonl?t=' + Date.now());
    if (!r.ok) return {};
    const out = {};
    (await r.text()).split('\n').filter(Boolean).forEach(l => {
      try { const x = JSON.parse(l); if (!out[x.ticker] || x.date >= out[x.ticker].date) out[x.ticker] = x; } catch (e) {}
    });
    return out;
  } catch (e) { return {}; }
}

function Check({ label, v }) {
  const cls = v == null ? 'na' : v ? 'ok' : 'no';
  return <span className={'chk ' + cls}>{v == null ? '? ' : v ? '✓ ' : '✗ '}{label}</span>;
}

function EtfCard({ etf, q, u, c, o }) {
  const meta = INV_STATE_META[c.state];
  const b = BADGE[meta.badge];
  return (
    <div className="card" style={{ borderLeftColor: STATE_BORDER[c.state] }}>
      <h2>
        <span style={{ color: etf.color }}>{etf.ticker}</span>
        <span className="badge" style={{ background: b.bg, color: b.fg }}>{meta.label}</span>
      </h2>
      <div className="sub">{etf.name}</div>
      {q ? (
        <>
          <div className="kv">
            <div><div className="k">Precio</div><div className="v">{fmtN(q.price)}</div></div>
            <div><div className="k">1D</div><div className={'v ' + signCls(q.d1)}>{fmtPct(q.d1)}</div></div>
            <div><div className="k">1M</div><div className={'v ' + signCls(q.m1)}>{fmtPct(q.m1)}</div></div>
            <div><div className="k">Dist. SMA20 (ATR)</div><div className="v">{fmtN(invDistAtr(q))}</div></div>
            <div><div className="k">RSI14</div><div className="v">{q.rsi ?? '—'}</div></div>
            <div><div className="k">Δ hist. MACD</div><div className={'v ' + signCls(q.macdHistDelta1)}>{q.macdHistDelta1 == null ? '—' : (q.macdHistDelta1 >= 0 ? '+' : '') + q.macdHistDelta1.toFixed(3)}</div></div>
          </div>
          <div className="checks">
            {c.checks.map((k, i) => <Check key={i} label={k.label} v={k.v} />)}
          </div>
          <div className="sub">
            Subyacente {etf.under}: {u ? <b>{fmtN(u.price)}</b> : '—'} · 1S <span className={signCls(u && u.w1)}>{u ? fmtPct(u.w1) : '—'}</span> · 1D <span className={signCls(u && u.d1)}>{u ? fmtPct(u.d1) : '—'}</span>
            {etf.coolW1 != null && <>{' '}(umbral de enfriamiento: {etf.sign > 0 ? '−' : '+'}{etf.coolW1}% semanal)</>}
          </div>
          <div className="sub" style={{ marginTop: 6 }}><i>{meta.desc}</i></div>
        </>
      ) : <div className="loading">Sin datos del ETF</div>}

      <div className="opt">
        <b>Opciones</b>{' '}
        {o ? (
          <>
            <span style={{ color: '#98a2b3' }}>({o.date}, venc. {o.expiry}, {o.dte} DTE)</span><br/>
            IV ATM <b>{(o.atmIv * 100).toFixed(0)}%</b> · RV20 {o.rv20 != null ? (o.rv20 * 100).toFixed(0) + '%' : '—'} ·
            IV/RV20 <b>{o.ivRv != null ? o.ivRv.toFixed(2) : '—'}</b>{o.rich ? ' (prima rica)' : ''} ·
            skew call−put {o.skew != null ? (o.skew * 100).toFixed(0) + 'pp' : '—'} ·
            spread {o.spread != null ? (o.spread * 100).toFixed(0) + '%' : '—'}{o.illiquid && <span className="warn"> ⚠ ilíquido</span>} ·
            OI C/P {o.oiCalls?.toLocaleString('es-ES')}/{o.oiPuts?.toLocaleString('es-ES')}
            {o.term && (o.term.front || o.term.long) && (
              <div style={{ marginTop: 4 }}>
                <b>Plazos:</b>{' '}
                {o.term.front ? `~1m (${o.term.front.dte} DTE) IV ${(o.term.front.atmIv * 100).toFixed(0)}%` : '~1m sin dato'} ·{' '}
                {o.term.long ? `~3m (${o.term.long.dte} DTE) IV ${(o.term.long.atmIv * 100).toFixed(0)}%` : '~3m sin dato'}
                {o.term.ratio != null && <> · ratio 3m/1m <b>{o.term.ratio.toFixed(2)}</b> {o.term.inverted ? '(curva invertida: la put a 3m sale más barata por unidad de vol)' : '(curva normal: la put a 3m no es más barata que la de 1m)'}</>}
                {o.term.long && o.term.long.ivPut80 != null && <> · put 80% a 3m IV {(o.term.long.ivPut80 * 100).toFixed(0)}%</>}
                {o.term.front && o.term.front.ivCall120 != null && <> · call 120% a 1m IV {(o.term.front.ivCall120 * 100).toFixed(0)}%</>}
              </div>
            )}
          </>
        ) : <span style={{ color: '#98a2b3' }}>sin snapshot todavía (se acumula a diario en horario de mercado)</span>}
      </div>

      {etf.strategy && (
        <details open={c.state === 'fading' || c.state === 'spike'}>
          <summary>{etf.strategy.title}</summary>
          <ul>{etf.strategy.lines.map((n, i) => <li key={i}>{n}</li>)}</ul>
        </details>
      )}
      <details>
        <summary>Peculiaridades de {etf.ticker}</summary>
        <div style={{ marginTop: 4 }}><b>Decay:</b> {etf.decay}</div>
        <ul>{etf.notes.map((n, i) => <li key={i}>{n}</li>)}</ul>
      </details>
    </div>
  );
}

// ── Recomendación de operación con opciones ─────────────────────────────────
// Generada por scripts/inverse_etf_recommendations.py (menú fijo de estructuras
// con la última cadena guardada). La página solo decide CUÁNDO mostrarla según
// el estado en vivo del ETF (ventana / spike / calma).
async function fetchRecommendations() {
  try {
    const r = await fetch('/docs/data/inverse_etf_recommendations.json?t=' + Date.now());
    return r.ok ? await r.json() : null;
  } catch (e) { return null; }
}

const GRADE_META = {
  ok:       { label: 'Operable',         bg: '#c8e6c9', fg: '#1b5e20' },
  marginal: { label: 'Con cautelas',     bg: '#fff3cd', fg: '#8a5200' },
  avoid:    { label: 'No fiable',        bg: '#ffcdd2', fg: '#b71c1c' },
};
const money = v => v == null ? '—' : (v < 0 ? '−$' : '$') + Math.abs(v).toLocaleString('es-ES', { maximumFractionDigits: 0 });
const per100 = v => v == null ? null : v * 100;

function legsText(s) {
  if (s.kind === 'put') return `compra ${s.strikes.long}`;
  if (s.kind === 'call_spread') return `vende ${s.strikes.short} / compra ${s.strikes.long}`;
  return `compra ${s.strikes.long} / vende ${s.strikes.short}`;
}

function contractsFor(maxLossPerShare, budget) {
  const per = maxLossPerShare * 100;
  return per > 0 ? Math.floor(budget / per) : 0;
}

function evText(s) {
  const ev = s.ev_by_basis && s.ev_by_basis[s.primary_basis];
  if (!ev) return { txt: 'sin distribución', cls: '' };
  if (!s.ev_reliable) return { txt: 'no fiable (cadena ilíquida)', cls: '' };
  const sign = ev.ev_pnl >= 0 ? '+' : '−';
  return {
    txt: `${sign}${money(Math.abs(ev.ev_pnl) * 100)}/contrato (${ev.ev_ret_pct >= 0 ? '+' : ''}${ev.ev_ret_pct}% · TAE ${ev.tae_ev_pct >= 0 ? '+' : ''}${ev.tae_ev_pct}%)`,
    cls: ev.ev_pnl >= 0 ? 'pos' : 'neg',
  };
}

function StructTable({ list, budget, title }) {
  if (!list || !list.length) return <div className="sub" style={{ margin: '4px 0 8px' }}>{title}: sin estructura utilizable con la cadena guardada.</div>;
  return (
    <div style={{ overflowX: 'auto', marginBottom: 6 }}>
      <table>
        <caption style={{ textAlign: 'left', fontSize: 11, fontWeight: 700, color: '#344054', padding: '4px 0' }}>{title}</caption>
        <thead><tr>
          <th>Estructura</th><th>Venc. (DTE)</th><th>Strikes</th><th>Prima estimada</th><th>Rango (media–peor)</th>
          <th>Riesgo máx.</th><th>Gan. máx.</th><th>Breakeven</th><th>Rent. máx. (TAE)</th>
          <th>Valor esperado (histórico)</th><th>P ganar / P pérd. máx.</th><th>Calidad</th><th>Contratos</th>
        </tr></thead>
        <tbody>
          {list.map(s => {
            const g = GRADE_META[s.grade];
            const ev = s.ev_by_basis && s.ev_by_basis[s.primary_basis];
            const n = contractsFor(s.max_loss, budget);
            const isCredit = s.premium.type === 'credit';
            const e = evText(s);
            return (
              <tr key={s.id} style={s.agreed ? { background: '#f6fbf7' } : null}>
                <td><b>{s.label}</b>{s.agreed && <span title="Estructura acordada" style={{ color: '#2e7d32' }}> ★</span>}</td>
                <td>{s.expiry} ({s.dte})</td>
                <td>{legsText(s)}</td>
                <td><b>{isCredit ? 'crédito ' : 'débito '}{fmtN(s.premium.est)}</b> <span style={{ color: '#98a2b3' }}>({money(s.premium.est * 100)}/contr.)</span></td>
                <td style={{ color: '#667085' }}>{fmtN(s.premium.mid)} – {fmtN(s.premium.worst)}</td>
                <td className="neg">{fmtN(s.max_loss)} ({money(s.max_loss * 100)})</td>
                <td className="pos">{fmtN(s.max_gain)} ({money(s.max_gain * 100)})</td>
                <td>{fmtN(s.breakeven)} ({fmtPct(s.breakeven_pct)})</td>
                <td>{s.ret_max_pct}% (TAE {s.tae_max_pct}%)</td>
                <td className={e.cls}>{e.txt}</td>
                <td>{ev && s.ev_reliable ? `${ev.p_profit}% / ${ev.p_max_loss}%` : '—'}{ev && <span style={{ color: '#98a2b3' }}> n={ev.n}</span>}</td>
                <td><span className="badge" title={s.grade_reason} style={{ background: g.bg, color: g.fg }}>{g.label}</span></td>
                <td>{n > 0 ? <b>{n}</b> : <span style={{ color: '#98a2b3' }} title="El riesgo de 1 contrato supera el presupuesto">0</span>}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function PayoffTable({ r }) {
  const all = [...(r.put || []), ...(r.call || [])];
  if (!all.length) return null;
  const moves = all[0].payoff.map(p => p.move_pct);
  return (
    <details>
      <summary>Escenarios al vencimiento (P&amp;L por contrato según lo que haga el ETF)</summary>
      <div style={{ overflowX: 'auto' }}>
        <table style={{ marginTop: 6 }}>
          <thead><tr><th>Estructura</th>{moves.map(m => <th key={m}>{m > 0 ? '+' : ''}{m}%</th>)}</tr></thead>
          <tbody>
            {all.map(s => (
              <tr key={s.id}>
                <td>{s.label} <span style={{ color: '#98a2b3' }}>({s.dte}d)</span></td>
                {s.payoff.map(p => <td key={p.move_pct} className={p.pnl > 0 ? 'pos' : p.pnl < 0 ? 'neg' : ''}>{money(per100(p.pnl))}</td>)}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="sub">P&amp;L a su propio vencimiento (la call vence antes que la put), sin gestión intermedia ni comisiones.</div>
    </details>
  );
}

function RecoBlock({ etf, state, r: rSaved, budget, live, onRefresh, onClearLive }) {
  const r = (live && live.reco) || rSaved;
  const meta = INV_STATE_META[state];
  const b = BADGE[meta.badge];
  const active = state === 'fading' || state === 'spike';
  const ap = r && r.put && r.put.find(s => s.id === (r.agreed && r.agreed.put));
  const ac = r && r.call && r.call.find(s => s.id === (r.agreed && r.agreed.call));
  const stale = r && r.chain_date && !r.live ? Math.round((Date.now() - new Date(r.chain_date + 'T12:00:00').getTime()) / 86400000) : null;

  let banner;
  if (!r || r.error) banner = { bg: '#f0f0f0', fg: '#555', txt: 'Sin recomendaciones generadas para este ETF (faltan snapshots de cadena).' };
  else if (state === 'fading') {
    const goods = [ap, ac].filter(s => s && s.grade !== 'avoid');
    if (!ap && !ac) banner = { bg: '#fff3cd', fg: '#8a5200', txt: 'Ventana de venta de prima activa, pero la cadena guardada no ofrece las estructuras acordadas.' };
    else if (!goods.length) banner = { bg: '#ffcdd2', fg: '#b71c1c', txt: 'Ventana de venta de prima ACTIVA, pero con las cotizaciones guardadas ninguna de las estructuras acordadas es fiable: contrasta la cadena en vivo en tu broker antes de operar. No hay base para recomendar entrada con estas primas.' };
    else banner = { bg: '#c8e6c9', fg: '#1b5e20', txt: 'Ventana de venta de prima ACTIVA: estas son las estructuras evaluadas con la cadena guardada. Confírmalas con cotizaciones en vivo (spreads reales) antes de enviar la orden.' };
  } else if (state === 'spike') banner = { bg: '#ffe0b2', fg: '#bf360c', txt: 'Spike en curso, pero el ETF aún no gira: ESPERAR. Vender prima ahora es ir contra el movimiento. Estructuras mostradas como preparación, no como orden.' };
  else banner = { bg: '#f0f0f0', fg: '#555', txt: 'Sin spike: no hay setup. Estructuras mostradas solo como referencia (la prima suele estar barata y el riesgo de spike no está pagado).' };

  const pkgLoss = ap && ac ? ap.max_loss + ac.max_loss : null;
  const pkgN = pkgLoss ? contractsFor(pkgLoss, budget) : null;

  return (
    <div className="card" style={{ borderLeftColor: STATE_BORDER[state], marginBottom: 12 }}>
      <h2>
        <span style={{ color: etf.color }}>{etf.ticker}</span>
        <span className="badge" style={{ background: b.bg, color: b.fg }}>{meta.label}</span>
        {r && r.chain_date && !r.live && <span style={{ fontSize: 10, fontWeight: 400, color: stale > 3 ? '#b71c1c' : '#98a2b3' }}>cadena guardada del {r.chain_date}{stale != null ? ` (hace ${stale} d)` : ''} · spot {fmtN(r.spot)}</span>}
        {r && r.live && <span className="badge" style={{ background: r.data_type === 'live' ? '#c8e6c9' : '#fff3cd', color: r.data_type === 'live' ? '#1b5e20' : '#8a5200' }}>
          IBKR {r.data_type === 'live' ? 'EN VIVO' : r.data_type === 'delayed' ? 'RETRASADO ~15 min' : r.data_type === 'frozen' ? 'CONGELADO (cierre)' : ''} · {(r.collected_at || '').slice(11, 16)} ET · spot {fmtN(r.spot)}
        </span>}
        <span style={{ marginLeft: 'auto', display: 'inline-flex', gap: 6 }}>
          {r && r.live && <button className="btn-export" onClick={onClearLive} style={{ fontSize: 10 }}>Volver a la cadena guardada</button>}
          <button className="btn-refresh" onClick={onRefresh} disabled={live && live.loading} style={{ fontSize: 10 }}
                  title="Pide a TWS/IB Gateway (abierto en este PC, API activada) las cotizaciones actuales de las opciones y recalcula las estructuras">
            {live && live.loading ? 'Pidiendo a IBKR…' : '⟳ Cadena en vivo (IBKR)'}
          </button>
        </span>
      </h2>
      {live && live.error && (
        <div style={{ background: '#ffebee', color: '#b71c1c', borderRadius: 4, padding: '7px 10px', fontSize: 11, margin: '8px 0' }}>
          <b>No se pudo obtener la cadena en vivo{live.code ? ` (${live.code})` : ''}:</b> {live.error}
          {r && !r.live && <div style={{ marginTop: 3, color: '#667085' }}>Se sigue mostrando la cadena guardada.</div>}
        </div>
      )}
      <div style={{ background: banner.bg, color: banner.fg, borderRadius: 4, padding: '7px 10px', fontSize: 11, fontWeight: 600, margin: '8px 0' }}>{banner.txt}</div>
      {r && !r.error && (
        <>
          {(r.notes || []).map((n, i) => <div key={i} className="sub" style={{ color: '#8a5200' }}>⚠ {n}</div>)}
          {r.implied_carry && (
            <div className="sub">
              Carry implícito (parity, {r.implied_carry.dte} DTE): la cadena descuenta una deriva de <b>{r.implied_carry.implied_drift_pct}%</b>
              {r.implied_carry.hist_median_pct != null && <> frente a la mediana histórica del ETF de <b>{r.implied_carry.hist_median_pct}%</b></>}
              {r.implied_carry.signal_median_pct != null && <> (<b>{r.implied_carry.signal_median_pct}%</b> tras la señal)</>}
              {r.implied_carry.hist_median_pct != null && (r.implied_carry.implied_drift_pct <= r.implied_carry.hist_median_pct * 0.7 ? ' → el decay ya está en el precio.' : ' → la cadena implica bastante menos caída que la histórica: hay hueco, con la cautela de que el pasado no garantiza.')}
            </div>
          )}
          <div className="sub" style={{ marginBottom: 6 }}>Valor esperado medido sobre: <b>{r.primary_basis === 'signal' ? `días con la señal (${r.distributions.signal.n_at_60d} observaciones solapadas, ~${r.distributions.signal.episodes_at_60d} episodios independientes)` : `todo el historial del ETF (${r.distributions.uncond ? r.distributions.uncond.n_at_60d : '—'} observaciones solapadas; señal sin calibrar)`}</b>.</div>
          <StructTable list={r.put} budget={budget} title="Lado bajista — comprar puts (~90 DTE): aprovecha el decay, riesgo limitado a la prima" />
          <StructTable list={r.call} budget={budget} title="Lado vendedor — call spread vendido (~30 DTE): cobra prima, riesgo limitado al ancho del spread" />
          {ap && ac && (
            <div className="opt">
              <b>Paquete acordado (★ put spread + ★ call spread):</b> prima neta {ap.premium.est - ac.premium.est >= 0 ? 'a pagar' : 'a cobrar'} <b>{fmtN(Math.abs(ap.premium.est - ac.premium.est))}</b>/acción
              ({money(Math.abs(ap.premium.est - ac.premium.est) * 100)}/contrato) · peor caso combinado (ETF se dispara) <span className="neg"><b>{money(pkgLoss * 100)}/contrato</b></span>
              {pkgN != null && <> · con tu presupuesto: <b>{pkgN}</b> contrato(s)</>}.
              <div className="sub">La call vence a ~30 días y la put a ~90: el paquete solo es un cálculo de prima y riesgo, no un payoff conjunto. Al vencer la call hay que decidir si se rueda.</div>
            </div>
          )}
          <PayoffTable r={r} />
        </>
      )}
    </div>
  );
}

// Resumen en texto de las recomendaciones para el export a LLM: solo ETFs en
// spike/ventana (con el resto, una línea), mismas cifras que la tabla de la página.
function recoMarkdown(rows, recs, budget, live = {}) {
  const NL = String.fromCharCode(10);
  let md = NL + `### Recomendación de opciones (presupuesto de riesgo $${budget})` + NL;
  if (!recs) return md + 'Sin inverse_etf_recommendations.json todavía.' + NL;
  const active = rows.filter(x => x.c.state === 'fading' || x.c.state === 'spike');
  if (!active.length) md += 'Ningún ETF en spike ni ventana de venta de prima: sin recomendación.' + NL;
  active.forEach(({ etf, c }) => {
    const r = (live[etf.ticker] && live[etf.ticker].reco) || (recs.tickers && recs.tickers[etf.ticker]);
    md += NL + `**${etf.ticker}** — ${INV_STATE_META[c.state].label}${c.state === 'spike' ? ' (esperar giro, no entrar aún)' : ''}`;
    if (!r || r.error) { md += ': sin estructuras generadas.' + NL; return; }
    md += ` · ${r.live ? `cadena IBKR ${r.data_type} ${(r.collected_at || '').slice(11, 16)} ET` : `cadena guardada ${r.chain_date}`}, spot ${r.spot}, EV medido sobre ${r.primary_basis === 'signal' ? 'días con señal' : 'historial completo (señal sin calibrar)'}` + NL;
    (r.notes || []).forEach(n => { md += `- ⚠ ${n}` + NL; });
    md += '| Estructura | Venc (DTE) | Strikes | Prima est. | Riesgo máx | Gan. máx | Breakeven | Rent. máx (TAE) | EV (TAE) | Calidad |' + NL + '|---|---|---|---|---|---|---|---|---|---|' + NL;
    [...r.put, ...r.call].forEach(s => {
      const e = evText(s);
      md += `| ${s.label}${s.agreed ? ' ★' : ''} | ${s.expiry} (${s.dte}) | ${legsText(s)} | ${s.premium.type === 'credit' ? 'crédito' : 'débito'} ${fmtN(s.premium.est)} | ${fmtN(s.max_loss)} | ${fmtN(s.max_gain)} | ${fmtN(s.breakeven)} (${fmtPct(s.breakeven_pct)}) | ${s.ret_max_pct}% (${s.tae_max_pct}%) | ${e.txt} | ${GRADE_META[s.grade].label}: ${s.grade_reason} |` + NL;
    });
  });
  return md;
}

function RecoSection({ rows, recs, budget, setBudget, showAll, setShowAll, live, refreshLive, clearLive }) {
  const shown = rows.filter(x => showAll || x.c.state === 'fading' || x.c.state === 'spike')
    .sort((a, b) => INV_STATE_META[b.c.state].rank - INV_STATE_META[a.c.state].rank);
  return (
    <>
      <div className="section-title">Recomendación de operación con opciones</div>
      <div className="section-sub">
        Menú fijo de estructuras (no optimizado) valoradas con la última cadena guardada y la distribución histórica del ETF. Solo se activan con spike o ventana de venta de prima;
        el resto de ETFs aparece solo si marcas «mostrar referencia». Observacional: no envía órdenes ni sustituye las cotizaciones en vivo de tu broker.
      </div>
      <div style={{ display: 'flex', gap: 18, alignItems: 'center', flexWrap: 'wrap', margin: '6px 0 10px', fontSize: 11 }}>
        <label>Presupuesto de riesgo máximo ($):{' '}
          <input type="number" min="0" step="100" value={budget} onChange={e => setBudget(Math.max(0, +e.target.value || 0))}
                 style={{ width: 90, padding: '3px 6px', border: '1px solid #d0d5dd', borderRadius: 3, fontSize: 11 }} />
        </label>
        <label><input type="checkbox" checked={showAll} onChange={e => setShowAll(e.target.checked)} /> Mostrar referencia aunque no haya señal</label>
      </div>
      {!recs && <div className="gap-note">Aún no hay <code>inverse_etf_recommendations.json</code> (se genera tras el snapshot de cadenas: <code>scripts/inverse_etf_recommendations.py</code>).</div>}
      {recs && !shown.length && <div className="loading">Ningún ETF en spike ni ventana de venta de prima ahora mismo. Marca «mostrar referencia» para ver las estructuras evaluadas igualmente.</div>}
      {recs && shown.map(({ etf, c }) => <RecoBlock key={etf.ticker} etf={etf} state={c.state} r={recs.tickers && recs.tickers[etf.ticker]} budget={budget}
                                                    live={live[etf.ticker]} onRefresh={() => refreshLive(etf.ticker)} onClearLive={() => clearLive(etf.ticker)} />)}
      {recs && (
        <div className="footer-note" style={{ marginTop: 6 }}>
          Metodología: prima estimada = {recs.method && recs.method.price_est}; valor esperado = {recs.method && recs.method.ev}; {recs.method && recs.method.tae}; calidad: {recs.method && recs.method.grades}.
          Rentabilidad máxima y TAE máxima son el techo de la estructura (casi nunca se alcanza); la TAE esperada ya pondera la distribución histórica. Las muestras son días solapados: el nº de episodios independientes es mucho menor que el de observaciones.
        </div>
      )}
    </>
  );
}

function InversosPage() {
  const [data, setData] = React.useState({ quotes: {}, unders: {}, options: {}, recs: null });
  const [budget, setBudget] = React.useState(() => { try { return +localStorage.getItem('inv_budget') || 1000; } catch (e) { return 1000; } });
  const [showAll, setShowAll] = React.useState(false);
  const [live, setLive] = React.useState({});     // ticker -> { loading, error, code, reco, info }
  const refreshLive = React.useCallback(async ticker => {
    setLive(m => ({ ...m, [ticker]: { ...(m[ticker] || {}), loading: true, error: null, code: null } }));
    try {
      const r = await fetch('/api/inverse-etf/live-reco', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ticker }) });
      const j = await r.json().catch(() => ({ ok: false, error: `Respuesta no válida del servidor (HTTP ${r.status}). ¿Reiniciaste node server.js tras la actualización?` }));
      if (!j.ok) setLive(m => ({ ...m, [ticker]: { ...(m[ticker] || {}), loading: false, error: j.error || 'Error desconocido', code: j.code || null } }));
      else setLive(m => ({ ...m, [ticker]: { loading: false, error: null, code: null, reco: j.reco, info: j.info } }));
    } catch (e) {
      setLive(m => ({ ...m, [ticker]: { ...(m[ticker] || {}), loading: false, error: 'No se pudo contactar con el servidor local: ' + e.message } }));
    }
  }, []);
  const clearLive = React.useCallback(ticker => setLive(m => { const n = { ...m }; delete n[ticker]; return n; }), []);
  React.useEffect(() => { try { localStorage.setItem('inv_budget', String(budget)); } catch (e) {} }, [budget]);
  const [loading, setLoading] = React.useState(true);
  const [updated, setUpdated] = React.useState(null);
  const [toast, showToast] = useToast();

  const load = React.useCallback(async () => {
    setLoading(true);
    const quotes = {}, unders = {};
    const underSyms = [...new Set(INVERSE_ETFS.map(e => e.under))];
    const [options, recs] = await Promise.all([
      fetchOptionsLatest(),
      fetchRecommendations(),
      Promise.all(INVERSE_ETFS.map(async e => { quotes[e.ticker] = await fetchQuote(e.ticker); })),
      Promise.all(underSyms.map(async s => { unders[s] = await fetchQuote(s); })),
    ]);
    setData({ quotes, unders, options, recs });
    setUpdated(new Date());
    setLoading(false);
  }, []);
  React.useEffect(() => { load(); }, [load]);

  const rows = INVERSE_ETFS.map(e => {
    const q = data.quotes[e.ticker], u = data.unders[e.under];
    return { etf: e, q, u, c: classifyInverseEtf(e, q, u), o: summarizeOptions(data.options[e.ticker]) };
  });

  const buildMarkdown = () => {
    let md = `## ETFs INVERSOS — venta de prima (${new Date().toLocaleString('es-ES')})\n\n`;
    md += `| ETF | Estado | Precio | 1D | 1M | Dist SMA20 ATR | Δhist MACD | Subyacente | Sub 1S | IV ATM | IV/RV20 | Skew | Spread |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|\n`;
    rows.forEach(({ etf, q, u, c, o }) => {
      md += `| ${etf.ticker} | ${INV_STATE_META[c.state].label} | ${q ? fmtN(q.price) : '—'} | ${q ? fmtPct(q.d1) : '—'} | ${q ? fmtPct(q.m1) : '—'} | ${q ? fmtN(invDistAtr(q)) : '—'} | ${q && q.macdHistDelta1 != null ? q.macdHistDelta1.toFixed(3) : '—'} | ${etf.under} ${u ? fmtN(u.price) : '—'} | ${u ? fmtPct(u.w1) : '—'} | ${o ? (o.atmIv * 100).toFixed(0) + '%' : '—'} | ${o && o.ivRv != null ? o.ivRv.toFixed(2) : '—'} | ${o && o.skew != null ? (o.skew * 100).toFixed(0) + 'pp' : '—'} | ${o && o.spread != null ? (o.spread * 100).toFixed(0) + '%' : '—'} |\n`;
    });
    md += `\nReglas: UVXY (calibrada, 5 años): spike = VIX ≥ 25; ventana de venta de prima = además UVXY girando a la baja (1D<0 y Δhist MACD<0). SQQQ/GLL/BOIL (sin calibrar): extendido (≥${INV_EXT_ATR} ATR sobre SMA20 o 1M ≥${INV_EXT_M1}%) + girando + subyacente enfriándose. Estructura acordada para UVXY: put/put spread a 2-3 meses + call spread vendido o call ~30d rodando (no naked a 3m). Solo observación.\n`;
    rows.forEach(({ etf, o }) => {
      if (o && o.term && o.term.ratio != null) md += `- ${etf.ticker} plazos: IV 1m ${o.term.front ? (o.term.front.atmIv * 100).toFixed(0) + '%' : '—'} · 3m ${o.term.long ? (o.term.long.atmIv * 100).toFixed(0) + '%' : '—'} · ratio ${o.term.ratio.toFixed(2)} (${o.term.inverted ? 'invertida' : 'normal'})\n`;
    });
    md += recoMarkdown(rows, data.recs, budget, live);
    return md;
  };

  React.useEffect(() => {
    if (loading) return;
    try {
      localStorage.setItem('llm_export_inversos', buildMarkdown());
      localStorage.setItem('llm_export_inversos_ts', Date.now().toString());
    } catch (e) {}
  }, [loading, data, budget, live]);

  const copyMarkdown = () => navigator.clipboard.writeText(buildMarkdown()).then(() => showToast('✅ Copiado')).catch(() => showToast('❌ Error al copiar'));

  const copyAllForLLM = () => {
    const parts = [
      { key: 'llm_export_market', label: 'Market Tracker' }, { key: 'llm_export_portfolio', label: 'Portfolio' },
      { key: 'llm_export_cycle', label: 'Cycle' }, { key: 'llm_export_relative', label: 'Relative Flow' },
      { key: 'llm_export_rotacion', label: 'Flujos & Rotación' }, { key: 'llm_export_duration', label: 'Duration' },
      { key: 'llm_export_sentiment', label: 'Sentiment' }, { key: 'llm_export_positioning', label: 'Positioning' },
      { key: 'llm_export_trullas', label: 'Trullás' }, { key: 'llm_export_screeners', label: 'Screener' },
      { key: 'llm_export_inversos', label: 'Inversos' },
    ];
    const now = Date.now(); const found = [], missing = [], stale = [];
    const sections = parts.map(({ key, label }) => {
      const md = localStorage.getItem(key);
      if (md) {
        found.push(label);
        const ts = parseInt(localStorage.getItem(key + '_ts') || '0');
        const hours = ts ? Math.round((now - ts) / 3600000) : null;
        if (!ts || hours > 23) stale.push(hours != null ? `${label} (${hours}h)` : label);
        return md;
      }
      missing.push(label); return null;
    }).filter(Boolean);
    if (!sections.length) { showToast('⚠️ Abre cada pestaña primero para generar datos'); return; }
    const header = `**Exportado:** ${new Date().toLocaleString('es-ES', { dateStyle: 'full', timeStyle: 'short' })}` +
      (stale.length ? `\n⚠️ **Secciones desactualizadas (>24h):** ${stale.join(', ')}\n` : '\n');
    navigator.clipboard.writeText(header + '\n---\n\n' + sections.join('\n\n---\n\n'))
      .then(() => showToast(missing.length ? `✅ ${found.length}/${parts.length} pestañas — Falta: ${missing.join(', ')}` : '✅ Todas las pestañas copiadas'))
      .catch(() => showToast('❌ Error al copiar'));
  };

  return (
    <div className="wrap">
      {toast && <div className="toast">{toast}</div>}
      <div className="topbar">
        <div>
          <div className="title-row">
            <h1>ETFs Inversos</h1>
            <a href="/index.html" className="nav-link" style={{ color: '#1a6b3c', borderColor: '#1a6b3c' }}>Market Tracker</a>
            <a href="/portfolio.html" className="nav-link" style={{ color: '#3a6ca0', borderColor: '#3a6ca0' }}>Portfolio</a>
            <a href="/relative.html" className="nav-link" style={{ color: '#7b1fa2', borderColor: '#7b1fa2' }}>Relative Flow</a>
            <a href="/cycle.html" className="nav-link" style={{ color: '#7f0000', borderColor: '#7f0000' }}>Cycle</a>
            <a href="/rotacion.html" className="nav-link" style={{ color: '#e65100', borderColor: '#e65100' }}>Flujos & Rotación</a>
            <a href="/duration.html" className="nav-link" style={{ color: '#37474f', borderColor: '#37474f' }}>Duration</a>
            <a href="/sentiment.html" className="nav-link" style={{ color: '#00695c', borderColor: '#00695c' }}>Sentiment</a>
            <a href="/positioning.html" className="nav-link" style={{ color: '#5d4037', borderColor: '#5d4037' }}>Positioning</a>
            <a href="/trullas.html" className="nav-link" style={{ color: '#ad1457', borderColor: '#ad1457' }}>Trullás</a>
            <a href="/screeners.html" className="nav-link" style={{ color: '#00838f', borderColor: '#00838f' }}>Screener</a>
          </div>
          <div className="meta">UVXY · SQQQ · GLL · BOIL — monitor de spikes y ventanas de venta de prima con opciones · observacional, no ejecuta ni recomienda trades{updated ? ` · actualizado ${updated.toLocaleTimeString('es-ES')}` : ''}</div>
        </div>
        <div className="actions">
          <button className="btn-refresh" onClick={load} disabled={loading}>{loading ? 'Cargando…' : 'Refrescar'}</button>
          <button className="btn-copy" onClick={copyMarkdown}>Copy for LLM</button>
          <button className="btn-export" onClick={copyAllForLLM}>🗂️ Exportar TODO a LLM</button>
        </div>
      </div>

      <div className="gap-note">
        <b>UVXY</b> (regla calibrada con 5 años de datos): <b>Spike en curso</b> = VIX ≥ 25; <b>Ventana de venta de prima</b> = además UVXY gira a la baja
        (1D&lt;0 y MACD cediendo). Estructura acordada: put o put spread a 2-3 meses + call spread vendido o call a ~30 días rodando (no naked a 3 meses).
        <b>SQQQ, GLL y BOIL</b> siguen con la regla genérica sin calibrar (ETF extendido ≥{INV_EXT_ATR} ATR sobre SMA20 o ≥{INV_EXT_M1}% a 1 mes + girando +
        subyacente enfriándose). Aviso por Telegram al subir de nivel. La parte de opciones sale del snapshot diario de cadenas
        (<code>inverse_etf_options_snapshot.py</code>) y el estudio de primas (<code>inverse_etf_premium_study.py</code>) cuando hay datos en horario de mercado.
      </div>

      <div className="section-title">Estado por ETF</div>
      <div className="section-sub">Ordenados por prioridad: ventana de prima, spike, calma. El riesgo de cola de vender calls sin cobertura (gaps de +50-100% en UVXY) no aparece en ninguna métrica — es decisión tuya.</div>
      {loading && !updated ? <div className="loading">Cargando…</div> : (
        <div className="cards">
          {[...rows].sort((a, b) => INV_STATE_META[b.c.state].rank - INV_STATE_META[a.c.state].rank).map(r => (
            <EtfCard key={r.etf.ticker} {...r} />
          ))}
        </div>
      )}

      <div className="section-title">Tabla resumen</div>
      <table>
        <thead><tr><th>ETF</th><th>Estado</th><th>Precio</th><th>1D</th><th>1M</th><th>Dist SMA20 (ATR)</th><th>RSI</th><th>Subyacente</th><th>Sub 1S</th><th>IV ATM</th><th>IV/RV20</th><th>Skew</th><th>Spread</th></tr></thead>
        <tbody>
          {rows.map(({ etf, q, u, c, o }) => {
            const m = INV_STATE_META[c.state], b = BADGE[m.badge];
            return (
              <tr key={etf.ticker}>
                <td><b style={{ color: etf.color }}>{etf.ticker}</b></td>
                <td><span className="badge" style={{ background: b.bg, color: b.fg }}>{m.short}</span></td>
                <td>{q ? fmtN(q.price) : '—'}</td>
                <td className={signCls(q && q.d1)}>{q ? fmtPct(q.d1) : '—'}</td>
                <td className={signCls(q && q.m1)}>{q ? fmtPct(q.m1) : '—'}</td>
                <td>{q ? fmtN(invDistAtr(q)) : '—'}</td>
                <td>{q ? q.rsi : '—'}</td>
                <td>{etf.under} {u ? fmtN(u.price) : ''}</td>
                <td className={signCls(u && u.w1)}>{u ? fmtPct(u.w1) : '—'}</td>
                <td>{o ? (o.atmIv * 100).toFixed(0) + '%' : '—'}</td>
                <td>{o && o.ivRv != null ? o.ivRv.toFixed(2) : '—'}</td>
                <td>{o && o.skew != null ? (o.skew * 100).toFixed(0) + 'pp' : '—'}</td>
                <td>{o && o.spread != null ? (o.spread * 100).toFixed(0) + '%' : '—'}</td>
              </tr>
            );
          })}
        </tbody>
      </table>

      <RecoSection rows={rows} recs={data.recs} budget={budget} setBudget={setBudget} showAll={showAll} setShowAll={setShowAll} live={live} refreshLive={refreshLive} clearLive={clearLive} />

      <div className="footer-note">
        Panel puramente observacional — no toca PCS, rot_score, HARD_RULES del motor de picks ni ninguna cartera.
        Clasificación en <code>shared/inverse-etf-lib.js</code> (misma fuente que el aviso de Telegram, <code>scripts/inverse_etf_alert.js</code>).
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<InversosPage />);
</script>
