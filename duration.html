  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    .meta { font-size: 9px; color: #999; margin-top: 4px; font-style: italic; }

      margin: 18px 0 4px; padding-bottom: 4px; border-bottom: 2px solid #e6e8eb; }

    .footer-note { font-size: 9px; color: #98a2b3; margin-top: 14px; font-style: italic; }
    .error-box { border: 1px solid #ffcdd2; background: #ffebee; color: #b71c1c; border-radius: 6px;
      padding: 10px 14px; font-size: 12px; margin-bottom: 14px; }
    .loading { font-size: 12px; color: #98a2b3; padding: 40px 0; text-align: center; }

<body>
<div id="root"></div>
<script type="text/babel">

// ── Paleta reutilizada de STATUS/riskOffMonitorState (index.html / relative.html) ──
const C = {
  green:   { bg: '#c8e6c9', fg: '#1b5e20' },
  yellow:  { bg: '#fff9c4', fg: '#e65100' },
  orange:  { bg: '#ffe0b2', fg: '#bf360c' },
  red:     { bg: '#ffcdd2', fg: '#b71c1c' },
  neutral: { bg: '#f0f0f0', fg: '#555' },
  blue:    { bg: '#e3f2fd', fg: '#1565c0' },
};

// ── Niveles trigger de la tesis (constantes fijas, duplicadas a propósito en scripts/duration_monitor.py) ──
const LEVELS = {
  coreBreak10y: 4.60, coreBreakTlt: 84,
  confirmHyBps: 300, confirmVix: 20, confirmMove: 120,
  pressureTlt: 84.8, pressure10y: 4.55,
  invalidTlt: 86.5, invalid10y: 4.55,
};

function computePhase({ tlt, y10, hyBps, vix, move }) {
  if (tlt == null || y10 == null) {
    return { phase: 'A', checks: { invalidation: null, coreBreak: null, confirmation: null, pressure: null } };
  }
  const invalidation = tlt > LEVELS.invalidTlt && y10 < LEVELS.invalid10y;
  const coreBreak    = y10 > LEVELS.coreBreak10y && tlt < LEVELS.coreBreakTlt;
  const confirmation = (hyBps != null && hyBps > LEVELS.confirmHyBps)
    || (vix != null && vix > LEVELS.confirmVix)
    || (move != null && move > LEVELS.confirmMove);
  const pressure = tlt < LEVELS.pressureTlt || y10 > LEVELS.pressure10y;

  let phase = 'A';
  if (invalidation) phase = 'D';
  else if (coreBreak && confirmation) phase = 'C';
  else if (pressure) phase = 'B';
  return { phase, checks: { invalidation, coreBreak, confirmation, pressure } };
}

const PHASE_STYLE = {
  A: { ...C.neutral, label: 'Fase A — Watch',                   desc: 'Sin ruptura ni presión de duración detectada.' },
  B: { ...C.yellow,  label: 'Fase B — Duration Pressure',       desc: 'TLT o 10Y ya muestran presión, sin ruptura sistémica todavía.' },
  C: { ...C.red,     label: 'Fase C — Systemic Confirmation',   desc: 'Ruptura core (10Y+TLT) confirmada por estrés de crédito/vol/MOVE.' },
  D: { ...C.blue,    label: 'Fase D — Invalidation',            desc: 'TLT recuperado y yields de vuelta bajo el umbral — tesis invalidada por ahora.' },
};

// ── Helpers de estilo por métrica ──────────────────────────────────────────
const styleTlt   = v => v == null ? C.neutral : v < LEVELS.coreBreakTlt ? C.red : v < LEVELS.pressureTlt ? C.yellow : C.green;
const style10y   = v => v == null ? C.neutral : v > LEVELS.coreBreak10y ? C.red : v > LEVELS.pressure10y ? C.yellow : C.green;
const styleHy    = bps => bps == null ? C.neutral : bps > LEVELS.confirmHyBps ? C.red : bps > 250 ? C.yellow : C.green;
const styleVix   = v => v == null ? C.neutral : v > LEVELS.confirmVix ? C.red : v > 15 ? C.yellow : C.green;
const styleMove  = v => v == null ? C.neutral : v > LEVELS.confirmMove ? C.red : v > 100 ? C.yellow : C.green;

function fmt(n, d = 2) { return n == null || Number.isNaN(n) ? '—' : n.toFixed(d); }
function fmtBps(n) { return n == null ? '—' : (n > 0 ? '+' : '') + Math.round(n) + 'bps'; }
function fmtPct(n) { return n == null ? '—' : (n > 0 ? '+' : '') + n + '%'; }

// ── Staleness: la fuente (Yahoo/FRED) a veces deja de publicar un ticker durante
// varias sesiones sin devolver error (^MOVE es el caso conocido) — sin este check
// el dato viejo se muestra como si fuera de hoy. Umbral más laxo para FRED (lag de
// 1 día + fines de semana ya es normal) que para quotes de Yahoo.
function staleInfo(dateStr, thresholdDays) {
  if (!dateStr) return { stale: false, days: null };
  const d = new Date(dateStr);
  if (Number.isNaN(d.getTime())) return { stale: false, days: null };
  const days = Math.floor((Date.now() - d.getTime()) / 86400000);
  return { stale: days > thresholdDays, days };
}
const staleQuote = dateStr => staleInfo(dateStr, 4);
const staleFred  = dateStr => staleInfo(dateStr, 5);

// ── Proxy de respaldo para MOVE cuando Yahoo no lo sirve ────────────────────
// ^MOVE es un caso conocido de fuente poco fiable (ver staleInfo arriba) — a veces
// deja de publicar durante varias sesiones seguidas sin error. Como respaldo, se
// estima un "MOVE equivalente" a partir de la volatilidad realizada de TLT (dato
// que sí tenemos siempre, vía /api/history ya usado para el sparkline).
// Calibrado 2026-07-27 contra 5 años de histórico diario TLT vs ^MOVE reales de Yahoo
// (1219 sesiones solapadas, excluyendo huecos de ^MOVE): regresión lineal
// MOVE_est = a + b * TLT_rvol20, donde TLT_rvol20 = stdev anualizada (%) de retornos
// log de TLT a 20 sesiones (mismo horizonte de 20 días que SMA20/dist_sma20_atr en
// el resto del proyecto). r²=0.51 — correlación moderada, NO un sustituto exacto:
// MOVE es volatilidad implícita de opciones sobre futuros de bonos, esto es
// volatilidad realizada de precio. Por eso se muestra como rango (±1 residual stdev),
// nunca como número puntual, y solo cuando el dato real de MOVE está ausente/obsoleto.
const MOVE_PROXY = { window: 20, a: 43.96, b: 3.876, r2: 0.51, residualSd: 16.9 };

function calcRealizedVol(series, window) {
  const closes = (series || []).map(p => p.close).filter(c => c != null && Number.isFinite(c));
  if (closes.length < window + 1) return null;
  const rets = [];
  for (let i = 1; i < closes.length; i++) rets.push(Math.log(closes[i] / closes[i - 1]));
  const tail = rets.slice(-window);
  const mean = tail.reduce((a, b) => a + b, 0) / tail.length;
  const variance = tail.reduce((a, b) => a + (b - mean) ** 2, 0) / tail.length;
  return Math.sqrt(variance) * Math.sqrt(252) * 100;
}

function moveProxyFromTlt(tltSeries) {
  const rvol = calcRealizedVol(tltSeries, MOVE_PROXY.window);
  if (rvol == null) return null;
  const est = MOVE_PROXY.a + MOVE_PROXY.b * rvol;
  return { rvol, est, lo: est - MOVE_PROXY.residualSd, hi: est + MOVE_PROXY.residualSd };
}

// ── Tickers / series a pedir ────────────────────────────────────────────────
const QUOTE_TICKERS = ['TLT', 'TBT', 'IEF', 'EDV', 'ZROZ', 'GC=F', 'DX-Y.NYB', 'JPY=X', '^VIX', '^MOVE'];
const FRED_SERIES = ['DGS10', 'DGS2', 'DGS30', 'DFII10', 'T5YIE', 'BAMLH0A0HYM2'];

const AUCTION_TENOR_ORDER = ['10-Year', '30-Year', '2-Year']; // 10Y/30Y priorizadas sobre 2Y
const HISTORY_TICKERS = ['TLT', '^VIX']; // 10Y/HY spread ya traen su propio .history vía /api/fred/:series

function Stat({ label, value, sub, style, staleDays }) {
  const isStale = staleDays != null;
  return (
    <div className="stat" style={{ background: style.bg, color: style.fg,
      ...(isStale ? { outline: '2px dashed #bf360c', outlineOffset: '-2px' } : {}) }}>
      <div className="label">
        {label}
        {isStale && <span title={`Sin datos nuevos desde hace ${staleDays} días — la fuente no ha publicado actualizaciones`} style={{ marginLeft: 4 }}>⚠️</span>}
      </div>
      <div className="value">{value}</div>
      {sub && <div className="sub">{sub}</div>}
      {isStale && <div className="sub" style={{ color: '#bf360c', fontWeight: 700 }}>obsoleto · {staleDays}d</div>}
    </div>
  );
}

// ── Spark (mismo patrón que sentiment.html/relative.html) ──────────────────
function Spark({ points, color = '#3a6ca0', height = 34 }) {
  if (!points || points.length < 2) return <span style={{ color: '#aaa', fontSize: 10 }}>sin datos</span>;
  const vals = points.map(p => p.y).filter(v => v != null && Number.isFinite(v));
  if (vals.length < 2) return <span style={{ color: '#aaa', fontSize: 10 }}>sin datos</span>;
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  const d = vals.map((v, i) => {
    const x = i / (vals.length - 1) * 100;
    const y = (height - 4) - ((v - min) / span * (height - 8) + 2);
    return `${i ? 'L' : 'M'}${x.toFixed(2)},${y.toFixed(2)}`;
  }).join(' ');
  const areaD = `${d} L100,${height} L0,${height} Z`;
  return (
    <svg viewBox={`0 0 100 ${height}`} preserveAspectRatio="none" style={{ width: '100%', height, display: 'block' }}>
      <path d={areaD} fill={color} opacity="0.12" stroke="none" />
      <path d={d} fill="none" stroke={color} strokeWidth="1.6" />
    </svg>
  );
}

// ── Playbook fijo por fase — NO recalcula strikes en vivo (decisión del usuario) ──
// Nota: las letras A-D aquí son las de la state machine de ESTE monitor (A=watch,
// D=invalidation), no las fases A-D del análisis externo original que motivó esta
// página (donde D era "confirmación Japón/yen", una escalada). No son el mismo eje.
const PLAYBOOK = {
  A: {
    action: 'Posición inicial pequeña: TLT put spread (comprar put ligeramente OTM, vender put más abajo, vencimiento 45-90 días). Riesgo máximo = prima pagada. Oro pequeño como hedge de contexto, no como trade principal.',
    weight: '100% opciones / put spread · 0% TBT hasta confirmación',
  },
  B: {
    action: 'TLT o 10Y ya muestran presión. Considerar añadir: más delta bajista en TLT (ampliar el put spread) o TBT táctico pequeño. No aumentar hedge de equities todavía — crédito/VIX aún no confirman estrés sistémico.',
    weight: '≈70% opciones TLT / put spread · ≈30% TBT táctico',
  },
  C: {
    action: 'Ruptura core (yields+TLT) confirmada por estrés de crédito/vol/MOVE. Valorar añadir hedge de equities (SPY/QQQ) o reducir beta de cartera. Short USDJPY solo si además hay señal de repatriación limpia (ver sección Japan/Causality Evidence).',
    weight: 'Mantener core TLT bajista + hedge equity táctico',
  },
  D: {
    action: 'Tesis invalidada por ahora (TLT > 86.5 y 10Y de vuelta bajo 4.55%). Cerrar o reducir significativamente la exposición bajista en TLT — no añadir mientras se mantenga esta lectura.',
    weight: 'Reducir / cerrar posición',
  },
};

function PhaseChecklist({ checks }) {
  const items = [
    ['Presión (B)', checks.pressure],
    ['Ruptura core', checks.coreBreak],
    ['Confirmación estrés', checks.confirmation],
    ['Invalidación', checks.invalidation],
  ];
  return (
    <div className="phase-checks">
      {items.map(([label, v]) => (
        <div className="phase-check" key={label}>
          <span>{v == null ? '⚪' : v ? '✅' : '⬜'}</span><span>{label}</span>
        </div>
      ))}
    </div>
  );
}

function DurationPage() {
  const [quotes, setQuotes] = React.useState({});
  const [fred, setFred] = React.useState({});
  const [histories, setHistories] = React.useState({});
  const [auctions, setAuctions] = React.useState(null);
  const [errors, setErrors] = React.useState({});
  const [loading, setLoading] = React.useState(true);
  const [updated, setUpdated] = React.useState(null);
  const [toast, setToast] = React.useState(null);
  const showToast = msg => { setToast(msg); setTimeout(() => setToast(null), 2600); };

  const load = React.useCallback(() => {
    setLoading(true);
    const qPromises = QUOTE_TICKERS.map(sym =>
      fetch('/api/quote/' + encodeURIComponent(sym) + '?t=' + Date.now())
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(d => ({ sym, d, err: null }))
        .catch(e => ({ sym, d: null, err: e.message }))
    );
    const fPromises = FRED_SERIES.map(series =>
      fetch('/api/fred/' + encodeURIComponent(series) + '?t=' + Date.now())
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(d => ({ series, d, err: null }))
        .catch(e => ({ series, d: null, err: e.message }))
    );
    const aPromise = fetch('/api/treasury-auctions?t=' + Date.now())
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .catch(e => ({ error: e.message }));
    const hPromises = HISTORY_TICKERS.map(sym =>
      fetch('/api/history/' + encodeURIComponent(sym) + '?range=6mo&t=' + Date.now())
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(d => ({ sym, d, err: null }))
        .catch(e => ({ sym, d: null, err: e.message }))
    );

    Promise.all([Promise.all(qPromises), Promise.all(fPromises), aPromise, Promise.all(hPromises)]).then(([qResults, fResults, aResult, hResults]) => {
      const q = {}, f = {}, h = {}, errs = {};
      qResults.forEach(({ sym, d, err }) => { q[sym] = d; if (err) errs['quote:' + sym] = err; });
      fResults.forEach(({ series, d, err }) => { f[series] = d; if (err) errs['fred:' + series] = err; });
      hResults.forEach(({ sym, d, err }) => { h[sym] = d; if (err) errs['history:' + sym] = err; });
      setQuotes(q);
      setFred(f);
      setHistories(h);
      setAuctions(aResult && !aResult.error ? aResult : null);
      if (aResult?.error) errs['auctions'] = aResult.error;
      setErrors(errs);
      setUpdated(new Date());
      setLoading(false);
    });
  }, []);

  React.useEffect(() => { load(); }, [load]);

  const tlt = quotes['TLT'], tbt = quotes['TBT'], ief = quotes['IEF'], edv = quotes['EDV'], zroz = quotes['ZROZ'];
  const gold = quotes['GC=F'], dxy = quotes['DX-Y.NYB'], usdjpy = quotes['JPY=X'];
  const vix = quotes['^VIX'], move = quotes['^MOVE'];
  const y10 = fred['DGS10'], y2 = fred['DGS2'], y30 = fred['DGS30'], dfii10 = fred['DFII10'], t5yie = fred['T5YIE'], hy = fred['BAMLH0A0HYM2'];

  const staleTlt = staleQuote(tlt?.asOf), staleVix = staleQuote(vix?.asOf), staleMove = staleQuote(move?.asOf);
  const staleY10 = staleFred(y10?.date), staleY2 = staleFred(y2?.date), staleY30 = staleFred(y30?.date);
  const staleDfii10 = staleFred(dfii10?.date), staleT5yie = staleFred(t5yie?.date), staleHy = staleFred(hy?.date);

  // Respaldo cuando MOVE está ausente u obsoleto — ver comentario de MOVE_PROXY arriba.
  const moveMissing = move?.price == null || staleMove.stale;
  const moveProxy = React.useMemo(
    () => moveMissing ? moveProxyFromTlt(histories['TLT']?.series) : null,
    [moveMissing, histories]
  );
  const moveEffective = moveMissing && moveProxy ? moveProxy.est : (move?.price ?? null);
  const moveIsProxy = moveMissing && moveProxy != null;

  const hyBps = hy?.current != null ? hy.current * 100 : null;
  const { phase, checks } = React.useMemo(() => computePhase({
    tlt: tlt?.price ?? null, y10: y10?.current ?? null, hyBps, vix: vix?.price ?? null, move: moveEffective,
  }), [tlt, y10, hyBps, vix, moveEffective]);
  const ps = PHASE_STYLE[phase];

  const spread3010 = (y30?.current != null && y10?.current != null) ? y30.current - y10.current : null;
  const spread102 = (y10?.current != null && y2?.current != null) ? y10.current - y2.current : null;
  const ratioTltIef = (tlt?.price && ief?.price) ? tlt.price / ief.price : null;
  const ratioEdvIef = (edv?.price && ief?.price) ? edv.price / ief.price : null;

  // ── Series para sparklines (últimos ~6 meses) ──────────────────────────────
  const sparkTlt = (histories['TLT']?.series || []).map(p => ({ x: p.date, y: p.close }));
  const sparkVix = (histories['^VIX']?.series || []).map(p => ({ x: p.date, y: p.close }));
  const spark10y = (y10?.history || []).map(p => ({ x: p.date, y: p.value }));
  const sparkHy  = (hy?.history || []).map(p => ({ x: p.date, y: p.value * 100 }));

  // ── Evidencia Japón/causalidad — heurística basada en retornos semanales (w1) ──
  const tltDown = tlt?.w1 != null && tlt.w1 < 0;
  const usdjpyDown = usdjpy?.w1 != null && usdjpy.w1 < 0;
  const usdjpyUp = usdjpy?.w1 != null && usdjpy.w1 > 0;
  const dxyUp = dxy?.w1 != null && dxy.w1 > 0;
  let jpyVerdict = { text: 'Sin patrón claro esta semana', style: C.neutral };
  if (tltDown && usdjpyDown) jpyVerdict = { text: 'Yields↑ + TLT↓ + USDJPY↓ → posible repatriación/intervención limpia', style: C.orange };
  else if (dxyUp && usdjpyUp) jpyVerdict = { text: 'DXY↑ + USDJPY↑ → shock de yields/dólar genérico, no confirma story de Japón', style: C.neutral };

  const yieldsUpWeek = (y10?.current != null && y10?.v1w != null) ? (y10.current - y10.v1w) > 0 : null;
  const goldUpWeek = gold?.w1 != null ? gold.w1 >= -1 : null;
  let goldVerdict = { text: 'Sin señal cruzada clara todavía', style: C.neutral };
  if (yieldsUpWeek === true && goldUpWeek === true) goldVerdict = { text: 'Yields↑ + oro↑/estable → posible crisis de confianza / degradación monetaria', style: C.orange };
  else if (yieldsUpWeek === true && goldUpWeek === false) goldVerdict = { text: 'Yields↑ + oro↓ → story de tipos reales, más genérico que específico de Japón', style: C.neutral };

  const AUCTION_BADGE = {
    weak_demand: { ...C.red, label: 'Demanda débil' },
    strong_demand: { ...C.green, label: 'Demanda fuerte' },
    normal: { ...C.neutral, label: 'Normal' },
    insufficient_data: { ...C.neutral, label: 'Datos insuficientes' },
  };

  const buildDurationMarkdown = () => {
    const lines = [];
    lines.push('# Duration Stress Monitor — BOJ/Treasury Supply Thesis');
    lines.push('');
    lines.push(`## ${ps.label}`);
    lines.push(ps.desc);
    lines.push(`Checks: pressure=${checks.pressure} · core_break=${checks.coreBreak} · confirmation=${checks.confirmation} · invalidation=${checks.invalidation}`);
    if (moveIsProxy) {
      lines.push(`⚠️ MOVE real no disponible — confirmation usa proxy estimado desde volatilidad realizada de TLT: ~${fmt(moveProxy.est, 0)} (rango ${fmt(moveProxy.lo, 0)}–${fmt(moveProxy.hi, 0)}, r²=0.51, no equivalente exacto).`);
    }
    lines.push('');
    lines.push('## Trade Structure — TLT Options Playbook (fijo por fase, no recalcula strikes en vivo)');
    lines.push(PLAYBOOK[phase].action);
    lines.push(`Ponderación sugerida: ${PLAYBOOK[phase].weight}`);
    lines.push('');
    const staleTag = s => s.stale ? ` ⚠OBSOLETO(${s.days}d)` : '';
    lines.push('## Market Confirmation');
    lines.push('| Metric | Value | As of |');
    lines.push('|---|---:|---|');
    lines.push(`| TLT | ${tlt?.price ?? '-'} (${fmtPct(tlt?.d1)} 1D) | ${tlt?.asOf ?? '-'}${staleTag(staleTlt)} |`);
    lines.push(`| 10Y Yield | ${fmt(y10?.current)}% | ${y10?.date ?? '-'}${staleTag(staleY10)} |`);
    lines.push(`| 2Y Yield | ${fmt(y2?.current)}% | ${y2?.date ?? '-'}${staleTag(staleY2)} |`);
    lines.push(`| 30Y Yield | ${fmt(y30?.current)}% | ${y30?.date ?? '-'}${staleTag(staleY30)} |`);
    lines.push(`| 30Y-10Y Spread | ${fmtBps(spread3010 != null ? spread3010 * 100 : null)} | - |`);
    lines.push(`| 10Y-2Y Spread | ${fmtBps(spread102 != null ? spread102 * 100 : null)} | - |`);
    lines.push(`| 10Y Real (DFII10) | ${fmt(dfii10?.current)}% | ${dfii10?.date ?? '-'}${staleTag(staleDfii10)} |`);
    lines.push(`| Breakeven 5Y | ${fmt(t5yie?.current)}% | ${t5yie?.date ?? '-'}${staleTag(staleT5yie)} |`);
    lines.push(`| HY Spread | ${hyBps != null ? Math.round(hyBps) + 'bps' : '-'} | ${hy?.date ?? '-'}${staleTag(staleHy)} |`);
    lines.push(`| VIX | ${fmt(vix?.price, 1)} | ${vix?.asOf ?? '-'}${staleTag(staleVix)} |`);
    lines.push(`| MOVE | ${move?.price != null ? fmt(move.price, 1) : 'no disponible'} | ${move?.asOf ?? '-'}${staleTag(staleMove)} |`);
    if (moveIsProxy) {
      lines.push(`| MOVE proxy (TLT rvol20) | ~${fmt(moveProxy.est, 0)} (rango ${fmt(moveProxy.lo, 0)}–${fmt(moveProxy.hi, 0)}) | r²=0.51, no equivalente exacto |`);
    }
    lines.push(`| TLT / IEF | ${fmt(ratioTltIef, 3)} | - |`);
    lines.push(`| EDV / IEF | ${fmt(ratioEdvIef, 3)} | - |`);
    lines.push('');
    lines.push('## Complejo duración');
    lines.push('| Ticker | Precio | 1D | 1S | 1M |');
    lines.push('|---|---:|---:|---:|---:|');
    [['TBT', tbt], ['IEF', ief], ['EDV', edv], ['ZROZ', zroz]].forEach(([name, d]) => {
      lines.push(`| ${name} | ${d?.price ?? '-'} | ${fmtPct(d?.d1)} | ${fmtPct(d?.w1)} | ${fmtPct(d?.m1)} |`);
    });
    lines.push('');
    lines.push('## Japan / Causality Evidence (contextual, no confirma causa)');
    lines.push(`- USDJPY ${usdjpy?.price ?? '-'} (${fmtPct(usdjpy?.w1)} 1S) — ${jpyVerdict.text}`);
    lines.push(`- Oro (GC=F) ${gold?.price ?? '-'} (${fmtPct(gold?.w1)} 1S) — ${goldVerdict.text}`);
    lines.push(`- DXY ${dxy?.price ?? '-'} (${fmtPct(dxy?.w1)} 1S)`);
    lines.push('- JGB 10Y/30Y y Japan CDS: no disponibles (sin fuente diaria gratuita fiable).');
    lines.push('');
    lines.push('## Auction Stress (Treasury Fiscal Data API, sin yield when-issued → sin tail real)');
    lines.push('| Tenor | Fecha | High Yield | vs media | Bid-to-Cover | vs media | Indirect % | vs media | Dealer % | vs media | Proxy estrés | Tail real |');
    lines.push('|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---|---|');
    AUCTION_TENOR_ORDER.forEach(tenor => {
      const t = auctions?.tenors?.[tenor];
      if (!t) { lines.push(`| ${tenor} | sin datos | | | | | | | | | | |`); return; }
      const badge = AUCTION_BADGE[t.auction_stress_proxy] || AUCTION_BADGE.insufficient_data;
      lines.push(`| ${tenor} | ${t.auction_date} | ${fmt(t.auction_high_yield)}% | ${fmtBps(t.high_yield_vs_recent_avg)} | ${fmt(t.bid_to_cover)} | ${t.bid_to_cover_vs_recent_avg ?? '-'} | ${fmt(t.indirect_pct)}% | ${t.indirect_pct_vs_recent_avg != null ? (t.indirect_pct_vs_recent_avg > 0 ? '+' : '') + t.indirect_pct_vs_recent_avg + 'pp' : '-'} | ${fmt(t.dealer_pct)}% | ${t.dealer_pct_vs_recent_avg != null ? (t.dealer_pct_vs_recent_avg > 0 ? '+' : '') + t.dealer_pct_vs_recent_avg + 'pp' : '-'} | ${badge.label} | n/d |`);
    });
    return lines.join('\n');
  };

  React.useEffect(() => {
    if (updated) {
      try {
        localStorage.setItem('llm_export_duration', buildDurationMarkdown());
        localStorage.setItem('llm_export_duration_ts', Date.now().toString());
      } catch {}
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [updated]);

  const copyMarkdown = () => {
    navigator.clipboard.writeText(buildDurationMarkdown()).then(() => showToast('Copiado para LLM'));
  };

  const copyAllForLLM = () => {
    const parts = [
      { key: 'llm_export_market',    label: 'Market Tracker' },
      { key: 'llm_export_portfolio', label: 'Portfolio' },
      { key: 'llm_export_cycle',     label: 'Cycle' },
      { key: 'llm_export_relative',  label: 'Relative Flow' },
      { key: 'llm_export_rotacion',  label: 'Flujos & Rotación' },
      { key: 'llm_export_duration',  label: 'Duration' },
      { key: 'llm_export_sentiment', label: 'Sentiment' },
      { key: 'llm_export_positioning', label: 'Positioning' },
    ];
    const now = Date.now();
    const found = [], missing = [], stale = [];
    const sections = parts.map(({ key, label }) => {
      const md = localStorage.getItem(key);
      if (md) {
        found.push(label);
        const ts = parseInt(localStorage.getItem(key + '_ts') || '0');
        const hours = ts ? Math.round((now - ts) / 3600000) : null;
        if (!ts || hours > 23) stale.push(hours != null ? `${label} (${hours}h)` : label);
        return md;
      }
      missing.push(label); return null;
    }).filter(Boolean);
    if (!sections.length) { showToast('⚠️ Abre cada pestaña primero para generar datos'); return; }
    const exportDate = new Date().toLocaleString('es-ES', { dateStyle: 'full', timeStyle: 'short' });
    const header = `**Exportado:** ${exportDate}` +
      (stale.length ? `\n⚠️ **Secciones desactualizadas (>24h):** ${stale.join(', ')} — Abre esas pestañas para refrescar\n` : '\n');
    const combined = header + '\n---\n\n' + sections.join('\n\n---\n\n');
    navigator.clipboard.writeText(combined)
      .then(() => {
        if (stale.length) showToast(`⚠️ ${stale.length} secc. desactualizadas: ${stale.join(', ')}`);
        else if (missing.length) showToast(`✅ ${found.length}/${parts.length} pestañas — Falta: ${missing.join(', ')}`);
        else showToast('✅ Todas las pestañas copiadas (datos frescos)');
      })
      .catch(() => showToast('❌ Error al copiar'));
  };

  return (
    <div className="wrap">
      {toast && <div className="toast">{toast}</div>}
      <div className="topbar">
        <div>
          <div className="title-row">
            <h1>Duration Stress Monitor</h1>
            <a href="/index.html" className="nav-link" style={{ color: '#1a6b3c', borderColor: '#1a6b3c' }}>Market Tracker</a>
            <a href="/portfolio.html" className="nav-link" style={{ color: '#3a6ca0', borderColor: '#3a6ca0' }}>Portfolio</a>
            <a href="/relative.html" className="nav-link" style={{ color: '#7b1fa2', borderColor: '#7b1fa2' }}>Relative Flow</a>
            <a href="/cycle.html" className="nav-link" style={{ color: '#7f0000', borderColor: '#7f0000' }}>Cycle</a>
            <a href="/rotacion.html" className="nav-link" style={{ color: '#e65100', borderColor: '#e65100' }}>Flujos & Rotación</a>
            <a href="/sentiment.html" className="nav-link" style={{ color: '#00695c', borderColor: '#00695c' }}>Sentiment</a>
            <a href="/positioning.html" className="nav-link" style={{ color: '#5d4037', borderColor: '#5d4037' }}>Positioning</a>
          </div>
          <div className="meta">BOJ/Treasury Supply Thesis — panel observacional, no ejecuta ni recomienda trades automáticamente</div>
        </div>
        <div className="actions">
          {updated && <span style={{ fontSize: 11, color: '#999' }}>{updated.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' })}</span>}
          <button className="btn-copy" onClick={copyMarkdown} disabled={!updated}>Copy for LLM</button>
          <button className="btn-export" onClick={copyAllForLLM}>🗂️ Exportar TODO a LLM</button>
          <button className="btn-refresh" onClick={load} disabled={loading}>{loading ? 'Cargando…' : '↻ Actualizar'}</button>
        </div>
      </div>

      <div className="thesis-box">
        <b>Tesis en seguimiento:</b> posible venta/reducción japonesa de Treasuries ejerciendo presión bajista sobre la duración larga USA.
        La atribución a Japón es una <b>hipótesis</b>, no un hecho confirmado — solo el mercado (yields, TLT, crédito, VIX/MOVE) puede
        confirmarse con datos públicos hoy. Por eso la evidencia de mercado y la evidencia de causalidad Japón se muestran en secciones separadas.
      </div>

      {loading && !updated && <div className="loading">Cargando…</div>}

      {updated && (
        <div className="phase-box" style={{ background: ps.bg, color: ps.fg, flexDirection: 'column', alignItems: 'stretch' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 18, flexWrap: 'wrap' }}>
            <div>
              <div className="phase-label">{ps.label}</div>
              <div style={{ fontSize: 11, marginTop: 2 }}>{ps.desc}</div>
            </div>
            <PhaseChecklist checks={checks} />
          </div>
          {moveIsProxy && (
            <div style={{ fontSize: 10, marginTop: 8, opacity: 0.9 }}>
              ⚠️ MOVE real no disponible — el check de confirmación usa un proxy estimado desde volatilidad realizada de TLT
              (~{fmt(moveProxy.est, 0)}, rango {fmt(moveProxy.lo, 0)}–{fmt(moveProxy.hi, 0)}, r²=0.51 — no equivalente exacto al MOVE real).
            </div>
          )}
        </div>
      )}

      {updated && (
        <div className="playbook-box" style={{ borderLeft: `4px solid ${ps.fg}` }}>
          <div style={{ fontWeight: 700, marginBottom: 4 }}>📋 Trade Structure — TLT Options Playbook ({ps.label})</div>
          <div>{PLAYBOOK[phase].action}</div>
          <div className="weight"><b>Ponderación sugerida:</b> {PLAYBOOK[phase].weight}</div>
        </div>
      )}

      {Object.keys(errors).length > 0 && (
        <div className="error-box">
          Algunas fuentes fallaron y se omiten con gracia: {Object.entries(errors).map(([k, v]) => `${k} (${v})`).join(' · ')}
        </div>
      )}

      <div className="section-title">1. Market Confirmation</div>
      <div className="section-sub">Objetivo y confirmable con datos públicos de mercado — no asume causa japonesa.</div>
      <div className="stat-grid">
        <Stat label="TLT" value={tlt?.price ?? '—'} sub={fmtPct(tlt?.d1)} style={styleTlt(tlt?.price)} staleDays={staleTlt.stale ? staleTlt.days : null} />
        <Stat label="10Y Yield" value={fmt(y10?.current) + '%'} sub={y10?.date} style={style10y(y10?.current)} staleDays={staleY10.stale ? staleY10.days : null} />
        <Stat label="2Y Yield" value={fmt(y2?.current) + '%'} sub={y2?.date} style={C.neutral} staleDays={staleY2.stale ? staleY2.days : null} />
        <Stat label="30Y Yield" value={fmt(y30?.current) + '%'} sub={y30?.date} style={C.neutral} staleDays={staleY30.stale ? staleY30.days : null} />
        <Stat label="30Y-10Y Spread" value={fmtBps(spread3010 != null ? spread3010 * 100 : null)} style={C.neutral} />
        <Stat label="10Y-2Y Spread" value={fmtBps(spread102 != null ? spread102 * 100 : null)} style={C.neutral} />
        <Stat label="10Y Real (DFII10)" value={fmt(dfii10?.current) + '%'} sub={dfii10?.date} style={C.neutral} staleDays={staleDfii10.stale ? staleDfii10.days : null} />
        <Stat label="Breakeven 5Y" value={fmt(t5yie?.current) + '%'} sub={t5yie?.date} style={C.neutral} staleDays={staleT5yie.stale ? staleT5yie.days : null} />
        <Stat label="HY Spread" value={hyBps != null ? Math.round(hyBps) + 'bps' : '—'} sub={hy?.date} style={styleHy(hyBps)} staleDays={staleHy.stale ? staleHy.days : null} />
        <Stat label="VIX" value={fmt(vix?.price, 1)} sub={vix?.asOf?.slice(0, 10)} style={styleVix(vix?.price)} staleDays={staleVix.stale ? staleVix.days : null} />
        <Stat label="MOVE" value={move?.price != null ? fmt(move.price, 1) : 'no disponible'} sub={move?.asOf?.slice(0, 10)} style={styleMove(move?.price)} staleDays={staleMove.stale ? staleMove.days : null} />
        {moveIsProxy && (
          <Stat label="MOVE proxy (TLT rvol20)" value={'~' + fmt(moveProxy.est, 0)}
            sub={`rango ${fmt(moveProxy.lo, 0)}–${fmt(moveProxy.hi, 0)} · r²=0.51`}
            style={styleMove(moveProxy.est)} />
        )}
        <Stat label="TLT / IEF" value={fmt(ratioTltIef, 3)} style={C.neutral} />
        <Stat label="EDV / IEF" value={fmt(ratioEdvIef, 3)} style={C.neutral} />
      </div>

      <div className="section-sub" style={{ marginTop: -4 }}>Tendencia — últimos ~6 meses (los 4 drivers que alimentan la fase A/B/C/D)</div>
      <div className="trend-grid">
        <div className="trend-card">
          <div className="label">TLT</div>
          <div className="value" style={{ color: styleTlt(tlt?.price).fg }}>{tlt?.price ?? '—'}</div>
          <Spark points={sparkTlt} color={styleTlt(tlt?.price).fg} />
        </div>
        <div className="trend-card">
          <div className="label">10Y Yield</div>
          <div className="value" style={{ color: style10y(y10?.current).fg }}>{fmt(y10?.current)}%</div>
          <Spark points={spark10y} color={style10y(y10?.current).fg} />
        </div>
        <div className="trend-card">
          <div className="label">VIX</div>
          <div className="value" style={{ color: styleVix(vix?.price).fg }}>{fmt(vix?.price, 1)}</div>
          <Spark points={sparkVix} color={styleVix(vix?.price).fg} />
        </div>
        <div className="trend-card">
          <div className="label">HY Spread</div>
          <div className="value" style={{ color: styleHy(hyBps).fg }}>{hyBps != null ? Math.round(hyBps) + 'bps' : '—'}</div>
          <Spark points={sparkHy} color={styleHy(hyBps).fg} />
        </div>
      </div>

      <table>
        <thead><tr><th>Complejo duración</th><th>Precio</th><th>1D</th><th>1S</th><th>1M</th></tr></thead>
        <tbody>
          {[['TBT', tbt], ['IEF', ief], ['EDV', edv], ['ZROZ', zroz]].map(([name, d]) => (
            <tr key={name}>
              <td>{name}</td><td>{d?.price ?? '—'}</td><td>{fmtPct(d?.d1)}</td><td>{fmtPct(d?.w1)}</td><td>{fmtPct(d?.m1)}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <div className="freshness">Yahoo as_of: {tlt?.asOf ? new Date(tlt.asOf).toLocaleString('es') : '—'} · FRED as_of: {y10?.date ?? '—'} (FRED puede tener 1 día de lag)</div>

      <div className="section-title">2. Japan / Causality Evidence</div>
      <div className="section-sub">Contextual y ambiguo — no confirmable con las fuentes disponibles hoy. No alimenta la fase A/B/C/D.</div>
      <div className="evidence-grid">
        <div className="evidence-card">
          <div className="label" style={{ fontSize: 9, color: '#98a2b3', textTransform: 'uppercase' }}>USDJPY</div>
          <div className="metric">{usdjpy?.price ?? '—'} <span style={{ fontSize: 11, fontWeight: 400 }}>({fmtPct(usdjpy?.w1)} 1S)</span></div>
          <div className="verdict" style={{ background: jpyVerdict.style.bg, color: jpyVerdict.style.fg }}>{jpyVerdict.text}</div>
        </div>
        <div className="evidence-card">
          <div className="label" style={{ fontSize: 9, color: '#98a2b3', textTransform: 'uppercase' }}>Oro (GC=F)</div>
          <div className="metric">{gold?.price ?? '—'} <span style={{ fontSize: 11, fontWeight: 400 }}>({fmtPct(gold?.w1)} 1S)</span></div>
          <div className="verdict" style={{ background: goldVerdict.style.bg, color: goldVerdict.style.fg }}>{goldVerdict.text}</div>
        </div>
        <div className="evidence-card">
          <div className="label" style={{ fontSize: 9, color: '#98a2b3', textTransform: 'uppercase' }}>DXY</div>
          <div className="metric">{dxy?.price ?? '—'} <span style={{ fontSize: 11, fontWeight: 400 }}>({fmtPct(dxy?.w1)} 1S)</span></div>
        </div>
      </div>
      <div className="gap-note">
        JGB 10Y/30Y y Japan CDS no están disponibles: sin fuente diaria gratuita fiable (FRED solo publica la serie mensual de Japón). Hueco documentado, no cubierto en v1.
      </div>

      <div className="section-title">3. Auction Stress</div>
      <div className="section-sub">
        Treasury Fiscal Data API no publica yield when-issued → no se puede calcular el tail real (high yield − WI yield). Se muestra un proxy de estrés en su lugar.
        Indirect % (demanda extranjera/fondos vía dealer intermediario) y Dealer % (cuánto absorben los primary dealers) son observacionales — todavía no alimentan el Proxy estrés, solo se muestran para seguimiento.
      </div>
      <table>
        <thead>
          <tr><th>Tenor</th><th>Fecha subasta</th><th>High Yield</th><th>vs media reciente</th><th>Bid-to-Cover</th><th>vs media reciente</th><th>Indirect %</th><th>vs media</th><th>Dealer %</th><th>vs media</th><th>Proxy estrés</th><th>Tail real</th></tr>
        </thead>
        <tbody>
          {AUCTION_TENOR_ORDER.map(tenor => {
            const t = auctions?.tenors?.[tenor];
            if (!t) return <tr key={tenor}><td>{tenor}</td><td colSpan="11">sin datos</td></tr>;
            const badge = AUCTION_BADGE[t.auction_stress_proxy] || AUCTION_BADGE.insufficient_data;
            return (
              <tr key={tenor}>
                <td>{tenor}</td>
                <td>{t.auction_date}</td>
                <td>{fmt(t.auction_high_yield)}%</td>
                <td>{fmtBps(t.high_yield_vs_recent_avg)}</td>
                <td>{fmt(t.bid_to_cover)}</td>
                <td>{t.bid_to_cover_vs_recent_avg != null ? (t.bid_to_cover_vs_recent_avg > 0 ? '+' : '') + t.bid_to_cover_vs_recent_avg.toFixed(2) : '—'}</td>
                <td>{fmt(t.indirect_pct)}%</td>
                <td>{t.indirect_pct_vs_recent_avg != null ? (t.indirect_pct_vs_recent_avg > 0 ? '+' : '') + t.indirect_pct_vs_recent_avg.toFixed(1) + 'pp' : '—'}</td>
                <td>{fmt(t.dealer_pct)}%</td>
                <td>{t.dealer_pct_vs_recent_avg != null ? (t.dealer_pct_vs_recent_avg > 0 ? '+' : '') + t.dealer_pct_vs_recent_avg.toFixed(1) + 'pp' : '—'}</td>
                <td><span className="badge" style={{ background: badge.bg, color: badge.fg }}>{badge.label}</span></td>
                <td>n/d</td>
              </tr>
            );
          })}
        </tbody>
      </table>
      <div className="freshness">Auctions as_of (caché del proxy): {auctions?.as_of ? new Date(auctions.as_of).toLocaleString('es') : '—'}</div>

      <div className="footer-note">
        Fuentes: Yahoo Finance (precios/indicadores vía proxy local), FRED (yields/HY spread, ~1 día de lag), Treasury Fiscal Data API (subastas, caché 6h).
        Panel puramente observacional — no toca PCS, rot_score ni HARD_RULES del motor de picks.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DurationPage />);
</script>
</body>
</html>
