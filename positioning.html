<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CoT Positioning — Market Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; color: #1f2933; }
    .wrap { background: white; min-width: 960px; min-height: 100vh; padding: 16px 20px; overflow-x: auto; }
    .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    .title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 20px; color: #111; line-height: 1; }
    .nav-link { font-size: 11px; text-decoration: none; padding: 2px 10px; border: 1px solid; border-radius: 12px; line-height: 20px; }
    .meta { font-size: 9px; color: #999; margin-top: 4px; font-style: italic; }
    .actions { display: flex; align-items: center; gap: 8px; }
    button { border: none; border-radius: 3px; padding: 5px 12px; cursor: pointer; font-size: 11px; font-weight: 600; color: white; }
    button:disabled { cursor: default; opacity: 0.65; }
    .btn-copy { background: #1a6b3c; }
    .btn-export { background: #37474f; }
    .btn-refresh { background: #3a6ca0; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a6b3c; color: white; padding: 10px 22px; border-radius: 20px; font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.18); z-index: 10; }

    .section-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: #344054;
      margin: 18px 0 4px; padding-bottom: 4px; border-bottom: 2px solid #e6e8eb; }
    .section-sub { font-size: 10px; color: #98a2b3; margin-bottom: 10px; font-style: italic; }

    .evidence-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .evidence-card { border: 1px solid #e6e8eb; border-radius: 6px; background: #fbfcfd; padding: 12px 14px; }
    .evidence-card .label { font-size: 10px; text-transform: uppercase; letter-spacing: .4px; color: #98a2b3; margin-bottom: 4px; }
    .evidence-card .metric { font-size: 19px; font-weight: 700; font-family: Consolas, monospace; }
    .evidence-card .sub { font-size: 10.5px; color: #667085; margin-top: 3px; }
    .evidence-card .verdict { margin-top: 8px; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 5px; display: inline-block; }
    .pos { color: #1b5e20; } .neg { color: #b71c1c; }

    table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 10px; }
    th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #eef0f2; white-space: nowrap; }
    th { font-size: 9px; text-transform: uppercase; color: #98a2b3; letter-spacing: .3px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; }

    .gap-note { border: 1px solid #ffe0b2; background: #fff8ef; color: #8a5200; border-radius: 6px; padding: 8px 12px; font-size: 10px; margin-bottom: 10px; }
    .freshness { font-size: 9px; color: #98a2b3; margin: 6px 0 0; }
    .footer-note { font-size: 9px; color: #98a2b3; margin-top: 14px; font-style: italic; }
    .error-box { border: 1px solid #ffcdd2; background: #ffebee; color: #b71c1c; border-radius: 6px;
      padding: 8px 10px; font-size: 10.5px; }
    .loading { font-size: 11px; color: #98a2b3; padding: 20px 0; text-align: center; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ── Paleta reutilizada de STATUS (index.html / relative.html / duration.html) ──
const C = {
  green:  { bg: '#c8e6c9', fg: '#1b5e20' },
  yellow: { bg: '#fff9c4', fg: '#e65100' },
  orange: { bg: '#ffe0b2', fg: '#bf360c' },
  red:    { bg: '#ffcdd2', fg: '#b71c1c' },
  neutral:{ bg: '#f0f0f0', fg: '#555' },
  blue:   { bg: '#e3f2fd', fg: '#1565c0' },
};

// ── Universo congelado v1: los 4 contratos que motivaron este módulo ──
// (oro/plata/cobre por el trabajo reciente de Relative Flow Lab, WTI por
// ser la pregunta original del asesor — "con crudo, ¿cuánto ya está
// posicionado?"). Ampliar esta lista es sencillo (ver COT_CONTRACTS en
// server.js) pero se mantiene acotada a propósito, mismo criterio de no
// añadir alcance sin que lo pida un caso de uso concreto.
const CONTRACTS = [
  { id: 'gold',   label: 'Oro',       ticker: 'GC=F', color: '#c9a227' },
  { id: 'silver', label: 'Plata',     ticker: 'SI=F', color: '#8c8c8c' },
  { id: 'copper', label: 'Cobre',     ticker: 'HG=F', color: '#b87333' },
  { id: 'wti',    label: 'Crudo WTI', ticker: 'CL=F', color: '#3a3a3a' },
];

// Umbrales de percentil — primera pasada, sin calibrar contra datos
// históricos de rendimiento futuro (mismo criterio que el resto de
// features nuevas del proyecto: observar primero, endurecer solo si los
// datos lo justifican). >=90/<=10 son los niveles que la literatura de
// posicionamiento suele citar como "extremo".
function percentileVerdict(p) {
  if (p == null) return { label: 'Sin datos', ...C.neutral };
  if (p >= 90) return { label: 'Extremo largo', ...C.red };
  if (p >= 70) return { label: 'Largo elevado', ...C.orange };
  if (p <= 10) return { label: 'Extremo corto', ...C.blue };
  if (p <= 30) return { label: 'Corto elevado', ...C.yellow };
  return { label: 'Neutral', ...C.green };
}

function fmtNum(v) { return v == null ? '—' : Math.round(v).toLocaleString('es-ES'); }
function fmtChange(v) {
  if (v == null) return '—';
  const s = (v > 0 ? '+' : '') + Math.round(v).toLocaleString('es-ES');
  return <span className={v > 0 ? 'pos' : v < 0 ? 'neg' : ''}>{s}</span>;
}

function Spark({ points, color = '#3a6ca0', height = 34 }) {
  if (!points || points.length < 2) return <span style={{ color: '#aaa', fontSize: 10 }}>sin datos</span>;
  const vals = points.map(p => p.y).filter(v => v != null && Number.isFinite(v));
  if (vals.length < 2) return <span style={{ color: '#aaa', fontSize: 10 }}>sin datos</span>;
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  const d = vals.map((v, i) => {
    const x = i / (vals.length - 1) * 100;
    const y = (height - 4) - ((v - min) / span * (height - 8) + 2);
    return `${i ? 'L' : 'M'}${x.toFixed(2)},${y.toFixed(2)}`;
  }).join(' ');
  const areaD = `${d} L100,${height} L0,${height} Z`;
  const zeroY = (max > 0 && min < 0) ? (height - 4) - ((0 - min) / span * (height - 8) + 2) : null;
  return (
    <svg viewBox={`0 0 100 ${height}`} preserveAspectRatio="none" style={{ width: '100%', height, display: 'block' }}>
      <path d={areaD} fill={color} opacity="0.12" stroke="none" />
      {zeroY != null && <line x1="0" y1={zeroY} x2="100" y2={zeroY} stroke="#ccc" strokeWidth="0.6" strokeDasharray="2 2" />}
      <path d={d} fill="none" stroke={color} strokeWidth="1.6" />
    </svg>
  );
}

function PositioningPage() {
  const [cot, setCot] = React.useState({});
  const [errors, setErrors] = React.useState({});
  const [loading, setLoading] = React.useState(true);
  const [updated, setUpdated] = React.useState(null);
  const [toast, setToast] = React.useState(null);
  const showToast = msg => { setToast(msg); setTimeout(() => setToast(null), 2600); };

  const load = React.useCallback(() => {
    setLoading(true);
    const promises = CONTRACTS.map(c =>
      fetch('/api/cot/' + c.id + '?t=' + Date.now())
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(d => ({ id: c.id, d, err: null }))
        .catch(e => ({ id: c.id, d: null, err: e.message }))
    );
    Promise.all(promises).then(results => {
      const c = {}, errs = {};
      results.forEach(({ id, d, err }) => { c[id] = d; if (err) errs[id] = err; });
      setCot(c);
      setErrors(errs);
      setLoading(false);
      setUpdated(new Date());
    });
  }, []);

  React.useEffect(() => { load(); }, [load]);

  const buildPositioningMarkdown = () => {
    const lines = [];
    lines.push('# CoT Positioning — Managed Money (CFTC Disaggregated Futures Only)');
    lines.push(`Actualizado: ${updated ? updated.toLocaleString('es-ES') : '-'}`);
    lines.push('');
    lines.push('| Contrato | Neto | Largos | Cortos | % OI Largo | % OI Corto | Cambio 1S | Percentil (n sem) | Lectura |');
    lines.push('|---|---:|---:|---:|---:|---:|---:|---:|---|');
    CONTRACTS.forEach(c => {
      const d = cot[c.id];
      if (!d) { lines.push(`| ${c.label} | sin datos | | | | | | | |`); return; }
      const v = percentileVerdict(d.percentile);
      lines.push(`| ${c.label} | ${d.mm_net} | ${d.mm_long} | ${d.mm_short} | ${d.mm_pct_oi_long}% | ${d.mm_pct_oi_short}% | ${d.net_change_1w} | ${d.percentile} (${d.n_weeks}) | ${v.label} |`);
    });
    lines.push('');
    lines.push('Fuente: CFTC Commitments of Traders, Disaggregated Futures Only, categoría Managed Money ("specs"). Semanal (viernes, datos del martes anterior). Percentil calculado sobre la ventana de historial disponible (hasta ~3.3 años).');
    return lines.join('\n');
  };

  React.useEffect(() => {
    if (!updated) return;
    localStorage.setItem('llm_export_positioning', buildPositioningMarkdown());
    localStorage.setItem('llm_export_positioning_ts', Date.now().toString());
  }, [updated]);

  const copyMarkdown = () => {
    navigator.clipboard.writeText(buildPositioningMarkdown()).then(() => showToast('Copiado para LLM'));
  };

  const copyAllForLLM = () => {
    const parts = [
      { key: 'llm_export_market',      label: 'Market Tracker' },
      { key: 'llm_export_portfolio',   label: 'Portfolio' },
      { key: 'llm_export_cycle',       label: 'Cycle' },
      { key: 'llm_export_relative',    label: 'Relative Flow' },
      { key: 'llm_export_rotacion',    label: 'Flujos & Rotación' },
      { key: 'llm_export_duration',    label: 'Duration' },
      { key: 'llm_export_sentiment',   label: 'Sentiment' },
      { key: 'llm_export_positioning', label: 'Positioning' },
    ];
    const now = Date.now();
    const found = [], missing = [], stale = [];
    const sections = parts.map(({ key, label }) => {
      const md = localStorage.getItem(key);
      if (md) {
        found.push(label);
        const ts = parseInt(localStorage.getItem(key + '_ts') || '0');
        const hours = ts ? Math.round((now - ts) / 3600000) : null;
        if (!ts || hours > 23) stale.push(hours != null ? `${label} (${hours}h)` : label);
        return md;
      }
      missing.push(label); return null;
    }).filter(Boolean);
    if (!sections.length) { showToast('⚠️ Abre cada pestaña primero para generar datos'); return; }
    const exportDate = new Date().toLocaleString('es-ES', { dateStyle: 'full', timeStyle: 'short' });
    const header = `**Exportado:** ${exportDate}` +
      (stale.length ? `\n⚠️ **Secciones desactualizadas (>24h):** ${stale.join(', ')} — Abre esas pestañas para refrescar\n` : '\n');
    const combined = header + '\n---\n\n' + sections.join('\n\n---\n\n');
    navigator.clipboard.writeText(combined)
      .then(() => {
        if (stale.length) showToast(`⚠️ ${stale.length} secc. desactualizadas: ${stale.join(', ')}`);
        else if (missing.length) showToast(`✅ ${found.length}/${parts.length} pestañas — Falta: ${missing.join(', ')}`);
        else showToast('✅ Todas las pestañas copiadas (datos frescos)');
      })
      .catch(() => showToast('❌ Error al copiar'));
  };

  return (
    <div className="wrap">
      {toast && <div className="toast">{toast}</div>}
      <div className="topbar">
        <div>
          <div className="title-row">
            <h1>CoT Positioning</h1>
            <a href="/index.html" className="nav-link" style={{ color: '#1a6b3c', borderColor: '#1a6b3c' }}>Market Tracker</a>
            <a href="/portfolio.html" className="nav-link" style={{ color: '#3a6ca0', borderColor: '#3a6ca0' }}>Portfolio</a>
            <a href="/relative.html" className="nav-link" style={{ color: '#7b1fa2', borderColor: '#7b1fa2' }}>Relative Flow</a>
            <a href="/cycle.html" className="nav-link" style={{ color: '#7f0000', borderColor: '#7f0000' }}>Cycle</a>
            <a href="/rotacion.html" className="nav-link" style={{ color: '#e65100', borderColor: '#e65100' }}>Flujos & Rotación</a>
            <a href="/duration.html" className="nav-link" style={{ color: '#37474f', borderColor: '#37474f' }}>Duration</a>
            <a href="/sentiment.html" className="nav-link" style={{ color: '#00695c', borderColor: '#00695c' }}>Sentiment</a>
          </div>
          <div className="meta">Posicionamiento especulativo (Managed Money) en oro/plata/cobre/WTI — panel observacional, no ejecuta ni recomienda trades</div>
        </div>
        <div className="actions">
          <button className="btn-refresh" onClick={load} disabled={loading}>{loading ? 'Cargando…' : 'Refrescar'}</button>
          <button className="btn-copy" onClick={copyMarkdown}>Copy for LLM</button>
          <button className="btn-export" onClick={copyAllForLLM}>🗂️ Exportar TODO a LLM</button>
        </div>
      </div>

      <div className="gap-note">
        Fuente: CFTC Commitments of Traders, informe "Disaggregated Futures Only" (API pública Socrata,
        publicreporting.cftc.gov). Categoría Managed Money = los "specs" de los que habla el mercado —
        no incluye Producer/Merchant (hedgers comerciales) ni Swap Dealers. Dato semanal (viernes, con
        posiciones del martes anterior) — no tiene sentido refrescar más a menudo. El percentil se calcula
        sobre el historial disponible en este dataset para cada contrato (hasta ~3,3 años / 170 semanas).
      </div>

      <div className="section-title">Posicionamiento neto por contrato</div>
      <div className="section-sub">
        Neto = largos − cortos de Managed Money. Percentil alto (≥90) = posicionamiento largo históricamente
        extremo — más riesgo de que un mal dato dispare ventas de cobertura de posiciones, no de que el
        movimiento en curso vaya a revertir por sí solo. Percentil bajo (≤10) es el caso simétrico en corto.
      </div>
      <div className="evidence-grid">
        {CONTRACTS.map(c => {
          const d = cot[c.id];
          const err = errors[c.id];
          const verdict = d ? percentileVerdict(d.percentile) : null;
          return (
            <div className="evidence-card" key={c.id}>
              <div className="label">{c.label} ({c.ticker}) — Managed Money</div>
              {d ? (
                <>
                  <div className="metric">{fmtNum(d.mm_net)} <span style={{ fontSize: 11, fontWeight: 400 }}>contratos netos</span></div>
                  <div className="sub">Largos {fmtNum(d.mm_long)} · Cortos {fmtNum(d.mm_short)} · {d.mm_pct_oi_long}% / {d.mm_pct_oi_short}% del open interest</div>
                  <div className="sub">Cambio 1 semana: {fmtChange(d.net_change_1w)} contratos</div>
                  <div style={{ margin: '8px 0' }}>
                    <Spark points={(d.history || []).map(h => ({ y: h.mm_net }))} color={c.color} />
                  </div>
                  <div className="verdict" style={{ background: verdict.bg, color: verdict.fg }}>
                    Percentil {d.percentile} de {d.n_weeks} semanas — {verdict.label}
                  </div>
                  <div className="freshness">Datos al {d.as_of}</div>
                </>
              ) : err ? (
                <div className="error-box">Error: {err}</div>
              ) : (
                <div className="loading">Cargando…</div>
              )}
            </div>
          );
        })}
      </div>

      <div className="section-title">Tabla completa</div>
      <table>
        <thead>
          <tr><th>Contrato</th><th>Neto</th><th>Largos</th><th>Cortos</th><th>% OI L</th><th>% OI S</th><th>Cambio 1S</th><th>Percentil</th><th>Lectura</th><th>Datos al</th></tr>
        </thead>
        <tbody>
          {CONTRACTS.map(c => {
            const d = cot[c.id];
            if (!d) return <tr key={c.id}><td>{c.label}</td><td colSpan="9">sin datos</td></tr>;
            const verdict = percentileVerdict(d.percentile);
            return (
              <tr key={c.id}>
                <td>{c.label}</td>
                <td>{fmtNum(d.mm_net)}</td>
                <td>{fmtNum(d.mm_long)}</td>
                <td>{fmtNum(d.mm_short)}</td>
                <td>{d.mm_pct_oi_long}%</td>
                <td>{d.mm_pct_oi_short}%</td>
                <td>{fmtChange(d.net_change_1w)}</td>
                <td>{d.percentile} <span style={{ color: '#98a2b3' }}>({d.n_weeks}sem)</span></td>
                <td><span className="badge" style={{ background: verdict.bg, color: verdict.fg }}>{verdict.label}</span></td>
                <td>{d.as_of}</td>
              </tr>
            );
          })}
        </tbody>
      </table>

      <div className="footer-note">
        Fuente: CFTC Commitments of Traders (Disaggregated Futures Only, Managed Money), caché de 12h en el servidor.
        Panel puramente observacional — no toca PCS, rot_score, HARD_RULES del motor de picks ni ninguna cartera.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PositioningPage />);
</script>
</body>
</html>
