const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// ── Formatters ────────────────────────────────────────────────────────────
const toN = v => (v != null && !isNaN(v)) ? +v : null;
const fmtPrc = v => { const n=toN(v); if(!n) return '—'; if(n>=1000) return n.toLocaleString('en-US',{maximumFractionDigits:0}); if(n>=100) return n.toFixed(1); return n.toFixed(2); };
const fmtVal = v => { const n=toN(v); if(n==null) return '—'; return n.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}); };
const fmtPL  = v => { const n=toN(v); if(n==null) return '—'; const a=Math.abs(n).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}); return n>=0?'+'+a:'-'+a; };
const fmtPct = v => { const n=toN(v); if(n==null) return '—'; return (n>=0?'+':'')+n.toFixed(1)+'%'; };
const fmtRet = v => { const n=toN(v); if(n==null) return '—'; return n<0?`(${Math.abs(Math.round(n))}%)`:`${Math.round(n)}%`; };
const plColor = v => { const n=toN(v); return n==null?'#999':n>=0?'#1a7a1a':'#c0392b'; };
const retBg   = v => { const n=toN(v); if(n==null) return ''; if(n>=20) return '#0d4e0d'; if(n>=10) return '#1a7a1a'; if(n>=3) return '#5ec45e'; if(n>0) return '#a8d8a8'; if(n===0) return ''; if(n>-3) return '#ffc9c9'; if(n>-10) return '#f48080'; return '#e03030'; };
const retFg   = v => { const n=toN(v); return n==null?'#555':Math.abs(n)>=10?'white':'#1a1a1a'; };
const volBg   = v => { const n=toN(v); if(n==null) return ''; if(n>=200) return '#0d2e6e'; if(n>=150) return '#1a5ca0'; if(n>=120) return '#6ab0e0'; if(n<=50) return '#a0a0a0'; if(n<=80) return '#d0d0d0'; return ''; };
const volFg   = v => { const n=toN(v); if(n==null) return '#aaa'; if(n>=150) return 'white'; if(n<=80) return '#555'; return '#333'; };
const fmtVol  = v => { const n=toN(v); if(n==null) return '—'; return n+'%'; };
const rsiBg = v => { const n=toN(v); if(n==null) return ''; if(n>=80) return '#6b0000'; if(n>=70) return '#c0392b'; if(n>=60) return '#e8a87c'; if(n<=20) return '#0d4e0d'; if(n<=30) return '#1a7a1a'; if(n<=40) return '#a8d8a8'; return ''; };
const rsiFg = v => { const n=toN(v); if(n==null) return '#aaa'; if(n>=70||n<=30) return 'white'; if(n>=60||n<=40) return '#222'; return '#444'; };
// ── Koncorde Plus helpers ─────────────────────────────────────────────────
// computeFlowScore / computeEarlyFlowScore / classifyFlow / classifyEarlyFlow /
// matrixReading / koncStateLbl live in shared/flow-score.js (loaded above) —
// keep only page-local presentation here (badge colors, number formatting).
const koncStateStyle = s => ({'accumulation':{bg:'#dbeafe',fg:'#1e40af'},'up':{bg:'#dcfce7',fg:'#15803d'},'distribution':{bg:'#fef3c7',fg:'#b45309'},'down':{bg:'#fee2e2',fg:'#b91c1c'}})[s] ?? {bg:'#f3f4f6',fg:'#6b7280'};
const blueFg   = v => { const n=toN(v); return n==null?'#aaa':n>0?'#1a5cb0':n<0?'#7b8ea0':'#888'; };
const greenFg  = v => { const n=toN(v); return n==null?'#aaa':n>0?'#1a7a1a':n<0?'#c0392b':'#888'; };
const trendFg  = v => { const n=toN(v); return n==null?'#aaa':n>0?'#555577':n<0?'#774455':'#888'; };
const fmtKonc  = (v,d) => { if(v==null) return '—'; const s=v>=0?'+':''; const a=d==null?'':d>0.1?'↑':d<-0.1?'↓':''; return s+v.toFixed(1)+a; };

// ── Koncorde mini chart — últimas 5 sesiones (blue/green/trend/trend_ma) ───
// Estilo Koncorde clásico, estructura confirmada con el usuario 2026-08-14
// (fórmula real de ProRealTime/Blai5, verificada línea por línea contra
// koncorde_calculator.py — coincide exacta):
//   - 3 ÁREAS con línea propia del mismo dato, cada una SÓLIDA (fillOpacity=1,
//     no blending) para que la capa de encima oculte de verdad a la de
//     detrás, no sume color. Orden fondo→frente: verde → ocre (= `trend`
//     crudo, la "marrón" sin suavizar) → azul (siempre visible por completo).
//   - LÍNEA ROJA (`trend_ma` = EMA15 de `trend`) suelta, sin área propia —
//     por eso se pinta la última, encima de todo: al no tener relleno nada
//     puede taparla, se ve entera en todo el trayecto (tal como la describió
//     el usuario). Es la señal/media de la montaña marrón (ocre), no un dato
//     independiente de mano fuerte/débil.
function KoncMiniChart({ blue, green, trend, trendMa }) {
  const areaSeries = [
    { arr: green, line: '#1a7a1a', fill: '#a8d5a2' }, // verde (fondo)
    { arr: trend, line: null,      fill: '#e0c184' }, // marrón cruda → área ocre (medio), sin línea propia
    { arr: blue,  line: '#1a5cb0', fill: '#8fb8e6' }, // azul (primer plano)
  ];
  const allArrs = [...areaSeries.map(s => s.arr), trendMa];
  const n = Math.max(0, ...allArrs.map(a => Array.isArray(a) ? a.length : 0));
  if (n < 2) return <span style={{color:'#ddd',fontSize:9}}>—</span>;

  const W = 58, H = 22, PAD = 2;
  const vals = allArrs.flatMap(a => (a||[]).filter(v => v != null));
  vals.push(0);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const x = i => PAD + (i / Math.max(n-1,1)) * (W - PAD*2);
  const y = v => H - PAD - ((v - min) / range) * (H - PAD*2);
  const baseline = y(0);

  const pointsFor = arr => (arr||[]).map((v,i) => v==null ? null : [x(i), y(v)]).filter(Boolean);
  const lineFor = pts => pts.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');

  const areas = areaSeries.map(s => {
    const pts = pointsFor(s.arr);
    if (pts.length < 2) return null;
    const line = lineFor(pts);
    const area = `${line} L${pts[pts.length-1][0].toFixed(1)},${baseline.toFixed(1)} `
               + `L${pts[0][0].toFixed(1)},${baseline.toFixed(1)} Z`;
    return { ...s, line, area };
  }).filter(Boolean);

  const redPts = pointsFor(trendMa);
  const redLine = redPts.length >= 2 ? lineFor(redPts) : null;

  return (
    <svg width={W} height={H} style={{display:'block',margin:'0 auto'}}>
      <line x1={PAD} y1={baseline} x2={W-PAD} y2={baseline} stroke="#ccc" strokeWidth={0.5} />
      {areas.map((p,i) => <path key={'a'+i} d={p.area} fill={p.fill} fillOpacity={1} stroke="none" />)}
      {areas.map((p,i) => p.line && <path key={'l'+i} d={p.line} fill="none" stroke={p.line} strokeWidth={1} />)}
      {redLine && <path d={redLine} fill="none" stroke="#c0392b" strokeWidth={1} />}
    </svg>
  );
}

// ── Tendencia Flow Score / ATR% vs sesión anterior ──────────────────────────
// Se apoya en signals_history.json (ya se registraba a diario para Flow Score;
// atrPct se añade aquí — ver push de entries más abajo). "Sesión anterior" =
// última fila con fecha < hoy para ese ticker, no un promedio multi-día.
// 4 niveles: sin flecha (ruido normal) · 1 flecha (movimiento normal)
// · 2 flechas (violento) · 3 flechas (extremo).
const TREND_ARROWS = { mildUp:'↑', strongUp:'↑↑', extremeUp:'↑↑↑', mildDown:'↓', strongDown:'↓↓', extremeDown:'↓↓↓' };
const trendBucket = (delta, mildTh, strongTh, extremeTh) => {
  const a = Math.abs(delta);
  if (a < mildTh) return 'flat';
  const dir = delta > 0 ? 'Up' : 'Down';
  if (a >= extremeTh) return 'extreme' + dir;
  if (a >= strongTh)  return 'strong'  + dir;
  return 'mild' + dir;
};
const trendColor = b => ({
  mildUp:'#4a9e5c',   strongUp:'#0d7a2e',   extremeUp:'#063d17',
  mildDown:'#c77c1f', strongDown:'#c0392b', extremeDown:'#7a1810',
})[b] ?? 'inherit';
function TrendArrow({ delta, mildTh, strongTh, extremeTh, color }) {
  if (delta == null || isNaN(delta)) return null;
  const b = trendBucket(delta, mildTh, strongTh, extremeTh);
  if (b === 'flat') return null;
  return (
    <span title={`${delta>=0?'+':''}${delta.toFixed(2)} vs sesión anterior`}
      style={{marginLeft:3, fontWeight:700, fontSize:9, color: color ?? trendColor(b)}}>
      {TREND_ARROWS[b]}
    </span>
  );
}
// Última fila registrada estrictamente antes de hoy, por ticker
function buildPrevSessionMap(history) {
  const today = new Date().toISOString().slice(0, 10);
  const map = {};
  (history || []).forEach(e => {
    if (!e.ticker || e.date >= today) return;
    const cur = map[e.ticker];
    if (!cur || e.date > cur.date) map[e.ticker] = e;
  });
  return map;
}
// Media histórica de ATR% por ticker — solo se muestra con >=10 sesiones (bootstrap)
function buildAtrAvgMap(history) {
  const acc = {};
  (history || []).forEach(e => {
    if (!e.ticker || e.atrPct == null) return;
    const a = acc[e.ticker] ?? (acc[e.ticker] = { sum:0, n:0 });
    a.sum += e.atrPct; a.n += 1;
  });
  const out = {};
  Object.entries(acc).forEach(([t,{sum,n}]) => { out[t] = { avg: sum/n, n }; });
  return out;
}

const FLOW_STYLE = {
  'Lider':      { bg:'#1a7a1a', fg:'white' },
  'Transicion': { bg:'#b8860b', fg:'white' },
  'Debil':      { bg:'#c0392b', fg:'white' },
};
const EARLY_STYLE = {
  'Fuerte':      { bg:'#1a5ca0', fg:'white' },
  'Interesante': { bg:'#5b3fa0', fg:'white' },
  'Sin setup':   { bg:'',       fg:'#aaa'   },
};

// ── PositionModal ─────────────────────────────────────────────────────────
function PositionModal({ mode, sectionId, item, sections, onSave, onClose }) {
  const [ticker,  setTicker]  = React.useState(item?.ticker  ?? '');
  const [shares,  setShares]  = React.useState(item?.shares  ?? '');
  const [avgCost, setAvgCost] = React.useState(item?.avgCost ?? '');
  const [notes,   setNotes]   = React.useState(item?.notes   ?? '');
  const [secId,   setSecId]   = React.useState(sectionId);
  const [err,     setErr]     = React.useState('');

  const handleSave = () => {
    if (!ticker.trim()) return setErr('Ticker obligatorio');
    onSave({ sectionId: secId, item: {
      id: item?.id ?? genId(),
      ticker:  ticker.trim().toUpperCase(),
      shares:  +shares,
      avgCost: +avgCost,
      notes:   notes.trim(),
      addedAt: item?.addedAt ?? new Date().toISOString().slice(0,10),
    }});
  };

  return (
    <div className="overlay" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="modal">
        <h3>{mode==='add' ? '+ Nueva posición' : `Editar — ${item?.ticker}`}</h3>
        <div className="field">
          <label>Ticker</label>
          <input value={ticker} onChange={e=>setTicker(e.target.value.toUpperCase())}
            placeholder="AAPL, NVDA, CCJ…" autoFocus={mode==='add'} />
        </div>
        <div className="row2">
          <div className="field">
            <label>Acciones / contratos</label>
            <input type="number" value={shares} onChange={e=>setShares(e.target.value)} placeholder="10" min="0" step="any"/>
          </div>
          <div className="field">
            <label>Coste medio (€ o $)</label>
            <input type="number" value={avgCost} onChange={e=>setAvgCost(e.target.value)} placeholder="150.00" min="0" step="any"/>
          </div>
        </div>
        <div className="field">
          <label>Sección</label>
          <select value={secId} onChange={e=>setSecId(e.target.value)}>
            {sections.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </div>
        <div className="field">
          <label>Notas (tesis, stop-loss, alertas pendientes…)</label>
          <textarea value={notes} onChange={e=>setNotes(e.target.value)} rows={4}
            placeholder="ej. Stop en 42. Catalizador: aprobación Q3. Alerta si cae <10% 52W high."/>
        </div>
        {err && <div style={{color:'#e74c3c',fontSize:11,marginBottom:10}}>⚠ {err}</div>}
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:4}}>
          <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary"   onClick={handleSave}>{mode==='add'?'Añadir':'Guardar'}</button>
        </div>
      </div>
    </div>
  );
}

// ── NotesModal ────────────────────────────────────────────────────────────
function NotesModal({ ticker, notes, onSave, onClose }) {
  const [val, setVal] = React.useState(notes);
  return (
    <div className="overlay" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="modal">
        <h3>Notas — {ticker}</h3>
        <div className="field">
          <textarea value={val} onChange={e=>setVal(e.target.value)} rows={9} autoFocus
            style={{fontSize:12,lineHeight:1.6}}
            placeholder="Tesis de inversión, niveles clave, stops, alertas pendientes, fechas de resultados…"/>
        </div>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
          <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary"   onClick={()=>onSave(val)}>Guardar</button>
        </div>
      </div>
    </div>
  );
}

// ── UniverseModal ─────────────────────────────────────────────────────────
const THEMES = ['argentina','cannabis','china_em','commodities_copper','commodities_metals',
  'crypto','defense_space','energy_storage','europa','global_etf','healthcare_largecap',
  'healthcare_special','oil_gas','reits','silver_gold_miners','smallcap_em',
  'smallcap_speculative','uranium_nuclear','us_cyclical','us_defensive','us_tech_ai'];

function UniverseModal({ ticker, onDone, onClose }) {
  const [name,      setName]      = React.useState('');
  const [theme,     setTheme]     = React.useState('');
  const [subtheme,  setSubtheme]  = React.useState('');
  const [assetType, setAssetType] = React.useState('stock');
  const [region,    setRegion]    = React.useState('US');
  const [priority,  setPriority]  = React.useState('medium');
  const [tradable,  setTradable]  = React.useState(true);
  const [notes,     setNotes]     = React.useState('');
  const [saving,    setSaving]    = React.useState(false);
  const [err,       setErr]       = React.useState('');

  const handleSave = async () => {
    if (!theme) return setErr('El tema es obligatorio');
    setSaving(true); setErr('');
    try {
      const r = await fetch('/api/universe/add', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticker, name, theme, subtheme, asset_type: assetType,
          region, priority, tradable, notes }),
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || 'Error');
      onDone(d.already_exists);
    } catch(e) { setErr(e.message); setSaving(false); }
  };

  const inp = { border:'1px solid #ddd', borderRadius:3, padding:'4px 8px',
    fontSize:12, width:'100%', boxSizing:'border-box' };
  const sel = { ...inp, background:'white' };

  return (
    <div className="overlay" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="modal" style={{width:480}}>
        <h3>Añadir <span style={{fontFamily:'monospace'}}>{ticker}</span> al universo screener</h3>
        <div className="field">
          <label>Nombre empresa / ETF</label>
          <input style={inp} value={name} onChange={e=>setName(e.target.value)} placeholder={ticker} autoFocus />
        </div>
        <div className="row2">
          <div className="field">
            <label>Tema *</label>
            <select style={sel} value={theme} onChange={e=>setTheme(e.target.value)}>
              <option value="">— seleccionar —</option>
              {THEMES.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Subtheme</label>
            <input style={inp} value={subtheme} onChange={e=>setSubtheme(e.target.value)} placeholder="ej. ai_chips" />
          </div>
        </div>
        <div className="row2">
          <div className="field">
            <label>Tipo</label>
            <select style={sel} value={assetType} onChange={e=>setAssetType(e.target.value)}>
              <option value="stock">stock</option>
              <option value="etf">etf</option>
            </select>
          </div>
          <div className="field">
            <label>Región</label>
            <input style={inp} value={region} onChange={e=>setRegion(e.target.value)} placeholder="US" />
          </div>
        </div>
        <div className="row2">
          <div className="field">
            <label>Priority</label>
            <select style={sel} value={priority} onChange={e=>setPriority(e.target.value)}>
              <option value="high">high</option>
              <option value="medium">medium</option>
              <option value="low">low</option>
            </select>
          </div>
          <div className="field" style={{paddingTop:18}}>
            <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
              <input type="checkbox" checked={tradable} onChange={e=>setTradable(e.target.checked)} />
              Tradable (incluir en PCS)
            </label>
          </div>
        </div>
        <div className="field">
          <label>Notas</label>
          <input style={inp} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Alta beta, líder sector, etc." />
        </div>
        {err && <div style={{color:'#e74c3c',fontSize:11,marginBottom:8}}>⚠ {err}</div>}
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:4}}>
          <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={handleSave} disabled={saving}>
            {saving ? 'Guardando…' : 'Añadir al universo'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Portfolio markdown export ─────────────────────────────────────────────
function buildPortfolioMarkdown(portfolio, prices, summary, prevSnapshot = {}) {
  const date = new Date().toLocaleDateString('es-ES');
  const f    = v => v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fp   = v => v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
  const fr   = v => v == null ? '—' : (v >= 0 ? '+' : '') + Math.round(v) + '%';
  const fv   = v => v == null ? '—' : v + '%';
  let md = `# Portfolio Tracker — Snapshot\n**Fecha:** ${date}\n\n`;
  md += `## RESUMEN GLOBAL\n| Coste | Valor | P&L | P&L% | Daily P&L |\n|------:|------:|----:|-----:|----------:|\n`;
  md += `| ${f(summary.cost)} | ${f(summary.value)} | ${f(summary.pl)} | ${fp(summary.plPct)} | ${f(summary.dailyPL)} |\n\n`;
  portfolio.sections.forEach(sec => {
    md += `## ${sec.name}\n`;
    md += `| Ticker | Acciones | Coste Avg | Precio | Valor | P&L | P&L% | 1D | 2D | 3D | 1W | 1M | 3M | YTD | 1Y | Vol 1D | Vol 2D | Vol 3D | RSI | MACD | ATR% | Konc D (blue/green/trend) | Konc 3D | Konc W | Flow | Early | Lectura | Notas | Patrón Konc. (D/3D/W) |\n`;
    md += `|--------|--------:|----------:|-------:|------:|----:|-----:|---:|---:|---:|---:|---:|---:|---:|---:|-------:|-------:|-------:|----:|:----:|-----:|:---|:---|:---|----:|-----:|:---|:---|:---|\n`;
    sec.items.forEach(item => {
      const p       = prices[item.ticker];
      const value   = p?.price != null ? item.shares * p.price : null;
      const pl      = value != null ? value - item.shares * item.avgCost : null;
      const plPct   = pl != null && item.avgCost ? pl / (item.shares * item.avgCost) * 100 : null;
      const flow    = computeFlowScore(p);
      const early   = computeEarlyFlowScore(p, prevSnapshot[item.ticker]);
      const lectura = (flow != null && early != null) ? (matrixReading(early, flow) ?? '—') : '—';
      const koncD   = p ? `blue ${fmtKonc(p.konc_d_blue,  p.konc_d_blue_delta1)} / green ${fmtKonc(p.konc_d_green,  p.konc_d_green_delta1)} / trend ${fmtKonc(p.konc_d_trend,  p.konc_d_trend_delta1)} (${koncStateLbl(p.konc_d_state)})`  : '—';
      const konc3D  = p ? `blue ${fmtKonc(p.konc_3d_blue, p.konc_3d_blue_delta1)} / green ${fmtKonc(p.konc_3d_green, p.konc_3d_green_delta1)} / trend ${fmtKonc(p.konc_3d_trend, p.konc_3d_trend_delta1)} (${koncStateLbl(p.konc_3d_state)})` : '—';
      const koncW   = p ? `blue ${fmtKonc(p.konc_w_blue,  p.konc_w_blue_delta1)} / green ${fmtKonc(p.konc_w_green,  p.konc_w_green_delta1)} / trend ${fmtKonc(p.konc_w_trend,  p.konc_w_trend_delta1)} (${koncStateLbl(p.konc_w_state)})`  : '—';
      const macd    = p?.macdBull == null ? '—' : p.macdBull ? '▲' : '▼';
      const notes   = (item.notes || '—').replace(/\|/g, '/').replace(/\n/g, ' ');
      const kpFlag  = (tf, v, d) => v ? `${tf}:✅${d||''}` : null;
      const koncPattern = [kpFlag('D', item.koncPatternD, item.koncPatternDDate),
                            kpFlag('3D', item.koncPattern3D, item.koncPattern3DDate),
                            kpFlag('W', item.koncPatternW, item.koncPatternWDate)]
                            .filter(Boolean).join(' ') || '—';
      md += `| ${item.ticker} | ${item.shares} | ${f(item.avgCost)} | ${p?.price != null ? f(p.price) : '—'} `
          + `| ${value != null ? f(value) : '—'} | ${pl != null ? f(pl) : '—'} | ${fp(plPct)} `
          + `| ${fr(p?.d1)} | ${fr(p?.d2)} | ${fr(p?.d3)} | ${fr(p?.w1)} | ${fr(p?.m1)} | ${fr(p?.m3)} | ${fr(p?.ytd)} | ${fr(p?.y1)} `
          + `| ${fv(p?.vol1d)} | ${fv(p?.vol2d)} | ${fv(p?.vol3d)} `
          + `| ${p?.rsi != null ? p.rsi : '—'} | ${macd} | ${p?.atrPct != null ? p.atrPct + '%' : '—'} `
          + `| ${koncD} | ${konc3D} | ${koncW} `
          + `| ${flow != null ? flow.toFixed(1) : '—'} | ${early != null ? early.toFixed(1) : '—'} | ${lectura} | ${notes} | ${koncPattern} |\n`;
    });
    md += '\n';
  });
  return md;
}

// ── Portfolio ─────────────────────────────────────────────────────────────
function Portfolio() {
  const [portfolio,   setPortfolio]   = React.useState({ sections: [] });
  const [prices,      setPrices]      = React.useState({});
  const [loading,     setLoading]     = React.useState(new Set());
  const [saving,      setSaving]      = React.useState(false);
  const [lastSaved,   setLastSaved]   = React.useState(null);
  const [modal,       setModal]       = React.useState(null);
  const [toast,       setToast]       = React.useState(null);
  const [prevSnapshot, setPrevSnapshot] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('ticker_snapshot') || '{}'); } catch { return {}; }
  });
  const [stockConfig,   setStockConfig]   = React.useState({});
  const [universeTickers, setUniverseTickers] = React.useState(new Set());
  const [signalsHistory, setSignalsHistory] = React.useState([]);
  const saveTimer = React.useRef(null);

  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(null), 3200); };

  // ── Carga inicial ──────────────────────────────────────────────────────
  React.useEffect(() => {
    fetch('/api/portfolio')
      .then(r => r.json())
      .then(d => {
        if (d.sections) {
          setPortfolio(d);
          fetchPrices(d.sections);
          if (d.lastSessionSnapshot) setPrevSnapshot(d.lastSessionSnapshot);
        }
      })
      .catch(() => showToast('❌ No se pudo cargar la cartera'));
    fetch('/api/stock-config')
      .then(r => r.json())
      .then(d => setStockConfig(d || {}))
      .catch(() => {});
    fetch('/api/universe')
      .then(r => r.json())
      .then(d => setUniverseTickers(new Set((d.tickers || []).map(t => t.ticker))))
      .catch(() => {});
    fetch('/api/signals')
      .then(r => r.json())
      .then(d => setSignalsHistory(Array.isArray(d) ? d : []))
      .catch(() => {});
  }, []);

  // ── Guardado automático (debounce 800 ms) ─────────────────────────────
  const persistPortfolio = React.useCallback(async data => {
    setSaving(true);
    try {
      const r = await fetch('/api/portfolio', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
      if (!r.ok) throw new Error('HTTP '+r.status);
      setLastSaved(new Date());
    } catch(e) { showToast('❌ Error al guardar: '+e.message); }
    setSaving(false);
  }, []);

  const updatePortfolio = React.useCallback(updater => {
    setPortfolio(prev => {
      const next = updater(prev);
      clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(() => persistPortfolio(next), 800);
      return next;
    });
  }, [persistPortfolio]);

  // ── Precios Yahoo ──────────────────────────────────────────────────────
  const fetchPrices = React.useCallback(async (sections, extraTickers=[]) => {
    const tickers = [...new Set([
      ...(sections ?? []).flatMap(s => s.items.map(i => i.ticker)),
      ...extraTickers,
    ])];
    if (!tickers.length) return;
    setLoading(prev => new Set([...prev, ...tickers]));
    await Promise.allSettled(tickers.map(async ticker => {
      try {
        const r = await fetch(`/api/quote/${encodeURIComponent(ticker)}`);
        const d = await r.json();
        if (d.error) throw new Error(d.error);
        setPrices(prev => ({...prev, [ticker]: d}));
      } catch(e) {}
      setLoading(prev => { const s=new Set(prev); s.delete(ticker); return s; });
    }));
  }, []);

  const refresh = () => fetchPrices(portfolio.sections);

  // ── Guardar snapshot + historial de señales ───────────────────────────
  React.useEffect(() => {
    if (loading.size === 0 && Object.keys(prices).length > 0) {
      const snapshot = {};
      Object.entries(prices).forEach(([ticker, d]) => {
        if (d.konc_d_state != null || d.atrPct != null)
          snapshot[ticker] = {
            konc_d_state:  d.konc_d_state  ?? null,
            konc_3d_state: d.konc_3d_state ?? null,
            konc_w_state:  d.konc_w_state  ?? null,
            atrPct:        d.atrPct        ?? null,
          };
      });

      // Persistir snapshot en portfolio.json (funciona entre máquinas)
      setPortfolio(prev => {
        const next = { ...prev, lastSessionSnapshot: snapshot };
        persistPortfolio(next);
        return next;
      });

      // Mantener localStorage como fallback
      try { localStorage.setItem('ticker_snapshot', JSON.stringify(snapshot)); } catch {}

      // Auto-save markdown for combined LLM export
      try { localStorage.setItem('llm_export_portfolio', buildPortfolioMarkdown(portfolio, prices, summary, prevSnapshot)); localStorage.setItem('llm_export_portfolio_ts', Date.now().toString()); } catch {}

      // Guardar historial de señales
      const today = new Date().toISOString().slice(0, 10);
      const entries = [];
      Object.entries(prices).forEach(([ticker, d]) => {
        const flowScore = computeFlowScore(d);
        const earlyFlow = computeEarlyFlowScore(d, prevSnapshot[ticker] ?? null);
        if (flowScore != null || earlyFlow != null) {
          entries.push({
            date:      today,
            ticker,
            price:     d.price     ?? null,
            flowScore,
            earlyFlow,
            konc_d_state:  d.konc_d_state  ?? null,
            konc_3d_state: d.konc_3d_state ?? null,
            konc_w_state:  d.konc_w_state  ?? null,
            konc_d_blue:   d.konc_d_blue   ?? null,
            konc_d_green:  d.konc_d_green  ?? null,
            rsi:       d.rsi       ?? null,
            w1:        d.w1        ?? null,
            m1:        d.m1        ?? null,
            fromHigh:  d.fromHigh  ?? null,
            atrPct:    d.atrPct    ?? null,
          });
        }
      });
      if (entries.length) {
        fetch('/api/signals', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(entries),
        }).catch(() => {});
      }
    }
  }, [prices, loading.size]);

  // ── Tendencia Flow Score / ATR% (sesión anterior + media ATR por ticker) ──
  const prevSessionMap = React.useMemo(() => buildPrevSessionMap(signalsHistory), [signalsHistory]);
  const atrAvgMap      = React.useMemo(() => buildAtrAvgMap(signalsHistory), [signalsHistory]);

  // ── Resumen global ─────────────────────────────────────────────────────
  const summary = React.useMemo(() => {
    let cost=0, value=0, dailyPL=0, loaded=0, total=0;
    portfolio.sections.forEach(sec => sec.items.forEach(item => {
      const p = prices[item.ticker];
      cost += item.shares * item.avgCost;
      total++;
      if (p?.price != null) {
        const v = item.shares * p.price;
        value   += v;
        dailyPL += p.d1 != null ? v * p.d1 / 100 : 0;
        loaded++;
      }
    }));
    const pl    = value - cost;
    const plPct = cost ? pl / cost * 100 : 0;
    return { cost, value, pl, plPct, dailyPL, loaded, total };
  }, [portfolio, prices]);

  // ── Ranking de setups ─────────────────────────────────────────────────
  const setupRanking = React.useMemo(() => {
    const seen = new Map();
    portfolio.sections.forEach(sec => sec.items.forEach(item => {
      const p = prices[item.ticker];
      if (!p || p.price == null) return;
      if (seen.has(item.ticker)) return;
      const flowScore = computeFlowScore(p);
      const earlyFlow = computeEarlyFlowScore(p, prevSnapshot[item.ticker] ?? null);
      if (earlyFlow == null && flowScore == null) return;
      seen.set(item.ticker, { ticker: item.ticker, flowScore, earlyFlow,
        konc_3d_state: p.konc_3d_state ?? null, rsi: p.rsi ?? null,
        w1: p.w1 ?? null, m1: p.m1 ?? null,
        konc_mirror_signal: p.konc_mirror_signal ?? null });
    }));
    return [...seen.values()].sort((a, b) => (b.earlyFlow ?? -99) - (a.earlyFlow ?? -99));
  }, [portfolio, prices, prevSnapshot]);

  // ── LLM export ─────────────────────────────────────────────────────────
  const copyForLLM = () => {
    if (!Object.keys(prices).length) { showToast('⚠️ Espera a que carguen los datos'); return; }
    const md = buildPortfolioMarkdown(portfolio, prices, summary, prevSnapshot);
    navigator.clipboard.writeText(md)
      .then(() => showToast('✅ Copiado — pégalo en Claude, ChatGPT o cualquier LLM'))
      .catch(() => showToast('❌ Error al copiar'));
  };

  const copyAllForLLM = () => {
    const parts = [
      { key: 'llm_export_market',    label: 'Market Tracker' },
      { key: 'llm_export_portfolio', label: 'Portfolio' },
      { key: 'llm_export_cycle',     label: 'Cycle' },
      { key: 'llm_export_relative',  label: 'Relative Flow' },
      { key: 'llm_export_rotacion',  label: 'Flujos & Rotación' },
      { key: 'llm_export_duration',  label: 'Duration' },
      { key: 'llm_export_sentiment', label: 'Sentiment' },
      { key: 'llm_export_positioning', label: 'Positioning' },
    ];
    const now = Date.now();
    const found = [], missing = [], stale = [];
    const sections = parts.map(({ key, label }) => {
      const md = localStorage.getItem(key);
      if (md) {
        found.push(label);
        const ts = parseInt(localStorage.getItem(key + '_ts') || '0');
        const hours = ts ? Math.round((now - ts) / 3600000) : null;
        if (!ts || hours > 23) stale.push(hours != null ? `${label} (${hours}h)` : label);
        return md;
      }
      missing.push(label); return null;
    }).filter(Boolean);
    if (!sections.length) { showToast('⚠️ Abre cada pestaña primero para generar datos'); return; }
    const exportDate = new Date().toLocaleString('es-ES', { dateStyle: 'full', timeStyle: 'short' });
    const header = `**Exportado:** ${exportDate}` +
      (stale.length ? `\n⚠️ **Secciones desactualizadas (>24h):** ${stale.join(', ')} — Abre esas pestañas para refrescar\n` : '\n');
    const combined = header + '\n---\n\n' + sections.join('\n\n---\n\n');
    navigator.clipboard.writeText(combined)
      .then(() => {
        if (stale.length) showToast(`⚠️ ${stale.length} secc. desactualizadas: ${stale.join(', ')}`);
        else if (missing.length) showToast(`✅ ${found.length}/${parts.length} pestañas — Falta: ${missing.join(', ')}`);
        else showToast('✅ Todas las pestañas copiadas (datos frescos)');
      })
      .catch(() => showToast('❌ Error al copiar'));
  };

  // ── CRUD ───────────────────────────────────────────────────────────────
  const addSection = () => {
    const name = prompt('Nombre de la sección (ej. Core, Especulativo, Energía):');
    if (!name?.trim()) return;
    updatePortfolio(p => ({...p, sections: [...p.sections, {id:genId(), name:name.trim(), items:[]}]}));
  };

  const renameSection = secId => {
    const sec = portfolio.sections.find(s=>s.id===secId);
    const name = prompt('Nuevo nombre:', sec?.name);
    if (!name?.trim() || name===sec?.name) return;
    updatePortfolio(p => ({...p, sections: p.sections.map(s => s.id===secId ? {...s, name:name.trim()} : s)}));
  };

  const deleteSection = secId => {
    const sec = portfolio.sections.find(s=>s.id===secId);
    if (!confirm(`¿Eliminar la sección "${sec?.name}" y todas sus posiciones?`)) return;
    updatePortfolio(p => ({...p, sections: p.sections.filter(s=>s.id!==secId)}));
  };

  const savePosition = ({sectionId, item, originalSectionId}) => {
    updatePortfolio(p => {
      let secs = p.sections.map(s => ({...s, items:[...s.items]}));
      // Mover de sección si cambió
      if (originalSectionId && originalSectionId !== sectionId)
        secs = secs.map(s => s.id===originalSectionId ? {...s, items:s.items.filter(i=>i.id!==item.id)} : s);
      // Añadir o actualizar en la sección destino
      secs = secs.map(s => {
        if (s.id !== sectionId) return s;
        const idx = s.items.findIndex(i=>i.id===item.id);
        return {...s, items: idx>=0 ? s.items.map(i=>i.id===item.id?item:i) : [...s.items, item]};
      });
      return {...p, sections: secs};
    });
    if (!prices[item.ticker]) fetchPrices([], [item.ticker]);
    setModal(null);
  };

  const deletePosition = (secId, itemId) => {
    if (!confirm('¿Eliminar esta posición?')) return;
    updatePortfolio(p => ({...p, sections:
      p.sections.map(s => s.id===secId ? {...s, items:s.items.filter(i=>i.id!==itemId)} : s)
    }));
  };

  const saveNotes = (secId, itemId, notes) => {
    updatePortfolio(p => ({...p, sections:
      p.sections.map(s => s.id===secId ? {...s, items:
        s.items.map(i => i.id===itemId ? {...i, notes} : i)
      } : s)
    }));
    setModal(null);
  };

  // tf: 'D' | '3D' | 'W' — cada timeframe se marca por separado
  const toggleKoncPattern = (secId, itemId, tf, checked) => {
    updatePortfolio(p => ({...p, sections:
      p.sections.map(s => s.id===secId ? {...s, items:
        s.items.map(i => i.id===itemId ? {
          ...i,
          [`koncPattern${tf}`]: checked,
          [`koncPattern${tf}Date`]: checked ? new Date().toISOString().slice(0,10) : null,
        } : i)
      } : s)
    }));
  };

  // ── AI Picks Lab integration ───────────────────────────────────────────
  const stockTickers = React.useMemo(() => {
    const s = new Set();
    Object.values(stockConfig).forEach(items => items.forEach(i => s.add(i.ticker)));
    return s;
  }, [stockConfig]);

  const toggleStockConfig = React.useCallback(async (ticker) => {
    const cfg = {};
    Object.entries(stockConfig).forEach(([k, v]) => { cfg[k] = [...v]; });
    let wasPresent = false;

    for (const [cluster, items] of Object.entries(cfg)) {
      const idx = items.findIndex(i => i.ticker === ticker);
      if (idx >= 0) {
        cfg[cluster] = items.filter(i => i.ticker !== ticker);
        if (cfg[cluster].length === 0) delete cfg[cluster];
        wasPresent = true;
        break;
      }
    }
    if (!wasPresent) {
      cfg['Portfolio'] = [...(cfg['Portfolio'] || []), { ticker, note: 'desde Portfolio Tracker' }];
    }

    setStockConfig(cfg);
    try {
      const r = await fetch('/api/stock-config', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg),
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      showToast(wasPresent ? `✓ ${ticker} quitado de AI Picks Lab` : `✓ ${ticker} añadido a AI Picks Lab`);
    } catch(e) {
      showToast('❌ Error al actualizar AI Picks: ' + e.message);
      setStockConfig(stockConfig);
    }
  }, [stockConfig, showToast]);

  // ── Render ─────────────────────────────────────────────────────────────
  const dot        = <span style={{color:'#ccc'}}>···</span>;
  const totalValue = summary.value || 1;

  return (
    <div className="wrap">
      {toast && <div className="toast">{toast}</div>}

      {modal?.type==='position' && (
        <PositionModal mode={modal.mode} sectionId={modal.sectionId} item={modal.item}
          sections={portfolio.sections}
          onSave={p => savePosition({...p, originalSectionId: modal.sectionId})}
          onClose={()=>setModal(null)} />
      )}
      {modal?.type==='notes' && (
        <NotesModal ticker={modal.ticker} notes={modal.notes}
          onSave={v=>saveNotes(modal.secId, modal.itemId, v)}
          onClose={()=>setModal(null)} />
      )}
      {modal?.type==='universe' && (
        <UniverseModal ticker={modal.ticker}
          onDone={alreadyExists => {
            setModal(null);
            if (alreadyExists) { showToast(`ℹ ${modal.ticker} ya está en el universo`); return; }
            setUniverseTickers(prev => new Set([...prev, modal.ticker]));
            showToast(`✓ ${modal.ticker} añadido al universo screener`);
          }}
          onClose={()=>setModal(null)} />
      )}

      {/* ── Header ────────────────────────────────────────────────────── */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:12}}>
        <div>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{fontSize:22,fontWeight:'bold',color:'#111'}}>Portfolio Tracker</div>
            <a href="/index.html" style={{fontSize:11,color:'#1a6b3c',textDecoration:'none',padding:'2px 10px',border:'1px solid #1a6b3c',borderRadius:12,lineHeight:'20px'}}>Market Tracker</a>
            <a href="/relative.html" style={{fontSize:11,color:'#7b1fa2',textDecoration:'none',padding:'2px 10px',border:'1px solid #7b1fa2',borderRadius:12,lineHeight:'20px'}}>Relative Flow</a>
            <a href="/cycle.html" style={{fontSize:11,color:'#7f0000',textDecoration:'none',padding:'2px 10px',border:'1px solid #7f0000',borderRadius:12,lineHeight:'20px'}}>Cycle</a>
            <a href="/rotacion.html" style={{fontSize:11,color:'#e65100',textDecoration:'none',padding:'2px 10px',border:'1px solid #e65100',borderRadius:12,lineHeight:'20px'}}>Flujos & Rotación</a>
            <a href="/sentiment.html" style={{fontSize:11,color:'#00695c',textDecoration:'none',padding:'2px 10px',border:'1px solid #00695c',borderRadius:12,lineHeight:'20px'}}>Sentiment</a>
            <a href="/duration.html" style={{fontSize:11,color:'#37474f',textDecoration:'none',padding:'2px 10px',border:'1px solid #37474f',borderRadius:12,lineHeight:'20px'}}>Duration</a>
            <a href="/positioning.html" style={{fontSize:11,color:'#5d4037',textDecoration:'none',padding:'2px 10px',border:'1px solid #5d4037',borderRadius:12,lineHeight:'20px'}}>Positioning</a>
          </div>
          <div style={{fontSize:9,color:'#aaa',marginTop:2,fontStyle:'italic'}}>
            Precios: Yahoo Finance (delayed 15 min) · Guardado automático en portfolio.json
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          {saving && <span style={{fontSize:10,color:'#aaa'}}>Guardando…</span>}
          {!saving && lastSaved && <span style={{fontSize:10,color:'#bbb'}}>Guardado {lastSaved.toLocaleTimeString()}</span>}
          <button onClick={copyForLLM} disabled={loading.size>0}
            style={{padding:'4px 12px',fontSize:11,border:'none',borderRadius:3,cursor:loading.size>0?'default':'pointer',background:loading.size>0?'#aaa':'#6c3483',color:'white'}}>
            📋 Copiar para LLM
          </button>
          <button onClick={copyAllForLLM}
            style={{padding:'4px 12px',fontSize:11,border:'none',borderRadius:3,cursor:'pointer',background:'#37474f',color:'white'}}>
            🗂️ Exportar TODO a LLM
          </button>
          <a href="/api/signals" target="_blank"
            style={{padding:'4px 12px',fontSize:11,border:'1px solid #888',borderRadius:3,
              cursor:'pointer',background:'#f5f5f5',color:'#555',fontWeight:600,textDecoration:'none'}}>
            📋 Historial
          </a>
          <button onClick={addSection}
            style={{padding:'4px 12px',fontSize:11,border:'none',borderRadius:3,cursor:'pointer',background:'#1a6b3c',color:'white',fontWeight:600}}>
            + Sección

                        {/* MACD */}
                        <td style={{textAlign:'center',fontSize:12}}>
                          {isLoad ? dot : p?.macdBull==null ? <span style={{color:'#aaa'}}>—</span>
                            : p.macdBull ? <span style={{color:'#1a7a1a'}}>▲</span>
                                         : <span style={{color:'#c0392b'}}>▼</span>}
                        </td>
                        {/* ATLAS Mini — estrechamiento de Bollinger, no da dirección */}
                        <td style={{textAlign:'center',fontSize:11}}
                          title={p?.atlasDbb!=null ? `dbb=${p.atlasDbb} · umbral=${p.atlasFactor} · atl=${p.atlasAtl}` : undefined}>
                          {isLoad ? dot : p?.atlasSignal==null ? <span style={{color:'#aaa'}}>—</span>
                            : p.atlasSignal ? <span style={{color:'#a9720f',fontWeight:700}}>●</span>
                                            : <span style={{color:'#ddd'}}>·</span>}
                        </td>
                        {/* ATR% */}
                        {(() => {
                          const prevAtr = prevSessionMap[item.ticker]?.atrPct;
                          const delta   = (p?.atrPct != null && prevAtr != null) ? p.atrPct - prevAtr : null;
                          const avg     = atrAvgMap[item.ticker];
                          return (
                            <td style={{textAlign:'center',fontFamily:'monospace',fontSize:10,color:'#666',whiteSpace:'nowrap'}}>
                              {isLoad ? dot : p?.atrPct != null ? (
                                <>
                                  {p.atrPct}%
                                  <TrendArrow delta={delta} mildTh={0.25} strongTh={0.8} extremeTh={1.5} />
                                  {avg && avg.n >= 10 && (
                                    <span title={`Media histórica ATR% (${avg.n} sesiones registradas)`}
                                      style={{color:'#aaa', fontSize:9, marginLeft:3}}>
                                      ·{avg.avg.toFixed(1)}%
                                    </span>
                                  )}
                                </>
                              ) : '—'}
                            </td>
                          );
                        })()}
                        {/* Flow Score */}
                        {(() => {
                          const score  = computeFlowScore(p);
                          const cls    = classifyFlow(score);
                          const st     = cls ? FLOW_STYLE[cls] : null;
                          const prevFl = prevSessionMap[item.ticker]?.flowScore;
                          const delta  = (score != null && prevFl != null) ? score - prevFl : null;
                          return (
                            <td style={{textAlign:'center',fontWeight:700,fontSize:10,fontFamily:'monospace',
                              background: isLoad||!st ? '' : st.bg,
                              color:      isLoad||!st ? '#aaa' : st.fg,
                              whiteSpace:'nowrap'}}>
                              {isLoad ? dot : score!=null ? (<>{score.toFixed(1)}<TrendArrow delta={delta} mildTh={0.6} strongTh={5} extremeTh={10} color={isLoad||!st?undefined:st.fg} /></>) : '—'}
                            </td>
                          );
                        })()}
                        {/* Early Flow */}
                        {(() => {
                          const snap  = prevSnapshot[item.ticker];
                          const early = computeEarlyFlowScore(p, snap);
                          const flow  = computeFlowScore(p);
                          const cls   = classifyEarlyFlow(early);
                          const st    = cls ? EARLY_STYLE[cls] : null;
                          const tip   = (early != null && flow != null) ? matrixReading(early, flow) : null;
                          return (
                            <td title={tip ?? undefined}
                              style={{textAlign:'center',fontWeight:700,fontSize:10,fontFamily:'monospace',
                                background: isLoad||!st?.bg ? '' : st.bg,
                                color:      isLoad||!st    ? '#aaa' : st.fg,
                                whiteSpace:'nowrap', cursor: tip ? 'help' : 'default'}}>
                              {isLoad ? dot : early!=null ? early.toFixed(1) : '—'}
                            </td>
                          );
                        })()}
                        {/* Notas preview */}
                        <td style={{maxWidth:180}}>
                          <button onClick={()=>setModal({type:'notes',secId:sec.id,itemId:item.id,ticker:item.ticker,notes:item.notes??''})}
                            style={{border:'none',background:'none',cursor:'pointer',textAlign:'left',
                              width:'100%',padding:0,fontSize:10,color:item.notes?'#555':'#ccc',
                              overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:175,display:'block'}}>
                            {item.notes ? '📝 '+item.notes.slice(0,45)+(item.notes.length>45?'…':'') : '+ notas'}
                          </button>
                        </td>
                        {/* Acciones */}
                        <td style={{textAlign:'center',whiteSpace:'nowrap'}}>
                          <button onClick={()=>setModal({type:'position',mode:'edit',sectionId:sec.id,item})}
                            style={{fontSize:9,padding:'1px 5px',border:'1px solid #ddd',borderRadius:3,
                              cursor:'pointer',background:'#f5f5f5',color:'#555',marginRight:2}}>✎</button>
                          <button onClick={()=>deletePosition(sec.id,item.id)}
                            style={{fontSize:9,padding:'1px 5px',border:'1px solid #fcc',borderRadius:3,
                              cursor:'pointer',background:'#fff5f5',color:'#e74c3c'}}>✕</button>
                        </td>
                      </tr>
                      {/* ── Sub-row 3D ── */}
                      <tr style={{background:subBg1}}>
                        <td colSpan={14} style={{padding:0}}/>
                        <td style={{textAlign:'center',fontSize:9,color:'#888',fontWeight:600,padding:'1px 4px'}}>3D</td>
                        <td style={{textAlign:'center',fontFamily:'monospace',fontWeight:600,padding:'1px 4px',color:blueFg(p?.konc_3d_blue)}}>
                          {fmtKonc(p?.konc_3d_blue, p?.konc_3d_blue_delta1)}
                        </td>
                        <td style={{textAlign:'center',fontFamily:'monospace',fontWeight:600,padding:'1px 4px',color:greenFg(p?.konc_3d_green)}}>
                          {fmtKonc(p?.konc_3d_green, p?.konc_3d_green_delta1)}
                        </td>
                        <td style={{textAlign:'center',fontFamily:'monospace',fontSize:10,padding:'1px 4px',color:trendFg(p?.konc_3d_trend)}}>
                          {fmtKonc(p?.konc_3d_trend, p?.konc_3d_trend_delta1)}
                        </td>
                        {(() => { const st = koncStateStyle(p?.konc_3d_state); return (
                          <td style={{textAlign:'center',fontWeight:600,fontSize:9,padding:'1px 4px',
                            background:p?.konc_3d_state?st.bg:'',color:p?.konc_3d_state?st.fg:'#aaa',whiteSpace:'nowrap'}}>
                            {koncStateLbl(p?.konc_3d_state)}
                          </td>
                        ); })()}
                        {/* Mini-gráfico Koncorde — 3D */}
                        <td style={{textAlign:'center',padding:'1px 4px'}}>
                          <KoncMiniChart blue={p?.konc_3d_blue_last5} green={p?.konc_3d_green_last5} trend={p?.konc_3d_trend_last5} trendMa={p?.konc_3d_trend_ma_last5} />
                        </td>
                        {/* Patrón Koncorde confirmado manualmente — 3D */}
                        <td style={{textAlign:'center',padding:'1px 4px'}}>
                          <input type="checkbox" checked={!!item.koncPattern3D}
                            onChange={e=>toggleKoncPattern(sec.id, item.id, '3D', e.target.checked)}
                            title={item.koncPattern3DDate
                                ? `Marcado el ${item.koncPattern3DDate} — el patrón Koncorde 3D predice los giros de esta acción`
                                : 'Marcar si compruebas que el patrón Koncorde 3D (azul) predice los giros de esta acción'}
                            style={{cursor:'pointer'}}/>
                        </td>
                        <td colSpan={7} style={{padding:0}}/>
                      </tr>
                      {/* ── Sub-row W ── */}
                      <tr style={{background:subBg2}}>
                        <td colSpan={14} style={{padding:0}}/>
                        <td style={{textAlign:'center',fontSize:9,color:'#888',fontWeight:600,padding:'1px 4px'}}>W</td>
                        <td style={{textAlign:'center',fontFamily:'monospace',fontWeight:600,padding:'1px 4px',color:blueFg(p?.konc_w_blue)}}>
                          {fmtKonc(p?.konc_w_blue, p?.konc_w_blue_delta1)}
                        </td>
                        <td style={{textAlign:'center',fontFamily:'monospace',fontWeight:600,padding:'1px 4px',color:greenFg(p?.konc_w_green)}}>
                          {fmtKonc(p?.konc_w_green, p?.konc_w_green_delta1)}
                        </td>
                        <td style={{textAlign:'center',fontFamily:'monospace',fontSize:10,padding:'1px 4px',color:trendFg(p?.konc_w_trend)}}>
                          {fmtKonc(p?.konc_w_trend, p?.konc_w_trend_delta1)}
                        </td>
                        {(() => { const st = koncStateStyle(p?.konc_w_state); return (
                          <td style={{textAlign:'center',fontWeight:600,fontSize:9,padding:'1px 4px',
                            background:p?.konc_w_state?st.bg:'',color:p?.konc_w_state?st.fg:'#aaa',whiteSpace:'nowrap'}}>
                            {koncStateLbl(p?.konc_w_state)}
                          </td>
                        ); })()}
                        {/* Mini-gráfico Koncorde — W */}
                        <td style={{textAlign:'center',padding:'1px 4px'}}>
                          <KoncMiniChart blue={p?.konc_w_blue_last5} green={p?.konc_w_green_last5} trend={p?.konc_w_trend_last5} trendMa={p?.konc_w_trend_ma_last5} />
                        </td>
                        {/* Patrón Koncorde confirmado manualmente — W */}
                        <td style={{textAlign:'center',padding:'1px 4px'}}>
                          <input type="checkbox" checked={!!item.koncPatternW}
                            onChange={e=>toggleKoncPattern(sec.id, item.id, 'W', e.target.checked)}
                            title={item.koncPatternWDate
                                ? `Marcado el ${item.koncPatternWDate} — el patrón Koncorde W predice los giros de esta acción`
                                : 'Marcar si compruebas que el patrón Koncorde W (azul) predice los giros de esta acción'}
                            style={{cursor:'pointer'}}/>
                        </td>
                        <td colSpan={7} style={{padding:0}}/>
                      </tr>
                    </React.Fragment>
                  );
                  })}
                </tbody>
              </table>
            )}
          </div>
        );
      })}

      <div style={{marginTop:10,fontSize:9,color:'#ccc',textAlign:'right'}}>
        Yahoo Finance (delayed 15 min) · portfolio.json · Not financial advice
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Portfolio));
</script>
</body>
</html>
